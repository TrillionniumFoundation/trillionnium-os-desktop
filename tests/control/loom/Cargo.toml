# Run through run-models.py: the default-backend variant replaces only sync.rs;
# the public-backend variant retains every production Rust module unchanged.
[package]
name = "os-control-loom"
version = "0.0.0"
edition = "2021"
publish = false

[features]
default = ["std"]
std = []
portable-spin = []

[dependencies]
loom = "=0.7.2"

[lib]
name = "os_control"
path = "src/lib.rs"

[[test]]
name = "models"
path = "models.rs"

[[test]]
name = "models_public"
path = "models_public.rs"

[lints.rust]
unsafe_code = "forbid"
