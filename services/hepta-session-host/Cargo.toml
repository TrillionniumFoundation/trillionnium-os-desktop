[package]
name = "hepta-session-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
publish = false

[workspace]
resolver = "2"

[features]
native-text = ["dep:codex-hepta-agentd", "dep:hepta-control-core"]

[dependencies]
codex-hepta-agentd = { git = "https://github.com/TrillionniumFoundation/hepta-private-ci", rev = "1a76b5084d52957ac7993fbf26839d0539c567b4", optional = true }
hepta-control-core = { git = "https://github.com/TrillionniumFoundation/hepta-private-ci", rev = "1a76b5084d52957ac7993fbf26839d0539c567b4", optional = true }
codex-hepta-objective = { git = "https://github.com/TrillionniumFoundation/hepta-private-ci", rev = "1a76b5084d52957ac7993fbf26839d0539c567b4" }
codex-hepta-operations = { git = "https://github.com/TrillionniumFoundation/hepta-private-ci", rev = "1a76b5084d52957ac7993fbf26839d0539c567b4" }
codex-hepta-types = { git = "https://github.com/TrillionniumFoundation/hepta-private-ci", rev = "1a76b5084d52957ac7993fbf26839d0539c567b4" }
codex-hepta-agent-protocol = { git = "https://github.com/TrillionniumFoundation/hepta-private-ci", rev = "1a76b5084d52957ac7993fbf26839d0539c567b4" }
trill-ui-core = { path = "../../ui/core" }
codex-hepta-memory = { git = "https://github.com/TrillionniumFoundation/hepta-private-ci", rev = "1a76b5084d52957ac7993fbf26839d0539c567b4" }
hepta-os-observer = { path = "../hepta-os", features = ["objective-history"] }
trill-session = { path = "../../ui/session", features = ["objective-submission"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "time", "net", "io-util", "fs"] }

[dev-dependencies]
codex-hepta-contracts = { git = "https://github.com/TrillionniumFoundation/hepta-private-ci", rev = "1a76b5084d52957ac7993fbf26839d0539c567b4" }
codex-hepta-paths = { git = "https://github.com/TrillionniumFoundation/hepta-private-ci", rev = "1a76b5084d52957ac7993fbf26839d0539c567b4" }
tempfile = "3.23.0"

[profile.dev-small]
inherits = "dev"
opt-level = 0
debug = "none"
strip = "symbols"

[patch.crates-io]
# Cargo applies patches only from the root workspace. Keep the original
# Hepta graph and its security fixes when Agentd is a native UI dependency.
i18n-config = { git = "https://github.com/TrillionniumFoundation/hepta-private-ci", rev = "1a76b5084d52957ac7993fbf26839d0539c567b4" }
secret-service = { git = "https://github.com/TrillionniumFoundation/hepta-private-ci", rev = "1a76b5084d52957ac7993fbf26839d0539c567b4" }
zbus-secret-service-keyring-store = { git = "https://github.com/TrillionniumFoundation/hepta-private-ci", rev = "1a76b5084d52957ac7993fbf26839d0539c567b4" }
anymap2 = { git = "https://github.com/TrillionniumFoundation/hepta-private-ci", rev = "1a76b5084d52957ac7993fbf26839d0539c567b4" }
imbl = { git = "https://github.com/TrillionniumFoundation/hepta-private-ci", rev = "1a76b5084d52957ac7993fbf26839d0539c567b4" }
matrix-sdk-sqlite = { git = "https://github.com/TrillionniumFoundation/hepta-private-ci", rev = "1a76b5084d52957ac7993fbf26839d0539c567b4" }
matrix-sdk-crypto = { git = "https://github.com/TrillionniumFoundation/hepta-private-ci", rev = "1a76b5084d52957ac7993fbf26839d0539c567b4" }
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "45fecb9508105988f42fe6ff0441783ed3717f92" }
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }
