[package]
name = "hepta-os-observer"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT OR Apache-2.0"
description = "Bounded read-only projection of the pinned Hepta Agentd control protocol"
publish = false

[features]
default = []
# Independent trusted-host transport; hepta-observe remains read-only.
objective-transport = ["serde_json/raw_value"]
# Explicit retained-request history against the separately pinned owner extension.
objective-history = ["objective-transport"]
# Separate trusted-host read-only reconciliation of a retained native delivery.
cpu-history = ["dep:hos2-os-abi", "dep:sha2"]

[dependencies]
hos2-os-abi = { path = "../../libs/os-abi", optional = true }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.10.9", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
tokio = { version = "=1.53.3", default-features = false, features = ["io-util", "net", "rt", "sync", "time"] }

[[bin]]
name = "hepta-observe"
path = "src/bin/hepta-observe.rs"

[[bin]]
name = "hepta-submit"
path = "src/bin/hepta-submit.rs"
required-features = ["objective-transport"]

[[bin]]
name = "hepta-history"
path = "src/bin/hepta-history.rs"
required-features = ["objective-history"]

[[test]]
name = "cpu_delivery"
path = "tests/cpu_delivery.rs"
required-features = ["cpu-history"]

[lints.rust]
unsafe_code = "forbid"
