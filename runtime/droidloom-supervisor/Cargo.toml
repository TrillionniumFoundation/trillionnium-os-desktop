[package]
name = "droidloom-supervisor"
description = "Fail-closed Android cell lifecycle transaction"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
droidloom-cpu-placement = { path = "../droidloom-cpu-placement" }
clap.workspace = true
droidloom-contracts = { path = "../droidloom-contracts" }
droidloom-task-launcher = { path = "../../android/framework/droidloom-task-launcher" }
droidloom-task-control = { path = "../../graphics/droidloom-task-control" }
droidloom-window-policy = { path = "../droidloom-window-policy" }
crc32fast = "1.5.0"
flate2.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
base64 = "=0.22.1"
sha2.workspace = true
thiserror.workspace = true
tempfile.workspace = true

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[[bin]]
name = "droidloom-host-mac"
path = "src/bin/droidloom-host-mac.rs"

# This target invokes the maintained kernel gate on its main thread.
# The confined loader does not gain process fork merely for libtest.
[[test]]
name = "actual-board-epoch"
path = "src/lib.rs"
harness = false
test = false
