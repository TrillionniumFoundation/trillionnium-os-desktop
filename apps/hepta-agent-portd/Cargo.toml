[package]
# Executable boundaries are explicit; default product and qualification graphs remain distinct.
autobins = false
autoexamples = false
build = false
name = "hepta-agent-portd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
fixture = ["dep:hepta-agent-port"]

[dependencies]
hepta-agent-port = { path = "../../crates/hepta-agent-port", optional = true }
hepta-agent-transport = { path = "../../crates/hepta-agent-transport" }
hepta-peer-attestation = { path = "../../crates/hepta-peer-attestation" }
libc = "=0.2.186"

# Cargo resolver 3 keeps these dependencies/features out of a --bin product build.
# They are admitted only when tests or the explicit D1 example are selected.
[dev-dependencies]
hepta-browser-codec = { path = "../../crates/hepta-browser-codec" }
hepta-peer-attestation = { path = "../../crates/hepta-peer-attestation", features = ["qualification-static-attestation"] }

[[bin]]
name = "hepta-agent-portd"
path = "src/main.rs"

[[bin]]
name = "hepta-agent-port-fixture"
path = "src/bin/hepta-agent-port-fixture.rs"
required-features = ["fixture"]

[[example]]
name = "hepta-agent-d1-fixture"
path = "examples/hepta-agent-d1-fixture.rs"
required-features = ["fixture"]
