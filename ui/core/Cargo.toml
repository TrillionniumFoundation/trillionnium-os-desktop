[package]
name = "trill-ui-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
# Candidate only: both original packages are pinned to the same reviewed head.
hepta-shared-presenter = ["dep:hepta-control-core", "dep:hepta-robrix-ui"]
hepta-native-makepad = ["hepta-shared-presenter", "hepta-robrix-ui/ui", "hepta-robrix-ui/native-presentation"]
hepta-native-clipboard-sdk = ["hepta-native-makepad", "hepta-robrix-ui/native-clipboard-sdk"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hepta-control-core = { git = "https://github.com/TrillionniumFoundation/hepta-private-ci", rev = "1a76b5084d52957ac7993fbf26839d0539c567b4", optional = true }
hepta-robrix-ui = { git = "https://github.com/TrillionniumFoundation/hepta-private-ci", rev = "1a76b5084d52957ac7993fbf26839d0539c567b4", default-features = false, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
