[package]
name = "trill-shell"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version = "1.96"

[features]
default = []
hepta-shared-presenter = ["trill-ui-core/hepta-shared-presenter"]
hepta-native-makepad = ["hepta-shared-presenter", "trill-ui-core/hepta-native-makepad", "dep:hepta-session-host"]
hepta-native-clipboard-sdk = ["hepta-native-makepad", "trill-ui-core/hepta-native-clipboard-sdk"]
# Independent original-SDK preedit candidate; does not advertise PasteText.
hepta-native-preedit-sdk = ["hepta-native-makepad"]

[dependencies]
trill-ui-core.workspace = true
eframe.workspace = true
ab_glyph.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
hepta-session-host = { path = "../../services/hepta-session-host", features = ["native-text"], optional = true }
