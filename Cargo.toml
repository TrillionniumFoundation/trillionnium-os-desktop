# Changes to the product workspace graph intentionally trigger every exact-head D0C gate.
[workspace]
members = [
  "apps/hepta-browserd",
  "apps/hepta-agent-portd",
  "crates/hepta-agent-transport",
  "crates/hepta-browser-codec",
  "crates/hepta-agent-port",
  "crates/hepta-peer-attestation",
  "crates/trillionnium-contract-core",
  "crates/hepta-browser-contracts",
  "crates/hepta-session-core",
  "crates/hepta-workspace-composition",
  "crates/hepta-browser-actor",
]
default-members = [
  "apps/hepta-browserd",
  "apps/hepta-agent-portd",
  "crates/hepta-agent-transport",
  "crates/hepta-browser-codec",
  "crates/hepta-agent-port",
  "crates/hepta-peer-attestation",
  "crates/trillionnium-contract-core",
  "crates/hepta-browser-contracts",
  "crates/hepta-session-core",
  "crates/hepta-workspace-composition",
  "crates/hepta-browser-actor",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
authors = ["Trillionnium Foundation contributors"]
repository = "https://github.com/TrillionniumFoundation/trillionnium-os-desktop"

[profile.release]
opt-level = 3
debug = 0
debug-assertions = false
incremental = false
lto = "thin"
strip = "symbols"
