[package]
name = "p4-app-frozen-read-host-regression"
version = "0.0.0"
edition = "2024"

[[bin]]
name = "native-original-reader"
path = "native-original-main.rs"

[[bin]]
name = "native-candidate-reader"
path = "native-candidate-main.rs"

[dependencies]
hex = "0.4"
libc = "0.2"
serde = {version = "1", features = ["derive"]}
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
