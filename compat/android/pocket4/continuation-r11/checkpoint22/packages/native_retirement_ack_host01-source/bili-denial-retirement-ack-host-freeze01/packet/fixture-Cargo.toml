[package]
name = "pocket4-denial-retirement-ack-controls"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace]
resolver = "2"

[lib]
path = "src/lib.rs"
doctest = false

[dependencies]
droidloom-composer = { path = "../builder-source/graphics/droidloom-composer" }
droidloom-task-control = { path = "../builder-source/graphics/droidloom-task-control" }
droidloom-denial-protocol = { path = "../builder-source/graphics/droidloom-denial-protocol" }
droidloom-denial-ipc = { path = "../builder-source/graphics/droidloom-denial-ipc" }
droidloom-transport = { path = "../builder-source/graphics/droidloom-transport" }
droidloom-syncobj = { path = "../builder-source/graphics/droidloom-syncobj" }
thiserror = "=2.0.19"
tempfile = "=3.27.0"

[[test]]
name = "denial_protocol_contract"
path = "src/denial_protocol_contract.rs"

[[test]]
name = "denial_endpoint_contract"
path = "src/denial_endpoint_contract.rs"
