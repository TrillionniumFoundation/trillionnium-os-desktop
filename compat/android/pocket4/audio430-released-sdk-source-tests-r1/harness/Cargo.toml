[package]
name = "pocket4-audio-source-history-tests"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
publish = false

[workspace]
resolver = "3"

[lib]
name = "droidloom_source"
path = "tools/droidloom-source/src/lib.rs"

[dependencies]
hex = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
thiserror = "=2.0.19"

[lints.rust]
unsafe_code = "forbid"
