[package]
name = "pocket4-owner-broker-r2-review"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]
resolver = "3"

[dependencies]
droidloom-supervisor = { path = "../../../source/runtime/droidloom-supervisor" }
droidloom-contracts = { path = "../../../source/runtime/droidloom-contracts" }
libc = "=0.2.188"
serde = { version = "=1.0.229", features = ["derive"] }
