[package]
name = "pocket4-settings-admission-tests"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace]
members = ["launcher", "denial-ipc", "denial-protocol", "task-control", "transport"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/denialwm/droidloom"

[workspace.dependencies]
libc = "=0.2.188"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
thiserror = "=2.0.19"

[dependencies]
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
