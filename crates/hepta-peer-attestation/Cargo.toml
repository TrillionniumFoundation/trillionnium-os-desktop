[package]
name = "hepta-peer-attestation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
# Static executable bindings are opt-in and non-production.  D1
# qualification and the explicit D3 development profile select distinct
# features so source validators can prove neither path enters the default
# product graph.
qualification-static-attestation = []
development-static-attestation = []

[dependencies]
hepta-agent-transport = { path = "../hepta-agent-transport" }
libc = "=0.2.186"
sha2 = "=0.10.9"
