[package]
# Executable boundaries are explicit and machine-registered.
autobins = false
build = false
name = "hepta-peer-attestation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
# Static executable bindings are opt-in and non-production.  D1
# qualification and the explicit D3 development profile select distinct
# features so source validators can prove neither path enters the default
# product graph.
qualification-static-attestation = []
development-static-attestation = []

[dependencies]
hepta-agent-transport = { path = "../hepta-agent-transport" }
libc = "=0.2.186"
sha2 = "=0.10.9"

# Actual fork and distinct-process descriptor custody use a single-thread main.
[[test]]
name = "control_owner_kernel"
path = "tests/control_owner_kernel.rs"
harness = false

[[test]]
name = "approved_policy_kernel"
path = "tests/approved_policy_kernel.rs"
harness = false

# Persistent service-source continuity is a separate actual root test profile.
[[test]]
name = "approved_service_owner_kernel"
path = "tests/approved_service_owner_kernel.rs"
harness = false
