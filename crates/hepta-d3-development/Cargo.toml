[package]
name = "hepta-d3-development"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
development = [
  "dep:hepta-agent-port",
  "dep:hepta-agent-transport",
  "dep:hepta-browser-actor",
  "dep:hepta-browser-codec",
  "dep:hepta-peer-attestation",
  "dep:hepta-session-core",
  "dep:libc",
  "hepta-peer-attestation/development-static-attestation",
]

[dependencies]
hepta-agent-port = { path = "../hepta-agent-port", optional = true }
hepta-agent-transport = { path = "../hepta-agent-transport", optional = true }
hepta-browser-actor = { path = "../hepta-browser-actor", optional = true }
hepta-browser-codec = { path = "../hepta-browser-codec", optional = true }
hepta-peer-attestation = { path = "../hepta-peer-attestation", optional = true }
hepta-session-core = { path = "../hepta-session-core", optional = true }
libc = { version = "=0.2.186", optional = true }

[[bin]]
name = "hepta-agent-port-development-sessiond"
path = "src/bin/sessiond.rs"
required-features = ["development"]

[[bin]]
name = "hepta-agent-d3-fixture"
path = "src/bin/fixture.rs"
required-features = ["development"]

[[bin]]
name = "hepta-d3-journal-check"
path = "src/bin/journal_check.rs"
required-features = ["development"]
