[package]
# Executable boundaries are explicit and machine-registered.
autobins = false
build = false
name = "hepta-agent-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
libc = "=0.2.186"
sha2 = "=0.10.9"

# Real descriptor inventory and actual fork probes run from a single-thread
# entry point, never alongside unrelated unit-test descriptor activity.
[[test]]
name = "accepted_handoff_kernel"
path = "tests/accepted_handoff_kernel.rs"
harness = false
