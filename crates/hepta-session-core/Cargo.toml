[package]
# Executable boundaries are explicit and machine-registered.
autobins = false
build = false
name = "hepta-session-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
hepta-browser-contracts = { path = "../hepta-browser-contracts" }
trillionnium-contract-core = { path = "../trillionnium-contract-core" }
sha2 = "=0.10.9"

[dev-dependencies]
libc = "=0.2.186"

[lib]
path = "src/lib.rs"

# Independent custom test harness: private fault cutpoints are cfg(test)-only.
[[test]]
name = "journal_persistence_process"
path = "tests/journal_persistence_process.rs"
harness = false

# Single-thread process owns its writer before an actual fork custody probe.
[[test]]
name = "journal_fork_custody"
path = "tests/journal_fork_custody.rs"
harness = false

# Independent process interruption tests for opt-in legacy copy, never installed.
[[test]]
name = "journal_migration_process"
path = "tests/journal_migration_process.rs"
harness = false
