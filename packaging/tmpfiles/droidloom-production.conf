# The boot setup owns the public directory; the broker retires its own socket.
# Keep the parent across individual production and legacy service lifetimes.
d /run/droidloom 0755 root root -

# The normal package installs this empty root, not a broad writable /var/lib.
# Public APK bytes and inspection records are owned by the selected host user.
d /var/lib/droidloom-public-apks 0755 root root -
d /var/lib/droidloom-public-apks/u1000 0700 1000 1000 -
