# The development BrowserActor process may write only its private state. The
# systemd-owned socket directory and reviewed Agent executable remain read-only.
[Service]
SupplementaryGroups=
ReadWritePaths=
ReadWritePaths=/var/lib/hepta-browserd/development
ReadOnlyPaths=
ReadOnlyPaths=/run/hepta/browserd /usr/libexec/hepta-agent
