# The stock helper keeps its root-owned start and ownership validation.
# Per-user tmpfs mounting remains unavailable; its documented directory fallback
# is used. PID 1 owns synchronous RuntimeDirectory cleanup after user@ stops.
[Service]
CapabilityBoundingSet=CAP_CHOWN CAP_FOWNER
RuntimeDirectory=user/%i
RuntimeDirectoryMode=0700
RuntimeDirectoryPreserve=no
# The bounded root helper cannot traverse another UID's 0700 runtime contents.
# Retire the exact declared runtime subtree through the original service manager.
ExecStop=
