# Preserve the stock directory fallback and its real orderly stop.
# The first stop command only prepares ACL metadata under the fixed runtime
# subtree after user@ has stopped; --physical never follows symlinks.
[Service]
CapabilityBoundingSet=CAP_CHOWN CAP_FOWNER
RuntimeDirectory=user/%i
RuntimeDirectoryMode=0700
RuntimeDirectoryPreserve=no
ExecStop=
ExecStop=/usr/bin/setfacl --recursive --physical --modify=u::rwX,u:0:rwX -- /run/user/%i
ExecStop=/usr/lib/systemd/systemd-user-runtime-dir stop %i
