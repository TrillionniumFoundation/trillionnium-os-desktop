# Prepare only existing native uevent inodes before each ordinary coldplug.
# The helper and udevadm retain root ownership without ambient or bounding caps.
[Service]
CapabilityBoundingSet=
AmbientCapabilities=
ExecStartPre=/usr/lib/droidloom/production/current/droidloom-native-uevent-label __native-uevent-label
