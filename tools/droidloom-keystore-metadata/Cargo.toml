[package]
name = "droidloom-keystore-metadata"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"

# Diagnostic host tool: independent lock avoids changing the normal image builder.
[workspace]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
hex = "0.4.3"
libc = "0.2.188"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tempfile = "3.27.0"
rusqlite = { version = "=0.39.0", default-features = false, features = ["bundled"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
