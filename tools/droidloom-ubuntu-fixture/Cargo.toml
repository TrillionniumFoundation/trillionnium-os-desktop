[package]
name = "droidloom-ubuntu-fixture"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"

# Independent diagnostic workspace; the production builder's lock is unchanged.
[workspace]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
hex = "0.4.3"
rustix = { version = "1.1.6", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
