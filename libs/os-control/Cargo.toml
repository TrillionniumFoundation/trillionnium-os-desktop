[package]
name = "os-control"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["std"]
std = []
# Experimental alloc-only backend, not a validated IRQ-safe kernel lock.
portable-spin = ["dep:spin"]

[dependencies]
spin = { version = "=0.9.9", optional = true, default-features = false, features = ["mutex", "spin_mutex"] }

[lib]
path = "src/lib.rs"

[[test]]
name = "control_conformance"
path = "../../tests/control/control_conformance.rs"

[[test]]
name = "delivery_adversarial"
path = "../../tests/control/delivery_adversarial.rs"

[[test]]
name = "resource_adversarial"
path = "../../tests/control/resource_adversarial.rs"

[[test]]
name = "kernel_handoff"
path = "../../tests/control/kernel_handoff.rs"

[[test]]
name = "resource_lifecycle"
path = "../../tests/control/resource_lifecycle.rs"

[[test]]
name = "nonblocking_history"
path = "../../tests/control/nonblocking_history.rs"

[[test]]
name = "token_retirement"
path = "../../tests/control/token_retirement.rs"

[[test]]
name = "native_handoff"
path = "../../tests/control/native_handoff.rs"

[[test]]
name = "native_bound_execution"
path = "../../tests/control/native_bound_execution.rs"

[[test]]
name = "native_lifetime"
path = "../../tests/control/native_lifetime.rs"

[[test]]
name = "native_context_negative"
path = "../../tests/control/native_context_negative.rs"

[[test]]
name = "management_authority"
path = "../../tests/control/management_authority.rs"

[[test]]
name = "management_identity"
path = "../../tests/control/management_identity.rs"

[[test]]
name = "native_failure_recovery"
path = "../../tests/control/native_failure_recovery.rs"

[[test]]
name = "status_boundary"
path = "../../tests/control/status_boundary.rs"

[[test]]
name = "bounded_window"
path = "../../tests/control/bounded_window.rs"

[[test]]
name = "callback_lifetime"
path = "../../tests/control/callback_lifetime.rs"

[[test]]
name = "native_resource_state"
path = "../../tests/control/native_resource_state.rs"

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
hos2-os-abi = { path = "../os-abi" }
