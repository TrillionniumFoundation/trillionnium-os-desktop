# Permanent exact-head qualification for the D0C-06 receipt substrate.
name: receipt-journal

on:
  pull_request:
    paths:
      - ".github/workflows/receipt-journal.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/hepta-session-core/**"
      - "contracts/receipt-journal.v1.json"
      - "docs/architecture/DURABLE_RECEIPT_JOURNAL.md"
      - "docs/evidence/2026-08-29-d0c06-durable-receipts.md"
      - "manifests/cargo-external-allowlist.json"
      - "manifests/project-state.v1.json"
      - "manifests/gates.v1.json"
      - "manifests/repository-state.json"
      - "manifests/rust-toolchain.lock.json"
      - "manifests/product-boundary.json"
      - "manifests/upstream-reference-review.v1.json"
      - "manifests/ci-action-pins.v1.json"
      - "docs/MANIFEST.json"
      - "docs/DESKTOP_PLAN-2026-08-29-d6.md"
      - "tools/verify_receipt_journal.py"
      - "tools/validate_project_truth.py"
      - "tools/validate_repository.py"
      - "tools/qualify_servo_exact_pin_evidence.py"
      - "tests/test_verify_receipt_journal.py"
      - "rust-toolchain.toml"
  push:
    branches:
      - main
      - codex/d0c06-durable-receipt-journal
    paths:
      - ".github/workflows/receipt-journal.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/hepta-session-core/**"
      - "contracts/receipt-journal.v1.json"
      - "docs/architecture/DURABLE_RECEIPT_JOURNAL.md"
      - "docs/evidence/2026-08-29-d0c06-durable-receipts.md"
      - "manifests/cargo-external-allowlist.json"
      - "manifests/project-state.v1.json"
      - "manifests/gates.v1.json"
      - "manifests/repository-state.json"
      - "manifests/rust-toolchain.lock.json"
      - "manifests/product-boundary.json"
      - "manifests/upstream-reference-review.v1.json"
      - "manifests/ci-action-pins.v1.json"
      - "docs/MANIFEST.json"
      - "docs/DESKTOP_PLAN-2026-08-29-d6.md"
      - "tools/verify_receipt_journal.py"
      - "tools/validate_project_truth.py"
      - "tools/validate_repository.py"
      - "tools/qualify_servo_exact_pin_evidence.py"
      - "tests/test_verify_receipt_journal.py"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: receipt-journal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install exact Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.93.0

      - name: Audit contract and repository
        run: |
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 tools/verify_receipt_journal.py
          python3 -m unittest tests.test_verify_receipt_journal -v

      - name: Enforce formatting, all targets, and warnings
        run: |
          cargo fmt --all --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run durable journal fault corpus and complete regression
        run: |
          cargo test --locked -p hepta-session-core receipt_journal::tests:: -- --nocapture
          cargo test --workspace --all-targets --locked

      - name: Reconfirm closed authority boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path('contracts/receipt-journal.v1.json').read_text())
          assert all(value is False for value in contract['claim_ceiling'].values())
          assert contract['effect_recovery']['potential_external_effect'] == 'never_automatic'
          assert contract['effect_recovery']['journal_executes_or_replays_operations'] is False
          PY
