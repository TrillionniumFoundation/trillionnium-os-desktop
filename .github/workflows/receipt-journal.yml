# Exact-source and live prospective-merge qualification for the durable receipt substrate.
name: receipt-journal

on:
  pull_request:
    paths:
      - ".github/workflows/receipt-journal.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/hepta-session-core/**"
      - "contracts/receipt*.json"
      - "contracts/legacy-receipt-migration.v1.json"
      - "docs/architecture/*RECEIPT*.md"
      - "docs/architecture/D3_JOURNAL_CHAIN_RECOVERY.md"
      - "tests/test_s05_receipt_recovery.py"
      - "tools/verify_receipt_journal.py"
      - "tools/validate_repository.py"
      - "tools/validate_project_truth.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/receipt-journal.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/hepta-session-core/**"
      - "contracts/receipt*.json"
      - "contracts/legacy-receipt-migration.v1.json"
      - "docs/architecture/*RECEIPT*.md"
      - "docs/architecture/D3_JOURNAL_CHAIN_RECOVERY.md"
      - "tests/test_s05_receipt_recovery.py"
      - "tools/verify_receipt_journal.py"
      - "tools/validate_repository.py"
      - "tools/validate_project_truth.py"

permissions:
  contents: read

concurrency:
  group: receipt-journal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-source:
    name: exact-source-receipt-journal
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Assert exact source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git rev-parse HEAD^{tree}
      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.93.0
      - name: Validate contracts, repository, and hostile source corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 tools/verify_receipt_journal.py
          python3 -m unittest tests.test_s05_receipt_recovery -v
      - name: Enforce complete locked Rust graph
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --locked -p hepta-session-core receipt_journal::tests:: -- --nocapture
          cargo test --workspace --all-targets --locked
      - name: Reconfirm non-authorizing recovery ceiling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path('contracts/receipt-journal.v1.json').read_text())
          assert all(value is False for value in contract['claim_ceiling'].values())
          assert contract['effect_recovery']['potential_external_effect'] == 'never_automatic'
          assert contract['effect_recovery']['journal_executes_or_replays_operations'] is False
          PY

  prospective-merge:
    name: prospective-merge-receipt-journal
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out live prospective merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 2
          persist-credentials: false
      - name: Bind merge parents to live remote refs
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          git check-ref-format --branch "$BASE_REF"
          test "$PR_NUMBER" -gt 0
          base_sha=$(git ls-remote --exit-code origin "refs/heads/${BASE_REF}" | awk 'NR == 1 {print $1}')
          head_sha=$(git ls-remote --exit-code origin "refs/pull/${PR_NUMBER}/head" | awk 'NR == 1 {print $1}')
          test -n "$base_sha" && test -n "$head_sha"
          test "$(git rev-list --parents -n1 HEAD | awk '{print NF - 1}')" -eq 2
          test "$(git rev-parse HEAD^1)" = "$base_sha"
          test "$(git rev-parse HEAD^2)" = "$head_sha"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.93.0
      - name: Validate contracts, repository, and hostile source corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 tools/verify_receipt_journal.py
          python3 -m unittest tests.test_s05_receipt_recovery -v
      - name: Enforce complete locked Rust graph
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --locked -p hepta-session-core receipt_journal::tests:: -- --nocapture
          cargo test --workspace --all-targets --locked
      - name: Reconfirm non-authorizing recovery ceiling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path('contracts/receipt-journal.v1.json').read_text())
          assert all(value is False for value in contract['claim_ceiling'].values())
          assert contract['effect_recovery']['potential_external_effect'] == 'never_automatic'
          assert contract['effect_recovery']['journal_executes_or_replays_operations'] is False
          PY
