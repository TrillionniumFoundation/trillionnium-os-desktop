permissions:
  contents: read

concurrency:
  group: receipt-journal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install exact Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.93.0

      - name: Audit contract and repository
        run: |
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 tools/verify_receipt_journal.py
          python3 -m unittest tests.test_verify_receipt_journal tests.test_managed_receipt_store tests.test_receipt_persistence_cuts -v

      - name: Enforce formatting, all targets, and warnings
        run: |
          cargo fmt --all --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run durable journal fault corpus and complete regression
        run: |
          cargo test --locked -p hepta-session-core --lib receipt_journal::tests:: -- --nocapture
          cargo test --locked -p hepta-session-core --lib receipt_journal::persistence_tests:: -- --nocapture
          cargo test --locked -p hepta-session-core --test journal_persistence_process
          cargo test --workspace --all-targets --locked

      - name: Reconfirm closed authority boundary
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path('contracts/receipt-journal.v1.json').read_text())
          assert all(value is False for value in contract['claim_ceiling'].values())
          assert contract['effect_recovery']['potential_external_effect'] == 'never_automatic'
          assert contract['effect_recovery']['journal_executes_or_replays_operations'] is False
          PY
