# Exact-source and prospective-merge qualification for the D0C-06 receipt substrate.
name: receipt-journal

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/s05-**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: receipt-journal-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-source:
    name: exact-source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git rev-parse HEAD^{tree}

      - name: Install exact Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.93.0

      - name: Audit contract and repository
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 tools/verify_receipt_journal.py

      - name: Enforce formatting, all targets, and warnings
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run durable journal fault corpus and complete regression
        run: |
          set -euo pipefail
          cargo test --locked -p hepta-session-core receipt_journal::tests:: -- --nocapture
          cargo test --workspace --all-targets --locked

      - name: Reconfirm closed authority boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path('contracts/receipt-journal.v1.json').read_text())
          assert all(value is False for value in contract['claim_ceiling'].values())
          assert contract['effect_recovery']['potential_external_effect'] == 'never_automatic'
          assert contract['effect_recovery']['journal_executes_or_replays_operations'] is False
          PY

  prospective-merge:
    name: prospective-merge
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out prospective merge object
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 2
          persist-credentials: false

      - name: Assert prospective merge identity and parents
        env:
          EXPECTED_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MERGE_SHA"
          test "$(git rev-list --parents -n1 HEAD | awk '{print NF - 1}')" -eq 2
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_BASE_SHA"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_HEAD_SHA"
          git rev-parse HEAD^{tree}

      - name: Install exact Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.93.0

      - name: Audit contract and repository
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 tools/verify_receipt_journal.py

      - name: Enforce formatting, all targets, and warnings
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run durable journal fault corpus and complete regression
        run: |
          set -euo pipefail
          cargo test --locked -p hepta-session-core receipt_journal::tests:: -- --nocapture
          cargo test --workspace --all-targets --locked

      - name: Reconfirm closed authority boundary
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path('contracts/receipt-journal.v1.json').read_text())
          assert all(value is False for value in contract['claim_ceiling'].values())
          assert contract['effect_recovery']['potential_external_effect'] == 'never_automatic'
          assert contract['effect_recovery']['journal_executes_or_replays_operations'] is False
          PY
