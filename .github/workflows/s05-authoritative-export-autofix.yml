# repair-retry: 10
name: s05-authoritative-export-autofix

on:
  push:
    branches: [codex/s05-receipt-recovery-closure-v1]
    paths: [".github/workflows/s05-authoritative-export-autofix.yml"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact repair trigger
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/s05-receipt-recovery-closure-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Assert exact trigger and apply reviewed repair
        env:
          TRIGGER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRIGGER_SHA"
          python3 tools/s05_autofix_bootstrap.py
          python3 tools/s05_authoritative_export_autofix.py
          python3 - <<'PY'
          from pathlib import Path

          journal = Path('crates/hepta-session-core/src/receipt_journal.rs')
          text = journal.read_text(encoding='utf-8')
          old_doc = 'or its compatibility alias\n/// [`export_redacted_jsonl`]).'
          new_doc = 'or the crate-root compatibility alias\n/// [`crate::export_redacted_jsonl`]).'
          if text.count(old_doc) != 1:
              raise SystemExit(f'compatibility documentation: expected one match, found {text.count(old_doc)}')
          text = text.replace(old_doc, new_doc, 1)
          marker = 'pub fn export_redacted_jsonl(\n'
          if text.count(marker) != 1:
              raise SystemExit(f'test-only compatibility alias: expected one match, found {text.count(marker)}')
          text = text.replace(marker, '#[cfg(test)]\n' + marker, 1)
          journal.write_text(text, encoding='utf-8')

          lib = Path('crates/hepta-session-core/src/lib.rs')
          lines = lib.read_text(encoding='utf-8').splitlines()
          removed_inspect = sum(line.strip() == 'inspect_chain,' for line in lines)
          if removed_inspect != 1:
              raise SystemExit(
                  f'stale standalone inspect_chain import: expected one removal, found {removed_inspect}'
              )
          output = []
          removed_alias = 0
          for line in lines:
              if line.strip() == 'inspect_chain,':
                  continue
              if 'export_journal_redacted_jsonl' in line:
                  count = line.count(' export_redacted_jsonl,')
                  line = line.replace(' export_redacted_jsonl,', '')
                  removed_alias += count
              output.append(line)
          if removed_alias != 1:
              raise SystemExit(
                  f'private compatibility alias import: expected one removal, found {removed_alias}'
              )
          lib.write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY
          cargo fmt --all
          python3 - <<'PY'
          from pathlib import Path
          for name in (
              'docs/architecture/DURABLE_RECEIPT_JOURNAL.md',
              'docs/architecture/MANAGED_RECEIPT_STORE.md',
          ):
              path = Path(name)
              path.write_text(path.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
          git diff --check
          git diff --name-only | tee "$RUNNER_TEMP/changed.txt"
          for required in \
            contracts/receipt-journal.v1.json \
            crates/hepta-session-core/src/authoritative_export.rs \
            crates/hepta-session-core/src/receipt_journal.rs \
            docs/architecture/DURABLE_RECEIPT_JOURNAL.md \
            docs/architecture/MANAGED_RECEIPT_STORE.md \
            tests/test_s05_receipt_recovery.py; do
            grep -Fxq "$required" "$RUNNER_TEMP/changed.txt"
          done

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.93.0

      - name: Validate source contracts and hostile export cases
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 tools/verify_receipt_journal.py
          python3 -m unittest tests.test_s05_receipt_recovery -v
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --locked -p hepta-session-core --lib authoritative_export::tests:: -- --nocapture
          cargo test --locked -p hepta-session-core --lib authoritative_path_tests:: -- --nocapture
          cargo test --workspace --all-targets --all-features --locked

      - name: Publish only the reviewed source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Trillionnium gap-closure bot"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git add -A
          git reset \
            .github/workflows/s05-authoritative-export-autofix.yml \
            tools/s05_authoritative_export_autofix.py \
            tools/s05_autofix_bootstrap.py
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          test -z "$(git diff --cached --name-only | grep '^\.github/workflows/' || true)"
          git commit -m "fix(s05): lock complete export snapshots and publish atomically"
          git push origin HEAD:codex/s05-receipt-recovery-closure-v1
