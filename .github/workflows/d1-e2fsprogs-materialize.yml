name: d1-e2fsprogs-materialize

on:
  push:
    branches:
      - codex/d1-01-reproducible-qemu-substrate
    paths:
      - .github/workflows/d1-e2fsprogs-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: d1-e2fsprogs-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d1-01-reproducible-qemu-substrate
          fetch-depth: 0

      - name: Pin and build the exact deterministic filesystem toolchain
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/d1-qemu.yml')
          source = path.read_text()
          old_dep = '''          sudo apt-get install -y --no-install-recommends \\
            curl \\
'''
          new_dep = '''          sudo apt-get install -y --no-install-recommends \\
            build-essential \\
            curl \\
'''
          if source.count(old_dep) != 1:
              raise SystemExit('D1 host dependency anchor is not unique')
          source = source.replace(old_dep, new_dep)

          anchor = '''      - name: Install exact repository Rust toolchain
'''
          step = '''      - name: Build exact e2fsprogs 1.47.2 toolchain
        shell: bash
        env:
          E2FSPROGS_COMMIT: c3cce4a07efefc62bc7fc57a678cb870af27d0f2
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/e2fsprogs-source"
          build_dir="$RUNNER_TEMP/e2fsprogs-build"
          prefix="$RUNNER_TEMP/e2fsprogs-1.47.2"
          rm -rf "$source_dir" "$build_dir" "$prefix"
          git init -q "$source_dir"
          git -C "$source_dir" remote add origin https://github.com/tytso/e2fsprogs.git
          git -C "$source_dir" fetch --depth=1 origin "$E2FSPROGS_COMMIT"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = "$E2FSPROGS_COMMIT"
          test -z "$(git -C "$source_dir" status --porcelain=v1)"
          mkdir -p "$build_dir"
          cd "$build_dir"
          "$source_dir/configure" \\
            --prefix="$prefix" \\
            --disable-nls \\
            --disable-uuidd
          make -j2
          make install
          test -x "$prefix/sbin/mke2fs"
          test -x "$prefix/sbin/e2fsck"
          test -x "$prefix/sbin/dumpe2fs"
          test "$("$prefix/sbin/mke2fs" -V 2>&1 | awk 'NR == 1 { print $2 }')" = 1.47.2
          printf '%s\\n' "$prefix/sbin" "$prefix/bin" >> "$GITHUB_PATH"
          printf 'E2FSPROGS_COMMIT=%s\\n' "$E2FSPROGS_COMMIT" >> "$GITHUB_ENV"

'''
          if source.count(anchor) != 1:
              raise SystemExit('D1 Rust toolchain anchor is not unique')
          source = source.replace(anchor, step + anchor)
          path.write_text(source)
          PY
          rm .github/workflows/d1-e2fsprogs-materialize.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/d1-qemu.yml .github/workflows/d1-e2fsprogs-materialize.yml
          git commit -m 'fix: pin e2fsprogs 1.47.2 for D1 reproducibility'
          git push origin HEAD:codex/d1-01-reproducible-qemu-substrate
