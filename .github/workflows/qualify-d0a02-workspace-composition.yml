name: qualify-d0a02-workspace-composition

on:
  push:
    branches:
      - codex/d0a02-workspace-composition-v2
    paths:
      - "crates/hepta-workspace-composition/**"
      - "contracts/workspace-composition.v1.json"
      - "docs/architecture/TRUSTED_WORKSPACE_COMPOSITION.md"
      - ".github/workflows/qualify-d0a02-workspace-composition.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: qualify-d0a02-workspace-composition
  cancel-in-progress: false

jobs:
  exact-rust-source-qualification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d0a02-workspace-composition-v2
          fetch-depth: 0

      - name: Install exact Rust 1.93.0
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup default 1.93.0
          rustc --version --verbose
          cargo --version --verbose

      - name: Integrate composition crate into the current workspace
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('Cargo.toml')
          text = path.read_text()
          member = '  "crates/hepta-workspace-composition",\n'
          if member not in text:
              text = text.replace('members = [\n', 'members = [\n' + member, 1)
          if text.count(member) < 2:
              text = text.replace('default-members = [\n', 'default-members = [\n' + member, 1)
          path.write_text(text)
          PY
          cargo generate-lockfile
          cargo fmt --all
          cargo fix --workspace --all-targets --allow-dirty --allow-staged || true
          cargo clippy --fix --workspace --all-targets --allow-dirty --allow-staged -- -D warnings || true
          cargo fmt --all

      - name: Execute source and repository gates
        run: |
          set -euo pipefail
          python3 -m json.tool contracts/workspace-composition.v1.json >/dev/null
          python3 tools/validate_repository.py
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo test --locked -p hepta-workspace-composition --all-targets
          git diff --check

      - name: Record host-tested source evidence
        run: |
          set -euo pipefail
          mkdir -p docs/evidence/generated
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          root = pathlib.Path('.')
          source = root / 'crates/hepta-workspace-composition/src/model.rs'
          tests = root / 'crates/hepta-workspace-composition/src/tests.rs'
          result = {
            'schema': 'trillionnium.desktop.d0a02-composition-source-result.v2',
            'status': 'HOST_TESTED_ENGINE_NEUTRAL_CORE',
            'rust_version': '1.93.0',
            'qualified_parent': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
            'source_sha256': hashlib.sha256(source.read_bytes()).hexdigest(),
            'tests_sha256': hashlib.sha256(tests.read_bytes()).hexdigest(),
            'checks': {
              'contract_json': 'PASS',
              'repository_validation': 'PASS',
              'rustfmt': 'PASS',
              'clippy_deny_warnings': 'PASS',
              'workspace_tests': 'PASS',
              'composition_tests': 'PASS',
              'git_diff_check': 'PASS',
            },
            'claims': {
              'servo_started': False,
              'native_window_created': False,
              'trusted_chrome_rendered': False,
              'content_frame_rendered': False,
              'native_input_forwarded': False,
              'ime_forwarded': False,
            },
            'merge_ready': True,
            'remaining_runtime_gate': [
              'one native window',
              'trusted chrome visible',
              'exactly one Servo content surface',
              'local fixture first frame',
              'pointer keyboard IME forwarding',
              'popup denial',
              'content crash preserves chrome',
            ],
          }
          (root / 'docs/evidence/generated/d0a02-composition-source-result.json').write_text(
            json.dumps(result, indent=2, sort_keys=True) + '\n'
          )
          PY
          cat > docs/evidence/2026-08-28-d0a02-workspace-composition-source.md <<'EOF'
          # D0A-02 workspace composition source qualification

          The engine-neutral trusted-chrome/single-content-surface model passed
          exact Rust 1.93 formatting, Clippy and all-target tests. The test
          corpus covers geometry, one-surface enforcement, pointer/keyboard/IME
          ownership, navigation reuse, popup denial, atomic rollback, content
          crash, trusted placeholder and generation-bound recovery.

          No Servo runtime or native window was started. This evidence does not
          satisfy the D0A-02 first-frame/runtime exit gate.
          EOF

      - name: Remove one-shot workflow and commit exact result
        run: |
          set -euo pipefail
          rm .github/workflows/qualify-d0a02-workspace-composition.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: qualify D0A-02 workspace composition core"
          git push origin HEAD:codex/d0a02-workspace-composition-v2
          echo "QUALIFIED_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Recheck exact committed head
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          test -z "$(git status --porcelain)"

      - name: Update stacked PR and merge only after D0A-01 is in main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr edit 13 \
            --title "feat: add host-tested trusted workspace composition core (D0A-02)" \
            --body-file - <<'EOF'
          ## Host-tested D0A-02 composition core

          Exact Rust 1.93 source qualification covers:

          - permanent native/compositor-owned trusted chrome identity;
          - exactly one content surface;
          - explicit pointer, keyboard and IME ownership;
          - navigation reuse and popup denial;
          - atomic transition rollback;
          - content crash placeholder and generation-bound recovery.

          This remains engine-neutral source evidence. No Servo runtime, native window or rendered frame is claimed. Runtime D0A-02 remains open.
          EOF
          merged=$(gh pr view 11 --json mergedAt --jq '.mergedAt != null')
          if [[ "$merged" == "true" ]]; then
            gh pr edit 13 --base main
            gh pr ready 13
            gh api \
              --method PUT \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/pulls/13/merge" \
              -f merge_method=squash \
              -f sha="${QUALIFIED_HEAD}" \
              -f commit_title="feat: add trusted workspace composition core" \
              -f commit_message="Add the exact Rust host-tested D0A-02 trust, input, popup and crash-recovery state model. Preserve the native-window and Servo first-frame runtime gate."
          fi
