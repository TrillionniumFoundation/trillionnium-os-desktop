name: promote-d0c-rust-candidate

on:
  push:
    branches:
      - codex/d0c02-transport-v2
    paths:
      - "docs/evidence/generated/d0c-rust-exact-gate-result.json"
      - "manifests/cargo-external-allowlist.d0c-candidate.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: promote-d0c-rust-candidate
  cancel-in-progress: false

jobs:
  audit-promote-and-requalify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d0c02-transport-v2
          fetch-depth: 0

      - name: Require exact Rust PASS evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          result = json.load(open('docs/evidence/generated/d0c-rust-exact-gate-result.json'))
          assert result['status'] == 'PASS_ALLOWLIST_REVIEW_REQUIRED', result
          expected = {
              'cargo_fmt': 'PASS',
              'cargo_clippy_deny_warnings': 'PASS',
              'cargo_test_workspace_all_targets': 'PASS',
              'codec_tests': 'PASS',
              'agent_port_tests': 'PASS',
              'browserd_self_check': 'PASS',
              'git_diff_check': 'PASS',
          }
          assert result['checks'] == expected, result['checks']
          assert result['authority'] == {
              'listener_enabled': False,
              'browser_actor_connected': False,
              'servo_connected': False,
              'external_effect_authorized': False,
          }
          PY

      - name: Install exact Rust and supply-chain audit tools
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup default 1.93.0
          cargo install cargo-audit --locked

      - name: Verify exact lock, sources, checksums and graph
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 --locked > /tmp/metadata.json
          cargo tree --workspace --locked --all-features > docs/evidence/generated/d0c-cargo-tree.txt
          python3 - <<'PY'
          import json, pathlib, tomllib
          root = pathlib.Path('.')
          lock = tomllib.loads((root / 'Cargo.lock').read_text())
          candidate = json.loads((root / 'manifests/cargo-external-allowlist.d0c-candidate.json').read_text())
          entries = {(p['name'], p['version']): p['checksum'] for p in candidate['packages']}
          registry = []
          for package in lock['package']:
              source = package.get('source')
              if source is None:
                  continue
              assert source == 'registry+https://github.com/rust-lang/crates.io-index', (package['name'], source)
              assert 'git+' not in source
              checksum = package.get('checksum')
              assert checksum and len(checksum) == 64
              registry.append((package['name'], package['version'], checksum))
          assert set(entries) == {(name, version) for name, version, _ in registry}
          for name, version, checksum in registry:
              assert entries[(name, version)] == checksum
          metadata = json.load(open('/tmp/metadata.json'))
          workspace_root = pathlib.Path(metadata['workspace_root']).resolve()
          for package in metadata['packages']:
              source = package.get('source')
              if source is None:
                  manifest = pathlib.Path(package['manifest_path']).resolve()
                  assert workspace_root in manifest.parents or manifest == workspace_root
              else:
                  assert source.startswith('registry+https://github.com/rust-lang/crates.io-index')
          direct = candidate.get('direct_dependencies', {})
          required = {
              'crates/hepta-agent-transport',
              'crates/hepta-browser-codec',
              'crates/hepta-agent-port',
          }
          assert required.issubset(direct), direct.keys()
          for crate, dependencies in direct.items():
              for name, version in dependencies.items():
                  assert isinstance(version, str) and version.startswith('='), (crate, name, version)
          PY
          cargo audit --deny warnings

      - name: Promote candidate allowlist and update evidence status
        run: |
          set -euo pipefail
          cp manifests/cargo-external-allowlist.d0c-candidate.json manifests/cargo-external-allowlist.json
          python3 - <<'PY'
          import json, pathlib
          path = pathlib.Path('docs/evidence/generated/d0c-rust-exact-gate-result.json')
          result = json.loads(path.read_text())
          result['status'] = 'PASS_EXACT_RUST_AND_SUPPLY_CHAIN'
          result['merge_ready'] = True
          result['remaining_gate'] = 'permanent branch CI and review'
          result['supply_chain'] = {
              'cargo_lock_sources': 'PASS_CRATES_IO_ONLY',
              'candidate_allowlist_matches_lock': 'PASS',
              'direct_dependencies_exactly_pinned': 'PASS',
              'cargo_audit': 'PASS',
          }
          path.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          checkpoint = {
              'schema': 'trillionnium.desktop.d0c-promotion.v1',
              'status': 'HOST_TESTED_EXACT_RUST_1_93',
              'completed': ['D0C-02', 'D0C-03', 'D0C-04'],
              'listener_enabled': False,
              'browser_actor_connected': False,
              'servo_connected': False,
              'external_effect_authorized': False,
              'next': ['D0C-05 socket custody', 'D0A-01 exact Servo compile'],
          }
          pathlib.Path('docs/evidence/generated/d0c-promotion-result.json').write_text(
              json.dumps(checkpoint, indent=2, sort_keys=True) + '\n'
          )
          PY
          rm -f .github/workflows/promote-d0c-rust-candidate.yml

      - name: Re-run complete repository and exact Rust gates
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo test --locked -p hepta-browser-codec --all-targets
          cargo test --locked -p hepta-agent-port --all-targets
          cargo run --locked -p hepta-browserd -- --self-check
          git diff --check

      - name: Commit tested promotion
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: promote exact Rust D0C product candidate"
          git push origin HEAD:codex/d0c02-transport-v2
