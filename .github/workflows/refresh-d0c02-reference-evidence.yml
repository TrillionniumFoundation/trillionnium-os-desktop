name: refresh-d0c02-reference-evidence

on:
  push:
    branches:
      - codex/d0c02-transport-v2
    paths:
      - .github/workflows/refresh-d0c02-reference-evidence.yml

permissions:
  contents: write

jobs:
  regenerate-test-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d0c02-transport-v2
          fetch-depth: 0

      - name: Compile and execute independent reference
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/agent_transport_reference.py tests/transport/test_agent_transport_reference.py
          python3 -m unittest discover -s tests/transport -p 'test_*.py' -v
          python3 tools/agent_transport_reference.py \
            --contract contracts/agent-transport.v1.json \
            --write-vector /tmp/agent-transport-request.v1.json \
            --write-result docs/evidence/generated/d0c02-agent-transport-reference-result.json \
            > /tmp/agent-transport-reference.stdout.json
          cmp /tmp/agent-transport-request.v1.json contracts/golden/agent-transport-request.v1.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("docs/evidence/generated/d0c02-agent-transport-reference-result.json").read_text())
          assert result["status"] == "PASS"
          assert result["tests_passed"] == 15
          assert result["authority"]["product_listener_created"] is False
          assert result["authority"]["browser_payload_interpreted"] is False
          PY

      - name: Remove one-shot workflow and commit evidence
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/refresh-d0c02-reference-evidence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: refresh D0C-02 deterministic reference evidence"
          git push origin HEAD:codex/d0c02-transport-v2
