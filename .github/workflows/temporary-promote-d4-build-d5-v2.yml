name: temporary-promote-d4-build-d5-v2

on:
  push:
    branches:
      - codex/control-d4-promote-d5-build-v2

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: temporary-promote-d4-build-d5-v2
  cancel-in-progress: false

jobs:
  promote-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: codex/full-gap-closure-final
      CONTROL_BRANCH: codex/control-d4-promote-d5-build-v2
      D4_CANDIDATE: codex/d4-integration-candidate-v2
      D4_CONTROL: codex/control-d4-build-v2
      D2I_PROOF: codex/d2i-apply-v3-proof
      D5_CANDIDATE: codex/d5-integration-candidate-v2
      D5_SOURCE_A: codex/d5-product-foundation
      D5_SOURCE_B: codex/d5-trusted-app-verifier-v1
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out promotion control branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/control-d4-promote-d5-build-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Wait for a proved isolated D4 candidate
        id: route
        run: |
          set -euo pipefail
          ready=false
          candidate=
          for _ in $(seq 1 540); do
            candidate=$(git ls-remote --heads origin "refs/heads/$D4_CANDIDATE" | awk '{print $1}')
            if test -n "$candidate"; then
              ready=true
              break
            fi
            d4_control=$(git ls-remote --heads origin "refs/heads/$D4_CONTROL" | awk '{print $1}')
            if test -n "$d4_control" && git show "$d4_control:diagnostics/d4-candidate-v2/latest.txt" >/dev/null 2>&1; then
              break
            fi
            d2i_proof=$(git ls-remote --heads origin "refs/heads/$D2I_PROOF" | awk '{print $1}')
            if test -n "$d2i_proof" && git show "$d2i_proof:diagnostics/d2i-v3-monitor/latest.txt" >/dev/null 2>&1; then
              break
            fi
            sleep 10
          done
          printf 'ready=%s\n' "$ready" >> "$GITHUB_OUTPUT"
          if test "$ready" = true; then
            printf 'candidate=%s\n' "$candidate" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify D4 ancestry and install pinned toolchain
        if: steps.route.outputs.ready == 'true'
        id: d4
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$TARGET_BRANCH" "$D4_CANDIDATE"
          target=$(git rev-parse "origin/$TARGET_BRANCH")
          candidate=$(git rev-parse "origin/$D4_CANDIDATE")
          test "$candidate" = '${{ steps.route.outputs.candidate }}'
          mapfile -t parents < <(git show -s --format='%P' "$candidate" | tr ' ' '\n' | sed '/^$/d')
          test "${#parents[@]}" -eq 1
          test "${parents[0]}" = "$target"
          git checkout -B "$D4_CANDIDATE" "$candidate"
          channel=$(python3 - <<'PY'
          from pathlib import Path
          import tomllib
          print(tomllib.loads(Path('rust-toolchain.toml').read_text())['toolchain']['channel'])
          PY
          )
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustup override set "$channel"
          printf 'parent=%s\n' "$target" >> "$GITHUB_OUTPUT"
          printf 'head=%s\n' "$candidate" >> "$GITHUB_OUTPUT"

      - name: Independently re-prove D4 candidate
        if: steps.route.outputs.ready == 'true'
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1)"
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 tools/verify_systemd_socket_custody.py
          python3 -m unittest discover -s tests -t . -p 'test_*.py'
          cargo fmt --all --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-targets --all-features --locked

      - name: Fast-forward unified candidate to D4
        if: steps.route.outputs.ready == 'true'
        run: |
          set -euo pipefail
          remote=$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')
          test "$remote" = '${{ steps.d4.outputs.parent }}'
          git push origin '${{ steps.d4.outputs.head }}:refs/heads/codex/full-gap-closure-final'

      - name: Require exact D4-head D2I machine evidence
        if: steps.route.outputs.ready == 'true'
        id: d2i
        run: |
          set -euo pipefail
          repo=$GITHUB_REPOSITORY
          candidate='${{ steps.d4.outputs.head }}'
          for _ in $(seq 1 180); do
            pr_head=$(gh api "repos/$repo/pulls/52" --jq '.head.sha')
            test "$pr_head" = "$candidate" && break
            sleep 10
          done
          test "$(gh api "repos/$repo/pulls/52" --jq '.head.sha')" = "$candidate"
          workflow_id=$(gh api "repos/$repo/actions/workflows" --paginate --jq \
            '.workflows[] | select(.path == ".github/workflows/d2i-integrated-image.yml") | .id' | head -n1)
          test -n "$workflow_id"
          run_id=
          for _ in $(seq 1 300); do
            run_id=$(gh api "repos/$repo/actions/workflows/$workflow_id/runs?event=pull_request&per_page=100" \
              --jq ".workflow_runs
                | map(select(.head_branch == \"$TARGET_BRANCH\"))
                | map(select(any(.pull_requests[]?; .number == 52 and (.head.sha == \"$candidate\" or .head.sha == null))))
                | sort_by(.created_at) | reverse | .[0].id // empty")
            if test -n "$run_id"; then
              status=$(gh api "repos/$repo/actions/runs/$run_id" --jq '.status')
              test "$status" = completed && break
            fi
            sleep 15
          done
          test -n "$run_id"
          status=$(gh api "repos/$repo/actions/runs/$run_id" --jq '.status')
          conclusion=$(gh api "repos/$repo/actions/runs/$run_id" --jq '.conclusion')
          printf 'candidate=%s\nrun_id=%s\nstatus=%s\nconclusion=%s\n' \
            "$candidate" "$run_id" "$status" "$conclusion" | tee /tmp/d4-d2i-state.txt
          if test "$status" != completed || test "$conclusion" != success; then
            gh run view "$run_id" --repo "$repo" --log-failed > /tmp/d4-d2i-failed.log 2>&1 || true
            exit 1
          fi
          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

      - name: Replay only D5-labelled commits from both source lines
        if: steps.route.outputs.ready == 'true'
        run: |
          set -euo pipefail
          d4='${{ steps.d4.outputs.head }}'
          git fetch --no-tags origin "$D5_SOURCE_A" "$D5_SOURCE_B"
          git checkout -B "$D5_CANDIDATE" "$d4"
          : > /tmp/d5-history.txt
          : > /tmp/d5-selected.txt
          declare -A seen=()
          for source_branch in "$D5_SOURCE_A" "$D5_SOURCE_B"; do
            source=$(git rev-parse "origin/$source_branch")
            merge_base=$(git merge-base "$d4" "$source")
            printf 'source=%s head=%s merge_base=%s\n' "$source_branch" "$source" "$merge_base" >> /tmp/d5-history.txt
            git log --reverse --format='%H%x09%s' "$merge_base..$source" >> /tmp/d5-history.txt
            mapfile -t commits < <(
              git log --reverse --format='%H%x09%s' \
                --extended-regexp --regexp-ignore-case \
                --grep='(^|[^[:alnum:]])d5([^[:alnum:]]|$)' \
                "$merge_base..$source" |
              awk -F '\t' 'tolower($2) !~ /(temporary|diagnostic|export|audit-only)/ {print $1}'
            )
            test "${#commits[@]}" -gt 0
            for commit in "${commits[@]}"; do
              if test -n "${seen[$commit]:-}"; then
                continue
              fi
              seen[$commit]=1
              test "$(git show -s --format=%P "$commit" | wc -w)" -eq 1
              printf '%s\n' "$commit" >> /tmp/d5-selected.txt
              git cherry-pick --no-commit "$commit"
            done
          done
          test -s /tmp/d5-selected.txt
          test -n "$(git diff --cached --name-only)"
          git diff --cached --name-status | tee /tmp/d5-diff.txt
          if git diff --cached --name-only | grep -E '(^|/)(temporary|diagnostics?)(/|$)|\.patch(\.|$)|\.b85$'; then
            echo 'D5 candidate contains temporary or diagnostic material' >&2
            exit 1
          fi
          git diff --cached --check

      - name: Prove D5 candidate source truth and feature graphs
        if: steps.route.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 tools/verify_systemd_socket_custody.py
          python3 -m unittest discover -s tests -t . -p 'test_*.py'
          cargo fmt --all --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-targets --all-features --locked

      - name: Publish isolated D5 candidate
        if: steps.route.outputs.ready == 'true'
        run: |
          set -euo pipefail
          remote=$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')
          test "$remote" = '${{ steps.d4.outputs.head }}'
          test -z "$(git ls-remote --heads origin "refs/heads/$D5_CANDIDATE")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m 'feat(d5): integrate trusted application product foundation'
          git push origin "HEAD:refs/heads/$D5_CANDIDATE"

      - name: Persist bounded D4/D5 failure diagnosis
        if: failure()
        run: |
          set -euo pipefail
          status_snapshot=$(git status --short 2>&1 || true)
          git fetch --no-tags origin "$CONTROL_BRANCH"
          git checkout -B "$CONTROL_BRANCH" "origin/$CONTROL_BRANCH"
          rm -f .github/workflows/temporary-promote-d4-build-d5-v2.yml
          mkdir -p diagnostics/d4-promote-d5-build-v2
          {
            printf 'schema=trillionnium.desktop.d4-promote-d5-build-diagnostic.v1\n'
            printf 'recorded_at=%s\n\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for file in /tmp/d4-d2i-state.txt /tmp/d4-d2i-failed.log /tmp/d5-history.txt /tmp/d5-selected.txt /tmp/d5-diff.txt; do
              if test -f "$file"; then
                printf '%s\n' "--- $(basename "$file") ---"
                tail -n 1600 "$file"
                printf '\n'
              fi
            done
            printf '%s\n%s\n' '--- status ---' "$status_snapshot"
          } > diagnostics/d4-promote-d5-build-v2/latest.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- \
            .github/workflows/temporary-promote-d4-build-d5-v2.yml \
            diagnostics/d4-promote-d5-build-v2/latest.txt
          git commit -m 'diagnostics(d4-d5): record promotion or construction failure'
          git push origin "HEAD:refs/heads/$CONTROL_BRANCH"

      - name: Remove D4/D5 control workflow
        if: success()
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$CONTROL_BRANCH"
          git checkout -B "$CONTROL_BRANCH" "origin/$CONTROL_BRANCH"
          rm .github/workflows/temporary-promote-d4-build-d5-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- .github/workflows/temporary-promote-d4-build-d5-v2.yml
          git commit -m 'ci: remove temporary D4/D5 promotion workflow'
          git push origin "HEAD:refs/heads/$CONTROL_BRANCH"
