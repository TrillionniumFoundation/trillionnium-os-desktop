permissions:
  contents: read

concurrency:
  group: s06-browser-actor-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-source:
    name: s06-browser-actor / exact-source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify canonical live source role
        shell: bash
        env:
          CI_SOURCE_ROLE: head
          CI_SOURCE_EVENT: ${{ github.event_name }}
          CI_SOURCE_REPOSITORY: ${{ github.repository }}
          CI_SOURCE_REF: ${{ github.ref }}
          CI_SOURCE_REF_NAME: ${{ github.ref_name }}
          CI_SOURCE_SHA: ${{ github.sha }}
          CI_SOURCE_PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_SOURCE_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_SOURCE_PR_BASE: ${{ github.event.pull_request.base.sha }}
          CI_SOURCE_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          python3 -B tools/verify_ci_source_identity.py

      - name: Assert exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          subject_tree="$(git rev-parse 'HEAD^{tree}')"
          test -n "$subject_tree"
          printf 'evidence_class=exact_head\nsubject_sha=%s\nsubject_tree=%s\n' \
            "$EXPECTED_SOURCE_SHA" "$subject_tree" >> "$GITHUB_STEP_SUMMARY"

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.93.0

      - name: Validate repository truth, contract paths, and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 -m unittest \
            tests.test_s06_browser_actor \
            tests.test_s06_contract_paths \
            tests.test_s06_public_exports \
            -v

      - name: Run complete locked source graph
        env:
          # Exclude test-only DWARF bytes from live self-image measurements; deadlines are unchanged.
          CARGO_PROFILE_TEST_DEBUG: '0'
          # Optimize the same source-test executable measurements without changing budgets.
          CARGO_PROFILE_TEST_OPT_LEVEL: '1'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          listed="$(cargo test --locked -p hepta-browser-actor-simulation --lib -- --list 2>/dev/null | grep -c ': test$' || true)"
          test "$listed" -gt 0
          printf 'actor_simulation_lib_tests=%s\n' "$listed" >> "$GITHUB_STEP_SUMMARY"
          cargo test --locked -p hepta-browser-actor-simulation --lib -- --nocapture
          cargo test --locked -p hepta-browser-actor --doc
          cargo test --workspace --all-targets --all-features --locked

      - name: Reconfirm sealed product API and claim ceiling
        shell: bash
        run: |
          set -euo pipefail
          reject_match() {
            local grep_status
            if grep "$@"; then
              echo "forbidden source match" >&2
              exit 1
            else
              grep_status=$?
            fi
            if [[ $grep_status -eq 1 ]]; then
              return 0
            fi
            echo "source absence scan failed with status $grep_status" >&2
            exit "$grep_status"
          }
          reject_match -R -n -E 'pub struct BrowserActor<|impl<.*BrowserActor|runtime: R|pub fn new\(|pub fn handle\(' crates/hepta-browser-actor/src
          # Inventory real declarations after discarding Rust comments/literals;
          # private use and pub(crate) use are not external public exports.
          export_inventory="$RUNNER_TEMP/s06-public-exports.txt"
          python3 tools/scan_s06_public_exports.py crates/hepta-browser-actor/src > "$export_inventory"
          reject_match -R -n -E '(^|[^[:alnum:]_])(PrincipalBinding|MechanismIdentity|PageRuntime|CallbackPageRuntime|RequestControl|RuntimeReply)([^[:alnum:]_]|$)|^pub use [^;]*\*' "$export_inventory"
          grep -R -n 'pub fn from_attested' crates/hepta-browser-actor/src
          grep -R -n 'pub fn handle_attested' crates/hepta-browser-actor/src
          python3 - <<'PY'
          import json
          from pathlib import Path

          def reject_duplicate(pairs):
              output = {}
              for key, value in pairs:
                  if key in output:
                      raise ValueError(key)
                  output[key] = value
              return output

          def reject_constant(value):
              raise ValueError(value)

          contract = json.loads(
              Path('contracts/browser-actor.v1.json').read_text(encoding='utf-8'),
              object_pairs_hook=reject_duplicate,
              parse_constant=reject_constant,
          )
          authority = contract['authority_boundary']
          assert authority['product_actor_generic_over_runtime'] is False
          assert authority['caller_supplied_runtime_adapter'] is False
          assert authority['runtime_trait_publicly_exported'] is False
          assert authority['request_control_publicly_exported'] is False
          assert authority['deferred_work_after_terminal_success_representable'] is False
          assert contract['browser_actor']['agent_navigation_requires_idle_control_before_runtime'] is True
          assert contract['browser_actor']['terminal_revision_reference_is_never_current'] is True
          assert contract['activation']['product_agent_port_enabled'] is False
          assert contract['activation']['servo_adapter_included'] is False
          assert contract['activation']['production_release_authorized'] is False
          PY

  prospective-merge:
    name: s06-browser-actor / prospective-merge
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out live prospective merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 2
          persist-credentials: false

      - name: Verify canonical live source role
        shell: bash
        env:
          CI_SOURCE_ROLE: prospective-merge
          CI_SOURCE_EVENT: ${{ github.event_name }}
          CI_SOURCE_REPOSITORY: ${{ github.repository }}
          CI_SOURCE_REF: ${{ github.ref }}
          CI_SOURCE_REF_NAME: ${{ github.ref_name }}
          CI_SOURCE_SHA: ${{ github.sha }}
          CI_SOURCE_PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_SOURCE_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_SOURCE_PR_BASE: ${{ github.event.pull_request.base.sha }}
          CI_SOURCE_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          python3 -B tools/verify_ci_source_identity.py

      - name: Bind merge parents to live remote refs
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git check-ref-format --branch "$BASE_REF"
          git check-ref-format "refs/heads/$BASE_REF"
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          resolve_ref() {
            git ls-remote --exit-code origin "$1" | awk -v ref="$1" '
              $2 == ref { value = $1; matches++ }
              END { if (matches != 1) exit 1; print value }
            '
          }
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-list --parents -n 1 HEAD | awk '{print NF}')" -eq 3
          live_base="$(resolve_ref "refs/heads/$BASE_REF")"
          live_head="$(resolve_ref "refs/pull/$PR_NUMBER/head")"
          test -n "$live_base"
          test -n "$live_head"
          test "$live_head" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD^1)" = "$live_base"
          test "$(git rev-parse HEAD^2)" = "$live_head"
          merge_tree="$(git rev-parse 'HEAD^{tree}')"
          printf 'evidence_class=prospective_merge\nsubject_sha=%s\nsubject_tree=%s\nbase_ref=%s\nbase_sha=%s\nhead_sha=%s\n' \
            "$(git rev-parse HEAD)" "$merge_tree" "$BASE_REF" "$live_base" "$live_head" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.93.0

      - name: Validate repository truth, contract paths, and authority boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 -m unittest \
            tests.test_s06_browser_actor \
            tests.test_s06_contract_paths \
            tests.test_s06_public_exports \
            -v

      - name: Run complete locked merged graph
        env:
          # Exclude test-only DWARF bytes from live self-image measurements; deadlines are unchanged.
          CARGO_PROFILE_TEST_DEBUG: '0'
          # Optimize the same source-test executable measurements without changing budgets.
          CARGO_PROFILE_TEST_OPT_LEVEL: '1'
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          listed="$(cargo test --locked -p hepta-browser-actor-simulation --lib -- --list 2>/dev/null | grep -c ': test$' || true)"
          test "$listed" -gt 0
          printf 'actor_simulation_lib_tests=%s\n' "$listed" >> "$GITHUB_STEP_SUMMARY"
          cargo test --locked -p hepta-browser-actor-simulation --lib -- --nocapture
          cargo test --locked -p hepta-browser-actor --doc
          cargo test --workspace --all-targets --all-features --locked

      - name: Reconfirm sealed product API and claim ceiling
        shell: bash
        run: |
          set -euo pipefail
          reject_match() {
            local grep_status
            if grep "$@"; then
              echo "forbidden source match" >&2
              exit 1
            else
              grep_status=$?
            fi
            if [[ $grep_status -eq 1 ]]; then
              return 0
            fi
            echo "source absence scan failed with status $grep_status" >&2
            exit "$grep_status"
          }
          reject_match -R -n -E 'pub struct BrowserActor<|impl<.*BrowserActor|runtime: R|pub fn new\(|pub fn handle\(' crates/hepta-browser-actor/src
          # Inventory real declarations after discarding Rust comments/literals;
          # private use and pub(crate) use are not external public exports.
          export_inventory="$RUNNER_TEMP/s06-public-exports.txt"
          python3 tools/scan_s06_public_exports.py crates/hepta-browser-actor/src > "$export_inventory"
          reject_match -R -n -E '(^|[^[:alnum:]_])(PrincipalBinding|MechanismIdentity|PageRuntime|CallbackPageRuntime|RequestControl|RuntimeReply)([^[:alnum:]_]|$)|^pub use [^;]*\*' "$export_inventory"
          grep -R -n 'pub fn from_attested' crates/hepta-browser-actor/src
          grep -R -n 'pub fn handle_attested' crates/hepta-browser-actor/src
          python3 - <<'PY'
          import json
          from pathlib import Path

          def reject_duplicate(pairs):
              output = {}
              for key, value in pairs:
                  if key in output:
                      raise ValueError(key)
                  output[key] = value
              return output

          def reject_constant(value):
              raise ValueError(value)

          contract = json.loads(
              Path('contracts/browser-actor.v1.json').read_text(encoding='utf-8'),
              object_pairs_hook=reject_duplicate,
              parse_constant=reject_constant,
          )
          authority = contract['authority_boundary']
          assert authority['product_actor_generic_over_runtime'] is False
          assert authority['caller_supplied_runtime_adapter'] is False
          assert authority['runtime_trait_publicly_exported'] is False
          assert authority['request_control_publicly_exported'] is False
          assert authority['deferred_work_after_terminal_success_representable'] is False
          assert contract['browser_actor']['agent_navigation_requires_idle_control_before_runtime'] is True
          assert contract['browser_actor']['terminal_revision_reference_is_never_current'] is True
          assert contract['activation']['product_agent_port_enabled'] is False
          assert contract['activation']['servo_adapter_included'] is False
          assert contract['activation']['production_release_authorized'] is False
          PY
