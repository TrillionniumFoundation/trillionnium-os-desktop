name: s06-browser-actor

on:
  pull_request:
    paths:
      - ".github/workflows/s06-browser-actor.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/hepta-browser-actor/**"
      - "crates/hepta-browser-actor-simulation/**"
      - "crates/hepta-agent-port/**"
      - "crates/hepta-peer-attestation/**"
      - "crates/hepta-session-core/**"
      - "contracts/browser-actor.v1.json"
      - "contracts/engine-thread-dispatch.v1.json"
      - "contracts/event-loop-completion.v1.json"
      - "contracts/session-incarnation.v1.json"
      - "docs/source-state.v1.json"
      - "docs/architecture/BROWSER_ACTOR_AUTHORITY_BOUNDARY.md"
      - "tests/test_s06_browser_actor.py"
      - "tools/validate_repository.py"
      - "tools/_validate_repository_impl.py"
      - "tools/validate_project_truth.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/s06-browser-actor.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/hepta-browser-actor/**"
      - "crates/hepta-browser-actor-simulation/**"
      - "crates/hepta-agent-port/**"
      - "crates/hepta-peer-attestation/**"
      - "crates/hepta-session-core/**"
      - "contracts/browser-actor.v1.json"
      - "contracts/engine-thread-dispatch.v1.json"
      - "contracts/event-loop-completion.v1.json"
      - "contracts/session-incarnation.v1.json"
      - "docs/source-state.v1.json"
      - "docs/architecture/BROWSER_ACTOR_AUTHORITY_BOUNDARY.md"
      - "tests/test_s06_browser_actor.py"
      - "tools/validate_repository.py"
      - "tools/_validate_repository_impl.py"
      - "tools/validate_project_truth.py"

permissions:
  contents: read

concurrency:
  group: s06-browser-actor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-source:
    name: exact-source-authority-boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Assert exact source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git rev-parse HEAD^{tree}
      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.93.0
      - name: Validate repository truth and authority contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 -m unittest tests.test_s06_browser_actor -v
      - name: Run complete locked source graph
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo test --locked --doc -p hepta-browser-actor
          cargo test --locked -p hepta-browser-actor-simulation --lib
      - name: Reconfirm product API has no weak dispatch entry
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E 'impl<.*BrowserRequestHandler.*BrowserActor|pub fn new\(|pub fn handle\(' crates/hepta-browser-actor/src
          ! grep -R -n -E 'pub (use|type).*PrincipalBinding|pub (use|type).*MechanismIdentity' crates/hepta-browser-actor/src
          grep -R -n 'pub fn from_attested' crates/hepta-browser-actor/src
          grep -R -n 'pub fn handle_attested' crates/hepta-browser-actor/src

  prospective-merge:
    name: prospective-merge-authority-boundary
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out live prospective merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 2
          persist-credentials: false
      - name: Bind merge parents to live remote refs
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          git check-ref-format --branch "$BASE_REF"
          test "$PR_NUMBER" -gt 0
          base_sha=$(git ls-remote --exit-code origin "refs/heads/${BASE_REF}" | awk 'NR == 1 {print $1}')
          head_sha=$(git ls-remote --exit-code origin "refs/pull/${PR_NUMBER}/head" | awk 'NR == 1 {print $1}')
          test -n "$base_sha" && test -n "$head_sha"
          test "$(git rev-list --parents -n1 HEAD | awk '{print NF - 1}')" -eq 2
          test "$(git rev-parse HEAD^1)" = "$base_sha"
          test "$(git rev-parse HEAD^2)" = "$head_sha"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.93.0
      - name: Validate repository truth and authority contract
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 -m unittest tests.test_s06_browser_actor -v
      - name: Run complete locked merged graph
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo test --locked --doc -p hepta-browser-actor
          cargo test --locked -p hepta-browser-actor-simulation --lib
      - name: Reconfirm product API has no weak dispatch entry
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n -E 'impl<.*BrowserRequestHandler.*BrowserActor|pub fn new\(|pub fn handle\(' crates/hepta-browser-actor/src
          ! grep -R -n -E 'pub (use|type).*PrincipalBinding|pub (use|type).*MechanismIdentity' crates/hepta-browser-actor/src
          grep -R -n 'pub fn from_attested' crates/hepta-browser-actor/src
          grep -R -n 'pub fn handle_attested' crates/hepta-browser-actor/src
