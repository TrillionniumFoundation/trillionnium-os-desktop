name: s06-browser-actor

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "tools/_validate_repository_impl.py"
      - "tools/validate_repository.py"
      - "crates/hepta-browser-actor/**"
      - "contracts/browser-actor.v1.json"
      - "contracts/engine-thread-dispatch.v1.json"
      - "contracts/event-loop-completion.v1.json"
      - "contracts/session-incarnation.v1.json"
      - "docs/architecture/PAGE_OWNER_BROWSER_ACTOR.md"
      - "docs/architecture/ENGINE_THREAD_DISPATCH.md"
      - "docs/architecture/EVENT_LOOP_COMPLETION.md"
      - "docs/architecture/SESSION_INCARNATION.md"
      - "tests/test_s06_browser_actor.py"
      - ".github/workflows/s06-browser-actor.yml"
  push:
    branches: [main, "codex/s06-**"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "tools/_validate_repository_impl.py"
      - "tools/validate_repository.py"
      - "crates/hepta-browser-actor/**"
      - "contracts/browser-actor.v1.json"
      - "contracts/engine-thread-dispatch.v1.json"
      - "contracts/event-loop-completion.v1.json"
      - "contracts/session-incarnation.v1.json"
      - "tests/test_s06_browser_actor.py"
      - ".github/workflows/s06-browser-actor.yml"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.93.0
      - run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 -m unittest tests.test_s06_browser_actor -v
      - run: cargo fmt --all --check
      - run: cargo check --locked -p hepta-browser-actor --all-targets
      - run: cargo clippy --locked -p hepta-browser-actor --all-targets -- -D warnings
      - run: cargo test --locked -p hepta-browser-actor --all-targets
