name: d0a02-fix-drive-dispatch

on:
  push:
    branches:
      - codex/d0a02-proof-soundness-v4
    paths:
      - ".github/workflows/d0a02-fix-drive-dispatch.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/d0a02-proof-soundness-v4
          fetch-depth: 0

      - name: Replace invalid receiver call with event-loop dispatch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("experiments/servo-headed-runtime/src/main.rs")
          text = path.read_text(encoding="utf-8")
          old = """        self.window.request_redraw();
        self.drive();
    }

    fn start_recovery"""
          new = """        self.window.request_redraw();
        let _ = self.proxy.send_event(AppEvent::Drive);
    }

    fn start_recovery"""
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit("receiver-call repair target is not unique")
              path.write_text(text.replace(old, new), encoding="utf-8")
          elif new not in text:
              raise SystemExit("neither old nor repaired receiver-call shape is present")
          PY
          git diff --check
          if git diff --quiet; then
            echo "repair already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/servo-headed-runtime/src/main.rs
          git commit -m "fix(d0a02): dispatch drive after exact termination"
          git push origin HEAD:codex/d0a02-proof-soundness-v4
