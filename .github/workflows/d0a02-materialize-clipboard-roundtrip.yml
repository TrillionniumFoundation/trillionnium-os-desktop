name: d0a02-materialize-clipboard-roundtrip

on:
  push:
    branches:
      - codex/d0a02-proof-soundness-v4
    paths:
      - ".github/workflows/d0a02-materialize-clipboard-roundtrip.yml"
      - "tools/materialize_d0a02_clipboard_roundtrip.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: d0a02-materialize-clipboard-roundtrip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact helper head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Materialize generation-bound Servo clipboard proof
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = codex/d0a02-proof-soundness-v4
          python3 tools/materialize_d0a02_clipboard_roundtrip.py
          python3 tools/validate_d0a02_proof_soundness.py
          python3 tools/validate_d0a02_clipboard_roundtrip.py
          python3 -m py_compile \
            tools/validate_d0a02_proof_soundness.py \
            tools/validate_d0a02_clipboard_roundtrip.py
          grep -q 'EditingAction::Copy' experiments/servo-headed-runtime/src/main.rs
          grep -q 'EditingAction::Paste' experiments/servo-headed-runtime/src/main.rs
          ! grep -R --line-number --fixed-strings 'xclip' \
            experiments/servo-headed-runtime/src/main.rs \
            .github/workflows/servo-headed-runtime.yml

      - name: Commit only the materialized permanent surfaces
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/d0a02-materialize-clipboard-roundtrip.yml \
            tools/materialize_d0a02_clipboard_roundtrip.py
          git add \
            experiments/servo-headed-runtime/src/main.rs \
            .github/workflows/servo-headed-runtime.yml \
            tools/validate_d0a02_clipboard_roundtrip.py \
            docs/architecture/D0A02_CLIPBOARD_ROUNDTRIP.md \
            .github/workflows/d0a02-materialize-clipboard-roundtrip.yml \
            tools/materialize_d0a02_clipboard_roundtrip.py
          test -n "$(git status --porcelain=v1)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'test(d0a02): prove Servo clipboard round-trip'
          git push origin "HEAD:$GITHUB_REF_NAME"
