name: materialize-d0c-rust-stack-v2

on:
  push:
    branches:
      - codex/d0c02-transport-v2
    paths:
      - ".github/workflows/materialize-d0c-rust-stack-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-d0c-rust-stack
  cancel-in-progress: false

jobs:
  materialize-test-and-publish-evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d0c02-transport-v2
          fetch-depth: 0

      - name: Install exact Rust 1.93.0
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup default 1.93.0
          rustc --version --verbose
          cargo --version --verbose

      - name: Materialize or verify D0C product source
        run: |
          set -euo pipefail
          if [[ ! -f crates/hepta-browser-codec/src/lib.rs || ! -f crates/hepta-agent-port/src/lib.rs ]]; then
            curl --fail --location --silent --show-error \
              https://raw.githubusercontent.com/TrillionniumFoundation/trillionnium-os-desktop/b617f1013d84770a74129895e4be1f3ce3960c17/.bootstrap-d0c/payload.tar.gz.b64 \
              --output /tmp/d0c-materialize.tar.gz.b64
            base64 -d /tmp/d0c-materialize.tar.gz.b64 > /tmp/d0c-materialize.tar.gz
            echo "787c4df8648ab4dd3c0795de3e04f3f1c11b913215cd81f0cc4bf9449b316ad9  /tmp/d0c-materialize.tar.gz" | sha256sum -c -
            mkdir -p /tmp/d0c
            tar -xzf /tmp/d0c-materialize.tar.gz -C /tmp/d0c
            mkdir -p docs/evidence/generated
            python3 /tmp/d0c/apply_to_checkout.py "$GITHUB_WORKSPACE" \
              --apply --allow-dirty \
              --report docs/evidence/generated/d0c-rust-overlay-application.json
            cp /tmp/d0c/toolchain/tools/verify_cargo_lock_allowlist.py tools/verify_cargo_lock_allowlist.py
            cp /tmp/d0c/toolchain/manifests/cargo-external-allowlist-d0c02-baseline.json \
              manifests/cargo-external-allowlist-d0c02-baseline.json
          fi
          cargo generate-lockfile
          cargo fmt --all
          python3 tools/verify_cargo_lock_allowlist.py \
            --lock Cargo.lock \
            --baseline manifests/cargo-external-allowlist-d0c02-baseline.json \
            --write-candidate manifests/cargo-external-allowlist.d0c-candidate.json \
            --output-result docs/evidence/generated/d0c-cargo-lock-candidate-result.json

      - name: Commit exact source candidate before execution
        run: |
          set -euo pipefail
          rm -f .github/workflows/materialize-d0c-rust-stack.yml
          rm -f .github/workflows/materialize-d0c-rust-stack-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "feat: materialize D0C-03 and D0C-04 Rust product candidate"
            git push origin HEAD:codex/d0c02-transport-v2
          fi
          echo "TESTED_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Execute exact Rust gate and retain logs
        id: rust_gate
        shell: bash
        run: |
          set +e
          mkdir -p docs/evidence/generated
          cargo fmt --all --check > docs/evidence/generated/d0c-rust-fmt.log 2>&1
          fmt_status=$?
          cargo clippy --workspace --all-targets --locked -- -D warnings > docs/evidence/generated/d0c-rust-clippy.log 2>&1
          clippy_status=$?
          cargo test --workspace --all-targets --locked > docs/evidence/generated/d0c-rust-workspace-tests.log 2>&1
          workspace_status=$?
          cargo test --locked -p hepta-browser-codec --all-targets > docs/evidence/generated/d0c-rust-codec-tests.log 2>&1
          codec_status=$?
          cargo test --locked -p hepta-agent-port --all-targets > docs/evidence/generated/d0c-rust-agent-port-tests.log 2>&1
          agent_port_status=$?
          cargo run --locked -p hepta-browserd -- --self-check > docs/evidence/generated/d0c-rust-browserd-self-check.log 2>&1
          self_check_status=$?
          git diff --check > docs/evidence/generated/d0c-rust-diff-check.log 2>&1
          diff_status=$?
          overall=0
          for status in "$fmt_status" "$clippy_status" "$workspace_status" "$codec_status" "$agent_port_status" "$self_check_status" "$diff_status"; do
            if [[ "$status" -ne 0 ]]; then overall=1; fi
          done
          {
            echo "fmt_status=$fmt_status"
            echo "clippy_status=$clippy_status"
            echo "workspace_status=$workspace_status"
            echo "codec_status=$codec_status"
            echo "agent_port_status=$agent_port_status"
            echo "self_check_status=$self_check_status"
            echo "diff_status=$diff_status"
            echo "overall=$overall"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish machine-readable gate evidence
        env:
          FMT_STATUS: ${{ steps.rust_gate.outputs.fmt_status }}
          CLIPPY_STATUS: ${{ steps.rust_gate.outputs.clippy_status }}
          WORKSPACE_STATUS: ${{ steps.rust_gate.outputs.workspace_status }}
          CODEC_STATUS: ${{ steps.rust_gate.outputs.codec_status }}
          AGENT_PORT_STATUS: ${{ steps.rust_gate.outputs.agent_port_status }}
          SELF_CHECK_STATUS: ${{ steps.rust_gate.outputs.self_check_status }}
          DIFF_STATUS: ${{ steps.rust_gate.outputs.diff_status }}
          OVERALL: ${{ steps.rust_gate.outputs.overall }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('.')
          def passed(name): return "PASS" if os.environ[name] == "0" else "FAIL"
          def sha(path): return hashlib.sha256((root / path).read_bytes()).hexdigest()
          overall_pass = os.environ["OVERALL"] == "0"
          evidence = {
              "schema": "trillionnium.desktop.d0c-rust-exact-gate.v1",
              "status": "PASS_ALLOWLIST_REVIEW_REQUIRED" if overall_pass else "FAIL_SOURCE_FIX_REQUIRED",
              "rust_version": "1.93.0",
              "tested_source_commit": os.environ["TESTED_SOURCE_COMMIT"],
              "cargo_lock_sha256": sha("Cargo.lock"),
              "codec_source_sha256": sha("crates/hepta-browser-codec/src/lib.rs"),
              "agent_port_source_sha256": sha("crates/hepta-agent-port/src/lib.rs"),
              "checks": {
                  "cargo_fmt": passed("FMT_STATUS"),
                  "cargo_clippy_deny_warnings": passed("CLIPPY_STATUS"),
                  "cargo_test_workspace_all_targets": passed("WORKSPACE_STATUS"),
                  "codec_tests": passed("CODEC_STATUS"),
                  "agent_port_tests": passed("AGENT_PORT_STATUS"),
                  "browserd_self_check": passed("SELF_CHECK_STATUS"),
                  "git_diff_check": passed("DIFF_STATUS")
              },
              "merge_ready": False,
              "remaining_gate": "review/promote exact Cargo external allowlist and rerun repository validation" if overall_pass else "repair failing exact Rust checks and rerun",
              "authority": {
                  "listener_enabled": False,
                  "browser_actor_connected": False,
                  "servo_connected": False,
                  "external_effect_authorized": False
              }
          }
          (root / "docs/evidence/generated/d0c-rust-exact-gate-result.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n"
          )
          PY
          git add docs/evidence/generated
          git diff --cached --check
          git commit -m "test: record exact Rust 1.93 D0C gate evidence"
          git push origin HEAD:codex/d0c02-transport-v2

      - name: Enforce exact gate result
        env:
          OVERALL: ${{ steps.rust_gate.outputs.overall }}
        run: test "$OVERALL" = "0"
