# repair-retry: 2
name: s06-product-authority-autofix

on:
  push:
    branches: [codex/s06-browser-actor-closure-v1]
    paths: [".github/workflows/s06-product-authority-autofix.yml"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      S05_HEAD: 1d69e22b2f0db757f1965aa578478943aa2bf03f
    steps:
      - name: Check out exact S06 repair trigger
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/s06-browser-actor-closure-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Bind and merge the exact repaired S05 parent
        env:
          TRIGGER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRIGGER_SHA"
          git config user.name "Trillionnium gap-closure bot"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git fetch --no-tags origin "$S05_HEAD"
          test "$(git rev-parse FETCH_HEAD)" = "$S05_HEAD"
          git merge --no-ff --no-commit "$S05_HEAD"
          test "$(git rev-parse MERGE_HEAD)" = "$S05_HEAD"

      - name: Apply the reviewed product API repair
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/s06_doc_test_bootstrap.py
          python3 tools/s06_product_authority_autofix.py
          rm -f \
            tools/s06_doc_test_bootstrap.py \
            tools/s06_product_authority_autofix.py \
            .github/workflows/s06-product-authority-autofix.yml
          cargo fmt --all
          git add -A
          git diff --cached --check
          git diff --cached --name-only | tee "$RUNNER_TEMP/changed.txt"
          for required in \
            contracts/browser-actor.v1.json \
            crates/hepta-browser-actor/src/lib.rs \
            crates/hepta-browser-actor/README.md \
            docs/architecture/BROWSER_ACTOR_AUTHORITY_BOUNDARY.md \
            tests/test_s06_browser_actor.py; do
            grep -Fxq "$required" "$RUNNER_TEMP/changed.txt"
          done
          test ! -e tools/s06_doc_test_bootstrap.py
          test ! -e tools/s06_product_authority_autofix.py
          test ! -e .github/workflows/s06-product-authority-autofix.yml
          ! grep -n 'pub fn apply_session_event' crates/hepta-browser-actor/src/lib.rs
          ! grep -n 'pub use hepta_session_core::{ReceiptJournal, SessionEvent' crates/hepta-browser-actor/src/lib.rs
          grep -n 'pub use hepta_session_core::ReceiptJournal' crates/hepta-browser-actor/src/lib.rs

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.93.0

      - name: Qualify the final merged source tree
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 tools/verify_receipt_journal.py
          python3 -m unittest \
            tests.test_s05_receipt_recovery \
            tests.test_s06_browser_actor \
            tests.test_s06_contract_paths \
            -v
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --locked -p hepta-session-core --lib authoritative_export::tests:: -- --nocapture
          cargo test --locked -p hepta-browser-actor --doc
          listed="$(cargo test --locked -p hepta-browser-actor-simulation --lib -- --list 2>/dev/null | grep -c ': test$' || true)"
          test "$listed" -gt 0
          printf 'actor_simulation_lib_tests=%s\n' "$listed" >> "$GITHUB_STEP_SUMMARY"
          cargo test --locked -p hepta-browser-actor-simulation --lib -- --nocapture
          cargo test --workspace --all-targets --all-features --locked

      - name: Publish the exact repaired S06 merge object
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse MERGE_HEAD)" = "$S05_HEAD"
          git diff --cached --check
          git commit -m "fix(s06): close raw state ingress and absorb S05 export repair"
          git push origin HEAD:codex/s06-browser-actor-closure-v1
