name: s05-receipt-recovery

on:
  pull_request:
    paths:
      - "crates/hepta-session-core/**"
      - "contracts/receipt*.json"
      - "contracts/legacy-receipt-migration.v1.json"
      - "docs/architecture/*RECEIPT*.md"
      - "docs/architecture/D3_JOURNAL_CHAIN_RECOVERY.md"
      - "tests/test_s05_receipt_recovery.py"
      - ".github/workflows/s05-receipt-recovery.yml"
  push:
    branches: [main, "codex/s05-**"]
    paths:
      - "crates/hepta-session-core/**"
      - "contracts/receipt*.json"
      - "contracts/legacy-receipt-migration.v1.json"
      - "docs/architecture/*RECEIPT*.md"
      - "docs/architecture/D3_JOURNAL_CHAIN_RECOVERY.md"
      - "tests/test_s05_receipt_recovery.py"
      - ".github/workflows/s05-receipt-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s05-receipt-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-source-package:
    name: exact-source-package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git rev-parse HEAD^{tree}

      - name: Install exact Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.93.0

      - name: Validate bounded receipt package
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 tools/verify_receipt_journal.py
          python3 -m unittest tests.test_s05_receipt_recovery -v
          cargo fmt --all --check
          cargo check --locked -p hepta-session-core --all-targets
          cargo clippy --locked -p hepta-session-core --all-targets -- -D warnings
          cargo test --locked -p hepta-session-core --all-targets
