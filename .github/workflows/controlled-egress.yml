name: controlled-egress-host-corpus

on:
  push:
    branches: [main, "codex/**"]
    paths:
      - ".github/workflows/controlled-egress.yml"
      - "tests/test_ci_pr_ref_identities.py"
      - "platform/controlled_egress.py"
      - "tests/test_controlled_egress.py"
      - "contracts/controlled-egress.v1.json"
      - "docs/architecture/CONTROLLED_EGRESS.md"
  pull_request:
    paths:
      - ".github/workflows/controlled-egress.yml"
      - "tests/test_ci_pr_ref_identities.py"
      - "platform/controlled_egress.py"
      - "tests/test_controlled_egress.py"
      - "contracts/controlled-egress.v1.json"
      - "docs/architecture/CONTROLLED_EGRESS.md"

permissions:
  contents: read

concurrency:
  group: controlled-egress-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actual-host-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        object: ${{ github.event_name == 'pull_request' && fromJSON('["head","prospective-merge"]') || fromJSON('["head"]') }}
    steps:
      - name: Check out exact source object
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.object == 'prospective-merge' && format('refs/pull/{0}/merge', github.event.pull_request.number) || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
          fetch-depth: 2
          persist-credentials: false
      - name: Bind exact source and current prospective parents
        shell: bash
        env:
          SOURCE_OBJECT: ${{ matrix.object }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          EVENT_TESTED: ${{ github.sha }}
          HEAD_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          resolve_ref() {
            git ls-remote --exit-code origin "$1" | awk -v ref="$1" '
              $2 == ref { value = $1; matches++ }
              END { if (matches != 1) exit 1; print value }
            '
          }
          case "$EVENT_NAME" in
            pull_request)
              [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
              head_query="refs/pull/$PR_NUMBER/head"
              ;;
            push)
              head_query="refs/heads/$HEAD_REF"
              git check-ref-format "$head_query"
              ;;
            *) exit 1 ;;
          esac
          live_head="$(resolve_ref "$head_query")"
          test "$live_head" = "$EVENT_HEAD"
          if test "$SOURCE_OBJECT" = prospective-merge; then
            git check-ref-format "refs/heads/$BASE_REF"
            live_base="$(resolve_ref "refs/heads/$BASE_REF")"
            test "$live_base" = "$EVENT_BASE"
            test "$(git rev-parse HEAD)" = "$EVENT_TESTED"
            test "$(git show -s --format=%P HEAD | wc -w)" -eq 2
            test "$(git rev-parse HEAD^1)" = "$live_base"
            test "$(git rev-parse HEAD^2)" = "$live_head"
          else
            test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          fi
          git rev-parse HEAD 'HEAD^{tree}'
          sha256sum platform/controlled_egress.py tests/test_controlled_egress.py contracts/controlled-egress.v1.json
      - name: Run real Git PR-ref identity regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p test_ci_pr_ref_identities.py -v
      - name: Run actual controlled-egress host corpus
        shell: bash
        run: |
          set -euo pipefail
          unset PYTHONOPTIMIZE
          openssl version
          python3 - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.discover('tests', pattern='test_controlled_egress.py')
          expected = suite.countTestCases()
          if expected < 45:
              raise RuntimeError('required controlled-egress corpus is missing tests')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.testsRun != expected or result.skipped:
              raise SystemExit('controlled-egress corpus failed, omitted or skipped cases')
          PY
      - name: Validate contracts and source claim ceilings
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_module_documentation.py
          python3 tools/validate_documentation_coherence.py
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 tools/validate_contract_foundation.py
          git diff --exit-code
