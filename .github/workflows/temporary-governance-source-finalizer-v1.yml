name: temporary-governance-source-finalizer-v1

on:
  push:
    branches:
      - codex/control-governance-source-finalizer-v1

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: temporary-governance-source-finalizer-v1
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: codex/full-gap-closure-final
      CONTROL_BRANCH: codex/control-governance-source-finalizer-v1
      SOURCE_D9: codex/d9-integration-candidate-v2
      GOVERNED_D9: codex/d9-governed-candidate-v1
      DIRECT_GOVERNANCE_BRANCH: codex/control-governance-direct-v1
      DIRECT_GOVERNANCE_PATH: diagnostics/governance-direct-v1/latest.json
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out governance-source control branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/control-governance-source-finalizer-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Wait for D9 source candidate and validated review team
        id: route
        run: |
          set -euo pipefail
          mkdir -p /tmp/governance-source
          ready=false
          reason=not_ready
          team_slug=
          d9=
          for _ in $(seq 1 1080); do
            d9=$(git ls-remote --heads origin "refs/heads/$SOURCE_D9" | awk '{print $1}')
            direct=$(git ls-remote --heads origin "refs/heads/$DIRECT_GOVERNANCE_BRANCH" | awk '{print $1}')
            if test -n "$direct"; then
              git fetch --no-tags origin "$direct" >/dev/null 2>&1 || true
              if git show "$direct:$DIRECT_GOVERNANCE_PATH" > /tmp/governance-source/direct.json 2>/dev/null; then
                team_slug=$(jq -r '.team.slug // empty' /tmp/governance-source/direct.json)
                member_count=$(jq -r '.team.members | length // 0' /tmp/governance-source/direct.json)
                production=$(jq -r '.production_environment.verified // false' /tmp/governance-source/direct.json)
                negative=$(jq -r '.negative_test.passed // false' /tmp/governance-source/direct.json)
                if test -n "$team_slug" && test "$member_count" -ge 2 && test "$production" = true && test "$negative" = true; then
                  if test -n "$d9"; then
                    ready=true
                    reason=d9_and_governance_ready
                    break
                  fi
                  reason=waiting_for_d9
                else
                  reason=governance_team_or_live_controls_unproven
                  break
                fi
              fi
            fi
            sleep 20
          done
          printf 'ready=%s\nreason=%s\nteam_slug=%s\nd9=%s\n' "$ready" "$reason" "$team_slug" "$d9" | tee /tmp/governance-source/route.txt
          printf 'ready=%s\nreason=%s\nteam_slug=%s\nd9=%s\n' "$ready" "$reason" "$team_slug" "$d9" >> "$GITHUB_OUTPUT"

      - name: Verify D9 parent and install pinned toolchain
        if: steps.route.outputs.ready == 'true'
        id: identity
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$TARGET_BRANCH" "$SOURCE_D9"
          target=$(git rev-parse "origin/$TARGET_BRANCH")
          d9=$(git rev-parse "origin/$SOURCE_D9")
          test "$d9" = '${{ steps.route.outputs.d9 }}'
          test "$(git show -s --format=%P "$d9" | wc -w)" -eq 1
          parent=$(git show -s --format=%P "$d9")
          test "$parent" = "$target"
          channel=$(git show "$target:rust-toolchain.toml" | python3 -c 'import sys,tomllib; print(tomllib.loads(sys.stdin.read())["toolchain"]["channel"])')
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustup override set "$channel"
          printf 'target=%s\nd9=%s\n' "$target" "$d9" >> "$GITHUB_OUTPUT"

      - name: Add organization-team CODEOWNERS to the exact current target
        if: steps.route.outputs.ready == 'true'
        id: codeowners
        run: |
          set -euo pipefail
          target='${{ steps.identity.outputs.target }}'
          team='${{ steps.route.outputs.team_slug }}'
          git checkout -B "$TARGET_BRANCH" "$target"
          mkdir -p .github
          cat > .github/CODEOWNERS <<EOF
          # TrillionniumOS Desktop independent review boundary.
          # The organization team is live-verified to contain at least two members.
          * @TrillionniumFoundation/$team
          /.github/ @TrillionniumFoundation/$team
          /contracts/ @TrillionniumFoundation/$team
          /manifests/ @TrillionniumFoundation/$team
          /packaging/ @TrillionniumFoundation/$team
          /tools/ @TrillionniumFoundation/$team
          /crates/ @TrillionniumFoundation/$team
          /apps/ @TrillionniumFoundation/$team
          EOF
          sed -i 's/^          //' .github/CODEOWNERS
          test "$(grep -Ec "@TrillionniumFoundation/$team" .github/CODEOWNERS)" -ge 1
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 tools/verify_systemd_socket_custody.py
          python3 -m unittest discover -s tests -t . -p 'test_*.py'
          cargo fmt --all --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-targets --all-features --locked
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/CODEOWNERS
          git commit -m 'chore(governance): bind code ownership to independent review team'
          head=$(git rev-parse HEAD)
          test "$(git show -s --format=%P HEAD)" = "$target"
          current=$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')
          test "$current" = "$target"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          printf 'head=%s\n' "$head" >> "$GITHUB_OUTPUT"

      - name: Require exact CODEOWNERS-head D2I evidence
        if: steps.route.outputs.ready == 'true'
        id: d2i
        run: |
          set -euo pipefail
          repo=$GITHUB_REPOSITORY
          candidate='${{ steps.codeowners.outputs.head }}'
          gh workflow run d2i-integrated-image.yml --repo "$repo" --ref "$TARGET_BRANCH"
          workflow_id=$(gh api "repos/$repo/actions/workflows" --paginate --jq '.workflows[] | select(.path == ".github/workflows/d2i-integrated-image.yml") | .id' | head -n1)
          test -n "$workflow_id"
          run_id=
          for _ in $(seq 1 480); do
            run_id=$(gh api "repos/$repo/actions/workflows/$workflow_id/runs?event=workflow_dispatch&per_page=100" --jq ".workflow_runs | map(select(.head_branch == \"$TARGET_BRANCH\" and .head_sha == \"$candidate\")) | sort_by(.created_at) | reverse | .[0].id // empty")
            if test -n "$run_id" && test "$(gh api "repos/$repo/actions/runs/$run_id" --jq '.status')" = completed; then
              break
            fi
            sleep 15
          done
          test -n "$run_id"
          status=$(gh api "repos/$repo/actions/runs/$run_id" --jq '.status')
          conclusion=$(gh api "repos/$repo/actions/runs/$run_id" --jq '.conclusion')
          printf 'candidate=%s\nrun_id=%s\nstatus=%s\nconclusion=%s\n' "$candidate" "$run_id" "$status" "$conclusion" | tee /tmp/governance-source/d2i.txt
          if test "$status" != completed || test "$conclusion" != success; then
            gh run view "$run_id" --repo "$repo" --log-failed > /tmp/governance-source/d2i-failed.log 2>&1 || true
            exit 1
          fi

      - name: Rebuild D9 source candidate on the governed target
        if: steps.route.outputs.ready == 'true'
        id: d9
        run: |
          set -euo pipefail
          old_parent='${{ steps.identity.outputs.target }}'
          old_d9='${{ steps.identity.outputs.d9 }}'
          governed='${{ steps.codeowners.outputs.head }}'
          test -z "$(git ls-remote --heads origin "refs/heads/$GOVERNED_D9")"
          git checkout -B "$GOVERNED_D9" "$governed"
          git diff --binary --full-index "$old_parent" "$old_d9" > /tmp/governance-source/d9.patch
          test -s /tmp/governance-source/d9.patch
          git apply --check /tmp/governance-source/d9.patch
          git apply --index --whitespace=error-all /tmp/governance-source/d9.patch
          test -f .github/CODEOWNERS
          if git diff --cached --name-only | grep -E '(^|/)(temporary|diagnostics?)(/|$)|\.patch(\.|$)|\.b85$'; then
            echo 'governed D9 includes temporary or diagnostic material' >&2
            exit 1
          fi
          git diff --cached --check
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 tools/verify_systemd_socket_custody.py
          python3 -m unittest discover -s tests -t . -p 'test_*.py'
          cargo fmt --all --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-targets --all-features --locked
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m 'feat(d9): build governed signed release promotion source candidate'
          head=$(git rev-parse HEAD)
          test "$(git show -s --format=%P HEAD)" = "$governed"
          git push origin "HEAD:refs/heads/$GOVERNED_D9"
          printf 'head=%s\n' "$head" >> "$GITHUB_OUTPUT"

      - name: Request fresh team review for the governed current PR head
        if: steps.route.outputs.ready == 'true'
        run: |
          set -euo pipefail
          jq -n --arg team '${{ steps.route.outputs.team_slug }}' '{reviewers:[],team_reviewers:[$team]}' > /tmp/governance-source/review-request.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/52/requested_reviewers" --method POST --input /tmp/governance-source/review-request.json > /tmp/governance-source/review-response.json

      - name: Persist governance-source result and remove workflow
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          ROUTE_READY: ${{ steps.route.outputs.ready }}
          ROUTE_REASON: ${{ steps.route.outputs.reason }}
          TEAM_SLUG: ${{ steps.route.outputs.team_slug }}
          GOVERNED_HEAD: ${{ steps.codeowners.outputs.head }}
          GOVERNED_D9_HEAD: ${{ steps.d9.outputs.head }}
        run: |
          set -euo pipefail
          status_snapshot=$(git status --short 2>&1 || true)
          git fetch --no-tags origin "$CONTROL_BRANCH"
          git checkout -B "$CONTROL_BRANCH" "origin/$CONTROL_BRANCH"
          rm -f .github/workflows/temporary-governance-source-finalizer-v1.yml
          mkdir -p diagnostics/governance-source-finalizer-v1
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('/tmp/governance-source')
          def text(name):
              p=root/name
              return p.read_text(errors='replace')[-10000:] if p.exists() else None
          def load(name):
              p=root/name
              if not p.exists(): return None
              try: return json.loads(p.read_text())
              except Exception: return {'raw_tail':p.read_text(errors='replace')[-10000:]}
          report={
              'schema':'trillionnium.desktop.governance-source-finalizer.v1',
              'job_status':os.environ.get('JOB_STATUS'),
              'route_ready':os.environ.get('ROUTE_READY')=='true',
              'route_reason':os.environ.get('ROUTE_REASON'),
              'team_slug':os.environ.get('TEAM_SLUG') or None,
              'governed_target_head':os.environ.get('GOVERNED_HEAD') or None,
              'governed_d9_candidate':os.environ.get('GOVERNED_D9_HEAD') or None,
              'd2i':text('d2i.txt'),
              'd2i_failure_tail':text('d2i-failed.log'),
              'review_response':load('review-response.json'),
              'claim_ceiling':{
                  'organization_team_codeowners_proven':os.environ.get('JOB_STATUS')=='success' and bool(os.environ.get('GOVERNED_HEAD')),
                  'governed_d9_source_candidate_proven':os.environ.get('JOB_STATUS')=='success' and bool(os.environ.get('GOVERNED_D9_HEAD')),
                  'independent_human_approval_proven':False,
                  'release_readiness_proven':False,
              },
          }
          Path('diagnostics/governance-source-finalizer-v1/latest.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
          {
            printf '%s\n' '--- control status before cleanup ---'
            printf '%s\n' "$status_snapshot"
            test -f /tmp/governance-source/route.txt && cat /tmp/governance-source/route.txt || true
          } > diagnostics/governance-source-finalizer-v1/control.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- .github/workflows/temporary-governance-source-finalizer-v1.yml diagnostics/governance-source-finalizer-v1
          git commit -m "diagnostics(governance): record source finalizer result ($JOB_STATUS)"
          git push origin "HEAD:refs/heads/$CONTROL_BRANCH"
