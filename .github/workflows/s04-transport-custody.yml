permissions:
  contents: read

concurrency:
  group: s04-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-policy:
    name: s04-transport-custody / source-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify canonical live source role
        shell: bash
        env:
          CI_SOURCE_ROLE: head
          CI_SOURCE_EVENT: ${{ github.event_name }}
          CI_SOURCE_REPOSITORY: ${{ github.repository }}
          CI_SOURCE_REF: ${{ github.ref }}
          CI_SOURCE_REF_NAME: ${{ github.ref_name }}
          CI_SOURCE_SHA: ${{ github.sha }}
          CI_SOURCE_PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_SOURCE_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_SOURCE_PR_BASE: ${{ github.event.pull_request.base.sha }}
          CI_SOURCE_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          python3 -B tools/verify_ci_source_identity.py

      - name: Verify exact identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          git rev-parse 'HEAD^{tree}'
      - name: Run real Git PR-ref identity regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p test_ci_pr_ref_identities.py -v
      - name: Compile source-policy implementation
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/browser_codec_reference_security.py \
            tools/browser_codec_reference_contract.py \
            tools/validate_s04_transport_custody.py \
            tools/agent_transport_reference.py \
            tests/test_s04_transport_custody.py \
            tests/test_dual_owner_custody.py \
            tests/test_accepted_stream_handoff.py \
            tests/transport/test_agent_transport_reference.py
      - name: Validate source, contracts, and project truth
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 tools/validate_contract_foundation.py
          python3 tools/validate_rust_browser_codec.py
          python3 tools/validate_s04_transport_custody.py
          python3 -m unittest tests.test_s04_transport_custody -v
          python3 -m unittest discover -s tests -p test_accepted_stream_handoff.py -v
          python3 -m unittest discover -s tests -p test_dual_owner_custody.py -v
          python3 -m unittest discover -s tests/transport -p 'test_*.py' -v
      - name: Reproduce independent transport evidence
        run: |
          set -euo pipefail
          python3 tools/agent_transport_reference.py \
            --contract contracts/agent-transport.v1.json \
            --write-vector /tmp/agent-transport-request.v1.json \
            --write-result /tmp/d0c02-agent-transport-reference-result.json \
            >/tmp/agent-transport-reference.stdout.json
          diff -u contracts/golden/agent-transport-request.v1.json \
            /tmp/agent-transport-request.v1.json
          diff -u docs/evidence/generated/d0c02-agent-transport-reference-result.json \
            /tmp/d0c02-agent-transport-reference-result.json

  rust-all-features:
    name: s04-transport-custody / rust-all-features
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify canonical live source role
        shell: bash
        env:
          CI_SOURCE_ROLE: head
          CI_SOURCE_EVENT: ${{ github.event_name }}
          CI_SOURCE_REPOSITORY: ${{ github.repository }}
          CI_SOURCE_REF: ${{ github.ref }}
          CI_SOURCE_REF_NAME: ${{ github.ref_name }}
          CI_SOURCE_SHA: ${{ github.sha }}
          CI_SOURCE_PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_SOURCE_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_SOURCE_PR_BASE: ${{ github.event.pull_request.base.sha }}
          CI_SOURCE_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          python3 -B tools/verify_ci_source_identity.py

      - name: Verify exact identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
      - name: Install exact Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.93.0
      - name: Rust format, build, lint, and test all S04 feature graphs
        env:
          # Exclude test-only DWARF bytes from live self-image measurements; deadlines are unchanged.
          CARGO_PROFILE_TEST_DEBUG: '0'
          # Optimize the same source-test executable measurements without changing budgets.
          CARGO_PROFILE_TEST_OPT_LEVEL: '1'
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-targets --all-features --locked
      - name: Product and fixture self-checks
        run: |
          set -euo pipefail
          cargo run --locked -p hepta-browserd -- --self-check
          cargo run --locked -p hepta-agent-portd --bin hepta-agent-portd -- --self-check
          cargo run --locked -p hepta-agent-portd --features fixture --bin hepta-agent-port-fixture -- --self-check
          test ! -S /run/hepta/browserd/agent.sock
          test ! -e /etc/hepta/enable-agent-port

  source-policy-prospective-merge:
    name: s04-transport-custody / source-policy-prospective-merge
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out prospective merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 2
          persist-credentials: false
      - name: Verify canonical live source role
        shell: bash
        env:
          CI_SOURCE_ROLE: prospective-merge
          CI_SOURCE_EVENT: ${{ github.event_name }}
          CI_SOURCE_REPOSITORY: ${{ github.repository }}
          CI_SOURCE_REF: ${{ github.ref }}
          CI_SOURCE_REF_NAME: ${{ github.ref_name }}
          CI_SOURCE_SHA: ${{ github.sha }}
          CI_SOURCE_PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_SOURCE_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_SOURCE_PR_BASE: ${{ github.event.pull_request.base.sha }}
          CI_SOURCE_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          python3 -B tools/verify_ci_source_identity.py

      - name: Verify merge identity against live branch refs
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git show -s --format=%P HEAD | wc -w)" -eq 2
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          resolve_ref() {
            git ls-remote --exit-code origin "$1" | awk -v ref="$1" '
              $2 == ref { value = $1; matches++ }
              END { if (matches != 1) exit 1; print value }
            '
          }
          git check-ref-format "refs/heads/$BASE_REF"
          live_base="$(resolve_ref "refs/heads/$BASE_REF")"
          live_head="$(resolve_ref "refs/pull/$PR_NUMBER/head")"
          test -n "$live_base"
          test -n "$live_head"
          test "$live_head" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD^1)" = "$live_base"
          test "$(git rev-parse HEAD^2)" = "$live_head"
          printf 'merge=%s\nbase_ref=%s\nbase_sha=%s\nhead_ref=%s\nhead_sha=%s\n' \
            "$(git rev-parse HEAD)" "$BASE_REF" "$live_base" "$HEAD_REF" "$live_head" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Run real Git PR-ref identity regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests -p test_ci_pr_ref_identities.py -v
      - name: Run prospective source-policy and reference gates
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 tools/validate_contract_foundation.py
          python3 tools/validate_rust_browser_codec.py
          python3 tools/validate_s04_transport_custody.py
          python3 -m unittest tests.test_s04_transport_custody -v
          python3 -m unittest discover -s tests -p test_accepted_stream_handoff.py -v
          python3 -m unittest discover -s tests -p test_dual_owner_custody.py -v
          python3 -m unittest discover -s tests/transport -p 'test_*.py' -v
          python3 tools/agent_transport_reference.py \
            --contract contracts/agent-transport.v1.json \
            --write-vector /tmp/agent-transport-request.v1.json \
            --write-result /tmp/d0c02-agent-transport-reference-result.json \
            >/tmp/agent-transport-reference.stdout.json
          diff -u contracts/golden/agent-transport-request.v1.json \
            /tmp/agent-transport-request.v1.json
          diff -u docs/evidence/generated/d0c02-agent-transport-reference-result.json \
            /tmp/d0c02-agent-transport-reference-result.json

  rust-prospective-merge:
    name: s04-transport-custody / rust-prospective-merge
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out prospective merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 2
          persist-credentials: false
      - name: Verify canonical live source role
        shell: bash
        env:
          CI_SOURCE_ROLE: prospective-merge
          CI_SOURCE_EVENT: ${{ github.event_name }}
          CI_SOURCE_REPOSITORY: ${{ github.repository }}
          CI_SOURCE_REF: ${{ github.ref }}
          CI_SOURCE_REF_NAME: ${{ github.ref_name }}
          CI_SOURCE_SHA: ${{ github.sha }}
          CI_SOURCE_PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_SOURCE_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_SOURCE_PR_BASE: ${{ github.event.pull_request.base.sha }}
          CI_SOURCE_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          python3 -B tools/verify_ci_source_identity.py

      - name: Verify merge identity against live branch refs
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git show -s --format=%P HEAD | wc -w)" -eq 2
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          resolve_ref() {
            git ls-remote --exit-code origin "$1" | awk -v ref="$1" '
              $2 == ref { value = $1; matches++ }
              END { if (matches != 1) exit 1; print value }
            '
          }
          git check-ref-format "refs/heads/$BASE_REF"
          live_base="$(resolve_ref "refs/heads/$BASE_REF")"
          live_head="$(resolve_ref "refs/pull/$PR_NUMBER/head")"
          test -n "$live_base"
          test -n "$live_head"
          test "$live_head" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD^1)" = "$live_base"
          test "$(git rev-parse HEAD^2)" = "$live_head"
          printf 'merge=%s\nbase_ref=%s\nbase_sha=%s\nhead_ref=%s\nhead_sha=%s\n' \
            "$(git rev-parse HEAD)" "$BASE_REF" "$live_base" "$HEAD_REF" "$live_head" \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Install exact Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.93.0
      - name: Run prospective Rust gate
        env:
          # Exclude test-only DWARF bytes from live self-image measurements; deadlines are unchanged.
          CARGO_PROFILE_TEST_DEBUG: '0'
          # Optimize the same source-test executable measurements without changing budgets.
          CARGO_PROFILE_TEST_OPT_LEVEL: '1'
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-targets --all-features --locked
          cargo run --locked -p hepta-browserd -- --self-check
          cargo run --locked -p hepta-agent-portd --bin hepta-agent-portd -- --self-check
          cargo run --locked -p hepta-agent-portd --features fixture --bin hepta-agent-port-fixture -- --self-check
