name: browser-codec-reference-and-rust-gate

on:
  pull_request:
    paths:
      - ".github/workflows/browser-codec-reference.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/hepta-browserd/**"
      - "crates/hepta-browser-codec/**"
      - "crates/hepta-browser-contracts/**"
      - "contracts/browser-*.json"
      - "contracts/browser-actor.v1.json"
      - "crates/trillionnium-contract-core/**"
      - "crates/hepta-session-core/**"
      - "crates/hepta-workspace-composition/**"
      - "contracts/browser-api.v1.schema.json"
      - "contracts/browser-codec.v1.json"
      - "contracts/browser-wire.v1.schema.json"
      - "contracts/browser-response.v1.schema.json"
      - "contracts/error-codes.v1.json"
      - "contracts/workspace-composition.v1.json"
      - "contracts/golden/*.wire.json"
      - "contracts/golden/trusted-app-origins.v1.tsv"
      - "tools/browser_codec_reference.py"
      - "tools/browser_codec_reference/**"
      - "tools/browser_codec_reference*"
      - "tools/qualify_servo_exact_pin_evidence.py"
      - "tests/test_validate_rust_browser_codec.py"
      - "tools/validate_rust_browser_codec.py"
      - "tools/validate_repository.py"
      - "tools/validate_project_truth.py"
      - "tools/structured_status.py"
      - "tools/structured_status_model.py"
      - "tools/validate_status_authority_singleton.py"
      - "docs/status-documents.v1.json"
      - "docs/CURRENT_STATE.md"
      - "manifests/project-state.v1.json"
      - "manifests/gates.v1.json"
      - "manifests/cargo-external-allowlist.json"
      - "manifests/repository-state.json"
      - "manifests/rust-toolchain.lock.json"
      - "manifests/product-boundary.json"
      - "manifests/upstream-reference-review.v1.json"
      - "manifests/ci-action-pins.v1.json"
      - "docs/MANIFEST.json"
      - "docs/DESKTOP_PLAN-2026-08-29-d6.md"
      - "docs/evidence/2026-08-28-d0c03-rust-product-codec-source.md"
      - "docs/plan/**"
      - "rust-toolchain.toml"
      - "docs/evidence/generated/d0c03-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/browser-codec-reference.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/hepta-browserd/**"
      - "crates/hepta-browser-codec/**"
      - "crates/hepta-browser-contracts/**"
      - "contracts/browser-*.json"
      - "contracts/browser-actor.v1.json"
      - "crates/trillionnium-contract-core/**"
      - "crates/hepta-session-core/**"
      - "crates/hepta-workspace-composition/**"
      - "contracts/browser-api.v1.schema.json"
      - "contracts/browser-codec.v1.json"
      - "contracts/browser-wire.v1.schema.json"
      - "contracts/browser-response.v1.schema.json"
      - "contracts/error-codes.v1.json"
      - "contracts/workspace-composition.v1.json"
      - "contracts/golden/*.wire.json"
      - "contracts/golden/trusted-app-origins.v1.tsv"
      - "tools/browser_codec_reference.py"
      - "tools/browser_codec_reference/**"
      - "tools/browser_codec_reference*"
      - "tools/qualify_servo_exact_pin_evidence.py"
      - "tests/test_validate_rust_browser_codec.py"
      - "tools/validate_rust_browser_codec.py"
      - "tools/validate_repository.py"
      - "tools/validate_project_truth.py"
      - "tools/structured_status.py"
      - "tools/structured_status_model.py"
      - "tools/validate_status_authority_singleton.py"
      - "docs/status-documents.v1.json"
      - "docs/CURRENT_STATE.md"
      - "manifests/project-state.v1.json"
      - "manifests/gates.v1.json"
      - "manifests/cargo-external-allowlist.json"
      - "manifests/repository-state.json"
      - "manifests/rust-toolchain.lock.json"
      - "manifests/product-boundary.json"
      - "manifests/upstream-reference-review.v1.json"
      - "manifests/ci-action-pins.v1.json"
      - "docs/MANIFEST.json"
      - "docs/DESKTOP_PLAN-2026-08-29-d6.md"
      - "docs/evidence/2026-08-28-d0c03-rust-product-codec-source.md"
      - "docs/plan/**"
      - "rust-toolchain.toml"
      - "docs/evidence/generated/d0c03-*.json"

permissions:
  contents: read

concurrency:
  group: browser-codec-reference-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-source-reference-and-static-audit:
    name: exact-source-reference-and-static-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git rev-parse HEAD^{tree}

      - name: Compile standard-library references and audits
        run: >-
          python3 -m py_compile
          tools/browser_codec_reference.py
          tools/browser_codec_reference/*.py
          tools/validate_rust_browser_codec.py
          tools/validate_project_truth.py
          tests/test_validate_rust_browser_codec.py

      - name: Validate repository and project truth
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py

      - name: Run browser codec Python regressions
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_validate_rust_browser_codec -v

      - name: Regenerate reference, audit and golden vectors
        run: |
          set -euo pipefail
          mkdir -p /tmp/d0c03-golden
          python3 tools/browser_codec_reference.py \
            --self-test \
            --contract contracts/browser-codec.v1.json \
            --write-result /tmp/d0c03-browser-codec-reference-result.json \
            --write-golden-dir /tmp/d0c03-golden \
            >/tmp/d0c03-browser-codec.stdout.json
          python3 tools/validate_rust_browser_codec.py \
            --write-result /tmp/d0c03-rust-source-audit-result.json \
            >/tmp/d0c03-rust-source-audit.stdout.json
          cmp /tmp/d0c03-browser-codec-reference-result.json \
            docs/evidence/generated/d0c03-browser-codec-reference-result.json
          cmp /tmp/d0c03-rust-source-audit-result.json \
            docs/evidence/generated/d0c03-rust-source-audit-result.json
          for fixture in contracts/golden/golden-*.wire.json; do
            cmp "$fixture" "/tmp/d0c03-golden/$(basename "$fixture")"
          done

      - name: Verify historical host evidence and current claim ceiling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys

          source_sha = "4cfebbe6a40ebbec32d9d1bcbfca1d513b510ebb"
          sys.path.insert(0, str(Path("tools").resolve()))
          from validate_rust_browser_codec import load_json_nofollow, repo_path

          contract = load_json_nofollow(
              Path("contracts/browser-codec.v1.json"), label="codec contract"
          )
          reference = load_json_nofollow(
              Path("docs/evidence/generated/d0c03-browser-codec-reference-result.json"),
              label="codec reference result",
          )
          audit = load_json_nofollow(
              Path("docs/evidence/generated/d0c03-rust-source-audit-result.json"),
              label="codec source audit result",
          )
          host = load_json_nofollow(
              repo_path(contract.get("rust_host_result"), label="rust_host_result"),
              label="Rust host result",
          )

          assert contract["validation"]["python_reference"] == "PASS_27_OF_27"
          assert contract["validation"]["rust_source_audit"] == "PASS"
          assert contract["validation"]["rust_fmt"] == "PASS"
          assert contract["validation"]["rust_clippy"] == "PASS"
          assert contract["validation"]["rust_tests"] == "PASS"
          assert contract["validation"]["browserd_self_check"] == "PASS"
          assert contract["status"] == "HOST_VALIDATED_RUST_1_93_NO_DISPATCH"
          assert contract["evidence_lifecycle"] == "STALE_EVIDENCE_REQUIRES_EXACT_HEAD_RERUN"
          assert contract["evidence_freshness"] == "STALE_EVIDENCE"
          assert contract["merge_ready"] is False
          assert contract["validation"]["evidence_freshness"] == "STALE_EVIDENCE"
          assert contract["validation"]["merge_ready"] is False
          assert host["status"] == "PASS"
          assert host["validated_source_sha"] == source_sha
          assert "exact candidate head" in contract["validation"]["stale_reason"]
          assert reference["status"] == "PASS" and reference["test_count"] == 27
          assert audit["status"] == "PASS" and audit["check_count"] >= 99
          assert reference["product_listener_created"] is False
          assert audit["product_listener_created"] is False
          assert reference["external_effect_authorized"] is False
          assert host["product_listener_created"] is False
          assert host["browser_actor_dispatched"] is False
          assert host["servo_called"] is False
          assert host["external_effect_authorized"] is False
          PY

  exact-source-rust:
    name: exact-source-rust
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git rev-parse HEAD^{tree}

      - name: Install exact Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.93.0

      - name: Validate repository and project truth
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py

      - run: cargo fmt --all --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: cargo run --locked -p hepta-browserd -- --self-check

      - name: Confirm no listener or activation marker
        shell: bash
        run: |
          set -euo pipefail
          test ! -S /run/hepta/browserd/agent.sock
          test ! -e /etc/hepta/enable-agent-port

  prospective-merge-reference-and-static-audit:
    name: prospective-merge-reference-and-static-audit
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out prospective merge object
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 2
          persist-credentials: false

      - name: Assert prospective merge identity and parents
        env:
          EXPECTED_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MERGE_SHA"
          test "$(git rev-list --parents -n1 HEAD | awk '{print NF - 1}')" -eq 2
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_BASE_SHA"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_HEAD_SHA"
          git rev-parse HEAD^{tree}

      - name: Compile standard-library references and audits
        run: >-
          python3 -m py_compile
          tools/browser_codec_reference.py
          tools/browser_codec_reference/*.py
          tools/validate_rust_browser_codec.py
          tools/validate_project_truth.py
          tests/test_validate_rust_browser_codec.py

      - name: Validate repository and project truth
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py

      - name: Run browser codec Python regressions
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_validate_rust_browser_codec -v

      - name: Regenerate reference, audit and golden vectors
        run: |
          set -euo pipefail
          mkdir -p /tmp/d0c03-golden
          python3 tools/browser_codec_reference.py \
            --self-test \
            --contract contracts/browser-codec.v1.json \
            --write-result /tmp/d0c03-browser-codec-reference-result.json \
            --write-golden-dir /tmp/d0c03-golden \
            >/tmp/d0c03-browser-codec.stdout.json
          python3 tools/validate_rust_browser_codec.py \
            --write-result /tmp/d0c03-rust-source-audit-result.json \
            >/tmp/d0c03-rust-source-audit.stdout.json
          cmp /tmp/d0c03-browser-codec-reference-result.json \
            docs/evidence/generated/d0c03-browser-codec-reference-result.json
          cmp /tmp/d0c03-rust-source-audit-result.json \
            docs/evidence/generated/d0c03-rust-source-audit-result.json
          for fixture in contracts/golden/golden-*.wire.json; do
            cmp "$fixture" "/tmp/d0c03-golden/$(basename "$fixture")"
          done

      - name: Verify historical host evidence and current claim ceiling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys

          source_sha = "4cfebbe6a40ebbec32d9d1bcbfca1d513b510ebb"
          sys.path.insert(0, str(Path("tools").resolve()))
          from validate_rust_browser_codec import load_json_nofollow, repo_path

          contract = load_json_nofollow(
              Path("contracts/browser-codec.v1.json"), label="codec contract"
          )
          reference = load_json_nofollow(
              Path("docs/evidence/generated/d0c03-browser-codec-reference-result.json"),
              label="codec reference result",
          )
          audit = load_json_nofollow(
              Path("docs/evidence/generated/d0c03-rust-source-audit-result.json"),
              label="codec source audit result",
          )
          host = load_json_nofollow(
              repo_path(contract.get("rust_host_result"), label="rust_host_result"),
              label="Rust host result",
          )

          assert contract["validation"]["python_reference"] == "PASS_27_OF_27"
          assert contract["validation"]["rust_source_audit"] == "PASS"
          assert contract["validation"]["rust_fmt"] == "PASS"
          assert contract["validation"]["rust_clippy"] == "PASS"
          assert contract["validation"]["rust_tests"] == "PASS"
          assert contract["validation"]["browserd_self_check"] == "PASS"
          assert contract["status"] == "HOST_VALIDATED_RUST_1_93_NO_DISPATCH"
          assert contract["evidence_lifecycle"] == "STALE_EVIDENCE_REQUIRES_EXACT_HEAD_RERUN"
          assert contract["evidence_freshness"] == "STALE_EVIDENCE"
          assert contract["merge_ready"] is False
          assert contract["validation"]["evidence_freshness"] == "STALE_EVIDENCE"
          assert contract["validation"]["merge_ready"] is False
          assert host["status"] == "PASS"
          assert host["validated_source_sha"] == source_sha
          assert "exact candidate head" in contract["validation"]["stale_reason"]
          assert reference["status"] == "PASS" and reference["test_count"] == 27
          assert audit["status"] == "PASS" and audit["check_count"] >= 99
          assert reference["product_listener_created"] is False
          assert audit["product_listener_created"] is False
          assert reference["external_effect_authorized"] is False
          assert host["product_listener_created"] is False
          assert host["browser_actor_dispatched"] is False
          assert host["servo_called"] is False
          assert host["external_effect_authorized"] is False
          PY

  prospective-merge-rust:
    name: prospective-merge-rust
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out prospective merge object
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 2
          persist-credentials: false

      - name: Assert prospective merge identity and parents
        env:
          EXPECTED_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MERGE_SHA"
          test "$(git rev-list --parents -n1 HEAD | awk '{print NF - 1}')" -eq 2
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_BASE_SHA"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_HEAD_SHA"
          git rev-parse HEAD^{tree}

      - name: Install exact Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.93.0

      - name: Validate repository and project truth
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py

      - run: cargo fmt --all --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked
      - run: cargo run --locked -p hepta-browserd -- --self-check

      - name: Confirm no listener or activation marker
        shell: bash
        run: |
          set -euo pipefail
          test ! -S /run/hepta/browserd/agent.sock
          test ! -e /etc/hepta/enable-agent-port
