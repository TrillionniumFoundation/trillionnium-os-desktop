name: browser-codec-reference-and-rust-gate

on:
  pull_request:
    paths:
      - ".github/workflows/browser-codec-reference.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/hepta-browserd/**"
      - "crates/hepta-browser-codec/**"
      - "crates/hepta-browser-contracts/**"
      - "crates/trillionnium-contract-core/**"
      - "crates/hepta-session-core/**"
      - "crates/hepta-workspace-composition/**"
      - "contracts/browser-api.v1.schema.json"
      - "contracts/browser-codec.v1.json"
      - "contracts/browser-wire.v1.schema.json"
      - "contracts/browser-response.v1.schema.json"
      - "contracts/error-codes.v1.json"
      - "contracts/workspace-composition.v1.json"
      - "contracts/golden/*.wire.json"
      - "contracts/golden/trusted-app-origins.v1.tsv"
      - "tools/browser_codec_reference.py"
      - "tools/browser_codec_reference/**"
      - "tools/validate_rust_browser_codec.py"
      - "tools/validate_repository.py"
      - "tools/validate_project_truth.py"
      - "tools/structured_status.py"
      - "tools/structured_status_model.py"
      - "tools/validate_status_authority_singleton.py"
      - "docs/status-documents.v1.json"
      - "docs/CURRENT_STATE.md"
      - "manifests/project-state.v1.json"
      - "manifests/gates.v1.json"
      - "docs/evidence/generated/d0c03-*.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/browser-codec-reference.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/hepta-browserd/**"
      - "crates/hepta-browser-codec/**"
      - "crates/hepta-browser-contracts/**"
      - "crates/trillionnium-contract-core/**"
      - "crates/hepta-session-core/**"
      - "crates/hepta-workspace-composition/**"
      - "contracts/browser-api.v1.schema.json"
      - "contracts/browser-codec.v1.json"
      - "contracts/browser-wire.v1.schema.json"
      - "contracts/browser-response.v1.schema.json"
      - "contracts/error-codes.v1.json"
      - "contracts/workspace-composition.v1.json"
      - "contracts/golden/*.wire.json"
      - "contracts/golden/trusted-app-origins.v1.tsv"
      - "tools/browser_codec_reference.py"
      - "tools/browser_codec_reference/**"
      - "tools/validate_rust_browser_codec.py"
      - "tools/validate_repository.py"
      - "tools/validate_project_truth.py"
      - "tools/structured_status.py"
      - "tools/structured_status_model.py"
      - "tools/validate_status_authority_singleton.py"
      - "docs/status-documents.v1.json"
      - "docs/CURRENT_STATE.md"
      - "manifests/project-state.v1.json"
      - "manifests/gates.v1.json"
      - "docs/evidence/generated/d0c03-*.json"

permissions:
  contents: read

concurrency:
  group: browser-codec-reference-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-source:
    name: exact-source-${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: [reference-and-static-audit, rust]
    steps:
      - name: Check out exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git rev-parse HEAD^{tree}

      - name: Compile reference and audit modules
        if: ${{ matrix.lane == 'reference-and-static-audit' }}
        run: >-
          python3 -m py_compile
          tools/browser_codec_reference.py
          tools/browser_codec_reference/*.py
          tools/validate_rust_browser_codec.py
          tools/validate_project_truth.py

      - name: Validate repository and project truth
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py

      - name: Regenerate reference, audit, and golden vectors
        if: ${{ matrix.lane == 'reference-and-static-audit' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/d0c03-golden
          python3 tools/browser_codec_reference.py \
            --self-test \
            --contract contracts/browser-codec.v1.json \
            --write-result /tmp/d0c03-browser-codec-reference-result.json \
            --write-golden-dir /tmp/d0c03-golden \
            >/tmp/d0c03-browser-codec.stdout.json
          python3 tools/validate_rust_browser_codec.py \
            --write-result /tmp/d0c03-rust-source-audit-result.json \
            >/tmp/d0c03-rust-source-audit.stdout.json
          cmp /tmp/d0c03-browser-codec-reference-result.json \
            docs/evidence/generated/d0c03-browser-codec-reference-result.json
          cmp /tmp/d0c03-rust-source-audit-result.json \
            docs/evidence/generated/d0c03-rust-source-audit-result.json
          for fixture in contracts/golden/golden-*.wire.json; do
            cmp "$fixture" "/tmp/d0c03-golden/$(basename "$fixture")"
          done

      - name: Verify historical host evidence and claim ceiling
        if: ${{ matrix.lane == 'reference-and-static-audit' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          source_sha = "4cfebbe6a40ebbec32d9d1bcbfca1d513b510ebb"
          contract = json.loads(Path("contracts/browser-codec.v1.json").read_text())
          reference = json.loads(Path("docs/evidence/generated/d0c03-browser-codec-reference-result.json").read_text())
          audit = json.loads(Path("docs/evidence/generated/d0c03-rust-source-audit-result.json").read_text())
          host = json.loads(Path(contract["rust_host_result"]).read_text())
          assert contract["validation"]["python_reference"] == "PASS_27_OF_27"
          assert contract["validation"]["rust_source_audit"] == "PASS"
          assert contract["validation"]["rust_fmt"] == "PASS"
          assert contract["validation"]["rust_clippy"] == "PASS"
          assert contract["validation"]["rust_tests"] == "PASS"
          assert contract["validation"]["browserd_self_check"] == "PASS"
          assert contract["validation"]["merge_ready"] is True
          assert host["status"] == "PASS"
          assert host["validated_source_sha"] == source_sha
          assert reference["status"] == "PASS" and reference["test_count"] == 27
          assert audit["status"] == "PASS" and audit["check_count"] >= 99
          assert reference["product_listener_created"] is False
          assert audit["product_listener_created"] is False
          assert reference["external_effect_authorized"] is False
          assert host["product_listener_created"] is False
          assert host["browser_actor_dispatched"] is False
          assert host["servo_called"] is False
          assert host["external_effect_authorized"] is False
          PY

      - name: Install exact Rust toolchain
        if: ${{ matrix.lane == 'rust' }}
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.93.0

      - name: Run locked Rust matrix
        if: ${{ matrix.lane == 'rust' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo run --locked -p hepta-browserd -- --self-check
          test ! -S /run/hepta/browserd/agent.sock
          test ! -e /etc/hepta/enable-agent-port

  prospective-merge:
    name: prospective-merge-${{ matrix.lane }}
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: [reference-and-static-audit, rust]
    steps:
      - name: Check out current prospective merge object
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 2
          persist-credentials: false

      - name: Bind merge object to live base and PR-head refs
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          git check-ref-format --branch "$BASE_REF"
          test "$PR_NUMBER" -gt 0
          git fetch --no-tags --prune --depth=1 origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/pr-base" \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/pr-head"
          test "$(git rev-list --parents -n1 HEAD | awk '{print NF - 1}')" -eq 2
          test "$(git rev-parse HEAD^1)" = "$(git rev-parse refs/remotes/origin/pr-base)"
          test "$(git rev-parse HEAD^2)" = "$(git rev-parse refs/remotes/pull/pr-head)"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}

      - name: Compile reference and audit modules
        if: ${{ matrix.lane == 'reference-and-static-audit' }}
        run: >-
          python3 -m py_compile
          tools/browser_codec_reference.py
          tools/browser_codec_reference/*.py
          tools/validate_rust_browser_codec.py
          tools/validate_project_truth.py

      - name: Validate repository and project truth
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py

      - name: Regenerate reference, audit, and golden vectors
        if: ${{ matrix.lane == 'reference-and-static-audit' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/d0c03-golden
          python3 tools/browser_codec_reference.py \
            --self-test \
            --contract contracts/browser-codec.v1.json \
            --write-result /tmp/d0c03-browser-codec-reference-result.json \
            --write-golden-dir /tmp/d0c03-golden \
            >/tmp/d0c03-browser-codec.stdout.json
          python3 tools/validate_rust_browser_codec.py \
            --write-result /tmp/d0c03-rust-source-audit-result.json \
            >/tmp/d0c03-rust-source-audit.stdout.json
          cmp /tmp/d0c03-browser-codec-reference-result.json \
            docs/evidence/generated/d0c03-browser-codec-reference-result.json
          cmp /tmp/d0c03-rust-source-audit-result.json \
            docs/evidence/generated/d0c03-rust-source-audit-result.json
          for fixture in contracts/golden/golden-*.wire.json; do
            cmp "$fixture" "/tmp/d0c03-golden/$(basename "$fixture")"
          done

      - name: Verify historical host evidence and claim ceiling
        if: ${{ matrix.lane == 'reference-and-static-audit' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          source_sha = "4cfebbe6a40ebbec32d9d1bcbfca1d513b510ebb"
          contract = json.loads(Path("contracts/browser-codec.v1.json").read_text())
          reference = json.loads(Path("docs/evidence/generated/d0c03-browser-codec-reference-result.json").read_text())
          audit = json.loads(Path("docs/evidence/generated/d0c03-rust-source-audit-result.json").read_text())
          host = json.loads(Path(contract["rust_host_result"]).read_text())
          assert contract["validation"]["python_reference"] == "PASS_27_OF_27"
          assert contract["validation"]["rust_source_audit"] == "PASS"
          assert contract["validation"]["rust_fmt"] == "PASS"
          assert contract["validation"]["rust_clippy"] == "PASS"
          assert contract["validation"]["rust_tests"] == "PASS"
          assert contract["validation"]["browserd_self_check"] == "PASS"
          assert contract["validation"]["merge_ready"] is True
          assert host["status"] == "PASS"
          assert host["validated_source_sha"] == source_sha
          assert reference["status"] == "PASS" and reference["test_count"] == 27
          assert audit["status"] == "PASS" and audit["check_count"] >= 99
          assert reference["product_listener_created"] is False
          assert audit["product_listener_created"] is False
          assert reference["external_effect_authorized"] is False
          assert host["product_listener_created"] is False
          assert host["browser_actor_dispatched"] is False
          assert host["servo_called"] is False
          assert host["external_effect_authorized"] is False
          PY

      - name: Install exact Rust toolchain
        if: ${{ matrix.lane == 'rust' }}
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.93.0

      - name: Run locked Rust matrix
        if: ${{ matrix.lane == 'rust' }}
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo run --locked -p hepta-browserd -- --self-check
          test ! -S /run/hepta/browserd/agent.sock
          test ! -e /etc/hepta/enable-agent-port
