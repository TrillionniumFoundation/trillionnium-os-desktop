name: G0 scoped host contracts

on:
  pull_request:
    paths:
      - "tests/abi/**"
      - "tests/golden/**"
      - "tests/spec/**"
      - "tests/organ_backend/**"
      - "tests/kernel/control/**"
      - "libs/os-abi/**"
      - "libs/os-control/**"
      - ".github/workflows/g0-contracts.yml"
  push:
    branches: [main]
    paths:
      - "tests/abi/**"
      - "tests/golden/**"
      - "tests/spec/**"
      - "tests/organ_backend/**"
      - "tests/kernel/control/**"
      - "libs/os-abi/**"
      - "libs/os-control/**"
      - ".github/workflows/g0-contracts.yml"

permissions:
  contents: read

jobs:
  host-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify independent HOS2 golden fixtures
        run: python3 tests/golden/generate_hos2.py --check
      - name: Python wire mutations and recovery specification
        run: |
          python3 -m unittest discover -s tests/abi -p 'test_*.py' -v
          python3 -m unittest discover -s tests/spec -p 'test_*.py' -v
      - name: Guest archive safety model (host only, no QEMU)
        run: |
          python3 -m unittest discover -s tests/organ_backend -p 'test_*.py' -v
          python3 -O -m unittest discover -s tests/organ_backend -p 'test_*.py' -v
      - name: Host A05 QueryAbi wire and ENOTTY smoke (no kernel driver)
        if: hashFiles('tests/kernel/control/hos2_queryabi_probe.c') != ''
        run: sh tests/kernel/control/run-host-smoke.sh
      - name: Require canonical Rust crate manifests and install lint components
        shell: bash
        run: |
          set -euo pipefail
          test -f libs/os-abi/Cargo.toml
          test -f libs/os-control/Cargo.toml
      - name: Report real host Rust toolchain and install lint components
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv
          cargo -Vv
          rustup component add rustfmt clippy
      - name: Host Rust no_std ABI crate (when implemented)
        run: cargo test --manifest-path libs/os-abi/Cargo.toml --verbose
      - name: Host Rust ABI strict rustfmt and Clippy (when implemented)
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path libs/os-abi/Cargo.toml -- --check
          cargo clippy --manifest-path libs/os-abi/Cargo.toml --all-targets -- -D warnings
      - name: Host Rust control model (when implemented)
        run: cargo test --manifest-path libs/os-control/Cargo.toml --verbose
      - name: Host Rust control strict rustfmt and Clippy (when implemented)
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path libs/os-control/Cargo.toml -- --check
          cargo clippy --manifest-path libs/os-control/Cargo.toml --all-targets -- -D warnings
