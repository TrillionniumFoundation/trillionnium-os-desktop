name: G0 scoped host contracts

on:
  pull_request:
    paths:
      - "tests/abi/**"
      - "tests/golden/**"
      - "tests/spec/**"
      - "tests/control/**"
      - "tests/organ_backend/**"
      - "tests/kernel/control/**"
      - "libs/os-abi/**"
      - "libs/os-control/**"
      - ".github/workflows/g0-contracts.yml"
  push:
    branches: [main]
    paths:
      - "tests/abi/**"
      - "tests/golden/**"
      - "tests/spec/**"
      - "tests/control/**"
      - "tests/organ_backend/**"
      - "tests/kernel/control/**"
      - "libs/os-abi/**"
      - "libs/os-control/**"
      - ".github/workflows/g0-contracts.yml"

permissions:
  contents: read

jobs:
  host-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Verify exact previous/base Git trees, including deleted regression pairs.
          fetch-depth: 0
      - name: Verify independent HOS2 golden fixtures
        run: python3 tests/golden/generate_hos2.py --check
      - name: Verify canonical HOS2 semantic edge corpus and independent generator
        shell: bash
        run: |
          set -euo pipefail
          for fixture in \
            tests/golden/generate_hos2_edges.py \
            tests/golden/hos2_edges.json \
            tests/abi/test_semantic_edges_contract.py \
            libs/os-abi/tests/semantic_edges.rs; do
            if [[ ! -f "$fixture" || -L "$fixture" ]]; then
              echo "Missing or symlinked mandatory HOS2 semantic oracle: $fixture" >&2
              exit 1
            fi
          done
          # This generator intentionally imports sibling generate_hos2.py;
          # it checks 24 independently generated HOS2 edge frames.
          python3 tests/golden/generate_hos2_edges.py --check
      - name: Verify independent native 32-byte HOS2 ioctl transport golden
        shell: bash
        run: |
          set -euo pipefail
          for fixture in tests/golden/generate_transport32.py tests/golden/transport32.hex; do
            if [[ ! -f "$fixture" || -L "$fixture" ]]; then
              echo "Missing or symlinked independent ioctl transport fixture: $fixture" >&2
              exit 1
            fi
          done
          python3 -I tests/golden/generate_transport32.py --check
      - name: Python wire mutations and recovery specification
        run: |
          python3 -m unittest discover -s tests/abi -p 'test_*.py' -v
          python3 -m unittest discover -s tests/spec -p 'test_*.py' -v
      - name: Guest archive safety model (host only, no QEMU)
        run: |
          python3 -m unittest discover -s tests/organ_backend -p 'test_*.py' -v
          python3 -O -m unittest discover -s tests/organ_backend -p 'test_*.py' -v
      - name: Host A05 QueryAbi wire and ENOTTY smoke (no kernel driver)
        run: |
          test -f tests/kernel/control/hos2_queryabi_probe.c
          test -f tests/kernel/control/run-host-smoke.sh
          test -f tests/kernel/control/fake-ioctl-efault.c
          sh tests/kernel/control/run-host-smoke.sh
      - name: Compile native A05 QueryAbi guest probe when present (host compiler only)
        if: hashFiles('tests/kernel/control/queryabi_guest.c') != ''
        shell: bash
        run: |
          set -euo pipefail
          # This only checks the actual A05 user ELF compiles; it cannot prove
          # the new Asterinas ioctl or guest QEMU behavior is present.
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -static \
            tests/kernel/control/queryabi_guest.c \
            -o "$RUNNER_TEMP/a05-queryabi-guest"
          test -s "$RUNNER_TEMP/a05-queryabi-guest"
          file "$RUNNER_TEMP/a05-queryabi-guest"
          sha256sum "$RUNNER_TEMP/a05-queryabi-guest"
      - name: A05 pinned QueryAbi replay host regressions (no QEMU)
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          dir=tests/kernel/control
          # A pair absent from BOTH base and head may bootstrap once. Once
          # tracked, deleting its source AND test together must be a failure.
          if [[ -z "${EVENT_BASE_SHA:-}" || "$EVENT_BASE_SHA" =~ ^0+$ ]] ||
             ! git cat-file -e "$EVENT_BASE_SHA^{commit}" 2>/dev/null; then
            echo 'Cannot identify exact A05 regression event base' >&2
            exit 1
          fi
          any=0
          for pair in \
            'run_queryabi_guest.py test_queryabi_guest_runner.py' \
            'pinned_memfd.py test_pinned_memfd.py' \
            'serial_limit.py test_serial_limit.py'; do
            read -r source testfile <<< "$pair"
            for name in "$source" "$testfile"; do
              path="$dir/$name"
              # The event-base *tree* is authoritative, not only the head.
              if git cat-file -e "$EVENT_BASE_SHA:$path" 2>/dev/null; then
                if [[ ! -f "$path" || -L "$path" ]]; then
                  echo "A05 required regression vanished since base: $path" >&2
                  exit 1
                fi
              fi
              if [[ -e "$path" || -L "$path" ]]; then
                if [[ ! -f "$path" || -L "$path" ]]; then
                  echo "A05 replay source/test is not regular: $path" >&2
                  exit 1
                fi
                any=1
              fi
            done
            if [[ -e "$dir/$source" || -L "$dir/$source" ||
                  -e "$dir/$testfile" || -L "$dir/$testfile" ]]; then
              if [[ ! -f "$dir/$source" || -L "$dir/$source" ||
                    ! -f "$dir/$testfile" || -L "$dir/$testfile" ]]; then
                echo "A05 replay source/test pair incomplete: $pair" >&2
                exit 1
              fi
            fi
          done
          if [[ "$any" -eq 0 ]]; then
            echo 'BOOTSTRAP ONLY: all three A05 replay pairs absent in base and head'
          else
            for mode in normal optimized; do
              args=()
              if [[ "$mode" == optimized ]]; then args=(-O); fi
              logfile="$RUNNER_TEMP/a05-replay-${mode}.log"
              python3 -I "${args[@]}" -m unittest discover -s "$dir" \
                -p 'test_*.py' -v 2>&1 | tee "$logfile"
              if ! grep -Eq '^Ran [1-9][0-9]* tests? in ' "$logfile"; then
                echo 'A05 replay suite yielded zero tests; fail closed' >&2
                exit 1
              fi
            done
          fi
      - name: Require canonical Rust crate manifests and install lint components
        shell: bash
        run: |
          set -euo pipefail
          test -f libs/os-abi/Cargo.toml
          test -f libs/os-control/Cargo.toml
      - name: Report real host Rust toolchain and install lint components
        shell: bash
        run: |
          set -euo pipefail
          rustc -Vv
          cargo -Vv
          rustup component add rustfmt clippy
      - name: Host Rust no_std ABI crate
        run: cargo test --manifest-path libs/os-abi/Cargo.toml --verbose
      - name: Host Rust ABI strict rustfmt and Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path libs/os-abi/Cargo.toml -- --check
          cargo clippy --manifest-path libs/os-abi/Cargo.toml --all-targets -- -D warnings
      - name: Host Rust control model
        run: cargo test --manifest-path libs/os-control/Cargo.toml --verbose
      - name: Host Rust control strict rustfmt and Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --manifest-path libs/os-control/Cargo.toml -- --check
          cargo clippy --manifest-path libs/os-control/Cargo.toml --all-targets -- -D warnings
      - name: Host A03 no_std portable-spin model and strict Clippy (not kernel IRQ)
        shell: bash
        run: |
          set -euo pipefail
          test -s libs/os-control/Cargo.lock
          cargo test --locked --manifest-path libs/os-control/Cargo.toml \
            --no-default-features --features portable-spin --verbose
          cargo clippy --locked --manifest-path libs/os-control/Cargo.toml \
            --no-default-features --features portable-spin --all-targets -- -D warnings
      - name: Cross-build A03 portable-spin rlib for x86_64-unknown-none (not kernel link)
        shell: bash
        run: |
          set -euo pipefail
          rustup target add x86_64-unknown-none
          cargo build --locked --manifest-path libs/os-control/Cargo.toml \
            --no-default-features --features portable-spin \
            --lib --target x86_64-unknown-none --verbose
