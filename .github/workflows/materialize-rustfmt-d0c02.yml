name: materialize-rustfmt-d0c02

on:
  push:
    branches:
      - codex/d0c02-transport-v2
    paths:
      - ".github/workflows/materialize-rustfmt-d0c02.yml"

permissions:
  contents: write

concurrency:
  group: materialize-rustfmt-d0c02
  cancel-in-progress: false

jobs:
  format-and-clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d0c02-transport-v2
          fetch-depth: 0
      - name: Install exact Rust toolchain
        run: |
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt
          rustup default 1.93.0
          rustc --version --verbose
          cargo --version --verbose
      - name: Format the exact branch
        run: cargo fmt --all
      - name: Remove one-shot formatter
        run: rm .github/workflows/materialize-rustfmt-d0c02.yml
      - name: Commit formatted source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "style: format D0C-02 with Rust 1.93"
          git push origin HEAD:codex/d0c02-transport-v2
