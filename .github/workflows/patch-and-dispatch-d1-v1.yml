name: patch-and-dispatch-d1-v1

on:
  push:
    branches:
      - codex/d1-01-debian-qemu-v1
    paths:
      - ".github/workflows/patch-and-dispatch-d1-v1.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  normalize-source-and-dispatch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d1-01-debian-qemu-v1
          fetch-depth: 0

      - name: Apply reviewed non-interactive builder corrections
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('packaging/debian/image/build-d1-image.sh')
          text = path.read_text()
          text = text.replace('IFS=, read -r -a _unused <<< ""\n', '')
          old = 'mke2fs \\\n  -q \\\n'
          new = 'mke2fs \\\n  -F \\\n  -q \\\n'
          if '-F \\\n  -q' not in text:
              if old not in text:
                  raise SystemExit('expected mke2fs block was not found')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          bash -n packaging/debian/image/build-d1-image.sh
          bash -n packaging/debian/image/rootfs-overlay/usr/local/libexec/trillionnium-d1-acceptance
          bash -n tests/qemu/run-d1-boot-test.sh
          bash -n tests/qemu/run-d1-pipeline.sh
          rm .github/workflows/patch-and-dispatch-d1-v1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: make D1 ext4 construction non-interactive"
          git push origin HEAD:codex/d1-01-debian-qemu-v1

      - name: Explicitly dispatch the D1 qualification workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/qualify-d1-debian-qemu-v1.yml/dispatches" \
            -f ref=codex/d1-01-debian-qemu-v1
