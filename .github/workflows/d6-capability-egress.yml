name: d6-capability-egress

on:
  pull_request:
    branches:
      - main
      - codex/d5-trusted-app-verifier-v1
  push:
    branches:
      - main
      - codex/d6-capability-egress-policy-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d6-capability-egress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capability_egress_reference:
    name: d6-capability-egress-reference
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record exact Git identity
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          git show -s --format='%P' HEAD

      - name: Compile dependency-free policy engine and attack corpus
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/trusted_app_bundle.py \
            tools/capability_egress_reference.py \
            tests/d6/test_capability_egress_reference.py

      - name: Run permit, portal, SSRF, rebinding, redirect, and proxy corpus
        run: |
          set -euo pipefail
          python3 -m unittest discover \
            -s tests/d6 \
            -p 'test_*.py' \
            -v

      - name: Generate bounded source-only evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts/d6-capability-egress
          python3 tools/capability_egress_reference.py \
            --contract contracts/capability-egress.v1.json \
            --write-result artifacts/d6-capability-egress/reference-result.json \
            | tee artifacts/d6-capability-egress/reference-result.stdout.json
          cmp \
            artifacts/d6-capability-egress/reference-result.json \
            artifacts/d6-capability-egress/reference-result.stdout.json

      - name: Validate repository and committed project truth
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py

      - name: Enforce D6 source-only claim ceiling
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path('contracts/capability-egress.v1.json').read_text())
          result = json.loads(Path('artifacts/d6-capability-egress/reference-result.json').read_text())
          assert contract['status'] == 'SOURCE_CANDIDATE_BLOCKED_UPSTREAM_D5'
          assert contract['claim_ceiling']['pure_capability_and_egress_reference'] is True
          for key in [
              'network_namespace_integrated',
              'controlled_resolver_integrated',
              'egress_proxy_integrated',
              'kernel_peer_ip_observed',
              'file_portal_integrated',
              'notification_portal_integrated',
              'audio_portal_integrated',
              'production_credentials_available',
              'external_network_enabled',
              'external_effects_enabled',
              'hardware_qualified',
              'release_ready',
          ]:
              assert contract['claim_ceiling'][key] is False, key
          assert result['status'] == 'PASS_SOURCE_REFERENCE_ONLY'
          assert result['network_access_executed'] is False
          assert result['controlled_resolver_integrated'] is False
          assert result['egress_proxy_integrated'] is False
          assert result['kernel_peer_ip_observed'] is False
          assert result['production_credentials_available'] is False
          assert result['external_effects_enabled'] is False
          assert result['release_ready'] is False
          PY

      - name: Upload exact-head source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d6-capability-egress-${{ github.sha }}
          path: artifacts/d6-capability-egress
          if-no-files-found: warn
          retention-days: 30
