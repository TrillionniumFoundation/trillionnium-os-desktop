name: s05-reconstruct-one-shot

on:
  push:
    branches: [codex/s05-receipt-recovery-closure-v1]
    paths: [".github/workflows/s05-reconstruct.yml"]

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact clean S04 base branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/s05-receipt-recovery-closure-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Verify trigger and apply only the receipt boundary
        shell: bash
        env:
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TRIGGER_SHA"
          git fetch --no-tags origin \
            201391fb7be2b6a2ce63e391f7ad6d4e7e6b55df \
            ceadc2b79f6383fe57fb1ce49937ed9092520e4f
          git diff --binary --full-index \
            201391fb7be2b6a2ce63e391f7ad6d4e7e6b55df \
            ceadc2b79f6383fe57fb1ce49937ed9092520e4f -- . \
            ':(exclude).github/workflows/receipt-journal.yml' \
            ':(exclude)crates/hepta-session-core/src/admission.rs' \
            ':(exclude)crates/hepta-session-core/src/lib.rs' \
            ':(exclude)crates/hepta-session-core/src/machine.rs' \
            ':(exclude)crates/hepta-session-core/src/tests.rs' \
            ':(exclude)crates/hepta-session-core/src/types.rs' \
            ':(exclude)crates/hepta-session-core/tests/lease_admission.rs' \
            ':(exclude)crates/hepta-session-core/tests/state_space.rs' \
            > /tmp/s05-receipt.patch
          test -s /tmp/s05-receipt.patch
          git apply --index --3way /tmp/s05-receipt.patch

          cat > crates/hepta-session-core/src/lib.rs <<'RUST'
          #![forbid(unsafe_code)]

          //! Deterministic session ownership, revision, bounded queueing, Agent/human
          //! arbitration, and durable receipt lifecycle core. No Servo object, socket,
          //! clock source, or policy authority is owned by this crate; adapters inject
          //! events, monotonic timestamps, and receipt facts.

          mod authoritative_export;
          mod machine;
          mod queue;
          #[path = "receipt_journal.rs"]
          mod receipt_journal_impl;
          mod types;

          /// Compatibility namespace for bounded chain limits only.
          ///
          /// The implementation module is private because historical report-based
          /// exporters accept caller-constructible forensic data. Authoritative export
          /// is available only through the path-verified crate-root functions.
          pub mod receipt_journal {
              pub use super::receipt_journal_impl::{
                  MAX_CHAIN_BYTES, MAX_CHAIN_RECORDS, MAX_CHAIN_SEGMENTS,
              };

              pub(crate) use super::receipt_journal_impl::{
                  Digest, JournalError, ReceiptEnvelope, RecoveredRecord, RecoveryReport, TailStatus,
                  export_journal_redacted_jsonl, export_receipt_envelopes_jsonl,
                  export_redacted_jsonl, inspect_chain,
              };
          }

          pub use authoritative_export::{
              export_forensic_prefix_jsonl, export_receipt_envelopes_jsonl, export_redacted_jsonl,
          };
          pub use machine::{SessionMachine, SessionSnapshot};
          pub use queue::{ArbiterQueue, QueueError};
          pub use receipt_journal_impl::{
              ArchivedSegment, CommittedRecord, CopiedReceiptSegment, Digest,
              EffectClass as ReceiptEffectClass, JournalError, JournalId,
              LifecycleState as ReceiptLifecycleState, MANAGED_ROTATION_THRESHOLD_BYTES,
              MAX_CHAIN_BYTES, MAX_CHAIN_RECORDS, MAX_CHAIN_SEGMENTS, ManagedOpenPolicy,
              OpenPolicy as JournalOpenPolicy, PrivacyClass, ReceiptEnvelope, ReceiptEvent,
              ReceiptJournal, ReceiptMigrationReport, ReceiptOutcome, ReceiptSource, ReceiptStatus,
              RecoveredRecord, RecoveryReport, ReplayDirective, SegmentHeader, SegmentSeal,
              TailStatus, UnresolvedReceipt, hex_digest, inspect_chain,
              inspect_path as inspect_receipt_journal, retention_candidates,
          };
          pub use types::{
              ControlSource, ControlState, DEFAULT_HUMAN_LEASE_TTL_MS, HumanLease,
              MAX_HUMAN_LEASE_TTL_MS, SessionEffect, SessionEvent, SessionPhase, TransitionError,
          };

          #[cfg(test)]
          mod tests;
          RUST
          sed -i 's/^          //' crates/hepta-session-core/src/lib.rs
          git add crates/hepta-session-core/src/lib.rs

          git diff --cached --name-only | tee /tmp/s05-paths.txt
          test -s /tmp/s05-paths.txt
          test -z "$(grep '^\.github/workflows/' /tmp/s05-paths.txt || true)"
          for forbidden in \
            crates/hepta-session-core/src/admission.rs \
            crates/hepta-session-core/src/machine.rs \
            crates/hepta-session-core/src/types.rs \
            crates/hepta-session-core/tests/lease_admission.rs \
            crates/hepta-session-core/tests/state_space.rs; do
            ! grep -Fxq "$forbidden" /tmp/s05-paths.txt
          done

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.93.0

      - name: Format and validate reconstructed source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 tools/verify_receipt_journal.py
          python3 -m unittest tests.test_s05_receipt_recovery -v
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --locked -p hepta-session-core --lib receipt_journal::tests:: -- --nocapture
          cargo test --workspace --all-targets --all-features --locked

      - name: Prove non-authorizing recovery ceiling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def reject_constant(value: str) -> object:
              raise ValueError(value)

          contract = json.loads(
              Path('contracts/receipt-journal.v1.json').read_text(encoding='utf-8'),
              parse_constant=reject_constant,
          )
          assert all(
              type(value) is bool and value is False
              for value in contract['claim_ceiling'].values()
          )
          assert contract['effect_recovery']['potential_external_effect'] == 'never_automatic'
          assert contract['effect_recovery']['journal_executes_or_replays_operations'] is False
          PY

      - name: Publish verified non-workflow S05 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Trillionnium gap-closure bot"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git add -A
          git reset .github/workflows/s05-reconstruct.yml
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          test -z "$(git diff --cached --name-only | grep '^\.github/workflows/' || true)"
          git commit -m "feat(s05): reconstruct durable receipt recovery on current S04"
          git push origin HEAD:codex/s05-receipt-recovery-closure-v1
