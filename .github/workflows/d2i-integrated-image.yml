name: d2i-integrated-image

on:
  pull_request:
    paths:
      - ".github/workflows/d2i-integrated-image.yml"
      - "runtime/servo/**"
      - "manifests/servo.lock.json"
      - "manifests/debian-d1*"
      - "manifests/debian-snapshot*"
      - "manifests/e2fsprogs-host-toolchain.v1.json"
      - "apps/hepta-agent-portd/**"
      - "packaging/debian/image/**"
      - "tests/d1/**"
      - "tests/qemu/**"
      - "tools/build_pinned_e2fsprogs.sh"
      - "tools/compare_d1_builds.py"
      - "tools/prepare_d1_inputs.py"
      - "tools/resolve_debian_snapshot*.py"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches:
      - codex/full-gap-closure-v2
    paths:
      - ".github/workflows/d2i-integrated-image.yml"
      - "runtime/servo/**"
      - "manifests/servo.lock.json"
      - "manifests/debian-d1*"
      - "manifests/debian-snapshot*"
      - "manifests/e2fsprogs-host-toolchain.v1.json"
      - "apps/hepta-agent-portd/**"
      - "packaging/debian/image/**"
      - "tests/d1/**"
      - "tests/qemu/**"
      - "tools/build_pinned_e2fsprogs.sh"
      - "tools/compare_d1_builds.py"
      - "tools/prepare_d1_inputs.py"
      - "tools/resolve_debian_snapshot*.py"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d2i-integrated-image-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  E2FSPROGS_COMMIT: c3cce4a07efefc62bc7fc57a678cb870af27d0f2
  E2FSPROGS_VERSION: 1.47.2
  CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
  TESTED_SHA: ${{ github.sha }}

jobs:
  integrated-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out exact integration candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Record exact source identities
        shell: bash
        run: |
          set -euo pipefail
          printf 'TESTED_TREE_SHA=%s\n' "$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          printf 'candidate_head=%s\nbase=%s\ntested=%s\ntree=%s\n' \
            "$CANDIDATE_HEAD_SHA" "$BASE_SHA" "$TESTED_SHA" "$(git rev-parse HEAD^{tree})"

      - name: Check out exact e2fsprogs source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: tytso/e2fsprogs
          ref: ${{ env.E2FSPROGS_COMMIT }}
          path: e2fsprogs-source
          fetch-depth: 1
          persist-credentials: false

      - name: Install D1 and headed Servo host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential ca-certificates clang cmake curl \
            debian-archive-keyring e2fsprogs gettext git gnupg gperf imagemagick jq \
            libdbus-1-dev libegl1-mesa-dev libfontconfig1-dev libfreetype-dev \
            libgl1-mesa-dev libgles2-mesa-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer1.0-dev libharfbuzz-dev liblzma-dev libssl-dev libunwind-dev \
            libwayland-dev libx11-dev libx11-xcb-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libxkbcommon-x11-dev mesa-utils mmdebstrap nasm ninja-build pkg-config \
            python3 python3-pip qemu-system-x86 rsync shellcheck systemd \
            x11-utils x11-xserver-utils xauth xserver-xorg-dev
          sudo rm -rf /var/lib/apt/lists/*

      - name: Build exact isolated e2fsprogs toolchain including debugfs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C e2fsprogs-source rev-parse HEAD)" = "$E2FSPROGS_COMMIT"
          test -z "$(git -C e2fsprogs-source status --porcelain=v1)"
          prefix="$RUNNER_TEMP/e2fsprogs-$E2FSPROGS_VERSION"
          build="$RUNNER_TEMP/e2fsprogs-build"
          rm -rf "$prefix" "$build"
          mkdir -p "$build"
          cd "$build"
          "$GITHUB_WORKSPACE/e2fsprogs-source/configure" \
            --prefix="$prefix" \
            --enable-nls
          make -j2
          make -C e2fsck install
          make -C misc install
          make -C debugfs install
          for tool in mke2fs e2fsck dumpe2fs debugfs; do
            test -x "$prefix/sbin/$tool"
          done
          test "$("$prefix/sbin/mke2fs" -V 2>&1 | awk 'NR == 1 { print $2 }')" = "$E2FSPROGS_VERSION"
          printf '%s\n' "$prefix/sbin" "$prefix/bin" >> "$GITHUB_PATH"
          cd "$GITHUB_WORKSPACE"
          rm -rf e2fsprogs-source

      - name: Install exact repository Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 - <<'PY'
          from pathlib import Path
          import tomllib
          print(tomllib.loads(Path('rust-toolchain.toml').read_text())['toolchain']['channel'])
          PY
          )"
          printf 'RUST_CHANNEL=%s\n' "$channel" >> "$GITHUB_ENV"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustup override set "$channel"
          rustc --version --verbose
          cargo --version --verbose

      - name: Restore repository Cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: d2i-repository-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Validate source and build qualification-only AgentPort binaries
        shell: bash
        run: |
          set -euo pipefail
          export RUSTUP_TOOLCHAIN="$RUST_CHANNEL"
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 tools/verify_systemd_socket_custody.py
          python3 -m unittest discover -s tests/d1 -p 'test_*.py'
          shellcheck -e SC2016,SC2054 \
            packaging/debian/image/build-d1-image.sh \
            packaging/debian/image/d2i-overlay/usr/local/libexec/trillionnium-d2i-acceptance \
            tests/qemu/run-d1-pipeline.sh \
            tests/qemu/prepare-d2i-image.sh \
            tests/qemu/run-d2i-boot-test.sh
          cargo fmt --all --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-targets --all-features --locked
          cargo build --release --locked \
            -p hepta-agent-portd \
            --features fixture \
            --bin hepta-agent-port-qualificationd \
            --bin hepta-agent-d1-fixture
          test -x target/release/hepta-agent-port-qualificationd
          test -x target/release/hepta-agent-d1-fixture

      - name: Resolve and check out exact Servo source
        id: servo-pin
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          lock = json.loads(Path('manifests/servo.lock.json').read_text())
          nested = lock.get('servo') if isinstance(lock.get('servo'), dict) else {}
          def first(*names):
              for source in (lock, nested):
                  for name in names:
                      value = source.get(name)
                      if isinstance(value, str) and value:
                          return value
              raise SystemExit(f'missing Servo lock field {names}')
          print(f"repository={first('repository', 'repo', 'url')}")
          print(f"revision={first('commit', 'revision', 'rev', 'git_revision')}")
          PY
          revision="$(jq -er '.commit // .revision // .servo.commit // .servo.revision' manifests/servo.lock.json)"
          test -n "$revision"
          git clone --filter=blob:none --no-checkout \
            "$(python3 -c 'import json; d=json.load(open("manifests/servo.lock.json")); print(d.get("repository") or d.get("servo",{}).get("repository"))')" \
            /tmp/servo
          git -C /tmp/servo fetch --depth=1 origin \
            "$revision"
          git -C /tmp/servo checkout --detach FETCH_HEAD
          test "$(git -C /tmp/servo rev-parse HEAD)" = "$revision"
          test -z "$(git -C /tmp/servo status --porcelain=v1)"
          cp runtime/servo/hepta_workspace_runtime.rs \
            /tmp/servo/components/servo/examples/hepta_workspace_runtime.rs

      - name: Install Servo toolchain and restore exact-pin cache
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 - <<'PY'
          from pathlib import Path
          import tomllib
          print(tomllib.loads(Path('/tmp/servo/rust-toolchain.toml').read_text())['toolchain']['channel'])
          PY
          )"
          printf 'SERVO_RUST_CHANNEL=%s\n' "$channel" >> "$GITHUB_ENV"
          rustup toolchain install "$channel" --profile minimal --component rustfmt

      - name: Restore exact-pin Servo build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/servo/target
          key: d2i-servo-${{ runner.os }}-${{ steps.servo-pin.outputs.revision }}-${{ hashFiles('runtime/servo/hepta_workspace_runtime.rs') }}
          restore-keys: |
            d2i-servo-${{ runner.os }}-${{ steps.servo-pin.outputs.revision }}-

      - name: Build exact headed Servo runtime
        working-directory: /tmp/servo
        shell: bash
        run: |
          set -euo pipefail
          export RUSTUP_TOOLCHAIN="$SERVO_RUST_CHANNEL"
          rustfmt --edition 2024 components/servo/examples/hepta_workspace_runtime.rs
          cargo build --release --locked -p servo --example hepta_workspace_runtime
          mkdir -p /tmp/trillionnium-d2i
          cp target/release/examples/hepta_workspace_runtime \
            /tmp/trillionnium-d2i/hepta-workspace-runtime
          chmod 0755 /tmp/trillionnium-d2i/hepta-workspace-runtime
          sha256sum /tmp/trillionnium-d2i/hepta-workspace-runtime \
            > /tmp/trillionnium-d2i/headed-runtime.sha256

      - name: Resolve signed D1 closure, build twice, and prove D1 under QEMU
        shell: bash
        run: |
          set -euo pipefail
          export RUSTUP_TOOLCHAIN="$RUST_CHANNEL"
          tests/qemu/run-d1-pipeline.sh \
            --workspace "$GITHUB_WORKSPACE" \
            --output-dir /tmp/trillionnium-d2i/d1

      - name: Prepare the integrated image twice and require byte equality
        shell: bash
        run: |
          set -euo pipefail
          base=/tmp/trillionnium-d2i/d1/build-a/candidate/artifacts/trillionnium-d1.ext4
          source_epoch="$(jq -er '.source_date_epoch' /tmp/trillionnium-d2i/d1/prepared/prepared-inputs.json)"
          mkdir -p /tmp/trillionnium-d2i/integrated
          for build in a b; do
            tests/qemu/prepare-d2i-image.sh \
              --base-image "$base" \
              --runtime-binary /tmp/trillionnium-d2i/hepta-workspace-runtime \
              --overlay packaging/debian/image/d2i-overlay \
              --source-epoch "$source_epoch" \
              --servo-revision "${{ steps.servo-pin.outputs.revision }}" \
              --output-image "/tmp/trillionnium-d2i/integrated/d2i-$build.ext4" \
              --evidence "/tmp/trillionnium-d2i/integrated/preparation-$build.json"
          done
          cmp -s \
            /tmp/trillionnium-d2i/integrated/d2i-a.ext4 \
            /tmp/trillionnium-d2i/integrated/d2i-b.ext4
          sha256sum \
            /tmp/trillionnium-d2i/integrated/d2i-a.ext4 \
            /tmp/trillionnium-d2i/integrated/d2i-b.ext4 \
            > /tmp/trillionnium-d2i/integrated/image-sha256.txt
          test "$(jq -r '.integrated_image_sha256' /tmp/trillionnium-d2i/integrated/preparation-a.json)" = \
            "$(jq -r '.integrated_image_sha256' /tmp/trillionnium-d2i/integrated/preparation-b.json)"

      - name: Boot the exact integrated image with no network device
        shell: bash
        run: |
          set -euo pipefail
          tests/qemu/run-d2i-boot-test.sh \
            --selection manifests/debian-d1.selection.json \
            --artifacts /tmp/trillionnium-d2i/d1/build-a/candidate/artifacts \
            --image /tmp/trillionnium-d2i/integrated/d2i-a.ext4 \
            --preparation /tmp/trillionnium-d2i/integrated/preparation-a.json \
            --output-dir /tmp/trillionnium-d2i/qemu

      - name: Enforce evidence, candidate ceiling, and promotion blocker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          root = Path('/tmp/trillionnium-d2i')
          d1 = json.loads((root / 'd1/pipeline-result.json').read_text())
          repro = json.loads((root / 'd1/reproducibility-result.json').read_text())
          prep_a = json.loads((root / 'integrated/preparation-a.json').read_text())
          prep_b = json.loads((root / 'integrated/preparation-b.json').read_text())
          boot = json.loads((root / 'qemu/boot-result.json').read_text())
          acceptance = json.loads((root / 'qemu/guest-acceptance.json').read_text())
          runtime = json.loads((root / 'qemu/runtime-ready.json').read_text())
          assert d1['status'] == 'PASS', d1
          assert repro['status'] == 'PASS_TWO_INDEPENDENT_BUILDS', repro
          assert prep_a['status'] == 'PASS_DETERMINISTIC_INPUT_INJECTION', prep_a
          assert prep_a['integrated_image_sha256'] == prep_b['integrated_image_sha256']
          assert boot['status'] == 'PASS_D1_D2_INTEGRATED_IMAGE_CANDIDATE', boot
          assert boot['network'] == 'none', boot
          assert acceptance['product_agent_port_default_disabled'] is True
          assert runtime['page_input_verified'] is True
          assert runtime['ime_composition_events_sent'] == 3
          assert boot['claims']['actual_content_process_crash_proven'] is False
          evidence = root / 'evidence'
          evidence.mkdir(parents=True, exist_ok=True)
          workflow = Path('.github/workflows/d2i-integrated-image.yml')
          inputs = [
              Path('Cargo.lock'),
              Path('manifests/servo.lock.json'),
              Path('manifests/debian-d1.selection.json'),
              Path('manifests/debian-d1.lock.v1.json'),
              Path('runtime/servo/hepta_workspace_runtime.rs'),
              Path('tests/qemu/prepare-d2i-image.sh'),
              Path('tests/qemu/run-d2i-boot-test.sh'),
          ]
          summary = {
              'schema': 'trillionnium.desktop.d2i-integrated-qualification.v1',
              'status': 'PASS_CANDIDATE_BLOCKED_ACTUAL_CONTENT_PROCESS_CRASH',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'base_sha': os.environ['BASE_SHA'],
              'candidate_head_sha': os.environ['CANDIDATE_HEAD_SHA'],
              'tested_sha': os.environ['TESTED_SHA'],
              'tree_sha': os.environ['TESTED_TREE_SHA'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'workflow_sha256': hashlib.sha256(workflow.read_bytes()).hexdigest(),
              'input_digests': {
                  str(path): hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in inputs
              },
              'd1_pipeline': d1,
              'd1_reproducibility': repro,
              'image_preparation': prep_a,
              'boot': boot,
              'guest_acceptance': acceptance,
              'runtime': runtime,
              'promotion_blockers': [
                  'actual_content_process_crash_callback_observed',
                  'digest_bound_evidence_committed',
                  'independent_review',
                  'exact_main_rerun_after_merge',
              ],
              'claim_ceiling': {
                  'external_browsing_or_effects': False,
                  'product_agent_port_enabled': False,
                  'secure_boot_qualified': False,
                  'hardware_ready': False,
                  'release_ready': False,
              },
          }
          (evidence / 'd2i-integrated-qualification.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          for source in [
              root / 'integrated/preparation-a.json',
              root / 'integrated/preparation-b.json',
              root / 'integrated/image-sha256.txt',
              root / 'qemu/boot-result.json',
              root / 'qemu/guest-acceptance.json',
              root / 'qemu/runtime-ready.json',
              root / 'qemu/runtime-journal.txt',
              root / 'qemu/serial.log',
              root / 'qemu/qemu-command.txt',
              root / 'qemu/servo-content-recovered.png',
          ]:
              if source.is_file():
                  target = evidence / source.name
                  target.write_bytes(source.read_bytes())
          d1_evidence = root / 'd1/evidence'
          if d1_evidence.is_dir():
              import shutil
              shutil.copytree(d1_evidence, evidence / 'd1', dirs_exist_ok=True)
          PY

      - name: Upload bounded D2I machine evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d2i-integrated-image-${{ github.sha }}
          path: /tmp/trillionnium-d2i/evidence
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
