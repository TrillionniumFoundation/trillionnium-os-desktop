name: d2i-integrated-image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d2i-integrated-image-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  E2FSPROGS_COMMIT: c3cce4a07efefc62bc7fc57a678cb870af27d0f2
  E2FSPROGS_VERSION: 1.47.2
  CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
  TESTED_SHA: ${{ github.sha }}

jobs:
  integrated-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out exact integration candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact candidate topology and base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_BEFORE: ${{ github.event.before || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          tested_sha="$(git rev-parse HEAD)"
          [[ "$tested_sha" == "$EVENT_SHA" ]] || {
            echo "checked-out object does not equal github.sha" >&2
            exit 1
          }
          # The webhook base SHA is only a snapshot of event metadata.  Fetch
          # the current main ref and bind the tested merge's first parent to
          # that object so a delayed PR run cannot qualify against stale main.
          git fetch --no-tags origin main
          current_main="$(git rev-parse origin/main)"
          mapfile -t parents < <(git show -s --format='%P' HEAD | tr ' ' '\n' | sed '/^$/d')
          base_sha=
          candidate_sha="$tested_sha"
          case "$EVENT_NAME" in
            pull_request)
              [[ ${#parents[@]} -eq 2 ]] || {
                echo "pull_request D2I qualification requires a two-parent merge" >&2
                exit 1
              }
              [[ "${parents[1]}" == "$PR_HEAD_SHA" ]] || {
                echo "merge second parent is not the live PR head" >&2
                exit 1
              }
              [[ "${parents[0]}" == "$PR_BASE_SHA" ]] || {
                echo "merge first parent is not the live PR base" >&2
                exit 1
              }
              [[ "${parents[0]}" == "$current_main" ]] || {
                echo "merge first parent is not the current origin/main object" >&2
                exit 1
              }
              base_sha="${parents[0]}"
              candidate_sha="${parents[1]}"
              ;;
            push)
              [[ "${GITHUB_REF_NAME}" == main ]] || {
                echo "D2I push qualification is main-only" >&2
                exit 1
              }
              [[ "$tested_sha" == "$current_main" ]] || {
                echo "D2I tested push object is not the current origin/main object" >&2
                exit 1
              }
              [[ ${#parents[@]} -ge 1 ]] || {
                echo "main push has no parent" >&2
                exit 1
              }
              if [[ -n "$EVENT_BEFORE" \
                && "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
                git cat-file -e "$EVENT_BEFORE^{commit}" || {
                  echo "main push event.before is not present in the checkout" >&2
                  exit 1
                }
                git merge-base --is-ancestor "$EVENT_BEFORE" "${parents[0]}" || {
                  echo "main push first-parent history does not contain event.before" >&2
                  exit 1
                }
              fi
              base_sha="${parents[0]}"
              ;;
            workflow_dispatch)
              [[ ${#parents[@]} -ge 1 ]] || {
                echo "manual D2I qualification has no parent" >&2
                exit 1
              }
              git fetch --no-tags origin main
              base_sha="$(git merge-base HEAD origin/main)"
              ;;
            *)
              echo "unsupported D2I event: $EVENT_NAME" >&2
              exit 1
              ;;
          esac
          {
            printf 'TESTED_SHA=%s\n' "$tested_sha"
            printf 'TESTED_TREE_SHA=%s\n' "$(git rev-parse HEAD^{tree})"
            printf 'BASE_SHA=%s\n' "$base_sha"
            printf 'CANDIDATE_HEAD_SHA=%s\n' "$candidate_sha"
          } >> "$GITHUB_ENV"
          printf 'tested=%s\nparents=%s\n' "$tested_sha" "${parents[*]:-none}"

      - name: Record exact source identities
        shell: bash
        run: |
          set -euo pipefail
          printf 'TESTED_TREE_SHA=%s\n' "$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          printf 'candidate_head=%s\nbase=%s\ntested=%s\ntree=%s\n' \
            "$CANDIDATE_HEAD_SHA" "$BASE_SHA" "$TESTED_SHA" "$(git rev-parse HEAD^{tree})"

      - name: Check out exact e2fsprogs source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: tytso/e2fsprogs
          ref: ${{ env.E2FSPROGS_COMMIT }}
          path: e2fsprogs-source
          fetch-depth: 1
          persist-credentials: false

      - name: Install D1 and headed Servo host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential ca-certificates clang cmake curl \
            debian-archive-keyring e2fsprogs gettext git gnupg gperf imagemagick jq \
            libdbus-1-dev libegl1-mesa-dev libfontconfig1-dev libfreetype-dev \
            libgl1-mesa-dev libgles2-mesa-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer1.0-dev libharfbuzz-dev liblzma-dev libssl-dev libunwind-dev \
            libwayland-dev libx11-dev libx11-xcb-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libxkbcommon-x11-dev mesa-utils mmdebstrap nasm ninja-build pkg-config \
            python3 python3-pip qemu-system-x86 rsync shellcheck systemd \
            x11-utils x11-xserver-utils xauth xserver-xorg-dev
          sudo rm -rf /var/lib/apt/lists/*

      - name: Build exact isolated e2fsprogs toolchain including debugfs
        shell: bash
        run: |
          set -euo pipefail
          manifest_repository="$(jq -er '.repository' manifests/e2fsprogs-host-toolchain.v1.json)"
          manifest_commit="$(jq -er '.commit' manifests/e2fsprogs-host-toolchain.v1.json)"
          manifest_tag="$(jq -er '.tag' manifests/e2fsprogs-host-toolchain.v1.json)"
          manifest_version="$(jq -er '.version' manifests/e2fsprogs-host-toolchain.v1.json)"
          test "$manifest_repository" = "https://github.com/tytso/e2fsprogs.git"
          test "$manifest_commit" = "$E2FSPROGS_COMMIT"
          test "$manifest_tag" = "v$E2FSPROGS_VERSION"
          test "$manifest_version" = "$E2FSPROGS_VERSION"
          test "$(git -C e2fsprogs-source rev-parse HEAD)" = "$E2FSPROGS_COMMIT"
          test -z "$(git -C e2fsprogs-source status --porcelain=v1)"
          prefix="$RUNNER_TEMP/e2fsprogs-$E2FSPROGS_VERSION"
          build="$RUNNER_TEMP/e2fsprogs-build"
          rm -rf "$prefix" "$build"
          mkdir -p "$build"
          cd "$build"
          "$GITHUB_WORKSPACE/e2fsprogs-source/configure" \
            --prefix="$prefix" \
            --enable-nls
          make -j2
          make -C e2fsck install
          make -C misc install
          make -C debugfs install
          for tool in mke2fs e2fsck dumpe2fs debugfs; do
            test -x "$prefix/sbin/$tool"
          done
          test "$("$prefix/sbin/mke2fs" -V 2>&1 | awk 'NR == 1 { print $2 }')" = "$E2FSPROGS_VERSION"
          printf '%s\n' "$prefix/sbin" "$prefix/bin" >> "$GITHUB_PATH"
          cd "$GITHUB_WORKSPACE"
          rm -rf e2fsprogs-source

      - name: Install exact repository Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 - <<'PY'
          from pathlib import Path
          import tomllib
          print(tomllib.loads(Path('rust-toolchain.toml').read_text())['toolchain']['channel'])
          PY
          )"
          printf 'RUST_CHANNEL=%s\n' "$channel" >> "$GITHUB_ENV"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustup override set "$channel"
          rustc --version --verbose
          cargo --version --verbose

      - name: Restore repository Cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: d2i-repository-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Validate source and build qualification-only AgentPort binaries
        shell: bash
        run: |
          set -euo pipefail
          export RUSTUP_TOOLCHAIN="$RUST_CHANNEL"
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 tools/verify_systemd_socket_custody.py
          make test-python
          # Follow the repository-root-bound helper sources; without -x
          # ShellCheck reports SC1091 for the intentional dynamic script_dir
          # paths even when a source directive is present.
          shellcheck -x -e SC2016,SC2054 \
            tools/reject_symlink_path.sh \
            packaging/debian/image/build-d1-image.sh \
            packaging/debian/image/d2i-overlay/usr/local/libexec/trillionnium-d2i-acceptance \
            packaging/debian/image/d2i-overlay/usr/local/libexec/trillionnium-d2i-content-crash-proof \
            tests/qemu/run-d1-pipeline.sh \
            tests/qemu/run-d1-boot-test.sh \
            tests/qemu/prepare-d2i-image.sh \
            tests/qemu/run-d2i-boot-test.sh \
            tools/build_pinned_e2fsprogs.sh \
            tools/run_d1_final_qualification.sh \
            tools/run_servo_headed_runtime_gate.sh
          cargo fmt --all --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-targets --all-features --locked
          # Keep the two qualification binaries under their distinct feature
          # contracts.  The qualification request daemon is D1-only and its
          # static executable binding is enabled solely by d1-qualification.
          cargo build --release --locked \
            -p hepta-agent-portd \
            --no-default-features \
            --bin hepta-agent-portd
          cargo build --release --locked \
            -p hepta-agent-portd \
            --features d1-qualification \
            --bin hepta-agent-port-qualificationd
          cargo build --release --locked \
            -p hepta-agent-portd \
            --features d1-qualification \
            --bin hepta-agent-d1-fixture
          test -x target/release/hepta-agent-portd
          test -x target/release/hepta-agent-port-qualificationd
          test -x target/release/hepta-agent-d1-fixture

      - name: Resolve exact Servo source lock
        id: servo-pin
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import io
          import re
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path('tools').resolve()))
          from gate_evidence_envelope import _open_artifact, load_json_strict
          with _open_artifact(Path('.'), 'manifests/servo.lock.json') as stream:
              lock = load_json_strict(io.TextIOWrapper(stream, encoding='utf-8'))
          nested = lock.get('servo') if isinstance(lock.get('servo'), dict) else {}
          def first(*names):
              for source in (lock, nested):
                  for name in names:
                      value = source.get(name)
                      if isinstance(value, str) and value:
                          return value
              raise SystemExit(f'missing Servo lock field {names}')
          repository = first('repository', 'repo', 'url')
          revision = first('commit', 'revision', 'rev', 'git_revision')
          if repository != 'https://github.com/servo/servo':
              raise SystemExit(
                  'D2I Servo lock repository must be exactly '
                  'https://github.com/servo/servo'
              )
          if re.fullmatch(r'[0-9a-f]{40}', revision) is None:
              raise SystemExit('D2I Servo lock revision must be lowercase 40-hex')
          print(f"repository={repository}")
          print(f"revision={revision}")
          PY

      - name: Check out exact Servo source
        shell: bash
        env:
          SERVO_REVISION: ${{ steps.servo-pin.outputs.revision }}
          SERVO_REPOSITORY: ${{ steps.servo-pin.outputs.repository }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout --no-tags \
            https://github.com/servo/servo \
            /tmp/servo
          test "$SERVO_REPOSITORY" = https://github.com/servo/servo
          git -C /tmp/servo fetch --depth=1 origin \
            "$SERVO_REVISION"
          git -C /tmp/servo checkout --detach FETCH_HEAD
          test "$(git -C /tmp/servo rev-parse HEAD)" = "$SERVO_REVISION"
          test -z "$(git -C /tmp/servo status --porcelain=v1)"
          # The pinned Servo tree may omit this optional leaf.  Validate the
          # tracked parent, create only the final directory component, and
          # revalidate before installing the ephemeral runtime sources.
          source tools/reject_symlink_path.sh
          examples_dir=/tmp/servo/ports/servoshell/examples
          examples_parent=$(dirname -- "$examples_dir")
          reject_symlink_path "$examples_parent" "D2I Servo examples parent"
          [[ -d "$examples_parent" && ! -L "$examples_parent" ]]
          reject_symlink_path "$examples_dir" "D2I Servo examples directory"
          if [[ -L "$examples_dir" || ( -e "$examples_dir" && ! -d "$examples_dir" ) ]]; then
            echo "D2I Servo examples directory is not a directory" >&2
            exit 1
          fi
          if [[ ! -e "$examples_dir" ]]; then
            mkdir -- "$examples_dir"
          fi
          reject_symlink_path "$examples_dir" "D2I Servo examples directory"
          [[ -d "$examples_dir" && ! -L "$examples_dir" ]]
          runtime_example="$examples_dir/trillionnium_headed_runtime.rs"
          fixture_example="$examples_dir/trillionnium_headed_fixture.html"
          require_regular_path "$runtime_example" "D2I Servo runtime example"
          require_regular_path "$fixture_example" "D2I Servo fixture example"
          cp -- experiments/servo-headed-runtime/src/main.rs "$runtime_example"
          cp -- experiments/servo-headed-runtime/fixture/index.html "$fixture_example"
          require_regular_path "$runtime_example" "D2I Servo runtime example"
          require_regular_path "$fixture_example" "D2I Servo fixture example"

      - name: Install Servo toolchain and restore exact-pin cache
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 - <<'PY'
          from pathlib import Path
          import tomllib
          print(tomllib.loads(Path('/tmp/servo/rust-toolchain.toml').read_text())['toolchain']['channel'])
          PY
          )"
          printf 'SERVO_RUST_CHANNEL=%s\n' "$channel" >> "$GITHUB_ENV"
          rustup toolchain install "$channel" --profile minimal --component rustfmt

      - name: Restore exact-pin Servo build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/servo/target
          key: d2i-servo-${{ runner.os }}-${{ steps.servo-pin.outputs.revision }}-${{ hashFiles('experiments/servo-headed-runtime/src/main.rs', 'experiments/servo-headed-runtime/fixture/index.html', 'tools/inject_servo_content_process.py') }}
          restore-keys: |
            d2i-servo-${{ runner.os }}-${{ steps.servo-pin.outputs.revision }}-

      - name: Build exact headed Servo runtime
        working-directory: /tmp/servo
        shell: bash
        run: |
          set -euo pipefail
          export RUSTUP_TOOLCHAIN="$SERVO_RUST_CHANNEL"
          rustfmt --edition 2024 ports/servoshell/examples/trillionnium_headed_runtime.rs
          cargo build --release --locked \
            -p servoshell --example trillionnium_headed_runtime \
            --no-default-features --features bundled,gamepad,js_jit,max_log_level
          mkdir -p /tmp/trillionnium-d2i
          cp target/release/examples/trillionnium_headed_runtime \
            /tmp/trillionnium-d2i/hepta-workspace-runtime
          chmod 0755 /tmp/trillionnium-d2i/hepta-workspace-runtime
          sha256sum /tmp/trillionnium-d2i/hepta-workspace-runtime \
            > /tmp/trillionnium-d2i/headed-runtime.sha256

      - name: Resolve signed D1 closure, build twice, and prove D1 under QEMU
        shell: bash
        env:
          # D2I calls the shared pipeline without the product-image adapter;
          # bind the fixture-free product daemon explicitly for the image.
          D1_AGENT_PORTD_BINARY: ${{ github.workspace }}/target/release/hepta-agent-portd
        run: |
          set -euo pipefail
          export RUSTUP_TOOLCHAIN="$RUST_CHANNEL"
          tests/qemu/run-d1-pipeline.sh \
            --workspace "$GITHUB_WORKSPACE" \
            --output-dir /tmp/trillionnium-d2i/d1

      - name: Prepare the integrated image twice and require byte equality
        shell: bash
        env:
          SERVO_REVISION: ${{ steps.servo-pin.outputs.revision }}
        run: |
          set -euo pipefail
          base=/tmp/trillionnium-d2i/d1/build-a/candidate/artifacts/trillionnium-d1.ext4
          source_epoch="$(jq -er '.source_date_epoch' /tmp/trillionnium-d2i/d1/prepared/prepared-inputs.json)"
          mkdir -p /tmp/trillionnium-d2i/integrated
          for build in a b; do
            tests/qemu/prepare-d2i-image.sh \
              --base-image "$base" \
              --runtime-binary /tmp/trillionnium-d2i/hepta-workspace-runtime \
              --overlay packaging/debian/image/d2i-overlay \
              --source-epoch "$source_epoch" \
              --servo-revision "$SERVO_REVISION" \
              --output-image "/tmp/trillionnium-d2i/integrated/d2i-$build.ext4" \
              --evidence "/tmp/trillionnium-d2i/integrated/preparation-$build.json"
          done
          cmp -s \
            /tmp/trillionnium-d2i/integrated/d2i-a.ext4 \
            /tmp/trillionnium-d2i/integrated/d2i-b.ext4
          sha256sum \
            /tmp/trillionnium-d2i/integrated/d2i-a.ext4 \
            /tmp/trillionnium-d2i/integrated/d2i-b.ext4 \
            > /tmp/trillionnium-d2i/integrated/image-sha256.txt
          test "$(jq -r '.integrated_image_sha256' /tmp/trillionnium-d2i/integrated/preparation-a.json)" = \
            "$(jq -r '.integrated_image_sha256' /tmp/trillionnium-d2i/integrated/preparation-b.json)"

      - name: Boot the exact integrated image with no network device
        shell: bash
        run: |
          set -euo pipefail
          tests/qemu/run-d2i-boot-test.sh \
            --selection manifests/debian-d1.selection.json \
            --artifacts /tmp/trillionnium-d2i/d1/build-a/candidate/artifacts \
            --image /tmp/trillionnium-d2i/integrated/d2i-a.ext4 \
            --preparation /tmp/trillionnium-d2i/integrated/preparation-a.json \
            --output-dir /tmp/trillionnium-d2i/qemu

      - name: Enforce evidence, candidate ceiling, and promotion blocker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io
          from pathlib import Path
          import hashlib
          import json
          import os
          import re
          import stat
          import subprocess
          import sys
          import tempfile
          sys.path.insert(0, str(Path('tools').resolve()))
          from gate_evidence_envelope import (
              _has_symlink_component,
              _open_artifact,
              build_envelope,
              load_json_strict,
              validate_artifacts_on_disk,
              write_envelope,
          )

          _O_CLOEXEC = getattr(os, 'O_CLOEXEC', 0)
          _O_NOFOLLOW = getattr(os, 'O_NOFOLLOW', 0)
          _O_NONBLOCK = getattr(os, 'O_NONBLOCK', 0)

          def open_regular(path, label):
              """Open one regular file without following a late symlink."""
              if _has_symlink_component(path):
                  raise RuntimeError(f'{label} contains a symlink: {path}')
              try:
                  descriptor = os.open(
                      path,
                      os.O_RDONLY | _O_CLOEXEC | _O_NOFOLLOW | _O_NONBLOCK,
                  )
              except OSError as error:
                  raise RuntimeError(f'{label} is absent or unsafe: {path}') from error
              try:
                  if not stat.S_ISREG(os.fstat(descriptor).st_mode):
                      raise RuntimeError(f'{label} is not a regular file: {path}')
                  return descriptor
              except BaseException:
                  os.close(descriptor)
                  raise

          def read_bytes(path, label='D2I evidence file'):
              descriptor = open_regular(path, label)
              try:
                  with os.fdopen(descriptor, 'rb', closefd=True) as stream:
                      descriptor = -1
                      return stream.read()
              finally:
                  if descriptor >= 0:
                      os.close(descriptor)

          def read_repo_bytes(relative):
              with _open_artifact(Path('.'), relative) as stream:
                  return stream.read()

          def read_json(path):
              try:
                  payload = read_bytes(path, 'D2I evidence JSON').decode('utf-8')
              except UnicodeDecodeError as error:
                  raise RuntimeError(f'D2I evidence JSON is not UTF-8: {path}') from error
              return load_json_strict(io.StringIO(payload))

          def sha256_file(path, label='D2I evidence file'):
              return hashlib.sha256(read_bytes(path, label)).hexdigest()

          def write_json(path, value, label='D2I evidence JSON'):
              """Atomically write JSON without following symlink components."""
              if _has_symlink_component(path.parent):
                  raise RuntimeError(f'{label} parent contains a symlink: {path.parent}')
              path.parent.mkdir(parents=True, exist_ok=True)
              if _has_symlink_component(path.parent):
                  raise RuntimeError(f'{label} parent contains a symlink: {path.parent}')
              descriptor, temporary_name = tempfile.mkstemp(
                  prefix=f'.{path.name}.', suffix='.tmp', dir=path.parent
              )
              temporary_path = Path(temporary_name)
              try:
                  with os.fdopen(descriptor, 'w', encoding='utf-8', closefd=True) as stream:
                      descriptor = -1
                      stream.write(json.dumps(value, indent=2, sort_keys=True) + '\n')
                      stream.flush()
                      try:
                          os.fsync(stream.fileno())
                      except OSError:
                          pass
                  if _has_symlink_component(path):
                      raise RuntimeError(f'{label} destination contains a symlink: {path}')
                  os.replace(temporary_path, path)
                  temporary_path = None
              finally:
                  if descriptor >= 0:
                      os.close(descriptor)
                  if temporary_path is not None:
                      temporary_path.unlink(missing_ok=True)

          def copy_regular(source, destination, label='D2I evidence copy'):
              """Copy one regular file through an exclusive temporary target."""
              source_fd = open_regular(source, f'{label} source')
              target_fd = -1
              temporary_path = None
              try:
                  if _has_symlink_component(destination.parent):
                      raise RuntimeError(f'{label} destination parent contains a symlink')
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  if _has_symlink_component(destination):
                      raise RuntimeError(
                          f'{label} destination contains a symlink: {destination}'
                      )
                  target_fd, temporary_name = tempfile.mkstemp(
                      prefix=f'.{destination.name}.', suffix='.tmp', dir=destination.parent
                  )
                  temporary_path = Path(temporary_name)
                  with os.fdopen(source_fd, 'rb', closefd=True) as source_stream:
                      source_fd = -1
                      with os.fdopen(target_fd, 'wb', closefd=True) as target_stream:
                          target_fd = -1
                          while True:
                              chunk = source_stream.read(1024 * 1024)
                              if not chunk:
                                  break
                              target_stream.write(chunk)
                          target_stream.flush()
                          try:
                              os.fsync(target_stream.fileno())
                          except OSError:
                              pass
                  if _has_symlink_component(destination):
                      raise RuntimeError(
                          f'{label} destination became a symlink: {destination}'
                      )
                  os.replace(temporary_path, destination)
                  temporary_path = None
              finally:
                  if source_fd >= 0:
                      os.close(source_fd)
                  if target_fd >= 0:
                      os.close(target_fd)
                  if temporary_path is not None:
                      temporary_path.unlink(missing_ok=True)

          def copy_regular_tree(source_root, destination_root, label):
              """Recursively copy only regular files and real directories."""
              if _has_symlink_component(source_root):
                  raise RuntimeError(f'{label} source contains a symlink: {source_root}')
              if not source_root.is_dir() or source_root.is_symlink():
                  raise RuntimeError(f'{label} source is not a real directory: {source_root}')
              if _has_symlink_component(destination_root):
                  raise RuntimeError(
                      f'{label} destination contains a symlink: {destination_root}'
                  )
              destination_root.mkdir(parents=True, exist_ok=True)
              if _has_symlink_component(destination_root):
                  raise RuntimeError(
                      f'{label} destination contains a symlink: {destination_root}'
                  )
              for current, directories, files in os.walk(
                  source_root, topdown=True, followlinks=False
              ):
                  current_path = Path(current)
                  if _has_symlink_component(current_path):
                      raise RuntimeError(f'{label} source contains a symlink: {current_path}')
                  for name in sorted(directories):
                      source = current_path / name
                      if _has_symlink_component(source) or not source.is_dir():
                          raise RuntimeError(f'{label} source directory is unsafe: {source}')
                      destination = destination_root / source.relative_to(source_root)
                      if _has_symlink_component(destination):
                          raise RuntimeError(
                              f'{label} destination directory is unsafe: {destination}'
                          )
                      destination.mkdir(parents=True, exist_ok=True)
                  for name in sorted(files):
                      source = current_path / name
                      if _has_symlink_component(source) or not source.is_file():
                          raise RuntimeError(f'{label} source file is unsafe: {source}')
                      destination = destination_root / source.relative_to(source_root)
                      copy_regular(source, destination, label)

          def artifact_records(root_dir):
              records = []
              for path in sorted(root_dir.rglob('*')):
                  relative = path.relative_to(root_dir).as_posix()
                  if _has_symlink_component(path):
                      raise RuntimeError(f'D2I evidence tree contains a symlink: {relative}')
                  if path.is_dir():
                      continue
                  if not path.is_file():
                      raise RuntimeError(f'D2I evidence entry is not regular: {relative}')
                  if relative == 'gate-evidence-envelope.json':
                      continue
                  payload = read_bytes(path, 'D2I evidence artifact')
                  records.append(
                      {
                          'path': relative,
                          'sha256': hashlib.sha256(payload).hexdigest(),
                          'bytes': len(payload),
                      }
                  )
              if not records:
                  raise RuntimeError('D2I evidence tree is empty')
              return records

          root = Path('/tmp/trillionnium-d2i')
          if _has_symlink_component(root) or not root.is_dir():
              raise RuntimeError(f'D2I working root is missing or unsafe: {root}')
          d1 = read_json(root / 'd1/pipeline-result.json')
          prepared = read_json(root / 'd1/prepared/prepared-inputs.json')
          repro = read_json(root / 'd1/reproducibility-result.json')
          prep_a = read_json(root / 'integrated/preparation-a.json')
          prep_b = read_json(root / 'integrated/preparation-b.json')
          boot = read_json(root / 'qemu/boot-result.json')
          acceptance = read_json(root / 'qemu/guest-acceptance.json')
          runtime = read_json(root / 'qemu/runtime-ready.json')
          crash_proof = read_json(root / 'qemu/content-process-crash-proof.json')
          assert d1['status'] == 'PASS', d1
          assert repro['status'] == 'PASS_TWO_INDEPENDENT_BUILDS', repro
          assert prep_a['status'] == 'PASS_DETERMINISTIC_INPUT_INJECTION', prep_a
          source_epoch = prepared['source_date_epoch']
          assert type(source_epoch) is int and 1 <= source_epoch <= 4294967295, prepared
          assert type(prep_a['source_date_epoch']) is int, prep_a
          assert type(prep_b['source_date_epoch']) is int, prep_b
          assert prep_a['source_date_epoch'] == source_epoch, prep_a
          assert prep_b['source_date_epoch'] == source_epoch, prep_b
          expected_metadata_normalization = {
              'injected_inode_times': True,
              'injected_inode_generations': True,
              'parent_directory_times': True,
              'superblock_times': True,
              'superblock_kbytes_written': 0,
          }
          for preparation in (prep_a, prep_b):
              metadata = preparation['metadata_normalization']
              assert type(metadata) is dict, preparation
              for key in (
                  'injected_inode_times',
                  'injected_inode_generations',
                  'parent_directory_times',
                  'superblock_times',
              ):
                  assert type(metadata[key]) is bool, preparation
              assert type(metadata['superblock_kbytes_written']) is int, preparation
          assert prep_a['metadata_normalization'] == expected_metadata_normalization
          assert prep_b['metadata_normalization'] == expected_metadata_normalization
          assert prep_a == prep_b, (prep_a, prep_b)
          assert prep_a['integrated_image_sha256'] == prep_b['integrated_image_sha256']
          assert prep_a['servo_revision'] == prep_b['servo_revision']
          assert re.fullmatch(r'[0-9a-f]{40}', prep_a['servo_revision'])
          assert boot['status'] == 'PASS_D1_D2_INTEGRATED_IMAGE_CANDIDATE', boot
          assert boot['network'] == 'none', boot
          assert acceptance['product_agent_port_default_disabled'] is True
          assert acceptance['external_crash_injector_count'] == 1
          assert acceptance['runtime_internal_injector'] is False
          assert runtime['page_input_verified'] is True
          assert runtime['ime_composition_events_sent'] == 3
          assert crash_proof['injector_count'] == 1
          assert crash_proof['runtime_internal_injector'] is False
          assert crash_proof['status'] == (
              'PASS_EXTERNAL_CONTENT_PROCESS_TERMINATION_AND_RECOVERY'
          ), crash_proof
          assert crash_proof['sigkill_delivered'] is True
          assert crash_proof['killed_pid_disappeared'] is True
          assert crash_proof['replacement_pid_distinct'] is True
          assert crash_proof['runtime_generation_after_recovery'] == 2
          killed_pid = crash_proof['killed_content_pid']
          killed_start = crash_proof['killed_content_start_time_ticks']
          replacement_pid = crash_proof['replacement_content_pid']
          replacement_start = crash_proof['replacement_content_start_time_ticks']
          for identity in (
              killed_pid,
              killed_start,
              replacement_pid,
              replacement_start,
          ):
              assert type(identity) is int and identity > 0, crash_proof
          assert (replacement_pid, replacement_start) != (killed_pid, killed_start)
          assert crash_proof['zero_process_intermediate_topology'] is True
          assert crash_proof['pre_fault_direct_child'] is True
          assert crash_proof['post_termination_active_content_processes'] == 0
          assert crash_proof['post_recovery_active_content_processes'] == 1
          assert crash_proof['post_recovery_direct_child'] is True
          runtime_fault = runtime.get('fault_injection')
          assert isinstance(runtime_fault, dict), runtime
          assert runtime_fault['mechanism'] == 'external_SIGKILL'
          assert runtime_fault['signal_sent'] is True
          assert runtime_fault['exact_termination_observed'] is True
          assert runtime_fault['old_process_absent'] is True
          assert runtime_fault['selected_pid'] == killed_pid
          assert runtime_fault['selected_start_time'] == killed_start
          runtime_replacement = runtime.get('replacement_process')
          assert isinstance(runtime_replacement, dict), runtime
          assert runtime_replacement['generation'] == 2
          assert runtime_replacement['pid'] == replacement_pid
          assert runtime_replacement['start_time'] == replacement_start
          assert runtime_replacement['distinct_from_fault_target'] is True
          callback = crash_proof.get('crash_callback_observed', False)
          assert isinstance(callback, bool), crash_proof
          assert boot['claims']['actual_content_process_crash_proven'] is False
          evidence = root / 'evidence'
          if _has_symlink_component(evidence):
              raise RuntimeError(f'D2I evidence root contains a symlink: {evidence}')
          evidence.mkdir(parents=True, exist_ok=True)
          if _has_symlink_component(evidence) or not evidence.is_dir():
              raise RuntimeError(f'D2I evidence root is missing or unsafe: {evidence}')
          workflow = Path('.github/workflows/d2i-integrated-image.yml')

          # Keep the file-level map tied to the machine registry instead of a
          # hand-maintained list that can silently miss a new builder input.
          # Git pathspec expansion covers every tracked file in each D2I
          # invalidation domain; tree_sha remains the authoritative complete
          # identity for the exact checked-out repository tree.
          registry = read_json(Path('manifests/gates.v1.json'))
          d2i_gate = next(
              (gate for gate in registry.get('gates', [])
               if gate.get('id') == 'D2I-01'),
              None,
          )
          if not isinstance(d2i_gate, dict):
              raise RuntimeError('D2I-01 is absent from the gate registry')
          pathspecs = d2i_gate.get('invalidation_paths')
          if not isinstance(pathspecs, list) or not pathspecs or any(
              not isinstance(pathspec, str)
              or not pathspec
              or pathspec.startswith((':', '!'))
              or '\\' in pathspec
              or pathspec.startswith('/')
              or '..' in pathspec.split('/')
              or any(ord(char) < 0x20 or ord(char) == 0x7f for char in pathspec)
              for pathspec in pathspecs
          ):
              raise RuntimeError('D2I-01 invalidation paths are malformed')
          encoded = subprocess.check_output(
              ['git', 'ls-files', '--stage', '-z', '--', *pathspecs]
          )
          input_names = []
          seen_input_names = set()
          for record in encoded.split(b'\0'):
              if not record:
                  continue
              try:
                  header, raw_name = record.split(b'\t', 1)
                  mode, _blob, _stage = header.split(b' ', 2)
                  name = raw_name.decode('utf-8')
              except (UnicodeDecodeError, ValueError) as error:
                  raise RuntimeError('D2I input manifest contains malformed Git data') from error
              if mode not in {b'100644', b'100755'}:
                  raise RuntimeError(f'D2I input is not a regular tracked file: {name!r}')
              if (
                  not name
                  or name.startswith('/')
                  or '\\' in name
                  or '..' in name.split('/')
                  or any(ord(char) < 0x20 or ord(char) == 0x7f for char in name)
              ):
                  raise RuntimeError(f'D2I input path is unsafe: {name!r}')
              if name in seen_input_names:
                  raise RuntimeError(f'D2I input path appears more than once: {name!r}')
              seen_input_names.add(name)
              input_names.append(name)
          input_names.sort()
          if workflow.as_posix() not in input_names:
              raise RuntimeError('D2I workflow is not covered by its registry pathspecs')
          tested_head = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          tested_tree = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD^{tree}'], text=True
          ).strip()
          if (
              tested_head != os.environ['TESTED_SHA']
              or tested_tree != os.environ['TESTED_TREE_SHA']
          ):
              raise RuntimeError('repository HEAD/tree changed during D2I qualification')
          dirty = subprocess.check_output(
              ['git', 'status', '--porcelain=v1', '--untracked-files=all'],
              text=True,
          )
          if dirty:
              raise RuntimeError(f'repository changed during D2I qualification: {dirty}')

          inputs = []
          for name in input_names:
              path = Path(name)
              if _has_symlink_component(path) or not path.is_file():
                  raise RuntimeError(f'D2I input is absent or unsafe: {name}')
              inputs.append(path)
          input_digests = {
              path.as_posix(): sha256_file(path, f'D2I tracked input {path}')
              for path in inputs
          }
          input_digest_scope = {
              'mode': 'registry_invalidation_paths',
              'pathspecs': pathspecs,
              'tracked_files_only': True,
              'tree_sha_authoritative': True,
              'external_pins_recorded_separately': True,
          }
          external_input_pins = {
              'e2fsprogs': {
                  'repository': 'https://github.com/tytso/e2fsprogs.git',
                  'commit': os.environ['E2FSPROGS_COMMIT'],
                  'version': os.environ['E2FSPROGS_VERSION'],
              },
              'servo': {
                  'repository': 'https://github.com/servo/servo',
                  'revision': prep_a['servo_revision'],
              },
          }
          summary = {
              'schema': 'trillionnium.desktop.d2i-integrated-qualification.v1',
              # External termination causality is callback-independent.  A
              # green guest run is still a candidate until the digest-bound
              # evidence receives independent review and exact-main replay.
              'status': 'PASS_CANDIDATE_REQUIRES_REVIEW_AND_EXACT_MAIN',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'base_sha': os.environ['BASE_SHA'],
              'candidate_head_sha': os.environ['CANDIDATE_HEAD_SHA'],
              'tested_sha': os.environ['TESTED_SHA'],
              'tree_sha': os.environ['TESTED_TREE_SHA'],
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'workflow_sha256': hashlib.sha256(
                  read_repo_bytes('.github/workflows/d2i-integrated-image.yml')
              ).hexdigest(),
              'input_digests': input_digests,
              'input_digest_scope': input_digest_scope,
              'external_input_pins': external_input_pins,
              'd1_pipeline': d1,
              'd1_reproducibility': repro,
              'image_preparation': prep_a,
              'boot': boot,
              'guest_acceptance': acceptance,
              'runtime': runtime,
              'content_crash_proof': crash_proof,
              'causal_crash_proof': {
                  'sigkill_success_bound_to_exact_pid_start_time': (
                      crash_proof['sigkill_delivered']
                      and runtime_fault['signal_sent']
                      and runtime_fault['selected_pid'] == killed_pid
                      and runtime_fault['selected_start_time'] == killed_start
                  ),
                  'old_identity_absent': (
                      crash_proof['killed_pid_disappeared']
                      and runtime_fault['old_process_absent']
                  ),
                  'zero_process_intermediate': (
                      crash_proof['zero_process_intermediate_topology']
                      and crash_proof['post_termination_active_content_processes'] == 0
                  ),
                  'distinct_replacement_identity': (
                      crash_proof['replacement_pid_distinct']
                      and (replacement_pid, replacement_start)
                      != (killed_pid, killed_start)
                  ),
                  # Servo's pipeline-panic callback is diagnostic telemetry;
                  # external SIGKILL proof does not depend on it.
                  'servo_crash_callback_required': False,
                  'servo_crash_callback_observed': callback,
              },
              'promotion_blockers': [
                  'digest_bound_machine_evidence_committed',
                  'independent_review',
                  'protected_main',
                  'exact_main_rerun_after_merge',
              ],
              'claim_ceiling': {
                  'actual_content_process_crash_can_be_proven_without_callback': True,
                  'actual_content_process_crash_currently_proven': False,
                  'external_browsing_or_effects': False,
                  'product_agent_port_enabled': False,
                  'secure_boot_qualified': False,
                  'hardware_ready': False,
                  'release_ready': False,
              },
          }
          specialized_receipt = evidence / 'd2i-integrated-qualification.json'
          write_json(specialized_receipt, summary, 'D2I specialized receipt')
          evidence_sources = [
              root / 'integrated/preparation-a.json',
              root / 'integrated/preparation-b.json',
              root / 'integrated/image-sha256.txt',
              root / 'qemu/boot-result.json',
              root / 'qemu/guest-acceptance.json',
              root / 'qemu/runtime-ready.json',
              root / 'qemu/runtime-journal.txt',
              root / 'qemu/content-process-crash-proof.json',
              root / 'qemu/content-process-identity.json',
              root / 'qemu/content-sigkill-sent.json',
              root / 'qemu/guest-failure-diagnostics.txt',
              root / 'qemu/content-crash-proof-diagnostics.txt',
              root / 'qemu/serial.log',
              root / 'qemu/qemu-command.txt',
              root / 'qemu/servo-content-recovered.png',
          ]
          for source in evidence_sources:
              if _has_symlink_component(source):
                  raise RuntimeError(f'D2I evidence source contains a symlink: {source}')
              if source.exists():
                  if not source.is_file():
                      raise RuntimeError(f'D2I evidence source is not regular: {source}')
                  target = evidence / source.name
                  copy_regular(source, target, 'D2I evidence file')
          d1_evidence = root / 'd1/evidence'
          if _has_symlink_component(d1_evidence):
              raise RuntimeError(f'D2I D1 evidence source contains a symlink: {d1_evidence}')
          if d1_evidence.exists():
              if not d1_evidence.is_dir():
                  raise RuntimeError(f'D2I D1 evidence source is not a directory: {d1_evidence}')
              copy_regular_tree(d1_evidence, evidence / 'd1', 'D2I D1 evidence')

          event_name = os.environ['GITHUB_EVENT_NAME']
          role_by_event = {
              'pull_request': 'pr_synthetic_merge',
              'push': 'exact_main_push',
              'workflow_dispatch': 'manual_non_authoritative',
          }
          role = role_by_event[event_name]
          envelope = build_envelope(
              gate_id='D2I-01',
              package_id='d2i-integrated-image',
              status=summary['status'],
              evidence_tier='integrated_qemu_image',
              base_sha=os.environ.get('BASE_SHA'),
              candidate_head_sha=os.environ.get('CANDIDATE_HEAD_SHA'),
              tested_merge_sha=os.environ['TESTED_SHA'] if event_name == 'pull_request' else None,
              integrated_main_sha=os.environ['TESTED_SHA'] if event_name == 'push' else None,
              tree_sha=os.environ.get('TESTED_TREE_SHA'),
              workflow_path='.github/workflows/d2i-integrated-image.yml',
              workflow_sha256=summary['workflow_sha256'],
              input_digests=summary['input_digests'],
              input_digest_scope=summary['input_digest_scope'],
              external_input_pins=summary['external_input_pins'],
              runner={
                  'os': os.environ.get('RUNNER_OS', ''),
                  'name': os.environ.get('RUNNER_NAME', ''),
                  'arch': os.environ.get('RUNNER_ARCH', ''),
              },
              commands=[
                  {'name': 'd1_pipeline', 'status': d1['status'], 'exit_code': 0},
                  {'name': 'd1_reproducibility', 'status': repro['status'], 'exit_code': 0},
                  {'name': 'image_preparation', 'status': prep_a['status'], 'exit_code': 0},
                  {'name': 'integrated_qemu_boot', 'status': boot['status'], 'exit_code': 0},
                  {'name': 'guest_acceptance', 'status': acceptance.get('status'), 'exit_code': 0},
                  {'name': 'headed_runtime', 'status': runtime.get('status'), 'exit_code': 0},
                  {'name': 'content_crash_proof', 'status': crash_proof.get('status'), 'exit_code': 0},
              ],
              artifacts=artifact_records(evidence),
              claim_ceiling=summary['claim_ceiling'],
              repository=summary['repository'],
              event_name=event_name,
              ref=os.environ['GITHUB_REF'],
              ref_name=os.environ.get('GITHUB_REF_NAME'),
              evidence_role=role,
              promotion_authoritative=(event_name == 'push'),
              tested_sha=os.environ['TESTED_SHA'],
              workflow_run_id=os.environ['GITHUB_RUN_ID'],
              workflow_run_attempt=int(os.environ['GITHUB_RUN_ATTEMPT']),
          )
          write_envelope(evidence / 'gate-evidence-envelope.json', envelope)
          # Keep an explicit command in the workflow so downloaded D2I
          # evidence can be checked with the same offline validator.
          from gate_evidence_envelope import load_and_validate
          load_and_validate(
              evidence / 'gate-evidence-envelope.json',
              expected_gate_id='D2I-01',
              expected_workflow_path='.github/workflows/d2i-integrated-image.yml',
          )
          validate_artifacts_on_disk(envelope, evidence)
          PY

      - name: Collect bounded D2I failure diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Diagnostics are an untrusted, non-authoritative transport.  Copy
          # only regular files after checking every raw path component; never
          # let a pre-seeded symlink/FIFO redirect an artifact write.
          source tools/reject_symlink_path.sh
          ensure_diagnostic_directory() {
            local directory=$1
            local label=$2
            reject_symlink_path "$directory" "$label" || return 1
            mkdir -p -- "$directory" || return 1
            reject_symlink_path "$directory" "$label" || return 1
            [[ -d "$directory" && ! -L "$directory" ]] || {
              printf '%s is not a real directory: %s\n' "$label" "$directory" >&2
              return 1
            }
          }
          copy_diagnostic_tree() {
            local source_root=$1
            local destination_root=$2
            local label=$3
            local source
            local relative
            local destination
            reject_symlink_path "$source_root" "$label source" || return 1
            [[ -d "$source_root" && ! -L "$source_root" ]] || return 0
            ensure_diagnostic_directory "$destination_root" "$label destination" || return 1
            if find -P "$source_root" -mindepth 1 \
                ! -type f ! -type d -print -quit | grep -q .; then
              printf '%s contains a non-regular entry\n' "$label source" >&2
              return 1
            fi
            while IFS= read -r -d '' source; do
              relative=${source#"$source_root"/}
              require_regular_path "$source" "$label source" || return 1
              destination="$destination_root/$relative"
              ensure_diagnostic_directory "$(dirname -- "$destination")" \
                "$label destination parent" || return 1
              require_regular_path "$destination" "$label destination" || return 1
              cp -- "$source" "$destination" || return 1
            done < <(find -P "$source_root" -mindepth 1 -type f -print0)
          }
          diagnostics=/tmp/trillionnium-d2i/diagnostics
          reject_symlink_path "$diagnostics" "D2I diagnostics" || exit 1
          rm -rf "$diagnostics"
          ensure_diagnostic_directory "$diagnostics" "D2I diagnostics"
          ensure_diagnostic_directory "$diagnostics/qemu" "D2I QEMU diagnostics"
          ensure_diagnostic_directory "$diagnostics/d1" "D2I D1 diagnostics"
          if [[ -d /tmp/trillionnium-d2i/qemu ]]; then
            copy_diagnostic_tree \
              /tmp/trillionnium-d2i/qemu "$diagnostics/qemu" "D2I QEMU diagnostics" || true
          fi
          if [[ -d /tmp/trillionnium-d2i/d1/evidence ]]; then
            copy_diagnostic_tree \
              /tmp/trillionnium-d2i/d1/evidence "$diagnostics/d1" "D2I D1 diagnostics" || true
          fi
          # Keep the canonical evidence directory immutable after its
          # envelope has been written.  Diagnostics are intentionally a
          # separate, non-authoritative artifact and must never overwrite or
          # add files to the digest-bound evidence bundle.
          while IFS= read -r -d '' file; do
            require_regular_path "$file" "D2I diagnostic file" || continue
            case "$file" in
              *.json|*.txt|*.log)
                parent=$(dirname -- "$file")
                ensure_diagnostic_directory "$parent" "D2I diagnostic parent" || continue
                temporary=$(mktemp "$parent/.$(basename -- "$file").tail.XXXXXX") || continue
                require_regular_path "$temporary" "D2I diagnostic truncation file" || {
                  rm -f -- "$temporary"
                  continue
                }
                if tail -c 4194304 -- "$file" > "$temporary"; then
                  mv -f -- "$temporary" "$file"
                else
                  rm -f -- "$temporary"
                fi
                ;;
            esac
          done < <(find -P "$diagnostics" -type f -size +4M -print0)

      - name: Upload bounded D2I machine evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d2i-integrated-image-${{ github.sha }}
          path: /tmp/trillionnium-d2i/evidence
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6

      - name: Upload bounded D2I failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d2i-integrated-image-diagnostics-${{ github.sha }}
          path: /tmp/trillionnium-d2i/diagnostics
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
