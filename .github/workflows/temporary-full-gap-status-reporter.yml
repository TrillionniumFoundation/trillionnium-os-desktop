name: temporary-full-gap-status-reporter

on:
  push:
    branches:
      - codex/full-gap-status-reporter-v1

permissions:
  contents: read

concurrency:
  group: temporary-full-gap-status-reporter
  cancel-in-progress: true

jobs:
  retired:
    name: retired-status-reporter
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Confirm retirement
        run: |
          set -euo pipefail
          echo 'The long-polling temporary status reporter is retired.'
          echo 'GitHub API state is read on demand; no runner is reserved for polling.'
