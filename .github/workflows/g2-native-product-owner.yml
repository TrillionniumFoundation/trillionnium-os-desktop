permissions:
  contents: read
concurrency:
  group: g2-native-product-owner-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  source-prospective:
    name: g2-native-product-owner / source-prospective
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify canonical live source role
        shell: bash
        env:
          CI_SOURCE_ROLE: prospective-merge
          CI_SOURCE_EVENT: ${{ github.event_name }}
          CI_SOURCE_REPOSITORY: ${{ github.repository }}
          CI_SOURCE_REF: ${{ github.ref }}
          CI_SOURCE_REF_NAME: ${{ github.ref_name }}
          CI_SOURCE_SHA: ${{ github.sha }}
          CI_SOURCE_PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_SOURCE_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_SOURCE_PR_BASE: ${{ github.event.pull_request.base.sha }}
          CI_SOURCE_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          python3 -B tools/verify_ci_source_identity.py

      - name: Source contract and original workspace regressions on prospective merge
        shell: bash
        env:
          CARGO_PROFILE_TEST_DEBUG: '0'
          # Optimize the same source-test executable measurements without changing budgets.
          CARGO_PROFILE_TEST_OPT_LEVEL: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.93.0
          python3 tools/validate_native_product_owner.py
          python3 -m unittest discover -s tests -p test_native_product_owner.py -v
          make check
  exact-pin-owner:
    name: g2-native-product-owner / exact-pin-owner
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SERVO_PIN: 670ae8a70801b162e186f81cbb5bdd2d59c39108
    steps:
      - name: Check out exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify canonical live source role
        shell: bash
        env:
          CI_SOURCE_ROLE: head
          CI_SOURCE_EVENT: ${{ github.event_name }}
          CI_SOURCE_REPOSITORY: ${{ github.repository }}
          CI_SOURCE_REF: ${{ github.ref }}
          CI_SOURCE_REF_NAME: ${{ github.ref_name }}
          CI_SOURCE_SHA: ${{ github.sha }}
          CI_SOURCE_PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_SOURCE_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_SOURCE_PR_BASE: ${{ github.event.pull_request.base.sha }}
          CI_SOURCE_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          python3 -B tools/verify_ci_source_identity.py

      - name: Exact source contract and typed bridge checks
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          CARGO_PROFILE_TEST_DEBUG: '0'
          # Optimize the same source-test executable measurements without changing budgets.
          CARGO_PROFILE_TEST_OPT_LEVEL: '1'
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git rev-parse HEAD | tee "$RUNNER_TEMP/native-owner-source-head.txt"
          git rev-parse 'HEAD^{tree}' | tee "$RUNNER_TEMP/native-owner-source-tree.txt"
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.93.0
          python3 tools/validate_native_product_owner.py
          python3 -m unittest discover -s tests -p test_native_product_owner.py -v
          cargo fmt --all --check
          cargo clippy --locked -p hepta-browser-actor -p hepta-browserd --all-targets --all-features -- -D warnings
          cargo test --locked -p hepta-browser-actor -p hepta-browserd --all-targets --all-features
          sha256sum experiments/servo-product-owner/src/*.rs \
            crates/hepta-browser-actor/src/{lib,servo_runtime}.rs \
            contracts/native-product-owner.v1.json \
            tools/{prepare,validate}_native_product_owner.py \
            .github/workflows/g2-native-product-owner.yml \
            > "$RUNNER_TEMP/native-owner-source.sha256"
      - name: Check out pristine exact Servo PIN
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: servo/servo
          ref: ${{ env.SERVO_PIN }}
          path: servo
          fetch-depth: 1
          persist-credentials: false
      - name: Assemble the actual reusable consumer and connected target
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C servo rev-parse HEAD)" = "$SERVO_PIN"
          cp servo/Cargo.lock "$RUNNER_TEMP/native-owner-original-Cargo.lock"
          python3 tools/prepare_native_product_owner.py prepare --upstream servo \
            | tee "$RUNNER_TEMP/native-owner-source-assembly.json"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev libunwind-dev pkg-config cmake ninja-build \
            libfontconfig1-dev libfreetype6-dev libglib2.0-dev libegl1-mesa-dev \
            libgl1-mesa-dev libx11-dev libxcb1-dev libxrandr-dev libxcursor-dev \
            libxi-dev libxinerama-dev libxkbcommon-dev libasound2-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libudev-dev libdbus-1-dev libssl-dev
          channel="$(sed -n 's/^channel = "\([^"]*\)"/\1/p' servo/rust-toolchain.toml)"
          test "$channel" = 1.97.1
          rustup toolchain install "$channel" --profile minimal --component rustfmt
          rustup run "$channel" rustfmt --edition 2024 --config skip_children=true \
            servo/components/servo/tests/trillionnium_native_owner.rs \
            servo/components/servo/tests/trillionnium_product_owner.rs
          cmp experiments/servo-product-owner/src/native_owner.rs servo/components/servo/tests/trillionnium_native_owner.rs
          cmp experiments/servo-product-owner/src/connected_tests.rs servo/components/servo/tests/trillionnium_product_owner.rs
          (cd servo && RUSTUP_TOOLCHAIN=1.97.1 cargo update -p libc --precise 0.2.186)
          python3 tools/prepare_native_product_owner.py verify-lock \
            --before "$RUNNER_TEMP/native-owner-original-Cargo.lock" --after servo/Cargo.lock \
            | tee "$RUNNER_TEMP/native-owner-lock-binding.json"
      - name: Compile the actual exact-pin native module and connected target
        shell: bash
        env:
          CARGO_INCREMENTAL: '0'
          RUST_BACKTRACE: '1'
        run: |
          set -euo pipefail
          (cd servo && RUSTUP_TOOLCHAIN=1.97.1 cargo test --locked --profile checked-release -p servo \
            --no-default-features --features bundled,js_jit \
            --test trillionnium_product_owner --no-run --message-format=json) \
            > "$RUNNER_TEMP/native-owner-compile.jsonl"
          python3 - "$RUNNER_TEMP/native-owner-compile.jsonl" "$RUNNER_TEMP/native-owner-binary.txt" <<'PY'
          import json, os, sys
          found = []
          for line in open(sys.argv[1], encoding='utf-8'):
              item = json.loads(line)
              if item.get('reason') == 'compiler-artifact' and item.get('target', {}).get('name') == 'trillionnium_product_owner' and item.get('executable'):
                  found.append(item['executable'])
          if len(found) != 1 or not os.path.isabs(found[0]):
              raise SystemExit('one actual connected target executable is required')
          open(sys.argv[2], 'w', encoding='utf-8').write(found[0] + '\n')
          PY
      - name: Actual same-UID transient-unit connected owner cases
        shell: bash
        run: |
          set -euo pipefail
          binary="$(cat "$RUNNER_TEMP/native-owner-binary.txt")"
          binary_sha="$(sha256sum "$binary" | cut -d' ' -f1)"
          sha256sum "$binary" | tee "$RUNNER_TEMP/native-owner-binary.sha256"
          output="$RUNNER_TEMP/native-owner-connected-corpus"
          install -d -m 0700 "$output"
          count=0
          for test_name in \
            actual_connected_immutable_semantic_snapshot \
            unsupported_operations_never_enter_durable_or_native_dispatch \
            native_handle_release_is_uncertain_and_blocks_reconstruction \
            wrong_live_policy_and_cancelled_original_connection_refuse_admission; do
            count=$((count + 1))
            unit="hepta-owner-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${count}"
            sudo systemd-run --wait --pipe --collect --service-type=exec \
              --unit "$unit" --uid "$(id -u)" --gid "$(id -g)" \
              --property=NoNewPrivileges=yes --property=RuntimeMaxSec=60 --property=UMask=0077 \
              --property="WorkingDirectory=$GITHUB_WORKSPACE/servo" \
              --setenv="HEPTA_OWNER_EXPECTED_UID=$(id -u)" \
              --setenv="HEPTA_OWNER_EXPECTED_GID=$(id -g)" \
              --setenv="HEPTA_OWNER_EXPECTED_UNIT=$unit.service" \
              --setenv="HEPTA_OWNER_EXPECTED_EXE_SHA256=$binary_sha" \
              --setenv="HEPTA_OWNER_OUTPUT=$output" \
              "$binary" --exact "$test_name" --nocapture --test-threads=1 \
              2>&1 | tee "$RUNNER_TEMP/native-owner-$count.log"
            grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$RUNNER_TEMP/native-owner-$count.log"
            test "$(sha256sum "$binary" | cut -d' ' -f1)" = "$binary_sha"
          done
          test "$count" = 4
          find "$output" -type f -exec sha256sum {} + | sort > "$RUNNER_TEMP/native-owner-journal-files.sha256"
          test -s "$RUNNER_TEMP/native-owner-journal-files.sha256"
          sha256sum --check "$RUNNER_TEMP/native-owner-source.sha256"
      - name: Preserve source, actual compile and connected/journal diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-product-owner-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ runner.temp }}/native-owner-*
