name: d0a02-api-adapter-fix-once

on:
  push:
    branches:
      - codex/d0a02-headed-runtime-v3
    paths:
      - .github/workflows/d0a02-api-adapter-fix-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d0a02-headed-runtime-v3
          fetch-depth: 0
      - name: Correct exact-pin runtime API adapters
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('experiments/servo-headed-runtime/src/main.rs')
          lines = path.read_text().splitlines()

          old_import = '    DeviceIntSize, DevicePoint, EmbedderControl, EventLoopWaker, ImeEvent, InputEvent,'
          new_import = '    DevicePoint, EmbedderControl, EventLoopWaker, ImeEvent, InputEvent,'
          if lines.count(old_import) != 1:
              raise SystemExit(f'unexpected DeviceIntSize import count: {lines.count(old_import)}')
          lines[lines.index(old_import)] = new_import

          context_start = lines.index('        let parent_context = Rc::new(WindowRenderingContext::new(')
          context_old = [
              '        let parent_context = Rc::new(WindowRenderingContext::new(',
              '            display_handle,',
              '            window_handle,',
              '            PhysicalSize::new(WINDOW_WIDTH, WINDOW_HEIGHT),',
              '        )?);',
              '        parent_context.make_current()?;',
          ]
          if lines[context_start:context_start + len(context_old)] != context_old:
              raise SystemExit('unexpected WindowRenderingContext construction block')
          context_new = [
              '        let parent_context = Rc::new(',
              '            WindowRenderingContext::new(',
              '                display_handle,',
              '                window_handle,',
              '                PhysicalSize::new(WINDOW_WIDTH, WINDOW_HEIGHT),',
              '            )',
              '            .map_err(|error| {',
              '                std::io::Error::other(format!(',
              '                    "WindowRenderingContext::new failed: {error:?}"',
              '                ))',
              '            })?,',
              '        );',
              '        parent_context.make_current().map_err(|error| {',
              '            std::io::Error::other(format!(',
              '                "WindowRenderingContext::make_current failed: {error:?}"',
              '            ))',
              '        })?;',
          ]
          lines[context_start:context_start + len(context_old)] = context_new

          rect_start = lines.index('        let rect = DeviceIntRect::new(')
          rect_old = [
              '        let rect = DeviceIntRect::new(',
              '            DeviceIntPoint::new(0, 0),',
              '            DeviceIntSize::new(WINDOW_WIDTH as i32, WINDOW_HEIGHT as i32),',
              '        );',
          ]
          if lines[rect_start:rect_start + len(rect_old)] != rect_old:
              raise SystemExit('unexpected DeviceIntRect construction block')
          rect_new = [
              '        let rect = DeviceIntRect::new(',
              '            DeviceIntPoint::new(0, 0),',
              '            DeviceIntPoint::new(WINDOW_WIDTH as i32, WINDOW_HEIGHT as i32),',
              '        );',
          ]
          lines[rect_start:rect_start + len(rect_old)] = rect_new

          borrow_old = '        let Some(webview) = self.webview.borrow().as_ref() else {'
          borrow_new = '        let Some(webview) = self.webview.borrow().as_ref().cloned() else {'
          if lines.count(borrow_old) != 1:
              raise SystemExit(f'unexpected native IME borrow count: {lines.count(borrow_old)}')
          lines[lines.index(borrow_old)] = borrow_new

          path.write_text('\n'.join(lines) + '\n')
          PY
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          RUSTUP_TOOLCHAIN=1.97.1 rustfmt --edition 2024 \
            experiments/servo-headed-runtime/src/main.rs
          RUSTUP_TOOLCHAIN=1.97.1 rustfmt --edition 2024 --check \
            experiments/servo-headed-runtime/src/main.rs
          git diff --check
      - name: Commit exact Servo API adapter corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/servo-headed-runtime/src/main.rs
          git commit -m "fix: adapt headed runtime to exact Servo geometry and errors"
          git push origin HEAD:codex/d0a02-headed-runtime-v3
