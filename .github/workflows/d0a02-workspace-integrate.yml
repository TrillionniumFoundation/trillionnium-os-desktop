name: d0a02-workspace-integrate

on:
  push:
    branches:
      - codex/d0a02-headed-runtime-v3
    paths:
      - .github/workflows/d0a02-workspace-integrate.yml
      - tools/patch_d0a02_workspace.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d0a02-headed-runtime-v3
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy
      - name: Patch the current workspace graph and lock
        run: |
          set -euo pipefail
          python3 tools/patch_d0a02_workspace.py
          rm tools/patch_d0a02_workspace.py
          cargo generate-lockfile
          cargo update -p typenum --precise 1.20.0
          cargo fmt --all
          python3 tools/validate_repository.py
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          git diff --check
      - name: Commit the integrated composition model
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock tools/validate_repository.py tools/patch_d0a02_workspace.py crates/hepta-workspace-composition
          git commit -m "feat: integrate trusted workspace composition model"
          git push origin HEAD:codex/d0a02-headed-runtime-v3
