name: d1-nls-utf8-patch

on:
  push:
    branches:
      - codex/d1-01-reproducible-qemu-substrate
    paths:
      - .github/workflows/d1-nls-utf8-patch.yml

permissions:
  contents: write

concurrency:
  group: d1-nls-utf8-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d1-01-reproducible-qemu-substrate
          fetch-depth: 0

      - name: Enable upstream LC_CTYPE initialization and add UTF-8 import probes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected exactly one replacement target, found {count}: {old!r}"
                  )
              path.write_text(text.replace(old, new), encoding="utf-8")

          workflow = Path('.github/workflows/d1-final-qualification.yml')
          replace_once(
              workflow,
              '      - "tools/compare_d1_builds.py"\n',
              '      - "tools/build_pinned_e2fsprogs.sh"\n'
              '      - "tools/compare_d1_builds.py"\n',
          )
          replace_once(
              workflow,
              '            gnupg \\\n            jq \\\n',
              '            gettext \\\n            gnupg \\\n            jq \\\n',
          )
          replace_once(
              workflow,
              "          assert manifest['build']['configure_flags'] == ['--disable-nls']\n",
              "          assert manifest['build']['configure_flags'] == ['--enable-nls']\n"
              "          assert manifest['build']['runtime_locale'] == 'C.UTF-8'\n"
              "          assert manifest['build']['utf8_tar_import_probe_required'] is True\n",
          )
          replace_once(
              workflow,
              '            --disable-nls\n',
              '            --enable-nls\n',
          )
          replace_once(
              workflow,
              '          test "$("$prefix/sbin/mke2fs" -V 2>&1 | awk \'NR == 1 { print $2 }\')" = "$E2FSPROGS_VERSION"\n'
              '          printf \'%s\\n\' "$prefix/sbin" "$prefix/bin" >> "$GITHUB_PATH"\n',
              '''          test "$("$prefix/sbin/mke2fs" -V 2>&1 | awk 'NR == 1 { print $2 }')" = "$E2FSPROGS_VERSION"
          test "$(LC_ALL=C.UTF-8 LANG=C.UTF-8 locale charmap)" = UTF-8
          probe="$RUNNER_TEMP/e2fsprogs-utf8-probe"
          rm -rf "$probe"
          mkdir -p "$probe/root"
          printf 'utf8-path-probe\n' > "$probe/root/路径.txt"
          LC_ALL=C tar \
            --sort=name \
            --format=pax \
            --pax-option=delete=atime,delete=ctime,exthdr.name=%d/PaxHeaders/%f \
            --numeric-owner \
            --mtime='@1700000000' \
            -C "$probe/root" \
            -cf "$probe/rootfs.tar" .
          truncate -s 64M "$probe/probe.ext4"
          probe_uuid=7f453284-a1e5-4f17-9c30-7c5bde91ffff
          E2FSPROGS_FAKE_TIME=1700000000 \
            LC_ALL=C.UTF-8 LANG=C.UTF-8 \
            "$prefix/sbin/mke2fs" \
            -F -q -t ext4 -b 4096 -I 256 -m 0 \
            -L TOSD1PROBE -U "$probe_uuid" \
            -E "root_owner=0:0,lazy_itable_init=0,lazy_journal_init=0,hash_seed=$probe_uuid" \
            -d "$probe/rootfs.tar" \
            "$probe/probe.ext4"
          "$prefix/sbin/e2fsck" -fn "$probe/probe.ext4"
          mkdir -p /tmp/trillionnium-d1/evidence
          python3 - "$prefix/sbin/mke2fs" \
            /tmp/trillionnium-d1/evidence/e2fsprogs-utf8-probe.json \
            "$E2FSPROGS_COMMIT" "$E2FSPROGS_VERSION" <<'PROBE_PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          binary = Path(sys.argv[1])
          output = Path(sys.argv[2])
          report = {
              "schema": "trillionnium.desktop.e2fsprogs-utf8-probe.v1",
              "status": "PASS_UTF8_TAR_IMPORT",
              "commit": sys.argv[3],
              "version": sys.argv[4],
              "configure_flags": ["--enable-nls"],
              "runtime_locale": "C.UTF-8",
              "source_patch_count": 0,
              "mke2fs_sha256": hashlib.sha256(binary.read_bytes()).hexdigest(),
          }
          output.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          PROBE_PY
          rm -rf "$probe"
          printf '%s\n' "$prefix/sbin" "$prefix/bin" >> "$GITHUB_PATH"
''',
          )
          replace_once(
              workflow,
              '          shellcheck -e SC2016,SC2054 \\\n            packaging/debian/image/build-d1-image.sh \\\n',
              '          shellcheck -e SC2016,SC2054 \\\n'
              '            tools/build_pinned_e2fsprogs.sh \\\n'
              '            packaging/debian/image/build-d1-image.sh \\\n',
          )

          manifest_path = Path('manifests/e2fsprogs-host-toolchain.v1.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest['build']['configure_flags'] != ['--disable-nls']:
              raise SystemExit('unexpected prior e2fsprogs configure contract')
          manifest['build']['configure_flags'] = ['--enable-nls']
          manifest['build']['runtime_locale'] = 'C.UTF-8'
          manifest['build']['utf8_tar_import_probe_required'] = True
          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=True) + '\n',
              encoding='utf-8',
          )

          helper = Path('tools/build_pinned_e2fsprogs.sh')
          replace_once(
              helper,
              'for command in git jq make sha256sum gcc; do\n',
              'for command in git jq make sha256sum gcc msgfmt locale tar truncate python3; do\n',
          )
          replace_once(
              helper,
              'tag_object=$(jq -er \'.tag_object\' "$manifest")\n'
              'if ! [[ "$commit" =~ ^[0-9a-f]{40}$ && "$tag_object" =~ ^[0-9a-f]{40}$ ]]; then\n',
              '''tag_object=$(jq -er '.tag_object' "$manifest")
runtime_locale=$(jq -er '.build.runtime_locale' "$manifest")
mapfile -t configure_flags < <(jq -er '.build.configure_flags[]' "$manifest")
if (( ${#configure_flags[@]} != 1 )) || [[ ${configure_flags[0]} != --enable-nls ]]; then
  echo "pinned e2fsprogs must use the reviewed --enable-nls build contract" >&2
  exit 1
fi
if [[ $(LC_ALL="$runtime_locale" LANG="$runtime_locale" locale charmap) != UTF-8 ]]; then
  echo "pinned e2fsprogs runtime locale is not UTF-8: $runtime_locale" >&2
  exit 1
fi
if ! [[ "$commit" =~ ^[0-9a-f]{40}$ && "$tag_object" =~ ^[0-9a-f]{40}$ ]]; then
''',
          )
          replace_once(
              helper,
              'stamp="$work_dir/PASS"\n\nvalid_existing=false\n',
              'stamp="$work_dir/PASS"\n'
              'build_fingerprint="$commit:${configure_flags[*]}:$runtime_locale"\n\n'
              'valid_existing=false\n',
          )
          replace_once(
              helper,
              '  if [[ "$installed_version" == "$version" && "$(cat "$stamp")" == "$commit" ]]; then\n',
              '  if [[ "$installed_version" == "$version" && "$(cat "$stamp")" == "$build_fingerprint" ]]; then\n',
          )
          replace_once(
              helper,
              '      --prefix="$prefix" \\\n      --disable-nls\n',
              '      --prefix="$prefix" \\\n      "${configure_flags[@]}"\n',
          )
          replace_once(
              helper,
              '  printf \'%s\\n\' "$commit" > "$stamp"\nfi\n\ncompiler=$(gcc --version | head -n1)\n',
              '''  printf '%s\n' "$build_fingerprint" > "$stamp"
fi

probe="$work_dir/utf8-probe"
rm -rf "$probe"
mkdir -p "$probe/root"
printf 'utf8-path-probe\n' > "$probe/root/路径.txt"
LC_ALL=C tar \
  --sort=name \
  --format=pax \
  --pax-option=delete=atime,delete=ctime,exthdr.name=%d/PaxHeaders/%f \
  --numeric-owner \
  --mtime='@1700000000' \
  -C "$probe/root" \
  -cf "$probe/rootfs.tar" .
truncate -s 64M "$probe/probe.ext4"
probe_uuid=7f453284-a1e5-4f17-9c30-7c5bde91ffff
E2FSPROGS_FAKE_TIME=1700000000 \
  LC_ALL="$runtime_locale" LANG="$runtime_locale" \
  "$bin_dir/mke2fs" \
  -F -q -t ext4 -b 4096 -I 256 -m 0 \
  -L TOSD1PROBE -U "$probe_uuid" \
  -E "root_owner=0:0,lazy_itable_init=0,lazy_journal_init=0,hash_seed=$probe_uuid" \
  -d "$probe/rootfs.tar" \
  "$probe/probe.ext4"
"$bin_dir/e2fsck" -fn "$probe/probe.ext4" >/dev/null
probe_image_sha256=$(sha256sum "$probe/probe.ext4" | awk '{print $1}')
rm -rf "$probe"

compiler=$(gcc --version | head -n1)
''',
          )
          replace_once(
              helper,
              '  "$compiler" "$make_version" "$git_version" "$bin_dir" <<\'PY\'\n',
              '  "$compiler" "$make_version" "$git_version" "$bin_dir" \\\n'
              '  "${configure_flags[*]}" "$runtime_locale" "$probe_image_sha256" <<\'PY\'\n',
          )
          replace_once(
              helper,
              '    git_version,\n    bin_dir,\n) = sys.argv[1:]\n',
              '    git_version,\n    bin_dir,\n    configure_flag,\n'
              '    runtime_locale,\n    probe_image_sha256,\n) = sys.argv[1:]\n',
          )
          replace_once(
              helper,
              '    "version": version,\n    "compiler": compiler,\n',
              '    "version": version,\n    "configure_flags": [configure_flag],\n'
              '    "runtime_locale": runtime_locale,\n'
              '    "utf8_tar_import_probe": {\n'
              '        "status": "PASS",\n'
              '        "image_sha256": probe_image_sha256,\n'
              '    },\n'
              '    "source_patch_count": 0,\n'
              '    "compiler": compiler,\n',
          )

          test_path = Path('tests/d1/test_d1_tool_binding.py')
          replace_once(
              test_path,
              'from pathlib import Path\nimport unittest\n',
              'import json\nfrom pathlib import Path\nimport unittest\n',
          )
          replace_once(
              test_path,
              'class D1FilesystemToolBindingTests(unittest.TestCase):\n',
              '''class D1FilesystemToolBindingTests(unittest.TestCase):
    def test_exact_e2fsprogs_build_initializes_utf8_ctype_before_tar_import(self) -> None:
        manifest = json.loads(
            (REPOSITORY_ROOT / "manifests/e2fsprogs-host-toolchain.v1.json").read_text(
                encoding="utf-8"
            )
        )
        self.assertEqual(manifest["build"]["configure_flags"], ["--enable-nls"])
        self.assertEqual(manifest["build"]["runtime_locale"], "C.UTF-8")
        self.assertTrue(manifest["build"]["utf8_tar_import_probe_required"])

        workflow = (
            REPOSITORY_ROOT / ".github/workflows/d1-final-qualification.yml"
        ).read_text(encoding="utf-8")
        helper = (REPOSITORY_ROOT / "tools/build_pinned_e2fsprogs.sh").read_text(
            encoding="utf-8"
        )
        for source in (workflow, helper):
            self.assertIn("--enable-nls", source)
            self.assertNotIn("--disable-nls", source)
            self.assertIn("路径.txt", source)
        self.assertIn("gettext", workflow)
        self.assertIn("e2fsprogs-utf8-probe.json", workflow)
        self.assertIn("LC_ALL=C.UTF-8 LANG=C.UTF-8", workflow)
        self.assertIn("build_fingerprint", helper)
        self.assertIn("msgfmt", helper)
        self.assertIn("runtime_locale", helper)

''',
          )
          PY

          git rm .github/workflows/d1-nls-utf8-patch.yml
          git diff --check
          bash -n tools/build_pinned_e2fsprogs.sh
          python3 tests/d1/test_d1_tool_binding.py
          python3 tools/validate_repository.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            .github/workflows/d1-final-qualification.yml \
            manifests/e2fsprogs-host-toolchain.v1.json \
            tools/build_pinned_e2fsprogs.sh \
            tests/d1/test_d1_tool_binding.py
          git commit -m 'fix: initialize UTF-8 locale in exact e2fsprogs build'
          git push origin HEAD:codex/d1-01-reproducible-qemu-substrate
