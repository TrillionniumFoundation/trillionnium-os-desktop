name: d1-nls-utf8-patch

on:
  push:
    branches:
      - codex/d1-01-reproducible-qemu-substrate
    paths:
      - .github/workflows/d1-nls-utf8-patch.yml

permissions:
  contents: write

concurrency:
  group: d1-nls-utf8-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d1-01-reproducible-qemu-substrate
          fetch-depth: 0

      - name: Apply exact e2fsprogs locale contract
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/d1-nls-utf8-patch.py
          git rm \
            .github/d1-nls-utf8-patch.py \
            .github/workflows/d1-nls-utf8-patch.yml
          git diff --check
          bash -n tools/build_pinned_e2fsprogs.sh
          python3 tests/d1/test_d1_tool_binding.py
          python3 tools/validate_repository.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: initialize UTF-8 locale in exact e2fsprogs build'
          git push origin HEAD:codex/d1-01-reproducible-qemu-substrate
