name: d0a02-child-crash-patch

on:
  push:
    branches:
      - codex/d0a02-headed-runtime-v3
    paths:
      - .github/workflows/d0a02-child-crash-patch.yml
      - .github/d0a02-child-crash-patch.py

permissions:
  contents: write

concurrency:
  group: d0a02-child-crash-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d0a02-headed-runtime-v3
          fetch-depth: 0

      - name: Replace caught script panic with external child-process crash marker
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/d0a02-child-crash-patch.py
          git rm .github/d0a02-child-crash-patch.py
          git diff --check
          grep -q 'content-crash-ready' experiments/servo-headed-runtime/src/main.rs
          ! grep -q 'ServoTestUtils.panic' experiments/servo-headed-runtime/src/main.rs
          ! grep -q 'dom_servo_helpers_enabled' experiments/servo-headed-runtime/src/main.rs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: expose exact content-process crash boundary'
          git push origin HEAD:codex/d0a02-headed-runtime-v3
