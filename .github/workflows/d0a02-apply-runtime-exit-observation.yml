name: d0a02-apply-runtime-exit-observation

on:
  push:
    branches:
      - codex/d0a02-headed-runtime-v3
    paths:
      - .github/workflows/d0a02-apply-runtime-exit-observation.yml
      - tools/patch_d0a02_runtime_exit_observation.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: d0a02-apply-runtime-exit-observation
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact package branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/d0a02-headed-runtime-v3
          fetch-depth: 0
          persist-credentials: true

      - name: Install exact Servo formatting toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt

      - name: Apply bounded process-exit observation repair
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_d0a02_runtime_exit_observation.py
          rustfmt +1.97.1 --edition 2024 \
            experiments/servo-headed-runtime/src/main.rs \
            runtime/servo/hepta_workspace_runtime.rs

      - name: Commit exact repaired source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- \
              experiments/servo-headed-runtime/src/main.rs \
              runtime/servo/hepta_workspace_runtime.rs; then
            echo 'D0A-02 runtime repair already materialized'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            experiments/servo-headed-runtime/src/main.rs \
            runtime/servo/hepta_workspace_runtime.rs
          git commit -m 'fix: observe exact Servo content-process termination'
          git push origin HEAD:codex/d0a02-headed-runtime-v3
