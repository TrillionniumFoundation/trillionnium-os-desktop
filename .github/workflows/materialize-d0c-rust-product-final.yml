name: materialize-d0c-rust-product-final

on:
  push:
    branches:
      - codex/d0c-rust-product-v1
    paths:
      - .github/workflows/materialize-d0c-rust-product-final.yml

permissions:
  contents: write

jobs:
  materialize-test-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d0c-rust-product-v1
          fetch-depth: 0
      - name: Run deterministic materializer
        run: bash tools/materialize_d0c_rust_product.sh
