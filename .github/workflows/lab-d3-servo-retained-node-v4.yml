name: lab-d3-servo-retained-node-v4

'on':
  push:
    branches: [codex/d3-servo-retained-node-action-v4]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab-d3-servo-retained-node-v4-${{ github.ref }}
  cancel-in-progress: false

env:
  SERVO_COMMIT: 670ae8a70801b162e186f81cbb5bdd2d59c39108
  MANIFEST_PATH: manifests/lab-d3-servo-retained-node-action.v1.json

jobs:
  qualify-exact-pin-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out carrier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: carrier
          persist-credentials: false

      - name: Check out exact Servo pin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: servo/servo
          ref: ${{ env.SERVO_COMMIT }}
          path: servo
          persist-credentials: false

      - name: Verify and apply immutable patch
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C servo rev-parse HEAD)" = "$SERVO_COMMIT"
          test -z "$(git -C servo status --porcelain=v1)"
          test "$(jq -r '.carrier_branch' "carrier/$MANIFEST_PATH")" = "$GITHUB_REF_NAME"
          test "$(jq -r '.carrier_base_commit' "carrier/$MANIFEST_PATH")" = \
            "3a35ac470435edc4514cf4826cd5de817562f465"
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          lock = tomllib.loads(Path("servo/Cargo.lock").read_text())
          versions = sorted(p["version"] for p in lock["package"] if p["name"] == "accesskit")
          if versions != ["0.24.0"]:
              raise SystemExit(f"unexpected AccessKit versions: {versions}")
          PY
          python3 carrier/tools/verify_d3_servo_patch.py \
            --manifest "carrier/$MANIFEST_PATH" \
            --root carrier \
            --output "$RUNNER_TEMP/d3-servo.patch" \
            | tee "$RUNNER_TEMP/verification.json"
          git -C servo apply --check "$RUNNER_TEMP/d3-servo.patch"
          git -C servo apply "$RUNNER_TEMP/d3-servo.patch"
          git -C servo diff --name-only | sort > "$RUNNER_TEMP/changed.txt"
          jq -r '.patch.allowed_paths[]' "carrier/$MANIFEST_PATH" | sort > "$RUNNER_TEMP/allowed.txt"
          cmp "$RUNNER_TEMP/allowed.txt" "$RUNNER_TEMP/changed.txt"
          ! grep -R -F "TODO(#4344): Forward action to Servo" \
            servo/ports/servoshell/desktop/headed_window.rs
          git -C servo diff --check

      - name: Set up Servo Python
        uses: ./servo/.github/actions/setup-python
        with:
          python-version-file-path: servo/.python-version

      - name: Bootstrap pinned toolchain
        shell: bash
        working-directory: servo
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -qy tshark shellcheck
          ./mach bootstrap --yes --skip-lints --skip-nextest
          rustc --version --verbose | tee "$RUNNER_TEMP/rustc-version.txt"
          cargo --version --verbose | tee "$RUNNER_TEMP/cargo-version.txt"
          test "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" = "1.97.1"

      - name: Normalize and compile exact dependency graph
        id: compile
        shell: bash
        working-directory: servo
        env:
          CARGO_INCREMENTAL: '0'
          LIBCLANG_PATH: /usr/lib/llvm-14/lib
          RUSTFLAGS: -D warnings
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          git diff --name-only | sort > "$RUNNER_TEMP/changed-formatted.txt"
          cmp "$RUNNER_TEMP/allowed.txt" "$RUNNER_TEMP/changed-formatted.txt"
          git diff --binary > "$RUNNER_TEMP/formatted.patch"
          cargo check --locked -p servoshell --no-default-features \
            --features bundled,gamepad,js_jit,max_log_level \
            2>&1 | tee "$RUNNER_TEMP/cargo-check.log"

      - name: Export source-only evidence
        if: always()
        shell: bash
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/d3-servo-evidence"
          mkdir -p "$out"
          cp "carrier/$MANIFEST_PATH" "$out/manifest.json"
          for item in d3-servo.patch formatted.patch verification.json changed.txt \
            changed-formatted.txt allowed.txt rustc-version.txt cargo-version.txt cargo-check.log; do
            test ! -f "$RUNNER_TEMP/$item" || cp "$RUNNER_TEMP/$item" "$out/$item"
          done
          jq -n \
            --arg carrier "$GITHUB_SHA" \
            --arg servo "$SERVO_COMMIT" \
            --arg verify "$VERIFY_OUTCOME" \
            --arg compile "$COMPILE_OUTCOME" \
            '{
              schema:"trillionnium.desktop.d3-servo-retained-node.v1",
              claim_ceiling:"exact-pin-source-apply-format-and-compile-only",
              carrier_commit:$carrier,
              servo_commit:$servo,
              verify_outcome:$verify,
              compile_outcome:$compile,
              accesskit_action_target_field:"target_node",
              typed_terminal_result_implemented:true,
              retained_node_lookup_implemented:true,
              same_script_task_lookup_and_dispatch:true,
              forbidden_fallback_present:false,
              installed_runtime_proven:false,
              independent_replay_proven:false,
              protected_environment_approval_proven:false,
              physical_hardware_proven:false,
              hsm_signing_proven:false,
              d3_promoted:false
            }' > "$out/evidence.json"
          find "$out" -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 sha256sum > "$out/SHA256SUMS"

      - name: Upload exact-pin evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d3-servo-retained-node-v4-${{ github.sha }}
          path: ${{ runner.temp }}/d3-servo-evidence
          if-no-files-found: error
          retention-days: 14
