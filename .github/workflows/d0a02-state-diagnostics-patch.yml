name: d0a02-state-diagnostics-brace-fix

on:
  push:
    branches:
      - codex/d0a02-headed-runtime-v3
    paths:
      - .github/workflows/d0a02-state-diagnostics-patch.yml

permissions:
  contents: write

concurrency:
  group: d0a02-state-diagnostics-brace-fix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d0a02-headed-runtime-v3
          fetch-depth: 0

      - name: Escape diagnostic JSON braces and remove the one-shot patcher
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('experiments/servo-headed-runtime/src/main.rs')
          source = path.read_text()
          old_open = '                "{\\n",\n'
          new_open = '                "{{\\n",\n'
          old_close = '                "}\\n"\n'
          new_close = '                "}}\\n"\n'
          if source.count(old_open) != 1:
              raise SystemExit(f'expected exactly one unescaped opening diagnostic brace, found {source.count(old_open)}')
          if source.count(old_close) != 1:
              raise SystemExit(f'expected exactly one unescaped closing diagnostic brace, found {source.count(old_close)}')
          source = source.replace(old_open, new_open).replace(old_close, new_close)
          path.write_text(source)
          PY
          git diff --check
          git rm .github/workflows/d0a02-state-diagnostics-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add experiments/servo-headed-runtime/src/main.rs
          git commit -m 'fix: escape D0A-02 diagnostic JSON braces'
          git push origin HEAD:codex/d0a02-headed-runtime-v3
