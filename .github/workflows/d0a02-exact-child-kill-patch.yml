name: d0a02-exact-child-kill-patch

on:
  push:
    branches:
      - codex/d0a02-headed-runtime-v3
    paths:
      - .github/workflows/d0a02-exact-child-kill-patch.yml
      - .github/d0a02-exact-child-kill-patch.py

permissions:
  contents: write

concurrency:
  group: d0a02-exact-child-kill-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d0a02-headed-runtime-v3
          fetch-depth: 0

      - name: Apply exact direct content-process kill boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/d0a02-exact-child-kill-patch.py
          git rm .github/d0a02-exact-child-kill-patch.py
          git diff --check
          grep -q 'exact_content_process_pid' experiments/servo-headed-runtime/src/main.rs
          grep -q '/bin/kill' experiments/servo-headed-runtime/src/main.rs
          ! grep -q 'ServoTestUtils.panic' experiments/servo-headed-runtime/src/main.rs
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: kill only the exact Servo content child'
          git push origin HEAD:codex/d0a02-headed-runtime-v3
