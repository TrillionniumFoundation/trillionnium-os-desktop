name: d1-rootfs-owner-fix

on:
  push:
    branches:
      - codex/d1-01-reproducible-qemu-substrate
    paths:
      - .github/workflows/d1-rootfs-owner-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d1-01-reproducible-qemu-substrate
          fetch-depth: 0
      - name: Normalize only builder-owned rootfs directories and symlinks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("packaging/debian/image/build-d1-image.sh")
          text = path.read_text(encoding="utf-8")

          old_commands = "  systemd-sysusers systemd-tmpfiles cmp diff readlink; do\n"
          new_commands = "  systemd-sysusers systemd-tmpfiles cmp diff readlink stat awk; do\n"
          if text.count(old_commands) != 1:
              raise SystemExit(
                  f"expected one command-list anchor, found {text.count(old_commands)}"
              )
          text = text.replace(old_commands, new_commands)

          anchor = 'mmdebstrap "${mmdebstrap_args[@]}" >"$logs/mmdebstrap.log" 2>&1\n\n'
          block = r'''mmdebstrap "${mmdebstrap_args[@]}" >"$logs/mmdebstrap.log" 2>&1

# GitHub-hosted sudo builds may leave mmdebstrap-created directory and symlink
# metadata owned by the invoking builder UID/GID. Target systemd-tmpfiles
# correctly rejects a rootfs whose trusted path parents are not guest root.
# Normalize only those metadata nodes. Never recursively chown regular files:
# that could erase package setuid bits or file capabilities.
builder_uid=${SUDO_UID:-0}
builder_gid=${SUDO_GID:-0}
if ! [[ "$builder_uid" =~ ^[0-9]+$ && "$builder_gid" =~ ^[0-9]+$ ]]; then
  echo "invalid sudo builder identity: uid=$builder_uid gid=$builder_gid" >&2
  exit 1
fi
if (( builder_uid != 0 )); then
  if awk -F: -v id="$builder_uid" '$3 == id { found = 1 } END { exit found ? 0 : 1 }' \
      "$rootfs/etc/passwd"; then
    echo "builder UID $builder_uid collides with a guest account" >&2
    exit 1
  fi
  unexpected_uid_node=$(find "$rootfs" -xdev -uid "$builder_uid" \
    ! -type d ! -type l -print -quit)
  if [[ -n "$unexpected_uid_node" ]]; then
    echo "refusing to rewrite builder-owned non-metadata node: $unexpected_uid_node" >&2
    exit 1
  fi
  find "$rootfs" -xdev -uid "$builder_uid" \( -type d -o -type l \) \
    -exec chown --no-dereference 0 {} +
fi
if (( builder_gid != 0 )); then
  if awk -F: -v id="$builder_gid" '$3 == id { found = 1 } END { exit found ? 0 : 1 }' \
      "$rootfs/etc/group"; then
    echo "builder GID $builder_gid collides with a guest group" >&2
    exit 1
  fi
  unexpected_gid_node=$(find "$rootfs" -xdev -gid "$builder_gid" \
    ! -type d ! -type l -print -quit)
  if [[ -n "$unexpected_gid_node" ]]; then
    echo "refusing to rewrite builder-group-owned non-metadata node: $unexpected_gid_node" >&2
    exit 1
  fi
  find "$rootfs" -xdev -gid "$builder_gid" \( -type d -o -type l \) \
    -exec chgrp --no-dereference 0 {} +
fi
for trusted_path in "$rootfs" "$rootfs/etc" "$rootfs/run" "$rootfs/usr" "$rootfs/var"; do
  [[ -d "$trusted_path" && ! -L "$trusted_path" ]] || {
    echo "required trusted rootfs directory is missing or unsafe: $trusted_path" >&2
    exit 1
  }
  [[ $(stat -c '%u:%g' "$trusted_path") == 0:0 ]] || {
    echo "trusted rootfs directory is not guest-root-owned: $trusted_path" >&2
    exit 1
  }
done

'''
          if text.count(anchor) != 1:
              raise SystemExit(f"expected one mmdebstrap anchor, found {text.count(anchor)}")
          text = text.replace(anchor, block)
          path.write_text(text, encoding="utf-8")
          PY
          rm .github/workflows/d1-rootfs-owner-fix.yml
          bash -n packaging/debian/image/build-d1-image.sh
          shellcheck -e SC2016,SC2054 packaging/debian/image/build-d1-image.sh
          grep -F 'unexpected_uid_node=$(find "$rootfs" -xdev -uid "$builder_uid"' \
            packaging/debian/image/build-d1-image.sh
          grep -F -- '-exec chown --no-dereference 0 {} +' \
            packaging/debian/image/build-d1-image.sh
          if grep -Eq 'chown[[:space:]]+-R' packaging/debian/image/build-d1-image.sh; then
            echo "recursive chown is forbidden in the D1 image builder" >&2
            exit 1
          fi
          git diff --check
      - name: Commit fail-closed ownership correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: normalize D1 rootfs builder ownership safely"
          git push origin HEAD:codex/d1-01-reproducible-qemu-substrate
