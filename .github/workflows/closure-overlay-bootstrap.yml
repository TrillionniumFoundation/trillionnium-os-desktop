name: closure-overlay-bootstrap

on:
  push:
    branches:
      - codex/d4-d7-authority-runtime-v1

permissions:
  contents: write

concurrency:
  group: closure-overlay-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-validate-and-self-remove:
    if: "${{ github.event.head_commit.message == 'chore: stage verified one-shot closure overlay' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact bootstrap head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/d4-d7-authority-runtime-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact bootstrap ancestry and reconstruct overlay
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "553331cf13ec2b6efc390d5d3a00ff8c9e4cd713"
          git merge-base --is-ancestor \
            f44837a6867b134fb329d14407e3ae918ed74a4b \
            HEAD
          for index in 00 01 02 03 04 05 06 07; do
            test -f ".closure-bootstrap/patch.part.${index}"
          done
          cat \
            .closure-bootstrap/patch.part.00 \
            .closure-bootstrap/patch.part.01 \
            .closure-bootstrap/patch.part.02 \
            .closure-bootstrap/patch.part.03 \
            .closure-bootstrap/patch.part.04 \
            .closure-bootstrap/patch.part.05 \
            .closure-bootstrap/patch.part.06 \
            .closure-bootstrap/patch.part.07 \
            > /tmp/closure-overlay.patch.xz.b64
          base64 --decode /tmp/closure-overlay.patch.xz.b64 > /tmp/closure-overlay.patch.xz
          printf '%s  %s\n' \
            '67b79657f6901434fa01fcd95bd76becd375e430d632be7d666436e16f21a9e1' \
            '/tmp/closure-overlay.patch.xz' \
            | sha256sum --check --strict -
          xz --decompress --stdout /tmp/closure-overlay.patch.xz > /tmp/closure-overlay.patch
          git apply --check --binary /tmp/closure-overlay.patch
          git apply --binary /tmp/closure-overlay.patch
          rm -rf .closure-bootstrap .github/workflows/closure-overlay-bootstrap.yml
          test ! -e .closure-bootstrap
          test ! -e .github/workflows/closure-overlay-bootstrap.yml
          git diff --check

      - name: Apply exact Rust closure fixes without weakening policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          authority_path = Path("apps/hepta-browserd/src/authority_coordinator.rs")
          authority = authority_path.read_text(encoding="utf-8")
          authority_old = '            signer_key_sha256: "d".repeat(64),'
          authority_new = '''            signer_key_sha256: registry
              .key_id("fixture-update-manifest")
              .expect("fixture update manifest key")
              .to_owned(),'''
          if authority.count(authority_old) != 1:
              raise SystemExit("authority signer fixture anchor drifted")
          authority_path.write_text(
              authority.replace(authority_old, authority_new),
              encoding="utf-8",
          )

          policy_path = Path("apps/hepta-browserd/src/product_policy.rs")
          policy = policy_path.read_text(encoding="utf-8")
          policy_pattern = re.compile(
              r'\.expect_err\("observation signature binds peer"\)'
              r'(\s*\.code\(\),\s*)'
              r'"EVIDENCE_AUTHENTICATION_FAILED"'
          )
          policy, replacements = policy_pattern.subn(
              r'.expect_err("observation evidence binds peer")'
              r'\1"EVIDENCE_BINDING_MISMATCH"',
              policy,
          )
          if replacements != 1:
              raise SystemExit(
                  f"network observation error-precedence anchor drifted: {replacements} matches"
              )
          policy_path.write_text(policy, encoding="utf-8")
          PY
          git diff --check

      - name: Validate Python, governance, D7 and source inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          python3 tools/validate_d0t03_source.py
          python3 tools/validate_governance_integrity.py
          python3 tools/validate_late_stage_source_packages.py
          python3 tools/ab_update_reference.py \
            --contract contracts/recovery-update-reconciliation.v1.json \
            --write-result /tmp/ab-update-result.json \
            | tee /tmp/ab-update-stdout.json
          cmp /tmp/ab-update-result.json /tmp/ab-update-stdout.json
          python3 -m unittest discover -s tests -t . -p 'test_*.py'
          git diff --check

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.93.0
          rustc --version --verbose
          cargo --version --verbose

      - name: Validate complete Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo run --locked -p hepta-browserd -- --self-check

      - name: Publish one clean atomic source commit
        shell: bash
        run: |
          set -euo pipefail
          git clean -fdX
          test ! -e .closure-bootstrap
          test ! -e .github/workflows/closure-overlay-bootstrap.yml
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(d4-d7): bind authority evidence and make transitions atomic'
          git push origin HEAD:codex/d4-d7-authority-runtime-v1
