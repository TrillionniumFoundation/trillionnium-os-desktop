name: temporary-d2i-promote-v3

on:
  push:
    branches:
      - codex/d2i-apply-v3-proof

permissions:
  contents: write

concurrency:
  group: temporary-d2i-promote-v3
  cancel-in-progress: false

jobs:
  prove-and-promote:
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      PYTHONDONTWRITEBYTECODE: "1"
      TARGET_BRANCH: codex/full-gap-closure-final
    steps:
      - name: Check out exact proved D2I branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/d2i-apply-v3-proof
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize the candidate tree without temporary machinery
        run: |
          set -euo pipefail
          test ! -e .github/workflows/temporary-d2i-apply-v3.yml
          test ! -e tools/temporary-d2i-fix-v3.patch.xz.b85
          rm .github/workflows/temporary-d2i-promote-v3.yml
          git add -u -- .github/workflows/temporary-d2i-promote-v3.yml
          git fetch --no-tags origin "$TARGET_BRANCH"
          base=$(git rev-parse "origin/$TARGET_BRANCH")
          printf 'BASE_SHA=%s\n' "$base" >> "$GITHUB_ENV"
          actual=$(git diff --name-only "$base" -- | sort)
          expected=$(printf '%s\n' \
            contracts/d2i-integrated-image.v1.json \
            experiments/servo-headed-runtime/src/main.rs \
            packaging/debian/image/d2i-overlay/etc/systemd/system/trillionnium-d2i-runtime.service \
            packaging/debian/image/d2i-overlay/usr/local/libexec/trillionnium-d2i-acceptance \
            tests/d1/test_d2i_renderer_policy.py | sort)
          test "$actual" = "$expected"
          git diff --check "$base" --

      - name: Install pinned repository toolchain
        run: |
          set -euo pipefail
          channel=$(python3 - <<'PY'
          from pathlib import Path
          import tomllib
          print(tomllib.loads(Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])
          PY
          )
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustup override set "$channel"

      - name: Re-prove source truth and all Rust feature graphs
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 tools/verify_systemd_socket_custody.py
          python3 -m unittest discover -s tests -t . -p 'test_*.py'
          python3 -m json.tool contracts/d2i-integrated-image.v1.json >/dev/null
          bash -n packaging/debian/image/d2i-overlay/usr/local/libexec/trillionnium-d2i-acceptance
          rustfmt --edition 2024 --check experiments/servo-headed-runtime/src/main.rs
          cargo fmt --all --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-targets --all-features --locked

      - name: Publish one clean commit whose parent is the live unified candidate
        run: |
          set -euo pipefail
          current=$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')
          test "$current" = "$BASE_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: remove temporary D2I v3 promotion workflow"
          clean_head=$(git rev-parse HEAD)
          clean_tree=$(git rev-parse HEAD^{tree})
          test ! -e .github/workflows/temporary-d2i-promote-v3.yml
          test ! -e .github/workflows/temporary-d2i-apply-v3.yml
          test ! -e tools/temporary-d2i-fix-v3.patch.xz.b85
          new_commit=$(printf '%s\n' \
            'fix(d2i): constrain llvmpipe and bind image-local input evidence' | \
            git commit-tree "$clean_tree" -p "$BASE_SHA")
          test "$(git rev-parse "$new_commit^{tree}")" = "$clean_tree"
          test "$(git show -s --format=%P "$new_commit")" = "$BASE_SHA"
          git push origin "$clean_head:refs/heads/codex/d2i-apply-v3-proof"
          git push origin "$new_commit:refs/heads/$TARGET_BRANCH"
