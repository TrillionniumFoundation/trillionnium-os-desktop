name: agent-transport-reference

on:
  pull_request:
    paths:
      - ".github/workflows/agent-transport-reference.yml"
      - "contracts/agent-transport.v1.json"
      - "contracts/golden/agent-transport-request.v1.json"
      - "docs/evidence/generated/d0c02-agent-transport-reference-result.json"
      - "tools/agent_transport_reference.py"
      - "tests/transport/test_agent_transport_reference.py"
      - "tools/validate_project_truth.py"
      - "tools/validate_repository.py"
      - "manifests/project-state.v1.json"
      - "manifests/gates.v1.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/agent-transport-reference.yml"
      - "contracts/agent-transport.v1.json"
      - "contracts/golden/agent-transport-request.v1.json"
      - "docs/evidence/generated/d0c02-agent-transport-reference-result.json"
      - "tools/agent_transport_reference.py"
      - "tests/transport/test_agent_transport_reference.py"
      - "tools/validate_project_truth.py"
      - "tools/validate_repository.py"
      - "manifests/project-state.v1.json"
      - "manifests/gates.v1.json"

permissions:
  contents: read

jobs:
  reference-exact-head:
    name: reference-exact-head
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          subject_tree="$(git rev-parse 'HEAD^{tree}')"
          test -n "$subject_tree"
          printf 'evidence_class=exact_head\nsubject_sha=%s\nsubject_tree=%s\n' \
            "$EXPECTED_HEAD" "$subject_tree" | tee /tmp/d0c02-subject.txt

      - name: Validate project truth
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py

      - name: Compile Python sources
        run: >-
          python3 -m py_compile
          tools/agent_transport_reference.py
          tests/transport/test_agent_transport_reference.py

      - name: Run independent fault vectors
        run: >-
          python3 -m unittest discover
          -s tests/transport
          -p 'test_*.py'
          -v

      - name: Regenerate deterministic evidence
        run: |
          set -euo pipefail
          python3 tools/agent_transport_reference.py \
            --contract contracts/agent-transport.v1.json \
            --write-vector /tmp/agent-transport-request.v1.json \
            --write-result /tmp/d0c02-agent-transport-reference-result.json \
            >/tmp/agent-transport-reference.stdout.json
          cmp /tmp/agent-transport-request.v1.json \
            contracts/golden/agent-transport-request.v1.json
          cmp /tmp/d0c02-agent-transport-reference-result.json \
            docs/evidence/generated/d0c02-agent-transport-reference-result.json
          sha256sum /tmp/agent-transport-request.v1.json \
            /tmp/d0c02-agent-transport-reference-result.json \
            | tee /tmp/d0c02-output-digests.txt

      - name: Confirm listener, evidence lifecycle and semantic ceilings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          def reject_constant(value: str) -> object:
              raise ValueError(f"non-JSON numeric constant: {value}")

          def load(path: str) -> object:
              return json.loads(
                  Path(path).read_text(encoding="utf-8"),
                  parse_constant=reject_constant,
              )

          contract = load("contracts/agent-transport.v1.json")
          result = load(
              "docs/evidence/generated/d0c02-agent-transport-reference-result.json"
          )
          assert contract["status"] == "HOST_VALIDATED_NO_LISTENER"
          assert contract["evidence_lifecycle"] == "STALE_EVIDENCE_REQUIRES_EXACT_HEAD_RERUN"
          assert contract["evidence_freshness"] == "STALE_EVIDENCE"
          assert contract["merge_ready"] is False
          assert contract["listener"] == {
              "enabled": False,
              "socket_path": None,
              "public_network": False,
          }
          assert contract["public_api"]["listener_type_exposed"] is False
          assert contract["public_api"]["raw_frame_types_exposed"] is False
          assert contract["public_api"]["nonce_source_trait_exposed"] is False
          assert contract["public_api"]["deterministic_nonce_source_exposed"] is False
          assert result["status"] == "PASS"
          assert result["product_listener_created"] is False
          assert result["browser_payload_interpreted"] is False
          validation = contract["validation"]
          for field in (
              "cargo_fmt",
              "cargo_clippy",
              "cargo_test",
              "browserd_self_check",
          ):
              assert validation[field] == "PASS_HISTORICAL_BASELINE"
          assert validation["evidence_freshness"] == "STALE_EVIDENCE"
          assert validation["merge_ready"] is False
          assert contract["independent_reference"]["test_count"] == 15
          assert contract["independent_reference"]["product_listener_created"] is False
          assert contract["independent_reference"]["browser_payload_interpreted"] is False
          PY
          cat /tmp/d0c02-subject.txt /tmp/d0c02-output-digests.txt \
            >> "$GITHUB_STEP_SUMMARY"

  reference-prospective-merge:
    name: reference-prospective-merge
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out prospective merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 2
          persist-credentials: false

      - name: Verify merge identity against live branch refs
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-list --parents -n 1 HEAD | awk '{print NF}')" -eq 3
          live_base="$(git ls-remote origin "refs/heads/$BASE_REF" | awk 'NR == 1 {print $1}')"
          live_head="$(git ls-remote origin "refs/heads/$HEAD_REF" | awk 'NR == 1 {print $1}')"
          test -n "$live_base"
          test -n "$live_head"
          test "$live_head" = "$EVENT_HEAD"
          test "$(git rev-parse HEAD^1)" = "$live_base"
          test "$(git rev-parse HEAD^2)" = "$live_head"
          merge_sha="$(git rev-parse HEAD)"
          merge_tree="$(git rev-parse 'HEAD^{tree}')"
          printf 'evidence_class=prospective_merge\nsubject_sha=%s\nsubject_tree=%s\nbase_ref=%s\nbase_sha=%s\nhead_ref=%s\nhead_sha=%s\n' \
            "$merge_sha" "$merge_tree" "$BASE_REF" "$live_base" \
            "$HEAD_REF" "$live_head" | tee /tmp/d0c02-subject.txt

      - name: Validate prospective merge and reference corpus
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 -m py_compile \
            tools/agent_transport_reference.py \
            tests/transport/test_agent_transport_reference.py
          python3 -m unittest discover -s tests/transport -p 'test_*.py' -v
          python3 tools/agent_transport_reference.py \
            --contract contracts/agent-transport.v1.json \
            --write-vector /tmp/agent-transport-request.v1.json \
            --write-result /tmp/d0c02-agent-transport-reference-result.json \
            >/tmp/agent-transport-reference.stdout.json
          cmp /tmp/agent-transport-request.v1.json \
            contracts/golden/agent-transport-request.v1.json
          cmp /tmp/d0c02-agent-transport-reference-result.json \
            docs/evidence/generated/d0c02-agent-transport-reference-result.json
          sha256sum /tmp/agent-transport-request.v1.json \
            /tmp/d0c02-agent-transport-reference-result.json \
            | tee /tmp/d0c02-output-digests.txt
          cat /tmp/d0c02-subject.txt /tmp/d0c02-output-digests.txt \
            >> "$GITHUB_STEP_SUMMARY"
