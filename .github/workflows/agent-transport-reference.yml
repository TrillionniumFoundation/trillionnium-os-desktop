name: agent-transport-reference

on:
  pull_request:
    paths:
      - ".github/workflows/agent-transport-reference.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/hepta-agent-transport/**"
      - "contracts/agent-transport.v1.json"
      - "contracts/golden/agent-transport-request.v1.json"
      - "docs/evidence/generated/d0c02-agent-transport-reference-result.json"
      - "docs/evidence/generated/d0c02-rust193-host-result.json"
      - "docs/evidence/2026-08-28-d0c02-authenticated-uds.md"
      - "docs/plan/**"
      - "tools/agent_transport_reference.py"
      - "tests/transport/**"
      - "tools/validate_repository.py"
      - "tools/qualify_servo_exact_pin_evidence.py"
      - "tools/validate_project_truth.py"
      - "manifests/cargo-external-allowlist.json"
      - "manifests/repository-state.json"
      - "manifests/project-state.v1.json"
      - "manifests/gates.v1.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/agent-transport-reference.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/hepta-agent-transport/**"
      - "contracts/agent-transport.v1.json"
      - "contracts/golden/agent-transport-request.v1.json"
      - "docs/evidence/generated/d0c02-agent-transport-reference-result.json"
      - "docs/evidence/generated/d0c02-rust193-host-result.json"
      - "docs/evidence/2026-08-28-d0c02-authenticated-uds.md"
      - "docs/plan/**"
      - "tools/agent_transport_reference.py"
      - "tests/transport/**"
      - "tools/validate_repository.py"
      - "tools/qualify_servo_exact_pin_evidence.py"
      - "tools/validate_project_truth.py"
      - "manifests/cargo-external-allowlist.json"
      - "manifests/repository-state.json"
      - "manifests/project-state.v1.json"
      - "manifests/gates.v1.json"

permissions:
  contents: read

jobs:
  reference-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install exact locked Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 - <<'PY'
          from pathlib import Path
          import tomllib
          print(tomllib.loads(Path('rust-toolchain.toml').read_text())['toolchain']['channel'])
          PY
          )"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustup override set "$channel"
          rustc --version --verbose
          cargo --version --verbose

      - name: Run exact locked Rust transport gate
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --locked -p hepta-agent-transport --all-targets
          cargo clippy --locked -p hepta-agent-transport --all-targets -- -D warnings
          cargo test --locked -p hepta-agent-transport --all-targets

      - name: Validate project truth
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py

      - name: Compile Python sources
        run: >-
          python3 -m py_compile
          tools/agent_transport_reference.py
          tests/transport/test_agent_transport_reference.py

      - name: Run independent fault vectors
        run: >-
          python3 -m unittest discover
          -s tests/transport
          -p 'test_*.py'
          -v

      - name: Regenerate deterministic evidence
        run: |
          set -euo pipefail
          python3 tools/agent_transport_reference.py \
            --contract contracts/agent-transport.v1.json \
            --write-vector /tmp/agent-transport-request.v1.json \
            --write-result /tmp/d0c02-agent-transport-reference-result.json \
            >/tmp/agent-transport-reference.stdout.json
          cmp /tmp/agent-transport-request.v1.json \
            contracts/golden/agent-transport-request.v1.json
          cmp /tmp/d0c02-agent-transport-reference-result.json \
            docs/evidence/generated/d0c02-agent-transport-reference-result.json

      - name: Confirm listener and semantic ceilings
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          contract = json.loads(Path("contracts/agent-transport.v1.json").read_text())
          result = json.loads(
              Path(
                  "docs/evidence/generated/d0c02-agent-transport-reference-result.json"
              ).read_text()
          )
          # Capability status is independent from freshness.  Historical host
          # evidence keeps the bounded transport capability while the
          # freshness fields below block promotion until an exact-head rerun.
          assert contract["status"] == "HOST_VALIDATED_NO_LISTENER"
          assert contract["listener"] == {
              "enabled": False,
              "socket_path": None,
              "public_network": False,
          }
          assert result["status"] == "PASS"
          assert result["product_listener_created"] is False
          assert result["browser_payload_interpreted"] is False
          assert contract["validation"]["cargo_fmt"] == "PASS"
          assert contract["validation"]["cargo_test"] == "PASS_25_RUST_TESTS"
          assert contract["validation"]["browserd_self_check"] == "PASS"
          assert contract.get("evidence_lifecycle") == "STALE_EVIDENCE_REQUIRES_EXACT_HEAD_RERUN"
          assert contract.get("evidence_freshness") == "STALE_EVIDENCE"
          assert contract.get("merge_ready") is False
          assert contract["validation"]["evidence_freshness"] == "STALE_EVIDENCE"
          assert contract["validation"]["merge_ready"] is False
          assert "786debc12aa8d790b231397c1a3341fbf89de080" in contract["validation"]["stale_reason"]
          PY
