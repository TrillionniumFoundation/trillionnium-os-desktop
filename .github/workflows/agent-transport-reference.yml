name: agent-transport-reference

on:
  pull_request:
    paths:
      - ".github/workflows/agent-transport-reference.yml"
      - ".github/workflows/agent-port-custody.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/hepta-agent-transport/**"
      - "crates/hepta-agent-port/**"
      - "crates/hepta-peer-attestation/**"
      - "contracts/agent-transport.v1.json"
      - "contracts/agent-port-bridge.v1.json"
      - "contracts/agent-port-custody.v1.json"
      - "contracts/request-peer-custody.v1.json"
      - "contracts/golden/agent-transport-request.v1.json"
      - "docs/architecture/AUTHENTICATED_AGENT_TRANSPORT.md"
      - "docs/architecture/REQUEST_PEER_CUSTODY.md"
      - "docs/evidence/generated/d0c02-*.json"
      - "tools/agent_transport_reference.py"
      - "tests/transport/**"
      - "tests/test_request_peer_custody.py"
      - "tools/validate_repository.py"
      - "tools/validate_project_truth.py"
      - "manifests/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent-transport-reference.yml"
      - ".github/workflows/agent-port-custody.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "crates/hepta-agent-transport/**"
      - "crates/hepta-agent-port/**"
      - "crates/hepta-peer-attestation/**"
      - "contracts/agent-transport.v1.json"
      - "contracts/agent-port-bridge.v1.json"
      - "contracts/agent-port-custody.v1.json"
      - "contracts/request-peer-custody.v1.json"
      - "contracts/golden/agent-transport-request.v1.json"
      - "docs/architecture/AUTHENTICATED_AGENT_TRANSPORT.md"
      - "docs/architecture/REQUEST_PEER_CUSTODY.md"
      - "docs/evidence/generated/d0c02-*.json"
      - "tools/agent_transport_reference.py"
      - "tests/transport/**"
      - "tests/test_request_peer_custody.py"
      - "tools/validate_repository.py"
      - "tools/validate_project_truth.py"
      - "manifests/**"

permissions:
  contents: read

concurrency:
  group: agent-transport-reference-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-source:
    name: exact-source-transport-custody
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Assert exact source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git rev-parse HEAD^{tree}
      - name: Install exact locked Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.93.0
      - name: Run repository and complete Rust gates
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          cargo fmt --all --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
      - name: Run independent transport and custody regressions
        run: |
          set -euo pipefail
          python3 -m py_compile tools/agent_transport_reference.py tests/transport/test_agent_transport_reference.py tests/test_request_peer_custody.py
          python3 -m unittest discover -s tests/transport -p 'test_*.py' -v
          python3 -m unittest tests.test_request_peer_custody -v
      - name: Regenerate deterministic transport evidence
        run: |
          set -euo pipefail
          python3 tools/agent_transport_reference.py --contract contracts/agent-transport.v1.json --write-vector /tmp/agent-transport-request.v1.json --write-result /tmp/d0c02-agent-transport-reference-result.json >/tmp/agent-transport-reference.stdout.json
          cmp /tmp/agent-transport-request.v1.json contracts/golden/agent-transport-request.v1.json
          cmp /tmp/d0c02-agent-transport-reference-result.json docs/evidence/generated/d0c02-agent-transport-reference-result.json
      - name: Enforce connected-stream claim ceiling
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path('contracts/agent-transport.v1.json').read_text())
          result = json.loads(Path('docs/evidence/generated/d0c02-agent-transport-reference-result.json').read_text())
          assert contract['status'] == 'HOST_VALIDATED_NO_LISTENER'
          assert contract['listener'] == {'enabled': False, 'socket_path': None, 'public_network': False}
          assert contract['evidence_lifecycle'] == 'STALE_EVIDENCE_REQUIRES_EXACT_HEAD_RERUN'
          assert contract['evidence_freshness'] == 'STALE_EVIDENCE'
          assert contract['merge_ready'] is False
          assert result['status'] == 'PASS'
          assert result['product_listener_created'] is False
          assert result['browser_payload_interpreted'] is False
          PY

  prospective-merge:
    name: prospective-merge-transport-custody
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out live prospective merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 2
          persist-credentials: false
      - name: Bind merge parents to live refs
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git check-ref-format --branch "$BASE_REF"
          test "$PR_NUMBER" -gt 0
          base_sha=$(git ls-remote --exit-code origin "refs/heads/${BASE_REF}" | awk 'NR == 1 {print $1}')
          head_sha=$(git ls-remote --exit-code origin "refs/pull/${PR_NUMBER}/head" | awk 'NR == 1 {print $1}')
          test -n "$base_sha" && test -n "$head_sha"
          test "$(git rev-list --parents -n1 HEAD | awk '{print NF - 1}')" -eq 2
          test "$(git rev-parse HEAD^1)" = "$base_sha"
          test "$(git rev-parse HEAD^2)" = "$head_sha"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Install exact locked Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.93.0
      - name: Run repository and complete Rust gates
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          cargo fmt --all --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
      - name: Run independent transport and custody regressions
        run: |
          set -euo pipefail
          python3 -m py_compile tools/agent_transport_reference.py tests/transport/test_agent_transport_reference.py tests/test_request_peer_custody.py
          python3 -m unittest discover -s tests/transport -p 'test_*.py' -v
          python3 -m unittest tests.test_request_peer_custody -v
      - name: Regenerate deterministic transport evidence
        run: |
          set -euo pipefail
          python3 tools/agent_transport_reference.py --contract contracts/agent-transport.v1.json --write-vector /tmp/agent-transport-request.v1.json --write-result /tmp/d0c02-agent-transport-reference-result.json >/tmp/agent-transport-reference.stdout.json
          cmp /tmp/agent-transport-request.v1.json contracts/golden/agent-transport-request.v1.json
          cmp /tmp/d0c02-agent-transport-reference-result.json docs/evidence/generated/d0c02-agent-transport-reference-result.json
      - name: Enforce connected-stream claim ceiling
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path('contracts/agent-transport.v1.json').read_text())
          result = json.loads(Path('docs/evidence/generated/d0c02-agent-transport-reference-result.json').read_text())
          assert contract['status'] == 'HOST_VALIDATED_NO_LISTENER'
          assert contract['listener'] == {'enabled': False, 'socket_path': None, 'public_network': False}
          assert contract['evidence_lifecycle'] == 'STALE_EVIDENCE_REQUIRES_EXACT_HEAD_RERUN'
          assert contract['evidence_freshness'] == 'STALE_EVIDENCE'
          assert contract['merge_ready'] is False
          assert result['status'] == 'PASS'
          assert result['product_listener_created'] is False
          assert result['browser_payload_interpreted'] is False
          PY
