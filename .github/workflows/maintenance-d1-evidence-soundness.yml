name: maintenance-d1-evidence-soundness

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/maintenance-d1-evidence-soundness.yml"

permissions:
  contents: write

concurrency:
  group: maintenance-d1-evidence-soundness
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact D1 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/d1-01-current-main-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Apply and validate ordinary source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch --no-tags origin codex/d1-01-current-main-v2
          test "$(git rev-parse HEAD)" = \
            "$(git rev-parse origin/codex/d1-01-current-main-v2)"
          python3 tools/maintenance_patch_d1_evidence.py
          rm tools/maintenance_patch_d1_evidence.py

          python3 -m py_compile \
            tools/compare_d1_builds.py \
            tools/d1_rootfs_manifest.py \
            tools/finalize_d1_evidence.py \
            tools/verify_d1_artifact.py \
            tests/d1/test_d1_evidence_soundness.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          json.loads(Path('manifests/gates.v1.json').read_text())
          PY
          bash -n \
            packaging/debian/image/build-d1-image.sh \
            tools/run_d1_final_qualification.sh
          shellcheck -e SC2016,SC2054 \
            packaging/debian/image/build-d1-image.sh \
            tools/run_d1_final_qualification.sh
          git diff --check

      - name: Commit stable source-only patch
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          test -n "$(git status --porcelain=v1)"
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "source transaction attempted to mutate a workflow" >&2
            exit 1
          fi
          git commit -m "build(d1): harden reproducibility and evidence binding"
          git push origin HEAD:codex/d1-01-current-main-v2
