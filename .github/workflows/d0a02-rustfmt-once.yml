name: d0a02-rustfmt-once

on:
  push:
    branches:
      - codex/d0a02-headed-runtime-v3
    paths:
      - .github/workflows/d0a02-rustfmt-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d0a02-headed-runtime-v3
          fetch-depth: 0
      - name: Format product runtime with Servo exact-pin toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          RUSTUP_TOOLCHAIN=1.97.1 rustfmt \
            --edition 2024 \
            experiments/servo-headed-runtime/src/main.rs
          RUSTUP_TOOLCHAIN=1.97.1 rustfmt \
            --edition 2024 \
            --check \
            experiments/servo-headed-runtime/src/main.rs
          rm .github/workflows/d0a02-rustfmt-once.yml
          git diff --check
      - name: Commit formatted product runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: format headed Servo runtime with exact toolchain"
          git push origin HEAD:codex/d0a02-headed-runtime-v3
