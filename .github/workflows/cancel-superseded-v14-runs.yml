name: cancel-superseded-v14-runs

on:
  push:
    branches:
      - codex/v14-object-import-3c73e5a2
    paths:
      - ".github/workflows/cancel-superseded-v14-runs.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: cancel-superseded-v14-runs
  cancel-in-progress: false

jobs:
  cancel:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Cancel only superseded v14 exact-head runs
        env:
          GH_TOKEN: ${{ github.token }}
          SUPERSEDED_HEAD: 364503d41b6c02656e7361e948d78dfa5612ec30
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          if repo != "TrillionniumFoundation/trillionnium-os-desktop":
              raise SystemExit("wrong repository")
          head = os.environ["SUPERSEDED_HEAD"]
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "Content-Type": "application/json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "trillionnium-cancel-superseded-v14",
          }

          def get_runs():
              query = urllib.parse.urlencode({"head_sha": head, "per_page": 100, "page": 1})
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/runs?{query}", headers=headers
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response).get("workflow_runs", [])

          def cancel(run_id):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/cancel",
                  data=b"{}",
                  method="POST",
                  headers=headers,
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      if response.status not in (202, 204):
                          raise RuntimeError(f"unexpected status {response.status}")
              except urllib.error.HTTPError as error:
                  if error.code == 409:
                      return False
                  raise
              print(f"cancelled superseded v14 run {run_id}", flush=True)
              return True

          cancelled = []
          for _ in range(50):
              stale = [run for run in get_runs() if run.get("head_sha") == head and run.get("status") != "completed"]
              if not stale:
                  break
              for run in stale:
                  if cancel(run["id"]):
                      cancelled.append(run["id"])
              time.sleep(1)
          else:
              raise SystemExit("v14 cancellation did not converge")

          remaining = [
              {"id": run["id"], "status": run.get("status")}
              for run in get_runs()
              if run.get("head_sha") == head and run.get("status") != "completed"
          ]
          if remaining:
              raise SystemExit("superseded v14 runs remain: " + json.dumps(remaining))
          print(json.dumps({"superseded_head": head, "cancelled": cancelled, "remaining": remaining}, sort_keys=True))
          PY
