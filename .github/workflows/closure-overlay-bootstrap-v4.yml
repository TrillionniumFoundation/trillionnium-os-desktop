name: closure-overlay-bootstrap-v4

on:
  push:
    branches:
      - codex/d4-d7-authority-runtime-v1

permissions:
  contents: write

concurrency:
  group: closure-overlay-bootstrap-v4-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile-validate-and-self-remove:
    if: "${{ github.event.head_commit.message == 'chore: stage verified one-shot closure overlay' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact current head with complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/d4-d7-authority-runtime-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Reconcile verified overlay and remove every bootstrap surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          if test -d .closure-bootstrap; then
            git merge-base --is-ancestor f44837a6867b134fb329d14407e3ae918ed74a4b HEAD
            for index in 00 01 02 03 04 05 06 07; do
              test -f ".closure-bootstrap/patch.part.${index}"
            done
            cat .closure-bootstrap/patch.part.{00,01,02,03,04,05,06,07} > /tmp/closure-overlay.patch.xz.b64
            base64 --decode /tmp/closure-overlay.patch.xz.b64 > /tmp/closure-overlay.patch.xz
            printf '%s  %s\n' '67b79657f6901434fa01fcd95bd76becd375e430d632be7d666436e16f21a9e1' '/tmp/closure-overlay.patch.xz' | sha256sum --check --strict -
            xz --decompress --stdout /tmp/closure-overlay.patch.xz > /tmp/closure-overlay.patch
            git apply --check --binary /tmp/closure-overlay.patch
            git apply --binary /tmp/closure-overlay.patch
          fi
          rm -rf .closure-bootstrap
          find .github/workflows -maxdepth 1 -type f -name 'closure-overlay-bootstrap*.yml' -delete
          test ! -e .closure-bootstrap
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'closure-overlay-bootstrap*.yml' -print -quit)"
          git diff --check

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.93.0
          rustc --version --verbose
          cargo --version --verbose

      - name: Normalize and validate complete source tree
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          python3 tools/validate_repository.py
          python3 tools/validate_d0t03_source.py
          python3 tools/validate_governance_integrity.py
          python3 tools/validate_late_stage_source_packages.py
          python3 tools/ab_update_reference.py self-test
          python3 -m unittest discover -s tests -t . -p 'test_*.py'
          cargo fmt --all -- --check
          cargo fix --workspace --all-targets --locked --allow-dirty --allow-staged
          cargo clippy --fix --workspace --all-targets --locked --allow-dirty --allow-staged -- -D warnings
          cargo fmt --all
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo run --locked -p hepta-browserd -- --self-check
          cargo fmt --all -- --check
          git diff --check

      - name: Publish one clean atomic commit with lease protection
        shell: bash
        run: |
          set -euo pipefail
          git clean -fdX
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(d4-d7): bind authority evidence and make transitions atomic'
          git push --force-with-lease="refs/heads/codex/d4-d7-authority-runtime-v1:$GITHUB_SHA" origin HEAD:codex/d4-d7-authority-runtime-v1