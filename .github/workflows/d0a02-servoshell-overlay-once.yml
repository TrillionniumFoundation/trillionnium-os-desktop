name: d0a02-servoshell-overlay-once

on:
  push:
    branches:
      - codex/d0a02-headed-runtime-v3
    paths:
      - .github/workflows/d0a02-servoshell-overlay-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d0a02-headed-runtime-v3
          fetch-depth: 0
      - name: Move runtime overlay to dependency-complete servoshell package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('experiments/servo-headed-runtime/src/main.rs')
          text = source.read_text()
          text = text.replace('use tracing::warn;\n', '')
          old = '''        if let Err(error) = self.0.send_event(AppEvent::Wake) {
              warn!(?error, "failed to wake D0A-02 event loop");
          }
          '''
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines()) + '\n'
          new = '''        if let Err(error) = self.0.send_event(AppEvent::Wake) {
              eprintln!("failed to wake D0A-02 event loop: {error}");
          }
          '''
          new = '\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines()) + '\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one waker warning block, got {text.count(old)}')
          source.write_text(text.replace(old, new))

          workflow = Path('.github/workflows/servo-headed-runtime.yml')
          text = workflow.read_text()
          replacements = {
              'rustfmt --check experiments/servo-headed-runtime/src/main.rs':
                  'rustfmt --edition 2024 --check experiments/servo-headed-runtime/src/main.rs',
              'servo-source/components/servo/examples/trillionnium_headed_runtime.rs':
                  'servo-source/ports/servoshell/examples/trillionnium_headed_runtime.rs',
              'servo-source/components/servo/examples/trillionnium_headed_fixture.html':
                  'servo-source/ports/servoshell/examples/trillionnium_headed_fixture.html',
              '-p servo --example trillionnium_headed_runtime \\\n':
                  '-p servoshell --example trillionnium_headed_runtime \\\n            --no-default-features --features bundled,js_jit,max_log_level \\\n',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if old.startswith('-p servo'):
                  if count != 2:
                      raise SystemExit(f'expected two Servo cargo target anchors, got {count}')
              elif count < 1:
                  raise SystemExit(f'missing workflow anchor: {old!r}')
              text = text.replace(old, new)
          workflow.write_text(text)
          PY
          rm .github/workflows/d0a02-servoshell-overlay-once.yml
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          RUSTUP_TOOLCHAIN=1.97.1 rustfmt --edition 2024 \
            experiments/servo-headed-runtime/src/main.rs
          RUSTUP_TOOLCHAIN=1.97.1 rustfmt --edition 2024 --check \
            experiments/servo-headed-runtime/src/main.rs
          git diff --check
      - name: Commit servoshell runtime overlay correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: host headed runtime in exact-pin servoshell package"
          git push origin HEAD:codex/d0a02-headed-runtime-v3
