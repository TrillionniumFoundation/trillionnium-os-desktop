name: d0a02-servoshell-overlay-once

on:
  push:
    branches:
      - codex/d0a02-headed-runtime-v3
    paths:
      - .github/workflows/d0a02-servoshell-overlay-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d0a02-headed-runtime-v3
          fetch-depth: 0
      - name: Remove optional tracing dependency from product runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('experiments/servo-headed-runtime/src/main.rs')
          text = source.read_text()
          if text.count('use tracing::warn;\n') != 1:
              raise SystemExit('expected one tracing warn import')
          text = text.replace('use tracing::warn;\n', '')
          old = 'warn!(?error, "failed to wake D0A-02 event loop");'
          new = 'eprintln!("failed to wake D0A-02 event loop: {error}");'
          if text.count(old) != 1:
              raise SystemExit(f'expected one waker warning macro, got {text.count(old)}')
          source.write_text(text.replace(old, new))
          PY
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          RUSTUP_TOOLCHAIN=1.97.1 rustfmt --edition 2024 \
            experiments/servo-headed-runtime/src/main.rs
          RUSTUP_TOOLCHAIN=1.97.1 rustfmt --edition 2024 --check \
            experiments/servo-headed-runtime/src/main.rs
          git diff --check
      - name: Commit source-only correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/servo-headed-runtime/src/main.rs
          git commit -m "build: remove optional tracing dependency from headed runtime"
          git push origin HEAD:codex/d0a02-headed-runtime-v3
