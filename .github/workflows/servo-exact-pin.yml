name: servo-exact-pin-compile

on:
  pull_request:
    paths:
      - "manifests/servo.lock.json"
      - "manifests/servo-embedder-compat.json"
      - "experiments/servo-embedder-probe/**"
      - "tools/qualify_servo_exact_pin.py"
      - "docs/evidence/generated/servo-probe-result.json"
      - ".github/workflows/servo-exact-pin.yml"
  push:
    branches: [main]
    paths:
      - "manifests/servo.lock.json"
      - "manifests/servo-embedder-compat.json"
      - "experiments/servo-embedder-probe/**"
      - "tools/qualify_servo_exact_pin.py"
      - "docs/evidence/generated/servo-probe-result.json"
      - ".github/workflows/servo-exact-pin.yml"

permissions:
  contents: read

jobs:
  compile-exact-pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install Servo Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake build-essential ccache clang cmake curl git gperf \
            libasound2-dev libavcodec-dev libavdevice-dev libavfilter-dev \
            libavformat-dev libavutil-dev libdbus-1-dev libegl1-mesa-dev \
            libfontconfig1-dev libfreetype6-dev libgl1-mesa-dev \
            libgles2-mesa-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer1.0-dev libharfbuzz-dev libpulse-dev libssl-dev \
            libudev-dev libunwind-dev libwayland-dev libx11-dev \
            libx11-xcb-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxi-dev libxkbcommon-dev libxrandr-dev \
            llvm-dev mold nasm ninja-build pkg-config python3 python3-dev \
            python3-pip xorg-dev

      - name: Fetch exact clean Servo pin
        shell: bash
        run: |
          set -euo pipefail
          git init /tmp/servo
          git -C /tmp/servo remote add origin https://github.com/servo/servo.git
          git -C /tmp/servo fetch --depth=1 origin 670ae8a70801b162e186f81cbb5bdd2d59c39108
          git -C /tmp/servo checkout --detach FETCH_HEAD
          test "$(git -C /tmp/servo rev-parse HEAD)" = \
            "670ae8a70801b162e186f81cbb5bdd2d59c39108"
          test -z "$(git -C /tmp/servo status --porcelain=v1)"

      - name: Install Servo-declared Rust toolchain exactly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/servo-toolchain.env
          import shlex, tomllib
          data = tomllib.load(open('/tmp/servo/rust-toolchain.toml', 'rb'))['toolchain']
          print('CHANNEL=' + shlex.quote(data['channel']))
          print('COMPONENTS=' + shlex.quote(' '.join(data.get('components', []))))
          print('TARGETS=' + shlex.quote(' '.join(data.get('targets', []))))
          PY
          source /tmp/servo-toolchain.env
          args=(toolchain install "$CHANNEL" --profile minimal --no-self-update)
          for component in $COMPONENTS; do args+=(--component "$component"); done
          for target in $TARGETS; do args+=(--target "$target"); done
          rustup "${args[@]}"
          rustup override set "$CHANNEL" --path /tmp/servo

      - name: Rebuild exact qualification outputs
        env:
          CARGO_TERM_COLOR: always
          CARGO_INCREMENTAL: "0"
          RUST_BACKTRACE: "1"
        run: |
          set -euo pipefail
          python3 tools/qualify_servo_exact_pin.py \
            --servo-root /tmp/servo \
            --output-manifest /tmp/servo-embedder-compat.json \
            --output-result /tmp/servo-probe-result.json \
            --output-probe /tmp/servo-api-probe.rs \
            --logs /tmp/servo-exact-pin-logs

      - name: Compare immutable generated API contract
        shell: bash
        run: |
          set -euo pipefail
          cmp /tmp/servo-embedder-compat.json manifests/servo-embedder-compat.json
          cmp /tmp/servo-api-probe.rs experiments/servo-embedder-probe/src/main.rs
          python3 - <<'PY'
          import json
          from pathlib import Path
          generated = json.loads(Path('/tmp/servo-probe-result.json').read_text())
          checked = json.loads(Path('docs/evidence/generated/servo-probe-result.json').read_text())
          for key in ('schema', 'status', 'servo_commit', 'servo_toolchain_channel',
                      'checks', 'manifest_sha256', 'probe_sha256', 'claims', 'merge_ready'):
              assert generated[key] == checked[key], (key, generated[key], checked[key])
          assert generated['status'] == 'PASS_COMPILE_COMPATIBILITY_ONLY'
          assert generated['merge_ready'] is True
          assert not any(generated['claims'].values())
          PY

      - name: Keep product regressions green
        run: |
          python3 tools/validate_repository.py
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo run --locked -p hepta-browserd -- --self-check
