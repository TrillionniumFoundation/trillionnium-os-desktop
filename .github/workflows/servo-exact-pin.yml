name: servo-exact-pin

on:
  pull_request:
    paths:
      - ".github/workflows/servo-exact-pin.yml"
      # Keep these patterns aligned with D0A-01's registry globs so a newly
      # added qualification helper or Servo lock cannot bypass the gate.
      - "tools/qualify_servo_exact_pin*"
      - "tools/validate_project_truth.py"
      - "tools/validate_repository.py"
      - "experiments/servo-embedder-probe/**"
      - "manifests/servo*.json"
      - "contracts/gate-evidence-envelope.v1.schema.json"
      - "tools/gate_evidence_envelope.py"
      - "manifests/project-state.v1.json"
      - "manifests/gates.v1.json"
      - "docs/architecture/SERVO_EMBEDDER_COMPATIBILITY.md"
      - "docs/evidence/2026-08-29-d0a01-servo-exact-pin.md"
      - "docs/evidence/generated/d0a01-*.json"
      - "docs/plan/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/servo-exact-pin.yml"
      - "tools/qualify_servo_exact_pin*"
      - "tools/validate_project_truth.py"
      - "tools/validate_repository.py"
      - "experiments/servo-embedder-probe/**"
      - "manifests/servo*.json"
      - "contracts/gate-evidence-envelope.v1.schema.json"
      - "tools/gate_evidence_envelope.py"
      - "manifests/project-state.v1.json"
      - "manifests/gates.v1.json"
      - "docs/architecture/SERVO_EMBEDDER_COMPATIBILITY.md"
      - "docs/evidence/2026-08-29-d0a01-servo-exact-pin.md"
      - "docs/evidence/generated/d0a01-*.json"
      - "docs/plan/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: servo-exact-pin-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVO_COMMIT: 670ae8a70801b162e186f81cbb5bdd2d59c39108
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Check out TrillionniumOS Desktop candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # The identity helper must see both synthetic-merge parents.  A
          # depth-1 checkout records the merge object but hides its parents.
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact desktop Git identity
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          EVENT_BEFORE: ${{ github.event.before || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_REF_NAME: ${{ github.ref_name }}
        run: python3 tools/qualify_servo_exact_pin_identity.py

      - name: Check out exact Servo source pin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: servo/servo
          ref: ${{ env.SERVO_COMMIT }}
          path: servo-source
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Verify exact immutable Servo checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C servo-source rev-parse HEAD)" = "$SERVO_COMMIT"
          test -z "$(git -C servo-source status --porcelain=v1)"
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path('tools').resolve()))
          from gate_evidence_envelope import load_json_strict
          def read_json(path):
              with path.open('r', encoding='utf-8') as stream:
                  return load_json_strict(stream)
          lock = read_json(Path('manifests/servo.lock.json'))
          requirements = read_json(Path('manifests/servo-api-requirements.v2.json'))
          ledger = read_json(Path('manifests/servo-patch-ledger.v1.json'))
          expected = '670ae8a70801b162e186f81cbb5bdd2d59c39108'
          assert lock['commit'] == expected
          assert requirements['servo_commit'] == expected
          assert ledger['servo_commit'] == expected
          assert ledger['patch_count'] == 0 and ledger['patches'] == []
          PY

      - name: Install Servo Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' \
            servo-source/python/servo/platform/linux_packages/apt/apt_common.txt \
            servo-source/python/servo/platform/linux_packages/apt/apt_ubuntu_only.txt \
            | sort -u > /tmp/servo-packages.txt
          sudo apt-get update
          xargs -r sudo apt-get install -y --no-install-recommends < /tmp/servo-packages.txt
          sudo apt-get purge -y fonts-droid-fallback || true

      - name: Install exact Servo Rust channel and compile-required components
        shell: bash
        run: |
          set -euo pipefail
          SERVO_RUST_CHANNEL="$(python3 - <<'PY'
          from pathlib import Path
          import tomllib
          toolchain = tomllib.loads(Path('servo-source/rust-toolchain.toml').read_text())['toolchain']
          print(toolchain['channel'])
          PY
          )"
          SERVO_DECLARED_COMPONENTS="$(python3 - <<'PY'
          from pathlib import Path
          import tomllib
          toolchain = tomllib.loads(Path('servo-source/rust-toolchain.toml').read_text())['toolchain']
          print(' '.join(toolchain.get('components', [])))
          PY
          )"
          SERVO_GATE_COMPONENTS="rustfmt"
          {
            printf 'SERVO_RUST_CHANNEL=%s\n' "$SERVO_RUST_CHANNEL"
            printf 'SERVO_DECLARED_COMPONENTS=%s\n' "$SERVO_DECLARED_COMPONENTS"
            printf 'SERVO_GATE_COMPONENTS=%s\n' "$SERVO_GATE_COMPONENTS"
          } >> "$GITHUB_ENV"
          rustup toolchain install "$SERVO_RUST_CHANNEL" --profile minimal
          for component in $SERVO_GATE_COMPONENTS; do
            rustup component add "$component" --toolchain "$SERVO_RUST_CHANNEL"
          done
          export RUSTUP_TOOLCHAIN="$SERVO_RUST_CHANNEL"
          rustc --version --verbose
          cargo --version --verbose
          rustfmt --version

      - name: Restore exact-pin Cargo and target cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            servo-source/target
          key: servo-${{ runner.os }}-${{ env.SERVO_COMMIT }}-${{ hashFiles('servo-source/Cargo.lock', 'servo-source/rust-toolchain.toml') }}
          restore-keys: |
            servo-${{ runner.os }}-${{ env.SERVO_COMMIT }}-

      - name: Check Trillionnium probe formatting
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/qualify_servo_exact_pin.py \
            tools/qualify_servo_exact_pin_v3.py \
            tools/qualify_servo_exact_pin_identity.py \
            tools/qualify_servo_exact_pin_evidence.py \
            tools/gate_evidence_envelope.py
          export RUSTUP_TOOLCHAIN="$SERVO_RUST_CHANNEL"
          rustfmt --check experiments/servo-embedder-probe/src/main.rs

      - name: Compile official shell and public embedder probes
        shell: bash
        run: |
          set -euo pipefail
          export RUSTUP_TOOLCHAIN="$SERVO_RUST_CHANNEL"
          mkdir -p artifacts/servo-qualification/logs
          python3 tools/qualify_servo_exact_pin_v3.py \
            --servo-root servo-source \
            --requirements manifests/servo-api-requirements.v2.json \
            --patch-ledger manifests/servo-patch-ledger.v1.json \
            --probe-source experiments/servo-embedder-probe/src/main.rs \
            --output artifacts/servo-qualification/servo-qualification-result.json \
            --logs artifacts/servo-qualification/logs \
            2>&1 | tee artifacts/servo-qualification/report.stdout.json

      - name: Bind declared and gate-installed toolchain components
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, os, sys
          sys.path.insert(0, str(Path('tools').resolve()))
          from gate_evidence_envelope import load_json_strict
          def read_json(path):
              with path.open('r', encoding='utf-8') as stream:
                  return load_json_strict(stream)
          path = Path('artifacts/servo-qualification/servo-qualification-result.json')
          report = read_json(path)
          declared = os.environ['SERVO_DECLARED_COMPONENTS'].split()
          installed = os.environ['SERVO_GATE_COMPONENTS'].split()
          report['toolchain']['gate_installed_components'] = sorted(installed)
          report['toolchain']['declared_components_not_required_by_gate'] = sorted(
              set(declared) - set(installed)
          )
          path.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          print(json.dumps(report['toolchain'], indent=2, sort_keys=True))
          PY

      - name: Enforce qualification claim ceiling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path('tools').resolve()))
          from gate_evidence_envelope import load_json_strict
          def read_json(path):
              with path.open('r', encoding='utf-8') as stream:
                  return load_json_strict(stream)
          report = read_json(Path('artifacts/servo-qualification/servo-qualification-result.json'))
          assert report['status'] == 'PASS_COMPILE_COMPATIBILITY_ONLY'
          assert report['servo']['commit'] == '670ae8a70801b162e186f81cbb5bdd2d59c39108'
          assert report['servo']['clean_checkout'] is True
          assert report['servo']['patch_count'] == 0
          assert report['toolchain']['gate_installed_components'] == ['rustfmt']
          assert 'rustc-dev' in report['toolchain']['declared_components_not_required_by_gate']
          assert all(item['status'] == 'PASS' for item in report['compile_results'].values())
          assert all(value is False for value in report['claims'].values())
          assert report['next_gate'].startswith('D0A-02')
          PY
          test -z "$(git -C servo-source status --porcelain=v1)"

      - name: Emit and validate generic gate evidence envelope
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/qualify_servo_exact_pin_evidence.py \
            --qualification-result artifacts/servo-qualification/servo-qualification-result.json \
            --output artifacts/servo-qualification/gate-evidence-envelope.json

      - name: Validate desktop repository contracts in a tracked-only tree
        shell: bash
        run: |
          set -euo pipefail
          validation_root="$RUNNER_TEMP/trillionnium-repository-validation"
          rm -rf "$validation_root"
          mkdir -p "$validation_root"
          git archive --format=tar HEAD | tar -xf - -C "$validation_root"
          python3 "$validation_root/tools/validate_repository.py"
          python3 "$validation_root/tools/validate_project_truth.py"

      - name: Upload exact-pin qualification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: servo-exact-pin-${{ github.sha }}
          path: artifacts/servo-qualification
          if-no-files-found: warn
          retention-days: 30
