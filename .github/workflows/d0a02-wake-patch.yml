name: d0a02-wake-patch

on:
  push:
    branches:
      - codex/d0a02-headed-runtime-v3
    paths:
      - .github/workflows/d0a02-wake-patch.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: d0a02-wake-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d0a02-headed-runtime-v3
          fetch-depth: 0

      - name: Wake driver after asynchronous delegate state transitions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('experiments/servo-headed-runtime/src/main.rs')
          source = path.read_text()

          def block(lines):
              return '\n'.join(lines) + '\n'

          replacements = [
              (
                  block([
                      '            state',
                      '                .input_handled_callbacks',
                      '                .set(state.input_handled_callbacks.get() + 1);',
                  ]),
                  block([
                      '            state',
                      '                .input_handled_callbacks',
                      '                .set(state.input_handled_callbacks.get() + 1);',
                      '            let _ = state.proxy.send_event(AppEvent::Drive);',
                  ]),
              ),
              (
                  block([
                      '            *state.crash_reason.borrow_mut() = Some(reason);',
                      '            state.window.request_redraw();',
                  ]),
                  block([
                      '            *state.crash_reason.borrow_mut() = Some(reason);',
                      '            state.window.request_redraw();',
                      '            let _ = state.proxy.send_event(AppEvent::Drive);',
                  ]),
              ),
              (
                  block([
                      '                request.deny();',
                      '            }',
                      '        } else {',
                  ]),
                  block([
                      '                request.deny();',
                      '            }',
                      '            let _ = state.proxy.send_event(AppEvent::Drive);',
                      '        } else {',
                  ]),
              ),
              (
                  block([
                      '        if let Some(state) = self.state.upgrade() {',
                      '            state.popup_denied.set(state.popup_denied.get() + 1);',
                      '        }',
                      '        // Dropping the request returns no auxiliary WebView.',
                  ]),
                  block([
                      '        if let Some(state) = self.state.upgrade() {',
                      '            state.popup_denied.set(state.popup_denied.get() + 1);',
                      '            let _ = state.proxy.send_event(AppEvent::Drive);',
                      '        }',
                      '        // Dropping the request returns no auxiliary WebView.',
                  ]),
              ),
              (
                  block([
                      '                state',
                      '                    .input_method_controls',
                      '                    .set(state.input_method_controls.get() + 1);',
                      '            }',
                      '        }',
                  ]),
                  block([
                      '                state',
                      '                    .input_method_controls',
                      '                    .set(state.input_method_controls.get() + 1);',
                      '            }',
                      '            let _ = state.proxy.send_event(AppEvent::Drive);',
                      '        }',
                  ]),
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected one delegate transition anchor, found {count}')
              source = source.replace(old, new)

          path.write_text(source)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add experiments/servo-headed-runtime/src/main.rs
          git commit -m 'fix: wake headed runtime after delegate transitions'
          git push origin HEAD:codex/d0a02-headed-runtime-v3
