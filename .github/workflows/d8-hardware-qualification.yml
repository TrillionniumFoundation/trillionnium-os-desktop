name: d8-hardware-qualification

on:
  pull_request:
    branches:
      - main
      - codex/d7-recovery-update-reconciliation-v1
  push:
    branches:
      - main
      - codex/d8-hardware-qualification-verifier-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d8-hardware-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hardware_evidence_reference:
    name: d8-hardware-evidence-verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record exact Git identity
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          git show -s --format='%P' HEAD

      - name: Compile dependency-free verifier and corpus
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/trusted_app_bundle.py \
            tools/hardware_evidence_verifier.py \
            tools/hardware_verification_receipt.py \
            tests/d8/test_hardware_evidence_verifier.py

      - name: Run format, identity, artifact, threshold, and anti-forgery corpus
        run: |
          set -euo pipefail
          python3 -m unittest discover \
            -s tests/d8 \
            -p 'test_*.py' \
            -v

      - name: Generate bounded fixture-only source evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts/d8-hardware-qualification
          python3 tools/hardware_evidence_verifier.py self-test \
            --contract contracts/hardware-beta-qualification.v1.json \
            --write-result artifacts/d8-hardware-qualification/reference-result.json \
            | tee artifacts/d8-hardware-qualification/reference-result.stdout.json
          cmp \
            artifacts/d8-hardware-qualification/reference-result.json \
            artifacts/d8-hardware-qualification/reference-result.stdout.json

      - name: Validate repository and committed project truth
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py

      - name: Enforce D8 source-only claim ceiling
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path('contracts/hardware-beta-qualification.v1.json').read_text())
          result = json.loads(Path('artifacts/d8-hardware-qualification/reference-result.json').read_text())
          assert contract['status'] == 'SOURCE_CANDIDATE_BLOCKED_UPSTREAM_D7'
          assert contract['claim_ceiling']['hardware_evidence_format_and_verifier'] is True
          for key in [
              'physical_hardware_run_completed',
              'independent_hardware_lab_signature_obtained',
              '24_hour_stability_completed',
              '72_hour_stability_completed',
              'power_loss_corpus_completed',
              'production_sbom_and_cve_process_reviewed',
              'hardware_beta_qualified',
              'release_ready',
          ]:
              assert contract['claim_ceiling'][key] is False, key
          assert result['status'] == 'PASS_SOURCE_REFERENCE_ONLY'
          assert result['fixture_verification_status'] == 'PASS_FIXTURE_FORMAT_ONLY'
          assert result['fixture_policy_eligible'] is False
          assert result['physical_hardware_run_completed'] is False
          assert result['independent_hardware_lab_signature_obtained'] is False
          assert result['stability_24h_completed'] is False
          assert result['stability_72h_completed'] is False
          assert result['power_loss_corpus_completed'] is False
          assert result['hardware_beta_qualified'] is False
          assert result['release_ready'] is False
          PY

      - name: Upload exact-head source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d8-hardware-qualification-${{ github.sha }}
          path: artifacts/d8-hardware-qualification
          if-no-files-found: warn
          retention-days: 30
