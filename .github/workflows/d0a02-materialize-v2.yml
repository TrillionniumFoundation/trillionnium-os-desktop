name: d0a02-materialize-v2

on:
  push:
    branches:
      - codex/d0a02-proof-soundness-v4
    paths:
      - ".github/workflows/d0a02-materialize-v2.yml"
      - "tools/materialize_d0a02_v2.py"
      - "tools/.d0a02-materialize/**"

permissions:
  contents: write

concurrency:
  group: d0a02-materialize-v2
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact materialization branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/d0a02-proof-soundness-v4
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize and verify final files
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/materialize_d0a02_v2.py
          python3 -m py_compile tools/materialize_d0a02_v2.py

      - name: Commit final source and erase bootstrap machinery
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            experiments/servo-headed-runtime/src/main.rs \
            experiments/servo-headed-runtime/fixture/index.html \
            .github/workflows/servo-headed-runtime.yml \
            docs/architecture/TRUSTED_WORKSPACE_COMPOSITION.md
          git rm -r \
            tools/.d0a02-materialize \
            tools/materialize_d0a02_v2.py \
            .github/workflows/d0a02-materialize-v2.yml
          git diff --cached --check
          git commit -m 'fix(d0a02): close causal generation topology and clipboard proof gaps'
          git push origin HEAD:codex/d0a02-proof-soundness-v4
