name: export-closure-source

on:
  push:
    branches: ["codex/full-gap-closure-v2"]
    paths:
      - ".github/export-closure-source.trigger"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/full-gap-closure-v2
          fetch-depth: 0
      - name: Record exact identity and package source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/closure-source
          git rev-parse HEAD > /tmp/closure-source/commit-sha.txt
          git rev-parse HEAD^{tree} > /tmp/closure-source/tree-sha.txt
          git archive --format=tar.gz --output=/tmp/closure-source/repository.tar.gz HEAD
          sha256sum /tmp/closure-source/repository.tar.gz > /tmp/closure-source/repository.tar.gz.sha256
      - name: Upload exact source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: closure-source-${{ github.sha }}
          path: /tmp/closure-source
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
