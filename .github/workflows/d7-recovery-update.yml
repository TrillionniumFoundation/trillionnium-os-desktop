name: d7-recovery-update

on:
  pull_request:
    branches:
      - main
      - codex/d6-capability-egress-policy-v1
  push:
    branches:
      - main
      - codex/d7-recovery-update-reconciliation-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d7-recovery-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery_update_reference:
    name: d7-recovery-update-reference
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record exact Git identity
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          git show -s --format='%P' HEAD

      - name: Compile dependency-free recovery models and corpora
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/trusted_app_bundle.py \
            tools/effect_reconciliation_reference.py \
            tools/ab_update_reference.py \
            tests/d7/test_effect_reconciliation_reference.py \
            tests/d7/test_ab_update_reference.py

      - name: Run no-replay effect journal corpus
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests/d7/test_effect_reconciliation_reference.py \
            -v

      - name: Run signed A/B update and power-loss corpus
        run: |
          set -euo pipefail
          python3 -m unittest \
            tests/d7/test_ab_update_reference.py \
            -v

      - name: Generate bounded source-only evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts/d7-recovery-update
          python3 tools/effect_reconciliation_reference.py \
            --contract contracts/recovery-update-reconciliation.v1.json \
            --write-result artifacts/d7-recovery-update/effect-result.json \
            | tee artifacts/d7-recovery-update/effect-result.stdout.json
          cmp \
            artifacts/d7-recovery-update/effect-result.json \
            artifacts/d7-recovery-update/effect-result.stdout.json
          python3 tools/ab_update_reference.py \
            --contract contracts/recovery-update-reconciliation.v1.json \
            --write-result artifacts/d7-recovery-update/update-result.json \
            | tee artifacts/d7-recovery-update/update-result.stdout.json
          cmp \
            artifacts/d7-recovery-update/update-result.json \
            artifacts/d7-recovery-update/update-result.stdout.json

      - name: Validate repository and committed project truth
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py

      - name: Enforce D7 source-only claim ceiling
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path('contracts/recovery-update-reconciliation.v1.json').read_text())
          effect = json.loads(Path('artifacts/d7-recovery-update/effect-result.json').read_text())
          update = json.loads(Path('artifacts/d7-recovery-update/update-result.json').read_text())
          assert contract['status'] == 'SOURCE_CANDIDATE_BLOCKED_UPSTREAM_D6'
          assert contract['claim_ceiling']['pure_effect_and_update_reference'] is True
          for key in [
              'external_effect_executor_integrated',
              'provider_reconciliation_integrated',
              'persistent_journal_integrated',
              'bootloader_slot_switch_integrated',
              'secure_rollback_counter_integrated',
              'production_update_key_enrolled',
              'production_recovery_key_enrolled',
              'offline_recovery_media_built',
              'power_loss_hardware_tested',
              'external_effects_enabled',
              'hardware_qualified',
              'release_ready',
          ]:
              assert contract['claim_ceiling'][key] is False, key
          assert effect['status'] == 'PASS_SOURCE_REFERENCE_ONLY'
          assert effect['automatic_replay_after_dispatch'] is False
          assert effect['external_effect_executor_integrated'] is False
          assert effect['external_effects_enabled'] is False
          assert update['status'] == 'PASS_SOURCE_REFERENCE_ONLY'
          assert update['active_slot_written_during_stage'] is False
          assert update['bootloader_slot_switch_integrated'] is False
          assert update['secure_rollback_counter_integrated'] is False
          assert update['production_update_key_enrolled'] is False
          assert update['offline_recovery_media_built'] is False
          assert update['network_used'] is False
          assert update['release_ready'] is False
          PY

      - name: Upload exact-head source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d7-recovery-update-${{ github.sha }}
          path: artifacts/d7-recovery-update
          if-no-files-found: warn
          retention-days: 30
