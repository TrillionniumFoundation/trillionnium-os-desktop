name: d1-procfs-patch

on:
  push:
    branches:
      - codex/d1-01-reproducible-qemu-substrate
    paths:
      - .github/workflows/d1-procfs-patch.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d1-01-reproducible-qemu-substrate
          fetch-depth: 0
      - name: Mount procfs while running target tmpfiles
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('packaging/debian/image/build-d1-image.sh')
          text = path.read_text(encoding='utf-8')
          old = 'chroot "$rootfs" /usr/bin/systemd-tmpfiles --create\n'
          new = '''install -d -m 0555 "$rootfs/proc"
mount --types proc proc "$rootfs/proc"
set +e
chroot "$rootfs" /usr/bin/systemd-tmpfiles --create
tmpfiles_status=$?
set -e
umount "$rootfs/proc"
if (( tmpfiles_status != 0 )); then
  exit "$tmpfiles_status"
fi
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one target tmpfiles command, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          bash -n packaging/debian/image/build-d1-image.sh
          git diff --check
      - name: Commit procfs build isolation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packaging/debian/image/build-d1-image.sh
          git commit -m "build: mount procfs for target Debian tmpfiles"
          git push origin HEAD:codex/d1-01-reproducible-qemu-substrate
