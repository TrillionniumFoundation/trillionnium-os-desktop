name: d1-materialize-gate-runner

on:
  push:
    branches:
      - codex/d1-01-current-main-v2
    paths:
      - ".github/workflows/d1-materialize-gate-runner.yml"

permissions:
  contents: write

concurrency:
  group: d1-materialize-gate-runner
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact D1 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/d1-01-current-main-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Extract reviewed run blocks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/d1-final-qualification.yml')
          output = Path('tools/run_d1_final_qualification.sh')
          steps = [
              ('Derive and validate exact Git identities', 'identities'),
              ('Install D1 host dependencies', 'install-deps'),
              ('Install exact repository Rust toolchain', 'install-rust'),
              ('Build isolated exact e2fsprogs toolchain', 'build-e2fsprogs'),
              ('Validate tracked source corpus', 'validate-source'),
              ('Prove product and qualification graphs are separate', 'prove-graphs'),
              ('Build and audit product and D1 qualification binaries', 'build-binaries'),
              ('Resolve signed closure, build twice, and qualify under QEMU', 'run-pipeline'),
              ('Enforce complete D1 evidence and claim ceiling', 'enforce-evidence'),
          ]
          lines = workflow.read_text(encoding='utf-8').splitlines()

          def extract(name: str) -> str:
              marker = f'      - name: {name}'
              try:
                  start = lines.index(marker)
              except ValueError as error:
                  raise SystemExit(f'missing D1 workflow step: {name}') from error
              run_line = None
              for index in range(start + 1, len(lines)):
                  if lines[index].startswith('      - name:'):
                      break
                  if lines[index] == '        run: |':
                      run_line = index
                      break
              if run_line is None:
                  raise SystemExit(f'D1 step has no literal run block: {name}')
              end = len(lines)
              for index in range(run_line + 1, len(lines)):
                  if lines[index].startswith('      - name:'):
                      end = index
                      break
              block = textwrap.dedent('\n'.join(lines[run_line + 1:end]).rstrip() + '\n')
              if not block.strip():
                  raise SystemExit(f'empty D1 run block: {name}')
              return block

          generated = [
              '#!/usr/bin/env bash',
              '# Permanent D1 qualification runner. It never mutates Git refs.',
              'set -euo pipefail',
              '',
          ]
          for name, command in steps:
              function = 'step_' + command.replace('-', '_')
              generated.extend([f'{function}() {{', extract(name).rstrip(), '}', ''])
          generated.append('case "${1:-}" in')
          for _, command in steps:
              function = 'step_' + command.replace('-', '_')
              generated.extend([f'  {command})', f'    {function}', '    ;;'])
          generated.extend([
              '  *)',
              '    printf \'unknown D1 gate command: %s\\n\' "${1:-}" >&2',
              '    exit 64',
              '    ;;',
              'esac',
              '',
          ])
          output.write_text('\n'.join(generated), encoding='utf-8')
          output.chmod(0o755)
          PY
          bash -n tools/run_d1_final_qualification.sh
          ! grep -Eq 'git[[:space:]]+push|gh[[:space:]]+workflow[[:space:]]+run' \
            tools/run_d1_final_qualification.sh
          git diff --check

      - name: Commit only permanent runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tools/run_d1_final_qualification.sh
          test "$(git diff --cached --name-only)" = tools/run_d1_final_qualification.sh
          git commit -m "ci(d1): extract permanent qualification runner"
          git push origin HEAD:codex/d1-01-current-main-v2
