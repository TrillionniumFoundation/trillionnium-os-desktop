name: d1-isolated-install-once

on:
  push:
    branches:
      - codex/d1-01-reproducible-qemu-substrate
    paths:
      - .github/workflows/d1-isolated-install-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: d1-isolated-install-once
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d1-01-reproducible-qemu-substrate
          fetch-depth: 0

      - name: Keep e2fsprogs install inside the reviewed prefix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/d1-qemu-v2.yml')
          source = path.read_text()
          old = (
              "          make -j2\n"
              "          make install\n"
              "          test -x \"$prefix/sbin/mke2fs\"\n"
          )
          new = (
              "          make -j2\n"
              "          make -C e2fsck install\n"
              "          make -C misc install\n"
              "          test -x \"$prefix/sbin/mke2fs\"\n"
          )
          if source.count(old) != 1:
              raise SystemExit(f'expected one full install block, found {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY
          rm .github/workflows/d1-isolated-install-once.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/d1-qemu-v2.yml .github/workflows/d1-isolated-install-once.yml
          git commit -m 'fix: isolate D1 e2fsprogs program install'
          git push origin HEAD:codex/d1-01-reproducible-qemu-substrate
