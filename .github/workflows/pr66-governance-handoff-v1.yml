name: pr66-governance-handoff-v1

on:
  push:
    branches:
      - codex/pr66-final-status-controller-v1
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: pr66-governance-handoff-v1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: TrillionniumFoundation/trillionnium-os-desktop
      PR_NUMBER: "66"
      EXPECTED_HEAD: 1e9ec3ce5746db0bafe5faf51fbcc0434b6dbca5
    steps:
      - name: Publish fail-closed labels and administration handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from typing import Any

          token = os.environ['GH_TOKEN']
          repo = os.environ['REPOSITORY']
          pr_number = int(os.environ['PR_NUMBER'])
          expected_head = os.environ['EXPECTED_HEAD']
          api = 'https://api.github.com'
          issue_marker = '<!-- d0t03-live-governance-handoff-v1 -->'

          def call(
              method: str,
              path: str,
              payload: Any | None = None,
              expected: tuple[int, ...] = (200,),
              optional: bool = False,
          ) -> tuple[int, Any]:
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(
                  api + '/' + path.lstrip('/'),
                  data=data,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                      'User-Agent': 'trillionnium-d0t03-handoff-v1',
                  },
                  method=method,
              )
              try:
                  with urllib.request.urlopen(req, timeout=45) as response:
                      status = response.status
                      raw = response.read()
              except urllib.error.HTTPError as exc:
                  status = exc.code
                  raw = exc.read()
              text = raw.decode('utf-8', errors='replace')
              try:
                  body = json.loads(text) if text else None
              except json.JSONDecodeError:
                  body = {'unparsed_tail': text[-1000:]}
              if status not in expected and not optional:
                  raise RuntimeError(f'{method} {path}: HTTP {status}: {body}')
              return status, body

          _, pr = call('GET', f'repos/{repo}/pulls/{pr_number}')
          if pr.get('state') != 'open' or pr.get('head', {}).get('sha') != expected_head:
              raise RuntimeError('PR #66 is no longer the frozen expected object')

          labels = {
              'exact-head-evidence': ('1D76DB', 'Exact candidate workflow evidence; not a higher-tier promotion'),
              'blocked-admin-governance': ('B60205', 'Requires live repository/organization Administration controls'),
              'blocked-independent-review': ('D93F0B', 'Requires two current-head independent human approvals'),
              'blocked-external-evidence': ('5319E7', 'Requires independently produced runtime, hardware, HSM, or release evidence'),
          }
          for label, (color, description) in labels.items():
              status, _ = call(
                  'POST', f'repos/{repo}/labels',
                  {'name': label, 'color': color, 'description': description},
                  expected=(201,), optional=True,
              )
              if status == 422:
                  call(
                      'PATCH', f'repos/{repo}/labels/{urllib.parse.quote(label, safe="")}',
                      {'new_name': label, 'color': color, 'description': description},
                      expected=(200,), optional=True,
                  )
          call(
              'POST', f'repos/{repo}/issues/{pr_number}/labels',
              {'labels': list(labels)}, expected=(200,)
          )

          title = '[D0T-03] Apply live governance and independent evidence controls'
          body = f'''{issue_marker}
          ## Frozen convergence dependency

          PR: #{pr_number}
          Expected head: `{expected_head}`

          This issue is an administration and independent-evidence handoff. It is not a source PASS record.

          ## Repository and organization controls

          - [ ] Protect `main`; disallow direct and force pushes and branch deletion, including for administrators.
          - [ ] Require strict current-base checks: `desktop-ci / repository-contracts`, `desktop-ci / rust`, and `governance-integrity / governance-integrity`.
          - [ ] Require two approvals, CODEOWNER review, stale-review dismissal, approval of the latest push, and conversation resolution.
          - [ ] Configure a real organization team for source custody; no user-only or author-controlled CODEOWNERS substitute.
          - [ ] Remove all user/team/app bypass allowances; disable auto-merge; retain squash-only normal merge.
          - [ ] Set Actions default permissions to read-only and prevent Actions from approving pull requests.
          - [ ] Protect `production` and release environments with independent reviewers and prevent self-review.
          - [ ] Execute positive and negative governance probes and preserve immutable readback evidence.

          ## Current-head review and integration

          - [ ] Obtain two independent non-author, non-source-author human approvals against the unchanged head.
          - [ ] Merge normally through the enforced controls; no self-merge, auto-merge, or administrator bypass.
          - [ ] Rerun all permanent workflows on exact `refs/heads/main` and promote machine truth only from that object.

          ## Higher evidence tiers

          - [ ] D3: Servo-owned retained-node semantic action plus independently attested exact-image principal/dispatch/receipt/fault corpus.
          - [ ] D4-D7: installed native interaction, trusted-app, capability/egress, effect-provider, update/rollback/recovery qualification.
          - [ ] D8: fixed-BOM 24/72-hour and repeated physical power-loss evidence with independent review.
          - [ ] D9: offline/HSM dual-control signing, separated roles, anti-rollback state, immutable artifacts, and protected publication.

          Chat-authored fields, fixtures, runner labels, QEMU results, bot reviews, and verifier self-tests cannot satisfy these checkboxes.
          '''
          body = '\n'.join(line.strip() for line in body.splitlines()).strip()

          _, issues = call(
              'GET', f'repos/{repo}/issues?state=all&per_page=100&sort=updated&direction=desc'
          )
          existing = next(
              (
                  issue for issue in issues
                  if isinstance(issue, dict)
                  and 'pull_request' not in issue
                  and issue_marker in str(issue.get('body', ''))
              ),
              None,
          )
          if existing is None:
              _, created = call(
                  'POST', f'repos/{repo}/issues',
                  {'title': title, 'body': body, 'labels': ['blocked-admin-governance', 'blocked-external-evidence']},
                  expected=(201,),
              )
              issue_number = created.get('number')
          else:
              issue_number = existing.get('number')
              call(
                  'PATCH', f'repos/{repo}/issues/{issue_number}',
                  {'title': title, 'body': body, 'state': 'open'},
              )

          call(
              'POST', f'repos/{repo}/pulls/{pr_number}/requested_reviewers',
              {'reviewers': ['Tomasrgbsf']}, expected=(201,), optional=True,
          )
          print(json.dumps({
              'status': 'HANDOFF_PUBLISHED',
              'pull_request': pr_number,
              'head_sha': expected_head,
              'handoff_issue': issue_number,
              'labels': list(labels),
          }, indent=2, sort_keys=True))
          PY
