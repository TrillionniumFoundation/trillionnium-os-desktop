name: d0t03-source-contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d0t03-source-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: d0t03-source-contract / validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source object without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate repository, governance source contract, and hostile corpus
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 tools/validate_d0t03_source.py
          python3 tools/validate_governance_integrity.py
          python3 -m unittest tests.test_d0t03_source -v

      - name: Emit bounded source-only evidence
        env:
          EVIDENCE_ROLE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'exact_main_source' || 'candidate_source' }}
          EVENT_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/d0t03-source
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import re
          import stat
          import subprocess

          def read_source_bytes(path):
              if path.is_absolute() or any(part in {'', '.', '..'} for part in path.parts):
                  raise SystemExit(f'unsafe source evidence path: {path}')
              current = Path('.')
              for part in path.parts:
                  current /= part
                  if current.is_symlink():
                      raise SystemExit(f'symlinked source evidence path: {path}')
              descriptor = os.open(
                  path,
                  os.O_RDONLY
                  | getattr(os, 'O_CLOEXEC', 0)
                  | getattr(os, 'O_NOFOLLOW', 0),
              )
              try:
                  if not stat.S_ISREG(os.fstat(descriptor).st_mode):
                      raise SystemExit(f'source evidence path is not a regular file: {path}')
                  with os.fdopen(descriptor, 'rb', closefd=True) as stream:
                      descriptor = None
                      return stream.read()
              finally:
                  if descriptor is not None:
                      os.close(descriptor)

          event_name = os.environ['GITHUB_EVENT_NAME']
          pr_number = os.environ.get('PR_NUMBER', '')
          pr_base_sha = os.environ.get('PR_BASE_SHA', '')
          pr_head_sha = os.environ.get('PR_HEAD_SHA', '')
          sha_pattern = re.compile(r'^[0-9a-f]{40}$')
          if event_name == 'pull_request':
              if (
                  not pr_number.isdigit()
                  or int(pr_number) < 1
                  or sha_pattern.fullmatch(pr_base_sha) is None
                  or sha_pattern.fullmatch(pr_head_sha) is None
              ):
                  raise SystemExit('pull-request source evidence identity is incomplete')
          elif pr_number or pr_base_sha or pr_head_sha:
              raise SystemExit('non-PR source evidence must not carry PR identity')

          inputs = [
              Path('.github/CODEOWNERS'),
              Path('.github/workflows/d0t03-source-contract.yml'),
              Path('.github/workflows/governance-integrity.yml'),
              Path('contracts/repository-governance.v1.json'),
              Path('manifests/repository-governance.v1.json'),
              Path('tools/validate_governance_integrity.py'),
              Path('tools/_validate_d0t03_source_impl.py'),
              Path('tools/validate_d0t03_source.py'),
              Path('tests/test_d0t03_source.py'),
              Path('docs/security/D0T03_REPOSITORY_GOVERNANCE.md'),
              Path('docs/release/D0T03_GOVERNANCE_BOOTSTRAP.md'),
          ]
          result = {
              'schema': 'trillionnium.desktop.d0t03-source-evidence.v1',
              'status': 'PASS_SOURCE_CONTRACT_SETTINGS_STILL_REQUIRED',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'event_name': os.environ['GITHUB_EVENT_NAME'],
              'ref': os.environ['GITHUB_REF'],
              'evidence_role': os.environ['EVIDENCE_ROLE'],
              'tested_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'tree_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'base_sha': pr_base_sha or None,
              'candidate_head_sha': pr_head_sha or None,
              'pull_request_number': int(pr_number) if pr_number else None,
              'input_digests': {
                  str(path): hashlib.sha256(read_source_bytes(path)).hexdigest()
                  for path in inputs
              },
              'claims': {
                  'source_contract_valid': True,
                  'interim_two_identity_codeowners_present': True,
                  'protected_main_observed': False,
                  'organization_team_codeowners_observed': False,
                  'independent_review_observed': False,
                  'release_environment_observed': False,
                  'd0t03_closed': False,
              },
          }
          if result['tested_sha'] != os.environ['EVENT_SHA']:
              raise SystemExit('source evidence checkout does not equal github.sha')
          if event_name == 'pull_request':
              parents = subprocess.check_output(
                  ['git', 'show', '-s', '--format=%P', 'HEAD'], text=True
              ).split()
              if parents != [pr_base_sha, pr_head_sha]:
                  raise SystemExit(
                      'pull-request source evidence parents do not match base/head'
                  )
          Path('artifacts/d0t03-source/evidence.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Upload source-only governance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d0t03-source-contract-${{ github.sha }}
          path: artifacts/d0t03-source
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
