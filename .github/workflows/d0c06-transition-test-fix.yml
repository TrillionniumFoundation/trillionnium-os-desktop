name: d0c06-transition-test-fix

on:
  push:
    branches: [codex/d0c06-durable-receipt-journal]
    paths:
      - .github/workflows/d0c06-transition-test-fix.yml
      - tools/patch_d0c06_transition_test.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d0c06-durable-receipt-journal
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: rustfmt
      - name: Patch and validate the lifecycle corpus
        run: |
          set -euo pipefail
          python3 tools/patch_d0c06_transition_test.py
          cargo fmt --all
          cargo test --locked -p hepta-session-core receipt_journal::tests:: -- --nocapture
          git diff --check
      - name: Commit the corrected test and remove the helper
        run: |
          set -euo pipefail
          rm tools/patch_d0c06_transition_test.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/hepta-session-core/src/receipt_journal.rs tools/patch_d0c06_transition_test.py
          git commit -m "test: make invalid receipt transition structurally valid"
          git push origin HEAD:codex/d0c06-durable-receipt-journal
