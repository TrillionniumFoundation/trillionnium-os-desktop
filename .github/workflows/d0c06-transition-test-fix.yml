# One-shot exact-toolchain correction for the lifecycle fault corpus.
name: d0c06-transition-test-fix

on:
  push:
    branches:
      - codex/d0c06-durable-receipt-journal
    paths:
      - ".github/workflows/d0c06-transition-test-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d0c06-durable-receipt-journal
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.0
          components: rustfmt

      - name: Build a structurally valid but state-invalid terminal event
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/hepta-session-core/src/receipt_journal.rs')
          text = path.read_text(encoding='utf-8')
          old = '''        let error = journal
            .append(event("receipt-1", LifecycleState::Completed))
            .expect_err("completion before request must fail");
        assert!(matches!(error, JournalError::InvalidTransition { .. }));
'''
          new = '''        let mut completed = event("receipt-1", LifecycleState::Completed);
        completed.outcome = Some(ReceiptOutcome::Succeeded);
        completed.response_sha256 = Some(digest(2));
        let error = journal
            .append(completed)
            .expect_err("completion before request must fail");
        assert!(matches!(error, JournalError::InvalidTransition { .. }));
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one lifecycle test block, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          cargo fmt --all
          cargo test --locked -p hepta-session-core receipt_journal::tests:: -- --nocapture
          git diff --check

      - name: Commit corrected fault corpus
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/hepta-session-core/src/receipt_journal.rs
          git commit -m "test: make invalid receipt transition structurally valid"
          git push origin HEAD:codex/d0c06-durable-receipt-journal
