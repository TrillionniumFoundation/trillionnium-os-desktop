name: d1-promote-generated-lock

on:
  push:
    branches:
      - codex/d1-01-d6-replay-v1
    paths:
      - .github/workflows/d1-promote-generated-lock.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: d1-promote-generated-lock
  cancel-in-progress: false

jobs:
  promote:
    if: github.actor != 'github-actions[bot]' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      SOURCE_RUN_ID: "33256023592"
      SOURCE_ARTIFACT: d1-final-qualification-b2dbd6e35ae2ebd57b68265d7fb28d7851e648ae
      EXPECTED_LOCK_SHA256: 9219ed5bbe3dbac2fdb60b5fcfa58318be4e21f6e3cce395f7f486222827b8bd
      EXPECTED_PACKAGE_SET_SHA256: 6f0f8ba20a4deba6d1273ea75ea5b2fb209f71f30b810240f1f63c22f67bf6b5
    steps:
      - name: Check out exact D1 package branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/d1-01-d6-replay-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Download exact successful qualification artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/d1-lock-promotion
          mkdir -p /tmp/d1-lock-promotion
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_ARTIFACT" \
            --dir /tmp/d1-lock-promotion
          test -f /tmp/d1-lock-promotion/debian-d1.lock.v1.json
          echo "$EXPECTED_LOCK_SHA256  /tmp/d1-lock-promotion/debian-d1.lock.v1.json" \
            | sha256sum --check --strict

      - name: Materialize and bind the committed D1 lock
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          source = Path('/tmp/d1-lock-promotion/debian-d1.lock.v1.json')
          lock = json.loads(source.read_text())
          assert lock['status'] == 'PASS_SIGNED_INPUT_AND_PACKAGE_CLOSURE_ONLY'
          assert lock['resolved_package_count'] == 352
          assert lock['package_set_sha256'] == os.environ['EXPECTED_PACKAGE_SET_SHA256']
          assert all(value is False for value in lock['claims'].values())
          canonical = Path('manifests/debian-d1.lock.v1.json')
          canonical.write_bytes(source.read_bytes())

          selection_path = Path('manifests/debian-d1.selection.json')
          selection = json.loads(selection_path.read_text())
          selection['status'] = 'COMMITTED_SIGNED_D1_PACKAGE_LOCK'
          selection['committed_d1_lock'] = str(canonical)
          selection['expected_d1_package_count'] = lock['resolved_package_count']
          selection['expected_d1_package_set_sha256'] = lock['package_set_sha256']
          selection['committed_d1_lock_sha256'] = hashlib.sha256(
              canonical.read_bytes()
          ).hexdigest()
          selection['promotion_source'] = {
              'qualification_run_id': int(os.environ['SOURCE_RUN_ID']),
              'artifact_name': os.environ['SOURCE_ARTIFACT'],
              'artifact_lock_sha256': os.environ['EXPECTED_LOCK_SHA256'],
          }
          selection_path.write_text(
              json.dumps(selection, indent=2, sort_keys=False) + '\n'
          )
          PY
          python3 tools/prepare_d1_inputs.py \
            --selection manifests/debian-d1.selection.json \
            --baseline-lock manifests/debian-snapshot.lock.v1.json \
            --d1-lock manifests/debian-d1.lock.v1.json \
            --requirements manifests/debian-d1.requirements.v1.json \
            --output-dir /tmp/d1-lock-validation
          jq -e '.status == "PASS_COMMITTED_SIGNED_D1_PACKAGE_LOCK"' \
            /tmp/d1-lock-validation/prepared-inputs.json

      - name: Commit exact lock promotion
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            manifests/debian-d1.lock.v1.json \
            manifests/debian-d1.selection.json
          git commit -m 'build: commit exact signed D1 package lock'
          git push origin HEAD:codex/d1-01-d6-replay-v1
