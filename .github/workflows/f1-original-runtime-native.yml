name: F1 original owner lifecycle in native x86_64 guest

on:
  pull_request:
    paths:
      - "tests/workloads/hepta_agentd_runtime/**"
      - "tests/workloads/hepta_agentd_abi/**"
      - "tests/integration/hepta/**"
      - "services/hepta-os/**"
      - ".github/workflows/f1-original-runtime-native.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  original-owner-native-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      DESKTOP_SOURCE_PIN: c5c88794bf227b1d862b2f914b02809a0090e854
      HEPTA_SOURCE_PIN: 6d6097da843f5831dfaf9cee3530da512d072a15
      A06_RUN_ID: "39898657974"
      A06_ARTIFACT_ID: "12480223660"
      GIT_TERMINAL_PROMPT: "0"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Allocate isolated native evidence and cache directories
        run: |
          set -euo pipefail
          umask 077
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(uname -m)" = x86_64
          ci_root="$RUNNER_TEMP/f1-native-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$ci_root"
          mkdir -m 700 "$ci_root"
          mkdir -m 700 "$ci_root/logs" "$ci_root/identity" "$ci_root/download" \
            "$ci_root/cargo-home" "$ci_root/rustup-home"
          printf 'F1_CI_ROOT=%s\nCARGO_HOME=%s/cargo-home\nRUSTUP_HOME=%s/rustup-home\n' \
            "$ci_root" "$ci_root" "$ci_root" >> "$GITHUB_ENV"
          git rev-parse HEAD HEAD^{tree} > "$ci_root/identity/runner-source.txt"
          git status --porcelain=v1 --untracked-files=all > "$ci_root/identity/runner-status.txt"
          test ! -s "$ci_root/identity/runner-status.txt"
          sha256sum tests/workloads/hepta_agentd_runtime/*.py \
            tests/workloads/hepta_agentd_runtime/*.c \
            tests/workloads/hepta_agentd_runtime/source-review.json \
            .github/workflows/f1-original-runtime-native.yml \
            > "$ci_root/identity/runner-inputs.sha256"

      - name: Install the original userspace compiler and actual guest tools
        run: |
          set -euo pipefail
          {
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              build-essential pkg-config libcap-dev bubblewrap cmake perl libssl-dev binutils \
              qemu-system-x86 e2fsprogs
            rustup toolchain install 1.95.0 --profile minimal
            rustup run 1.95.0 rustc -Vv
            rustup run 1.95.0 cargo -Vv
            qemu-system-x86_64 --version
            gcc --version
            dpkg-query -W build-essential pkg-config libcap-dev cmake libssl-dev binutils qemu-system-x86 e2fsprogs
            df -B1 "$F1_CI_ROOT"
          } 2>&1 | tee "$F1_CI_ROOT/logs/native-setup.log"

      - name: Fetch exact original Desktop and Hepta sources without credentials
        run: |
          set -euo pipefail
          {
            git init "$F1_CI_ROOT/desktop-source"
            git -C "$F1_CI_ROOT/desktop-source" remote add origin \
              https://github.com/TrillionniumFoundation/trillionnium-os-desktop.git
            git -C "$F1_CI_ROOT/desktop-source" -c credential.helper= -c core.askPass= \
              fetch --depth=1 --no-tags origin "$DESKTOP_SOURCE_PIN"
            git -C "$F1_CI_ROOT/desktop-source" checkout --detach "$DESKTOP_SOURCE_PIN"
            git init "$F1_CI_ROOT/hepta-source"
            git -C "$F1_CI_ROOT/hepta-source" remote add origin \
              https://github.com/TrillionniumFoundation/hepta-private-ci.git
            git -C "$F1_CI_ROOT/hepta-source" -c credential.helper= -c core.askPass= \
              fetch --depth=1 --no-tags origin "$HEPTA_SOURCE_PIN"
            git -C "$F1_CI_ROOT/hepta-source" checkout --detach "$HEPTA_SOURCE_PIN"
          } 2>&1 | tee "$F1_CI_ROOT/logs/source-checkout.log"
          git -C "$F1_CI_ROOT/desktop-source" rev-parse HEAD HEAD^{tree} > "$F1_CI_ROOT/identity/desktop-source.txt"
          git -C "$F1_CI_ROOT/hepta-source" rev-parse HEAD HEAD^{tree} > "$F1_CI_ROOT/identity/hepta-source.txt"

      - name: Download the exact successful final-head A06 artifact and original metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repository=TrillionniumFoundation/trillionnium-os-desktop
          gh api "repos/$repository/actions/runs/$A06_RUN_ID/artifacts" \
            > "$F1_CI_ROOT/download/artifact-list.json"
          gh api "repos/$repository/actions/runs/$A06_RUN_ID" \
            > "$F1_CI_ROOT/download/workflow-run.json"
          gh api "repos/$repository/actions/artifacts/$A06_ARTIFACT_ID/zip" \
            > "$F1_CI_ROOT/download/a06-final.zip"
          # No token is present in compilation or the guest process environment.
          # The importer pins ZIP bytes as well as checking these original records.

      - name: Transcribe the retained ordinary build after original raw-evidence replay
        run: |
          set -euo pipefail
          python3 -I -B tests/workloads/hepta_agentd_runtime/import_kernel_artifact.py \
            --archive "$F1_CI_ROOT/download/a06-final.zip" \
            --artifact-metadata "$F1_CI_ROOT/download/artifact-list.json" \
            --run-metadata "$F1_CI_ROOT/download/workflow-run.json" \
            --desktop-source "$F1_CI_ROOT/desktop-source" \
            --output "$F1_CI_ROOT/kernel-inputs" \
            2>&1 | tee "$F1_CI_ROOT/logs/kernel-import.log"

      - name: Build original Agentd, unchanged original fixture and real observer for x86_64
        run: |
          set -euo pipefail
          cargo_binary=$(rustup which --toolchain 1.95.0 cargo)
          rustc_binary=$(rustup which --toolchain 1.95.0 rustc)
          cargo_sha=$(sha256sum "$cargo_binary" | cut -d ' ' -f1)
          rustc_sha=$(sha256sum "$rustc_binary" | cut -d ' ' -f1)
          kernel_receipt_sha=$(sha256sum "$F1_CI_ROOT/kernel-inputs/kernel-build.json" | cut -d ' ' -f1)
          # Dependency prefetch is explicit and uses original locked manifests.
          # All builds and fixture resolution then run offline; no ELF is run here.
          python3 -I -B tests/workloads/hepta_agentd_runtime/prepare_inputs.py \
            --execute --fetch-dependencies \
            --desktop-source "$F1_CI_ROOT/desktop-source" \
            --hepta-source "$F1_CI_ROOT/hepta-source" \
            --kernel "$F1_CI_ROOT/kernel-inputs/kernel.elf" \
            --kernel-receipt "$F1_CI_ROOT/kernel-inputs/kernel-build.json" \
            --expected-kernel-receipt-sha256 "$kernel_receipt_sha" \
            --cargo "$cargo_binary" --expected-cargo-sha256 "$cargo_sha" \
            --rustc "$rustc_binary" --expected-rustc-sha256 "$rustc_sha" \
            --cargo-home "$CARGO_HOME" --output "$F1_CI_ROOT/frozen-inputs" \
            2>&1 | tee "$F1_CI_ROOT/logs/userspace-preparation.log"

      - name: Execute the unchanged original no-turn lifecycle in the actual OS guest
        run: |
          set -euo pipefail
          qemu_binary=$(command -v qemu-system-x86_64)
          qemu_sha=$(sha256sum "$qemu_binary" | cut -d ' ' -f1)
          manifest_sha=$(sha256sum "$F1_CI_ROOT/frozen-inputs/input-manifest.json" | cut -d ' ' -f1)
          python3 -I -B tests/workloads/hepta_agentd_runtime/run_agentd_runtime.py --execute \
            --input-manifest "$F1_CI_ROOT/frozen-inputs/input-manifest.json" \
            --expected-input-manifest-sha256 "$manifest_sha" \
            --initramfs "$F1_CI_ROOT/kernel-inputs/initramfs.cpio.gz" \
            --bios "$F1_CI_ROOT/kernel-inputs/bios.bin" \
            --qemu "$qemu_binary" --expected-qemu-sha256 "$qemu_sha" \
            --memory-mib 4096 --timeout 900 --output "$F1_CI_ROOT/guest" \
            2>&1 | tee "$F1_CI_ROOT/logs/guest-execution.log"

      - name: Preserve source identities and scope on success or failure
        if: ${{ always() }}
        run: |
          set -euo pipefail
          python3 -I -B - <<'PY'
          from datetime import datetime, timezone
          import json, os, subprocess
          from pathlib import Path
          root = Path(os.environ["F1_CI_ROOT"])
          result = {"recorded_at_utc": datetime.now(timezone.utc).isoformat(),
                    "run_url": f'{os.environ["GITHUB_SERVER_URL"]}/{os.environ["GITHUB_REPOSITORY"]}/actions/runs/{os.environ["GITHUB_RUN_ID"]}',
                    "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"], "checkouts": {},
                    "f1_completed": False, "g2_completed": False, "hardware_verified": False}
          for name, source in (("runner", Path(os.environ["GITHUB_WORKSPACE"])),
                               ("desktop", root / "desktop-source"), ("hepta", root / "hepta-source")):
              result["checkouts"][name] = {}
              for key, arguments in (("identity", ["rev-parse", "HEAD", "HEAD^{tree}"]),
                                     ("status", ["status", "--porcelain=v1", "--untracked-files=all"])):
                  command = subprocess.run(["git", "-C", str(source), *arguments], capture_output=True, text=True, timeout=30)
                  result["checkouts"][name][key] = {"exit_code": command.returncode, "stdout": command.stdout, "stderr": command.stderr}
          (root / "identity/final.json").write_text(json.dumps(result, indent=2) + "\n")
          PY

      - name: Upload original evidence, real binaries and actual guest diagnostics even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: f1-original-owner-native-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ env.F1_CI_ROOT }}/logs/
            ${{ env.F1_CI_ROOT }}/identity/
            ${{ env.F1_CI_ROOT }}/download/*.json
            ${{ env.F1_CI_ROOT }}/kernel-inputs/
            ${{ env.F1_CI_ROOT }}/frozen-inputs/*.json
            ${{ env.F1_CI_ROOT }}/frozen-inputs/*.log
            ${{ env.F1_CI_ROOT }}/frozen-inputs/bin/
            ${{ env.F1_CI_ROOT }}/frozen-inputs/fixture-build/Cargo.toml
            ${{ env.F1_CI_ROOT }}/frozen-inputs/fixture-build/Cargo.lock
            ${{ env.F1_CI_ROOT }}/frozen-inputs/fixture-build/src/
            ${{ env.F1_CI_ROOT }}/guest/*.json
            ${{ env.F1_CI_ROOT }}/guest/*.log
            ${{ env.F1_CI_ROOT }}/guest/fixture.stdout
            ${{ env.F1_CI_ROOT }}/guest/fixture.stderr
            ${{ env.F1_CI_ROOT }}/guest/agentd-runtime-probe
            ${{ env.F1_CI_ROOT }}/guest/state.raw
