name: d0a02-delegate-wake-once

on:
  push:
    branches:
      - codex/d0a02-headed-runtime-v3
    paths:
      - .github/workflows/d0a02-delegate-wake-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: d0a02-delegate-wake-once
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d0a02-headed-runtime-v3
          fetch-depth: 0

      - name: Wake the runtime driver after every asynchronous delegate transition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('experiments/servo-headed-runtime/src/main.rs')
          source = path.read_text()
          replacements = [
              (
                  """            state
                .input_handled_callbacks
                .set(state.input_handled_callbacks.get() + 1);
""",
                  """            state
                .input_handled_callbacks
                .set(state.input_handled_callbacks.get() + 1);
            let _ = state.proxy.send_event(AppEvent::Drive);
""",
              ),
              (
                  """            *state.crash_reason.borrow_mut() = Some(reason);
            state.window.request_redraw();
""",
                  """            *state.crash_reason.borrow_mut() = Some(reason);
            state.window.request_redraw();
            let _ = state.proxy.send_event(AppEvent::Drive);
""",
              ),
              (
                  """                request.deny();
            }
        } else {
""",
                  """                request.deny();
            }
            let _ = state.proxy.send_event(AppEvent::Drive);
        } else {
""",
              ),
              (
                  """        if let Some(state) = self.state.upgrade() {
            state.popup_denied.set(state.popup_denied.get() + 1);
        }
""",
                  """        if let Some(state) = self.state.upgrade() {
            state.popup_denied.set(state.popup_denied.get() + 1);
            let _ = state.proxy.send_event(AppEvent::Drive);
        }
""",
              ),
              (
                  """                    .set(state.input_method_controls.get() + 1);
            }
        }
""",
                  """                    .set(state.input_method_controls.get() + 1);
            }
            let _ = state.proxy.send_event(AppEvent::Drive);
        }
""",
              ),
          ]
          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected one delegate anchor, found {count}: {old!r}')
              source = source.replace(old, new)
          path.write_text(source)
          PY
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add experiments/servo-headed-runtime/src/main.rs
          git commit -m 'fix: wake headed runtime after delegate transitions'
          git push origin HEAD:codex/d0a02-headed-runtime-v3
