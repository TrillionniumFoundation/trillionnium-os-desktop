name: format-d0c02-once

on:
  push:
    branches:
      - codex/d0c02-transport-v2
    paths:
      - ".github/workflows/format-d0c02-once.yml"

permissions:
  contents: write

concurrency:
  group: format-d0c02-once
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: codex/d0c02-transport-v2
          fetch-depth: 0

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup default 1.93.0
          rustc --version --verbose
          cargo --version --verbose

      - name: Apply rustfmt and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          rm -f .github/workflows/format-d0c02-once.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git commit -m "style: apply Rust 1.93 formatting to D0C-02"
          git push origin HEAD:codex/d0c02-transport-v2
