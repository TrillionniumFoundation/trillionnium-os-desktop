name: s10-production-debian-qemu

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s10-production-debian-qemu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  SERVO_COMMIT: 670ae8a70801b162e186f81cbb5bdd2d59c39108
  IMAGE_OBJECT: exact-head
  EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
  EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
  EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
  EXPECTED_MERGE: ${{ github.sha }}
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  source-contracts:
    name: image-source-${{ matrix.object }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        object: ${{ fromJSON(github.event_name == 'pull_request' && '["exact-head","prospective-merge"]' || '["exact-head"]') }}
    env:
      IMAGE_OBJECT: ${{ matrix.object }}
    steps:
      - name: Check out exact source or prospective merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.object == 'prospective-merge' && github.sha || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
          fetch-depth: 2
          persist-credentials: false
      - name: Bind live event, head, base and ordered merge parents
        run: python3 tools/image_workflow_identity.py
      - name: Execute all source and image-contract regressions before costly builds
        run: |
          set -euo pipefail
          python3 tools/validate_image_source_contract.py
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          /usr/bin/python3 -I tools/validate_module_documentation.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m unittest discover -s tests/d1 -p 'test_*.py' -v
          python3 tools/image_workflow_identity.py
          git diff --exit-code

  exact-head-integrated-image:
    needs: source-contracts
    name: exact-head-integrated-image
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source identity against the live event
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/image_workflow_identity.py

      - name: Derive non-authoritative exact-head image identity
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          GITHUB_EVENT_NAME=workflow_dispatch \
          GITHUB_REF="refs/heads/$SOURCE_BRANCH" \
          GITHUB_REF_NAME="$SOURCE_BRANCH" \
            bash tools/run_d2i_integrated_image.sh identities

      - name: Install and bind D1 plus Servo host dependencies
        run: bash tools/run_d2i_integrated_image.sh install-deps

      - name: Install exact repository Rust toolchain
        run: bash tools/run_d2i_integrated_image.sh install-rust

      - name: Restore repository Cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: s10-repository-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Build exact pinned e2fsprogs toolchain
        run: bash tools/run_d2i_integrated_image.sh build-e2fsprogs

      - name: Validate tracked source and read-only gate surface
        run: bash tools/run_d2i_integrated_image.sh validate-source

      - name: Validate resource reclamation and diagnostics helpers
        run: |
          shellcheck tools/reclaim_d2i_servo_workspace.sh tools/collect_d2i_failure_diagnostics.sh

      - name: Prove D1 product and qualification dependency separation
        run: bash tools/run_d2i_integrated_image.sh prove-d1-graphs

      - name: Build and audit D1 product and qualification binaries
        run: bash tools/run_d2i_integrated_image.sh build-d1-binaries

      - name: Check out exact clean Servo source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: servo/servo
          ref: ${{ env.SERVO_COMMIT }}
          path: servo-source
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Verify exact Servo pin and zero-patch image-runtime ledger
        run: bash tools/run_d2i_integrated_image.sh verify-servo

      - name: Install Servo-declared Rust channel
        run: bash tools/run_d2i_integrated_image.sh install-servo-rust

      - name: Restore exact-pin Servo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            servo-source/target
          key: s10-servo-${{ runner.os }}-${{ env.SERVO_COMMIT }}-${{ hashFiles('runtime/servo/hepta_workspace_runtime.rs', 'tools/prepare_d2i_runtime.py') }}
          restore-keys: |
            s10-servo-${{ runner.os }}-${{ env.SERVO_COMMIT }}-

      - name: Build callback-independent causal Servo runtime
        run: bash tools/run_d2i_integrated_image.sh build-runtime

      - name: Reclaim exact Servo build workspace before image construction
        run: bash tools/reclaim_d2i_servo_workspace.sh

      - name: Build and qualify exact D1 image
        run: bash tools/run_d2i_integrated_image.sh run-d1

      - name: Prepare two byte-identical integrated images
        run: bash tools/run_d2i_integrated_image.sh prepare-images

      - name: Boot and qualify exact integrated image without networking
        run: bash tools/run_d2i_integrated_image.sh boot-image

      - name: Build and strictly verify portable D2I evidence
        run: |
          set -euo pipefail
          python3 tools/image_workflow_identity.py
          bash tools/run_d2i_integrated_image.sh finalize-evidence
          python3 tools/image_workflow_identity.py

      - name: Collect bounded cross-stage failure diagnostics
        if: failure()
        continue-on-error: true
        run: bash tools/collect_d2i_failure_diagnostics.sh

      - name: Upload canonical portable S10 candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s10-production-debian-qemu-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: /tmp/trillionnium-d2i-artifact
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0

      - name: Upload bounded failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s10-production-debian-qemu-diagnostics-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: |
            /tmp/trillionnium-d1/evidence
            /tmp/trillionnium-d2i/evidence
            /tmp/trillionnium-d2i/qemu
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
