name: codex-servo-source-snapshot

on:
  push:
    branches:
      - codex/d3-servo-retained-node-v1
    paths:
      - .github/workflows/codex-servo-source-snapshot.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-servo-source-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out controller without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Check out exact Servo pin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: servo/servo
          ref: 670ae8a70801b162e186f81cbb5bdd2d59c39108
          path: servo
          fetch-depth: 1
          persist-credentials: false

      - name: Verify and archive exact clean Servo source
        run: |
          set -euo pipefail
          test "$(git -C servo rev-parse HEAD)" = 670ae8a70801b162e186f81cbb5bdd2d59c39108
          test -z "$(git -C servo status --porcelain=v1)"
          git -C servo archive --format=tar.gz --output="$GITHUB_WORKSPACE/servo-670ae8a70801b162e186f81cbb5bdd2d59c39108.tar.gz" HEAD
          sha256sum servo-670ae8a70801b162e186f81cbb5bdd2d59c39108.tar.gz > SHA256SUMS

      - name: Upload exact-pin source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: servo-source-670ae8a70801b162e186f81cbb5bdd2d59c39108
          path: |
            servo-670ae8a70801b162e186f81cbb5bdd2d59c39108.tar.gz
            SHA256SUMS
          if-no-files-found: error
          retention-days: 1
