name: d0a02-source-snapshot

on:
  push:
    branches:
      - codex/d0a02-proof-soundness-v4
    paths:
      - ".github/workflows/d0a02-source-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Record source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-snapshot
          git rev-parse HEAD > source-snapshot/commit.txt
          git rev-parse 'HEAD^{tree}' > source-snapshot/tree.txt
          install -D -m 0644 experiments/servo-headed-runtime/src/main.rs \
            source-snapshot/experiments/servo-headed-runtime/src/main.rs
          install -D -m 0644 experiments/servo-headed-runtime/fixture/index.html \
            source-snapshot/experiments/servo-headed-runtime/fixture/index.html
          install -D -m 0644 .github/workflows/servo-headed-runtime.yml \
            source-snapshot/.github/workflows/servo-headed-runtime.yml
          install -D -m 0644 docs/architecture/TRUSTED_WORKSPACE_COMPOSITION.md \
            source-snapshot/docs/architecture/TRUSTED_WORKSPACE_COMPOSITION.md
      - name: Upload exact source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d0a02-source-snapshot-${{ github.sha }}
          path: source-snapshot
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
