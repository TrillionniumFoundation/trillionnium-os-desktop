permissions:
  contents: read

concurrency:
  group: agent-port-custody-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install exact Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.93.0

      - name: Audit repository, truth, custody, and fixture separation
        run: |
          python3 tools/validate_repository.py
          python3 tools/validate_d0c04_rust_product.py
          python3 tools/validate_project_truth.py
          python3 tools/verify_systemd_socket_custody.py
          python3 tools/validate_d3_development_profile.py

      - name: Run systemd custody parser regressions
        run: |
          set -euo pipefail
          python3 -m py_compile tests/test_systemd_custody_validator.py
          python3 -m unittest tests.test_systemd_custody_validator -v

      - name: Verify systemd unit syntax and account mappings
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /usr/libexec /usr/lib/sysusers.d
          sudo install -m 0755 /bin/true /usr/libexec/hepta-agent-portd
          sudo install -m 0755 /bin/true /usr/libexec/hepta-agent-port-developmentd
          sudo install -m 0644 \
            packaging/debian/sysusers.d/trillionnium-desktop.conf \
            /usr/lib/sysusers.d/trillionnium-desktop.conf
          sudo systemd-sysusers /usr/lib/sysusers.d/trillionnium-desktop.conf
          systemd-analyze verify \
            packaging/debian/systemd/hepta-browserd-agent.socket \
            packaging/debian/systemd/hepta-browserd-agent@.service \
            packaging/debian/systemd/hepta-browserd-agent-development.socket \
            packaging/debian/systemd/hepta-browserd-agent-development@.service
          sudo rm -f \
            /usr/libexec/hepta-agent-portd \
            /usr/libexec/hepta-agent-port-developmentd \
            /usr/lib/sysusers.d/trillionnium-desktop.conf

      - name: Check default product graph and fixture feature graph
        run: |
          cargo fmt --all --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo check --locked -p hepta-agent-portd --all-targets --all-features
          cargo clippy --locked -p hepta-agent-portd --all-targets --all-features -- -D warnings

      - name: Run product and explicit fixture regressions
        run: |
          cargo test --workspace --all-targets --locked
          cargo test --locked -p hepta-agent-portd --all-targets --all-features
          cargo run --locked -p hepta-browserd -- --self-check
          cargo run --locked -p hepta-agent-portd \
            --bin hepta-agent-portd \
            -- --self-check
          cargo run --locked -p hepta-agent-portd \
            --features fixture \
            --bin hepta-agent-port-fixture \
            -- --self-check
          cargo run --locked -p hepta-agent-portd \
            --features development \
            --bin hepta-agent-port-developmentd \
            -- --profile development --self-check

      - name: Build and audit the production binary graph
        shell: bash
        run: |
          set -euo pipefail
          cargo clean -p hepta-agent-portd
          cargo build --release --locked -p hepta-agent-portd --bin hepta-agent-portd
          cargo build --release --locked -p hepta-agent-portd \
            --features development --bin hepta-agent-port-developmentd
          test -x target/release/hepta-agent-portd
          test -x target/release/hepta-agent-port-developmentd
          test ! -e target/release/hepta-agent-port-fixture
          ! strings target/release/hepta-agent-portd | grep -F 'D0FixtureHandler'
          ! strings target/release/hepta-agent-portd | grep -F 'agent-port-fixture-self-check'
          ! grep -F 'hepta-agent-port-fixture' packaging/debian/hepta-agent-portd.install

      - name: Reconfirm closed authority and activation ceiling
        shell: bash
        run: |
          set -euo pipefail
          test ! -e enable-agent-port
          test ! -e /etc/hepta/enable-agent-port
          ! grep -R -n -E 'TcpListener|UnixListener|WebDriver' \
            apps/hepta-agent-portd crates/hepta-peer-attestation
          ! grep -F 'D0FixtureHandler' apps/hepta-agent-portd/src/main.rs
          grep -F 'ProductHandlerUnavailable' apps/hepta-agent-portd/src/main.rs
          grep -F 'D0FixtureHandler' \
            apps/hepta-agent-portd/src/bin/hepta-agent-port-fixture.rs
          python3 - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path('contracts/agent-port-custody.v1.json').read_text())
          evidence = json.loads(Path('docs/evidence/generated/d0c05-rust193-host-result.json').read_text())
          docs = json.loads(Path('docs/MANIFEST.json').read_text())
          assert contract['activation']['enabled_by_default'] is False
          assert contract['activation']['marker_shipped'] is False
          assert contract['activation']['tcp_listener'] is False
          assert contract['dispatch']['browser_actor'] is False
          assert contract['dispatch']['servo_runtime'] is False
          assert contract['dispatch']['external_effect_authority'] is False
          assert contract['dispatch']['fixture_substitution'] is False
          assert contract['dispatch']['activation_without_browser_actor'] == 'fail_closed_before_request_decode'
          separation = contract['fixture_separation']
          assert separation['feature_enabled_by_default'] is False
          assert separation['production_binary_references_fixture_handler'] is False
          assert separation['debian_package_installs_fixture_binary'] is False
          assert separation['external_effect_authority'] is False
          current = (
              contract.get('evidence_lifecycle') in (None, 'CURRENT')
              and contract['host_validation'].get('evidence_lifecycle') in (None, 'CURRENT')
              and contract['host_validation'].get('evidence_freshness') in (None, 'CURRENT')
              and contract['host_validation'].get('merge_ready') is True
              and evidence.get('evidence_lifecycle') in (None, 'CURRENT')
              and evidence.get('evidence_freshness') in (None, 'CURRENT')
              and evidence.get('merge_ready') is True
          )
          assert docs['agent_port_systemd_custody_exact_head_rust_validation'] is current
          assert docs['agent_port_systemd_custody_host_evidence_freshness'] == (
              'CURRENT' if current else 'STALE_EVIDENCE'
          )
          if not current:
              historical_head = '7be7121b1d2593a0e708ec9ade189ef84ab245da'
              assert contract['evidence_lifecycle'] == 'STALE_EVIDENCE_REQUIRES_EXACT_HEAD_RERUN'
              assert contract['host_validation']['evidence_lifecycle'] == 'STALE_EVIDENCE_REQUIRES_EXACT_HEAD_RERUN'
              assert contract['host_validation']['evidence_freshness'] == 'STALE_EVIDENCE'
              assert contract['host_validation']['merge_ready'] is False
              assert historical_head in contract['host_validation']['stale_reason']
              assert evidence['evidence_lifecycle'] == 'STALE_EVIDENCE_REQUIRES_EXACT_HEAD_RERUN'
              assert evidence['evidence_freshness'] == 'STALE_EVIDENCE'
              assert evidence['merge_ready'] is False
              assert historical_head in evidence['stale_reason']
          PY
