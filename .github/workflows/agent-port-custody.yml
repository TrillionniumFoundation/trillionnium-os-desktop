name: agent-port-custody

on:
  pull_request:
    paths:
      - ".github/workflows/agent-port-custody.yml"
      - "apps/hepta-agent-portd/**"
      - "crates/hepta-agent-port/**"
      - "crates/hepta-peer-attestation/**"
      - "crates/hepta-agent-transport/**"
      - "packaging/debian/systemd/**"
      - "packaging/debian/sysusers.d/**"
      - "packaging/debian/tmpfiles.d/**"
      - "packaging/debian/systemd-preset/**"
      - "packaging/debian/hepta-agent-portd.install"
      - "contracts/agent-port-*.json"
      - "contracts/request-peer-custody.v1.json"
      - "tools/verify_systemd_socket_custody.py"
      - "tools/validate_repository.py"
      - "tools/validate_project_truth.py"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/agent-port-custody.yml"
      - "apps/hepta-agent-portd/**"
      - "crates/hepta-agent-port/**"
      - "crates/hepta-peer-attestation/**"
      - "crates/hepta-agent-transport/**"
      - "packaging/debian/systemd/**"
      - "packaging/debian/sysusers.d/**"
      - "packaging/debian/tmpfiles.d/**"
      - "packaging/debian/systemd-preset/**"
      - "packaging/debian/hepta-agent-portd.install"
      - "contracts/agent-port-*.json"
      - "contracts/request-peer-custody.v1.json"
      - "tools/verify_systemd_socket_custody.py"
      - "tools/validate_repository.py"
      - "tools/validate_project_truth.py"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

concurrency:
  group: agent-port-custody-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-source-custody:
    name: exact-source-custody
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Assert exact source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          git rev-parse HEAD^{tree}
      - name: Install exact Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.93.0
      - name: Audit repository, truth, custody, and fixture separation
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 tools/verify_systemd_socket_custody.py
      - name: Verify systemd unit syntax and account mappings
        run: |
          set -euo pipefail
          sudo mkdir -p /usr/libexec /usr/lib/sysusers.d
          sudo install -m 0755 /bin/true /usr/libexec/hepta-agent-portd
          sudo install -m 0644 packaging/debian/sysusers.d/trillionnium-desktop.conf /usr/lib/sysusers.d/trillionnium-desktop.conf
          sudo systemd-sysusers /usr/lib/sysusers.d/trillionnium-desktop.conf
          systemd-analyze verify packaging/debian/systemd/hepta-browserd-agent.socket packaging/debian/systemd/hepta-browserd-agent@.service
          sudo rm -f /usr/libexec/hepta-agent-portd /usr/lib/sysusers.d/trillionnium-desktop.conf
      - name: Run complete product and fixture graph
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo check --locked -p hepta-agent-portd --all-targets --all-features
          cargo clippy --locked -p hepta-agent-portd --all-targets --all-features -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo test --locked -p hepta-agent-portd --all-targets --all-features
          cargo run --locked -p hepta-browserd -- --self-check
          cargo run --locked -p hepta-agent-portd --bin hepta-agent-portd -- --self-check
          cargo run --locked -p hepta-agent-portd --features fixture --bin hepta-agent-port-fixture -- --self-check
      - name: Build and audit production binary
        run: |
          set -euo pipefail
          cargo clean -p hepta-agent-portd
          cargo build --release --locked -p hepta-agent-portd --bin hepta-agent-portd
          test -x target/release/hepta-agent-portd
          test ! -e target/release/hepta-agent-port-fixture
          ! strings target/release/hepta-agent-portd | grep -F 'D0FixtureHandler'
          ! strings target/release/hepta-agent-portd | grep -F 'agent-port-fixture-self-check'
          ! grep -F 'hepta-agent-port-fixture' packaging/debian/hepta-agent-portd.install
      - name: Reconfirm closed authority and activation ceiling
        run: |
          set -euo pipefail
          test ! -e enable-agent-port
          test ! -e /etc/hepta/enable-agent-port
          ! grep -R -n -E 'TcpListener|UnixListener|WebDriver' apps/hepta-agent-portd crates/hepta-peer-attestation
          ! grep -F 'D0FixtureHandler' apps/hepta-agent-portd/src/main.rs
          grep -F 'ProductHandlerUnavailable' apps/hepta-agent-portd/src/main.rs
          grep -F 'D0FixtureHandler' apps/hepta-agent-portd/src/bin/hepta-agent-port-fixture.rs
          python3 - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path('contracts/agent-port-custody.v1.json').read_text())
          assert contract['activation']['enabled_by_default'] is False
          assert contract['activation']['marker_shipped'] is False
          assert contract['activation']['tcp_listener'] is False
          assert contract['dispatch']['browser_actor'] is False
          assert contract['dispatch']['servo_runtime'] is False
          assert contract['dispatch']['external_effect_authority'] is False
          assert contract['dispatch']['fixture_substitution'] is False
          assert contract['dispatch']['activation_without_browser_actor'] == 'fail_closed_before_request_decode'
          separation = contract['fixture_separation']
          assert separation['feature_enabled_by_default'] is False
          assert separation['production_binary_references_fixture_handler'] is False
          assert separation['debian_package_installs_fixture_binary'] is False
          assert separation['external_effect_authority'] is False
          PY
