permissions:
  contents: read

concurrency:
  group: agent-port-custody-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-custody:
    name: agent-port-custody / validate-custody
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify canonical live source role
        shell: bash
        env:
          CI_SOURCE_ROLE: event-source
          CI_SOURCE_EVENT: ${{ github.event_name }}
          CI_SOURCE_REPOSITORY: ${{ github.repository }}
          CI_SOURCE_REF: ${{ github.ref }}
          CI_SOURCE_REF_NAME: ${{ github.ref_name }}
          CI_SOURCE_SHA: ${{ github.sha }}
          CI_SOURCE_PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_SOURCE_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_SOURCE_PR_BASE: ${{ github.event.pull_request.base.sha }}
          CI_SOURCE_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          python3 -B tools/verify_ci_source_identity.py

      - name: Install exact Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.93.0

      - name: Audit repository, truth, custody, and fixture separation
        run: |
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 tools/verify_systemd_socket_custody.py
          python3 -m unittest discover -s tests -p test_root_control_path.py -v
          python3 -m unittest discover -s tests -p test_root_path_retained_control.py -v

      - name: Verify systemd unit syntax and account mappings
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /usr/libexec /usr/lib/sysusers.d
          sudo install -m 0755 /bin/true /usr/libexec/hepta-agent-portd
          sudo install -m 0644 \
            packaging/debian/sysusers.d/trillionnium-desktop.conf \
            /usr/lib/sysusers.d/trillionnium-desktop.conf
          sudo systemd-sysusers /usr/lib/sysusers.d/trillionnium-desktop.conf
          systemd-analyze verify \
            packaging/debian/systemd/hepta-browserd-agent.socket \
            packaging/debian/systemd/hepta-browserd-agent@.service
          sudo rm -f \
            /usr/libexec/hepta-agent-portd \
            /usr/lib/sysusers.d/trillionnium-desktop.conf

      - name: Check default product graph and fixture feature graph
        run: |
          cargo fmt --all --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo check --locked -p hepta-agent-portd --all-targets --all-features
          cargo clippy --locked -p hepta-agent-portd --all-targets --all-features -- -D warnings

      - name: Run product and explicit fixture regressions
        env:
          # Exclude test-only DWARF bytes from live self-image measurements; deadlines are unchanged.
          CARGO_PROFILE_TEST_DEBUG: '0'
          # Optimize the same source-test executable measurements without changing budgets.
          CARGO_PROFILE_TEST_OPT_LEVEL: '1'
        run: |
          # Includes the required root-path primitive and live retained bridge/kernel/coordinator profiles.
          cargo test --workspace --all-targets --locked
          cargo test --locked -p hepta-agent-portd --all-targets --all-features
          cargo run --locked -p hepta-browserd -- --self-check
          cargo run --locked -p hepta-agent-portd \
            --bin hepta-agent-portd \
            -- --self-check
          cargo run --locked -p hepta-agent-portd \
            --features fixture \
            --bin hepta-agent-port-fixture \
            -- --self-check

      - name: Build and audit the production binary graph
        shell: bash
        run: |
          set -euo pipefail
          reject_match() {
            local result
            if grep "$@"; then
              exit 1
            else
              result=$?
              if [[ "$result" -ne 1 ]]; then
                exit "$result"
              fi
            fi
          }
          cargo clean -p hepta-agent-portd
          cargo build --release --locked -p hepta-agent-portd --bin hepta-agent-portd
          test -x target/release/hepta-agent-portd
          test ! -e target/release/hepta-agent-port-fixture
          strings_report="$(mktemp "${RUNNER_TEMP:?}/agent-portd-strings.XXXXXX")"
          trap 'rm -f -- "$strings_report"' EXIT
          strings target/release/hepta-agent-portd > "$strings_report"
          reject_match -F 'D0FixtureHandler' "$strings_report"
          reject_match -F 'agent-port-fixture-self-check' "$strings_report"
          reject_match -F 'hepta-agent-port-fixture' packaging/debian/hepta-agent-portd.install

      - name: Reconfirm closed authority and activation ceiling
        shell: bash
        run: |
          set -euo pipefail
          reject_match() {
            local result
            if grep "$@"; then
              exit 1
            else
              result=$?
              if [[ "$result" -ne 1 ]]; then
                exit "$result"
              fi
            fi
          }
          test ! -e enable-agent-port
          test ! -e /etc/hepta/enable-agent-port
          reject_match -R -n --include='*.rs' -E 'TcpListener|UnixListener|WebDriver' \
            apps/hepta-agent-portd crates/hepta-peer-attestation/src
          reject_match -F 'D0FixtureHandler' apps/hepta-agent-portd/src/main.rs
          grep -F 'ProductHandlerUnavailable' apps/hepta-agent-portd/src/main.rs
          grep -F 'D0FixtureHandler' \
            apps/hepta-agent-portd/src/bin/hepta-agent-port-fixture.rs
          python3 - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path('contracts/agent-port-custody.v1.json').read_text())
          assert contract['activation']['enabled_by_default'] is False
          assert contract['activation']['marker_shipped'] is False
          assert contract['activation']['tcp_listener'] is False
          assert contract['dispatch']['browser_actor'] is False
          assert contract['dispatch']['servo_runtime'] is False
          assert contract['dispatch']['external_effect_authority'] is False
          assert contract['dispatch']['fixture_substitution'] is False
          assert contract['dispatch']['activation_without_browser_actor'] == 'fail_closed_before_request_decode'
          separation = contract['fixture_separation']
          assert separation['feature_enabled_by_default'] is False
          assert separation['production_binary_references_fixture_handler'] is False
          assert separation['debian_package_installs_fixture_binary'] is False
          assert separation['external_effect_authority'] is False
          PY
