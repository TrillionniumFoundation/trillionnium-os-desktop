name: A08 Android source integrity and host probes

on:
  pull_request:
    paths:
      - 'compat/android/**'
      - 'support/android/**'
      - 'tests/workloads/android/**'
      - '.github/workflows/a08-host.yml'
      - 'README.md'
  push:
    branches: [main]
    paths:
      - 'compat/android/**'
      - 'support/android/**'
      - 'tests/workloads/android/**'
      - '.github/workflows/a08-host.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-linux-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require complete source and test inputs before discovery
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md && test ! -s README.md
          mkdir -p "$RUNNER_TEMP/a08"
          python3 support/android/verify_source_integrity.py \
            --out "$RUNNER_TEMP/a08/source-integrity.json"
      - name: Install Java, JNI and media host test tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential openjdk-17-jdk-headless ffmpeg
          test -x /usr/lib/jvm/java-17-openjdk-amd64/bin/javac
          test -f /usr/lib/jvm/java-17-openjdk-amd64/include/jni.h
          test -x /usr/bin/ffmpeg
          test -x /usr/bin/ffprobe
          printf '%s\n' /usr/lib/jvm/java-17-openjdk-amd64/bin >> "$GITHUB_PATH"
          printf 'JAVA_HOME=%s\n' /usr/lib/jvm/java-17-openjdk-amd64 >> "$GITHUB_ENV"
      - name: Run complete host gate and optimized regression
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python3 --version
          javac -version
          java -version
          python3 support/android/verify_host.py \
            --out "$RUNNER_TEMP/a08/host-gates.json" \
            2>&1 | tee "$RUNNER_TEMP/a08/host-gates.log"
          python3 -O -m unittest discover \
            -s tests/workloads/android -p 'test_*.py' -v \
            2>&1 | tee "$RUNNER_TEMP/a08/unittest-optimized.log"
      - name: Verify Native full build memory and host reserve contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B compat/android/pocket4/native-full-profile-8gib/tests/test_resource_profile.py \
            2>&1 | tee "$RUNNER_TEMP/a08/native-full-profile-controls.log"
      - name: Verify completed Native release and Audio continuation contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B compat/android/pocket4/native-stage-release/tests/test_native_release.py \
            2>&1 | tee "$RUNNER_TEMP/a08/native-stage-release-controls.log"
          python3 -B -m unittest discover -s compat/android/pocket4/audio-continuation-r1/tests -v \
            2>&1 | tee "$RUNNER_TEMP/a08/audio-continuation-controls.log"
      - name: Verify exact source transfers and Linux build ownership
        shell: bash
        run: |
          set -euo pipefail
          (cd compat/android/pocket4/source-transfer-batches-r1 && python3 -B -m unittest discover -s tests -v) \
            2>&1 | tee "$RUNNER_TEMP/a08/source-transfer-batches.log"
          python3 -B compat/android/pocket4/git-transfer-layout-r1/test_git_transfer_layout.py \
            2>&1 | tee "$RUNNER_TEMP/a08/git-transfer-layout.log"
          python3 -B - <<'PYOWNED' 2>&1 | tee "$RUNNER_TEMP/a08/linux-build-ownership.log"
          import importlib.util
          from pathlib import Path
          import unittest
          path = Path('compat/android/pocket4/linux-build-lifecycle-r1/test_linux_build_support.py')
          spec = importlib.util.spec_from_file_location('owned_build_controls', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromModule(module))
          if result.testsRun != 9 or result.skipped or not result.wasSuccessful():
              raise SystemExit('All nine Linux ownership controls must actually execute')
          PYOWNED
          python3 -B - <<'PYCOMMAND' 2>&1 | tee "$RUNNER_TEMP/a08/process-command-witness.log"
          import importlib.util
          from pathlib import Path
          import sys
          import unittest
          directory = Path('compat/android/pocket4/process-command-witness-r1').resolve()
          sys.path.insert(0, str(directory))
          spec = importlib.util.spec_from_file_location('process_command_controls', directory / 'test_process_command_witness.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromModule(module))
          if result.testsRun != 10 or result.skipped or not result.wasSuccessful():
              raise SystemExit('All ten process command witness controls must actually execute on Linux')
          PYCOMMAND
      - name: Verify Linux host runtime source capsules
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B - <<'PYHOST' 2>&1 | tee "$RUNNER_TEMP/a08/host-runtime-capsules.log"
          import hashlib
          import json
          from pathlib import Path
          for name in ('host-gsi-layout', 'host-namespace-ownership'):
              directory = Path('compat/android/pocket4') / name
              manifest = json.loads((directory / 'FILES.json').read_bytes())
              for leaf, expected in manifest['files'].items():
                  path = directory / leaf
                  if path.is_symlink() or path.resolve().parent != directory.resolve():
                      raise SystemExit('Host capsule path is not a direct regular input')
                  raw = path.read_bytes()
                  if {'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()} != expected:
                      raise SystemExit('Host capsule source pin differs: ' + str(path))
              print(name + ': exact source capsule pins verified; Android runtime not executed by this step')
          PYHOST
      - name: Verify current source and admission corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PYCLOSURE' 2>&1 | tee "$RUNNER_TEMP/a08/current-source-corrections.log"
          import hashlib
          import importlib.util
          import json
          from pathlib import Path
          import sys
          import unittest
          capsules = ['audio-cts-compilation-budget-r1', 'process-start-observation-r1', 'qpr1-modern-vendor-admission', 'host-guest-directory-umask-r1', 'audio-errorprone-provider-r1']
          for name in capsules:
              directory = Path('compat/android/pocket4') / name
              manifest = json.loads((directory / 'FILES.json').read_bytes())
              for leaf, expected in manifest.get('files', manifest).items():
                  path = directory / leaf
                  if path.is_symlink() or path.resolve().parent != directory.resolve():
                      raise SystemExit('Source capsule path is not a direct regular file')
                  raw = path.read_bytes()
                  if {'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()} != expected:
                      raise SystemExit('Source capsule pin differs: ' + str(path))
          suites = [('audio-cts-compilation-budget-r1', 'test_go_runtime_budget.py', 8),
                    ('process-start-observation-r1', 'test_start_observation.py', 4),
                    ('qpr1-modern-vendor-admission', 'test_modern_vendor_guard.py', 9)]
          for index, (name, leaf, expected) in enumerate(suites):
              directory = (Path('compat/android/pocket4') / name).resolve()
              sys.path.insert(0, str(directory))
              spec = importlib.util.spec_from_file_location('closure_controls_' + str(index), directory / leaf)
              module = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(module)
              result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromModule(module))
              if result.testsRun != expected or result.skipped or not result.wasSuccessful():
                  raise SystemExit('All exact source correction controls must execute: ' + name)
              sys.path.pop(0)
          print('21 source/admission controls passed; Android runtime is a separate gate')
          PYCLOSURE
      - name: Verify Native normal Go budget source and controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B - <<'PYNATIVE' 2>&1 | tee "$RUNNER_TEMP/a08/native-go-budget-controls.log"
          import hashlib
          import importlib.util
          import json
          from pathlib import Path, PurePosixPath
          import stat
          import unittest
          directory = Path('compat/android/pocket4/native597-explicit-go-budget-r1').resolve()
          manifest = json.loads((directory / 'FILES.json').read_bytes())
          for name, expected in manifest.items():
              relative = PurePosixPath(name)
              if relative.is_absolute() or '..' in relative.parts or str(relative) != name:
                  raise SystemExit('Native source path is not canonical')
              path = directory / name
              if path.is_symlink() or not path.resolve().is_relative_to(directory):
                  raise SystemExit('Native source path escaped its capsule')
              if not stat.S_ISREG(path.lstat().st_mode) or path.lstat().st_nlink != 1:
                  raise SystemExit('Native source file type differs')
              raw = path.read_bytes()
              if {'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()} != expected:
                  raise SystemExit('Native source capsule hash differs: ' + name)
          spec = importlib.util.spec_from_file_location('native_budget_controls', directory / 'tests/test_go_runtime_budget.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromModule(module))
          if result.testsRun != 8 or result.skipped or not result.wasSuccessful():
              raise SystemExit('All eight actual Native metric-consumer controls must execute')
          print('8 Native metric-consumer controls passed; Android pair and runtime remain separate gates')
          PYNATIVE
      - name: Verify Audio recursive source closure and serialized plans
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B - <<'PYAUDIOSOURCE' 2>&1 | tee "$RUNNER_TEMP/a08/audio-source-plan-controls.log"
          import hashlib
          import importlib.util
          import json
          from pathlib import Path
          import stat
          import sys
          import unittest
          capsules = {
              'audio-cts-sts-recursive-closure-r1': ('ae98fdd2886bdd486341720377483b2a568641fb98b8f2d34dd615e18ba4a8e1', 8),
              'audio-source-plan-serialization-r1': ('987afa7a4457082e8d0a295f36dd5a7ba35bac19fe9a9dffb1a4842b818945ac', 4),
          }
          for name, (digest, count) in capsules.items():
              directory = Path('compat/android/pocket4', name).resolve()
              raw = (directory / 'FILES.json').read_bytes()
              if hashlib.sha256(raw).hexdigest() != digest:
                  raise SystemExit('Frozen Audio source manifest differs: ' + name)
              manifest = json.loads(raw)
              if type(manifest) is not dict or len(manifest) != count:
                  raise SystemExit('Exact Audio source inventory required: ' + name)
              for leaf, expected in manifest.items():
                  path = directory / leaf
                  if Path(leaf).name != leaf or path.is_symlink() or path.resolve().parent != directory:
                      raise SystemExit('Audio capsule member escaped: ' + leaf)
                  info = path.lstat()
                  if not stat.S_ISREG(info.st_mode) or info.st_nlink != 1:
                      raise SystemExit('Audio capsule member type differs: ' + leaf)
                  raw = path.read_bytes()
                  if {'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()} != expected:
                      raise SystemExit('Audio source capsule pin differs: ' + leaf)
          directory = Path('compat/android/pocket4/audio-source-plan-serialization-r1').resolve()
          sys.path.insert(0, str(directory))
          spec = importlib.util.spec_from_file_location('audio_source_plan_controls', directory / 'test_source_plan_guard.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromModule(module))
          if result.testsRun != 12 or result.skipped or not result.wasSuccessful():
              raise SystemExit('All twelve source-plan serialization controls must execute')
          print('12 Audio source-plan controls passed; complete APEX and runtime remain separate gates')
          PYAUDIOSOURCE
      - name: Verify retained Binder credentials, Native source and Audio custody
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B - <<'PYCURRENTCAPSULES' 2>&1 | tee "$RUNNER_TEMP/a08/current-source-capsules.log"
          import hashlib
          import importlib.util
          import json
          from pathlib import Path, PurePosixPath
          import stat
          import sys
          import unittest
          capsules = {'native597-original-llvm-plugin-cones-r1': ('75bde519a097f50940576b13b8c5bafb4fe4c1fb54d44cf1f168dd730ab5da7c', 12), 'audio-canonical-custody-r1': ('42ead27bc89d5d866eddfd951e0dbfb91af1ff1c4e2843946fe4eee34925f1d5', 3), 'apparmor-binder-retained-credential-r1': ('243e3355ecfa6f96af8839ffa10854c796a3b22e03a5d924c778fb47aa83f4b9', 6), 'production-identity-reservation-r1': ('eee9cec9ecbd9b71cdda9df13bb0446124001a5826932709561126896881ffea', 3), 'native600-original-provider-closure-r1': ('d40f8629af9741d8bc4dc09bb89389fe2b1c7348e3ea02d72b01dca1908c6cc6', 18), 'audio425-original-provider-closure-r1': ('257bc3f071fd09c6b908ef80fdf0fe50617259c33b9083b0d66da6e270a6a450', 23), 'native600-rkpd-apex-r1': ('f33f622023fb328ea88c79a2fb29f7f7a9c1c3427af0a31b53bbdfc8c9fc4889', 9)}
          for name, (digest, count) in capsules.items():
              directory = Path('compat/android/pocket4', name).resolve(strict=True)
              raw = (directory / 'FILES.json').read_bytes()
              if hashlib.sha256(raw).hexdigest() != digest:
                  raise SystemExit('Frozen source manifest differs: ' + name)
              manifest = json.loads(raw)
              members = manifest.get('files', manifest)
              if type(members) is not dict or len(members) != count:
                  raise SystemExit('Exact source inventory required: ' + name)
              actual = set()
              for path in directory.rglob('*'):
                  info = path.lstat()
                  if stat.S_ISLNK(info.st_mode):
                      raise SystemExit('Symlink in source capsule: ' + str(path))
                  if stat.S_ISDIR(info.st_mode):
                      continue
                  if not stat.S_ISREG(info.st_mode) or info.st_nlink != 1:
                      raise SystemExit('Source member type differs: ' + str(path))
                  actual.add(path.relative_to(directory).as_posix())
              if actual != set(members) | {'FILES.json'}:
                  raise SystemExit('Unexpected source capsule member: ' + name)
              for relative, expected in members.items():
                  rel = PurePosixPath(relative)
                  path = directory / relative
                  if rel.is_absolute() or '..' in rel.parts or str(rel) != relative or not path.resolve(strict=True).is_relative_to(directory):
                      raise SystemExit('Source member escaped: ' + relative)
                  data = path.read_bytes()
                  if {'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()} != expected:
                      raise SystemExit('Source member pin differs: ' + relative)
          directory = Path('compat/android/pocket4/audio-canonical-custody-r1').resolve()
          sys.path.insert(0, str(directory))
          spec = importlib.util.spec_from_file_location('audio_canonical_custody_controls', directory / 'test_canonical_audio_import.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          result = unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromModule(module))
          if result.testsRun != 19 or result.skipped or not result.wasSuccessful():
              raise SystemExit('All nineteen canonical Audio custody controls must execute')
          print('7 exact source capsules and 19 custody controls passed; Android runtime remains a separate gate')
          PYCURRENTCAPSULES
      - name: Verify supervisor inputs, Native observations and cleanup visibility
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B - <<'PYREVIEW' 2>&1 | tee "$RUNNER_TEMP/a08/independent-review-controls.log"
          import hashlib
          import importlib.util
          import json
          from pathlib import Path, PurePosixPath
          import stat
          import subprocess
          import sys
          capsules = [('production-identity-input-validation-r1', 'FILES.json', '473a68243cb0641c1c96d4b34de2f6a29936826f12a29890bbc6a903ef366853', 8), ('native600-allocation-observation-r1', 'manifest.json', 'e0b80c1c3baa9726e1f8739fc46f85cf944dff7a458b1e5c9703b4707b2a9118', 14), ('cleanup-current-inputs-r1', 'FILES.json', '20587c6e0d3451712fa6b2d4f67ea7008648d1d1c78e553bbb89cb0ffb4b194b', 17), ('production-userns-audit-r1', 'FILES.json', 'a1deacfd0bb40fec96a22b24391abb29b7eb97dc2a76799a181c679b27e55720', 8), ('private-control-driver-guards-r1', 'FILES.json', '1cc941b09d767383099f4a3aaedf0ad7351d8d28adf9447b445acae6ad7ecf88', 6), ('official-app-source-reconciliation-r1', 'FILES.json', '4a10a8aa354c3623c9dfb951c67df8c247a2c036183683674216c0f8017e06fc', 2), ('native600-tradefed-provider-closure-r1', 'FILES.json', 'deb7afe31bbdddd7bc0f48ec6b89750b230ea9845a0e143389e45dc20d12487f', 7), ('production-namespace-broker-r2-review-r1', 'manifest.json', 'a812554f12216680d5b4106b4dac10caa300b4bf1f86871b7e36cca336ce0241', 21)]
          for name, manifest_leaf, expected_sha, expected_count in capsules:
              directory = Path('compat/android/pocket4', name).resolve(strict=True)
              raw = (directory / manifest_leaf).read_bytes()
              if hashlib.sha256(raw).hexdigest() != expected_sha:
                  raise SystemExit('Frozen review manifest differs: ' + name)
              manifest = json.loads(raw)
              rows = manifest['files']
              members = ({row['path']: {'bytes': row['bytes'], 'sha256': row['sha256']} for row in rows}
                         if type(rows) is list else rows)
              if type(members) is not dict or len(rows) != len(members) or len(members) != expected_count:
                  raise SystemExit('Exact review source inventory required: ' + name)
              actual = set()
              for path in directory.rglob('*'):
                  info = path.lstat()
                  if stat.S_ISDIR(info.st_mode):
                      continue
                  if not stat.S_ISREG(info.st_mode) or info.st_nlink != 1:
                      raise SystemExit('Invalid review member type: ' + str(path))
                  actual.add(path.relative_to(directory).as_posix())
              if actual != set(members) | {manifest_leaf}:
                  raise SystemExit('Unexpected review source member: ' + name)
              for leaf, expected in members.items():
                  relative = PurePosixPath(leaf)
                  path = directory / leaf
                  if relative.is_absolute() or '..' in relative.parts or str(relative) != leaf or not path.resolve(strict=True).is_relative_to(directory):
                      raise SystemExit('Review source escaped its capsule: ' + leaf)
                  data = path.read_bytes()
                  if {'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()} != expected:
                      raise SystemExit('Review source pin differs: ' + leaf)
              print(name + ': exact source capsule verified', flush=True)

          def run(arguments, *, input=None):
              subprocess.run(arguments, input=input, text=True, check=True, timeout=120)

          base = Path('compat/android/pocket4').resolve()
          run([sys.executable, '-I', '-B', str(base / 'production-identity-input-validation-r1/verify_source_chain.py'), '--repo-root', '.'])
          run([sys.executable, '-I', '-B', str(base / 'cleanup-current-inputs-r1/verify_reference_patch.py')])
          run([sys.executable, '-I', '-B', '-O', str(base / 'cleanup-current-inputs-r1/verify_reference_patch.py')])
          for optimization in ([], ['-O']):
              run([sys.executable, '-I', '-B', *optimization, str(base / 'native600-allocation-observation-r1/verify.py')])
              run([sys.executable, '-I', '-B', *optimization, str(base / 'native600-tradefed-provider-closure-r1/verify_source_delta.py'), '--repo-root', '.'])

          controls = """
          import importlib.util
          import json
          from pathlib import Path
          import sys
          import unittest
          directory = Path(sys.argv[1]).resolve()
          names = json.loads(sys.argv[2])
          expected = int(sys.argv[3])
          sys.path.insert(0, str(directory))
          suite = unittest.TestSuite()
          for index, name in enumerate(names):
              spec = importlib.util.spec_from_file_location('review_control_' + str(index), directory / name)
              module = importlib.util.module_from_spec(spec)
              sys.modules[spec.name] = module
              spec.loader.exec_module(module)
              suite.addTests(unittest.defaultTestLoader.loadTestsFromModule(module))
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun != expected or result.skipped or not result.wasSuccessful():
              raise SystemExit('Every exact review control must execute successfully')
          """
          for optimization in ([], ['-O']):
              run([sys.executable, '-I', '-B', *optimization, '-', str(base / 'cleanup-current-inputs-r1'),
                   json.dumps(['test_verify_current_inputs.py', 'test_reference_observer.py']), '54'], input=controls)
          run([sys.executable, '-I', '-B', '-O', '-', str(base / 'native600-allocation-observation-r1'),
               json.dumps(['test_verifier_smoke.py']), '2'], input=controls)
          print('Source replay and isolated controls passed; this step does not run Rust, Android, or application acceptance')
          PYREVIEW
      - name: Verify Native600 RKPD source consumer
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B - <<'PYRKPD600' 2>&1 | tee "$RUNNER_TEMP/a08/native600-rkpd-controls.log"
          from pathlib import Path
          import sys
          import unittest
          directory = Path('compat/android/pocket4/native600-rkpd-apex-r1/controls').resolve()
          sys.path.insert(0, str(directory))
          suite = unittest.defaultTestLoader.discover(str(directory), pattern='test_*.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun != 12 or result.skipped or not result.wasSuccessful():
              raise SystemExit('All twelve current RKPD source controls must execute')
          print('12 RKPD source controls passed; complete artifacts and runtime remain unqualified')
          PYRKPD600
      - name: Verify Native600 complete build ownership controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B - <<'PYNATIVE600' 2>&1 | tee "$RUNNER_TEMP/a08/native600-controls.log"
          from pathlib import Path
          import sys
          import unittest
          directory = Path('compat/android/pocket4/native600-original-provider-closure-r1/controls').resolve()
          sys.path.insert(0, str(directory))
          suite = unittest.defaultTestLoader.discover(str(directory), pattern='test_*.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.testsRun != 67 or result.skipped or not result.wasSuccessful():
              raise SystemExit('All 67 Native600 Linux controls must execute')
          print('67 Native600 source controls passed; complete artifacts and runtime remain unqualified')
          PYNATIVE600
      - name: Verify Audio425 complete allocation controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B compat/android/pocket4/audio425-original-provider-closure-r1/allocation-observer/run_portable_tests.py \
            2>&1 | tee "$RUNNER_TEMP/a08/audio425-allocation-controls.log"
          python3 -I -B - "$RUNNER_TEMP/a08/audio425-allocation-controls.log" <<'PYAUDIO425'
          import json
          from pathlib import Path
          import sys
          records = [json.loads(line) for line in Path(sys.argv[1]).read_text().splitlines() if line.startswith('{')]
          if len(records) != 1:
              raise SystemExit('One complete Audio allocation result is required')
          report = records[0]
          if not report.get('supported') or report.get('run') != 17 or report.get('passed') != 17 or report.get('skipped') != 0 or report.get('failures') != 0 or report.get('errors') != 0:
              raise SystemExit('All 17 Audio425 Linux controls must execute')
          print('17 Audio allocation controls passed; complete APEX and runtime remain unqualified')
          PYAUDIO425
      - name: Verify actual cleanup references in private Linux namespaces
        shell: bash
        run: |
          set -euo pipefail
          fixture_base="$RUNNER_TEMP/a08/cleanup-alias-fixtures"
          mkdir "$fixture_base"
          sudo -n env NAMESPACE_FIXTURE_DIR="$fixture_base" /usr/bin/python3 -I -B \
            compat/android/pocket4/cleanup-current-inputs-r1/verify_isolated_alias_views.py \
