                'test result: ok. 5 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out;'])]:
              text = (evidence / observed).read_text()
              reference = (capsule / 'evidence/r3' / original).read_text()
              names = lambda value: collections.Counter(re.findall(r'^test (\S+) \.\.\. ok$', value, re.M))
              if names(text) != names(reference) or sum(names(text).values()) != count:
                  raise SystemExit('Exact original test names must execute: ' + observed)
              if any(text.count(summary) != 1 for summary in summaries):
