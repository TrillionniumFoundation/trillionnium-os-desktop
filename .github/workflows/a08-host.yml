name: A08 Android source integrity and host probes

on:
  pull_request:
    paths:
      - 'compat/android/**'
      - 'support/android/**'
      - 'tests/workloads/android/**'
      - '.github/workflows/a08-host.yml'
      - 'README.md'
  push:
    branches: [main]
    paths:
      - 'compat/android/**'
      - 'support/android/**'
      - 'tests/workloads/android/**'
      - '.github/workflows/a08-host.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-linux-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require complete source and test inputs before discovery
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md && test ! -s README.md
          mkdir -p "$RUNNER_TEMP/a08"
          python3 support/android/verify_source_integrity.py \
            --out "$RUNNER_TEMP/a08/source-integrity.json"
      - name: Install Java, JNI and media host test tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential openjdk-17-jdk-headless ffmpeg
          test -x /usr/lib/jvm/java-17-openjdk-amd64/bin/javac
          test -f /usr/lib/jvm/java-17-openjdk-amd64/include/jni.h
          test -x /usr/bin/ffmpeg
          test -x /usr/bin/ffprobe
          printf '%s\n' /usr/lib/jvm/java-17-openjdk-amd64/bin >> "$GITHUB_PATH"
          printf 'JAVA_HOME=%s\n' /usr/lib/jvm/java-17-openjdk-amd64 >> "$GITHUB_ENV"
      - name: Run complete host gate and optimized regression
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python3 --version
          javac -version
          java -version
          python3 support/android/verify_host.py \
            --out "$RUNNER_TEMP/a08/host-gates.json" \
            2>&1 | tee "$RUNNER_TEMP/a08/host-gates.log"
          python3 -O -m unittest discover \
            -s tests/workloads/android -p 'test_*.py' -v \
            2>&1 | tee "$RUNNER_TEMP/a08/unittest-optimized.log"
      - name: Verify Native full build memory and host reserve contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B compat/android/pocket4/native-full-profile-8gib/tests/test_resource_profile.py \
            2>&1 | tee "$RUNNER_TEMP/a08/native-full-profile-controls.log"
      - name: Verify completed Native release and Audio continuation contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B compat/android/pocket4/native-stage-release/tests/test_native_release.py \
            2>&1 | tee "$RUNNER_TEMP/a08/native-stage-release-controls.log"
          python3 -B -m unittest discover -s compat/android/pocket4/audio-continuation-r1/tests -v \
            2>&1 | tee "$RUNNER_TEMP/a08/audio-continuation-controls.log"
      - name: Preserve the qualified Sensor candidate during composition
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B compat/android/pocket4/stage-existing-sensor/tests/test_existing_sensor.py \
            2>&1 | tee "$RUNNER_TEMP/a08/existing-sensor-controls.log"
      - name: Exercise owned Camera media through actual Linux descriptors
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I -B compat/android/pocket4/camera-video-media/tests/test_camera_video_decode.py \
            --report "$RUNNER_TEMP/a08/camera-video-controls.json"
      - name: Exercise current Camera r4 decoder through actual Linux descriptors
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$RUNNER_TEMP/a08/camera-r4-decoder-controls.json"
          /usr/bin/python3 -I -B compat/android/pocket4/camera-video-r4/tests/test_camera_r4_decode.py \
            --report "$RUNNER_TEMP/a08/camera-r4-decoder-controls.json"
          /usr/bin/python3 -I -B - "$RUNNER_TEMP/a08/camera-r4-decoder-controls.json" <<'PYGATE'
          import json
          import sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if report.get("schema") != "pocket4-camera-r4-decoder-component-controls-v1":
              raise SystemExit("Unexpected Camera r4 decoder report schema")
          for key, expected in (("tests_run", 11), ("failures", 0), ("errors", 0), ("skipped", 0)):
              if type(report.get(key)) is not int or report[key] != expected:
                  raise SystemExit("Camera r4 decoder report count mismatch: " + key)
          if report.get("passed") is not True or report.get("failed_tests") != []:
              raise SystemExit("Camera r4 decoder controls did not all pass")
          print(json.dumps({"Camera_r4_decoder_tests": 11, "failures": 0, "errors": 0, "skipped": 0,
                            "runtime_qualified": False}, sort_keys=True))
          PYGATE
      - name: Exercise the single current Camera preparation and state sources
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$RUNNER_TEMP/a08/camera-current-source-controls.json"
          sudo -n /usr/bin/python3 -I -B compat/android/pocket4/closeout-20261107/continuation/camera_video_current/tests/run_current_source_controls.py \
            --report "$RUNNER_TEMP/a08/camera-current-source-controls.json"
          /usr/bin/python3 -I -B - "$RUNNER_TEMP/a08/camera-current-source-controls.json" <<'PYCURRENT'
          import json
          import sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if report.get("schema") != "pocket4-camera-current-source-controls-v1":
              raise SystemExit("Unexpected current Camera source report schema")
          if report.get("inventory_sha256") != "28e61371c50638a3ac33d4e28b0466754bc2b81c9f5d015f262d43e60243dd00":
              raise SystemExit("Current Camera source inventory changed")
          for key, expected in (("tests_run", 38), ("expected_tests", 38), ("uid", 0), ("euid", 0)):
              if type(report.get(key)) is not int or report[key] != expected:
                  raise SystemExit("Current Camera source count or construction identity mismatch: " + key)
          expected_suites = [("preparation", 11), ("display_contract", 18), ("state_public_api", 9)]
          suites = report.get("suites")
          if type(suites) is not list or len(suites) != len(expected_suites):
              raise SystemExit("Current Camera source suite inventory changed")
          for row, (family, count) in zip(suites, expected_suites):
              if type(row) is not dict or row.get("family") != family:
                  raise SystemExit("Current Camera source suite order changed")
              for key, expected in (("expected", count), ("tests_run", count), ("failures", 0), ("errors", 0), ("skipped", 0)):
                  if type(row.get(key)) is not int or row[key] != expected:
                      raise SystemExit("Current Camera source suite did not all pass: " + family + ":" + key)
          if report.get("passed") is not True or report.get("source_bytes_unchanged") is not True:
              raise SystemExit("Current Camera source controls did not preserve their inputs")
          before = report.get("source_and_control_inputs_before")
          if type(before) is not list or len(before) != 41 or before != report.get("source_and_control_inputs_after"):
              raise SystemExit("Current Camera source input inventory changed")
          for key in ("prior_host_qualification_transferred", "real_UID_1000_decoder_qualified", "real_display_lease_qualified", "runtime_qualified", "whole_app_business_accepted"):
              if report.get(key) is not False:
                  raise SystemExit("Source controls cannot grant host or device qualification: " + key)
          for key in ("Main_actions", "Android_UI_actions", "physical_audio_stream_actions"):
              if type(report.get(key)) is not int or report[key] != 0:
                  raise SystemExit("Unexpected device or Main action: " + key)
          print(json.dumps({"Camera_current_source_tests": 38, "passed": True,
                            "runtime_qualified": False, "historical_host_qualification_transferred": False}, sort_keys=True))
          PYCURRENT
      - name: Preserve host evidence without implying Android guest success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a08-source-and-host-evidence
          if-no-files-found: warn
          path: ${{ runner.temp }}/a08/
