name: A08 Android source integrity and host probes

on:
  pull_request:
    paths:
      - 'compat/android/**'
      - 'support/android/**'
      - 'tests/workloads/android/**'
      - '.github/workflows/a08-host.yml'
      - 'README.md'
  push:
    branches: [main]
    paths:
      - 'compat/android/**'
      - 'support/android/**'
      - 'tests/workloads/android/**'
      - '.github/workflows/a08-host.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-linux-host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require complete source and test inputs before discovery
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md && test ! -L README.md && test -s README.md
          mkdir -p "$RUNNER_TEMP/a08"
          python3 support/android/verify_source_integrity.py \
            --out "$RUNNER_TEMP/a08/source-integrity.json"
      - name: Verify runner Java 17 and JNI host build tools
        shell: bash
        run: |
          set -euo pipefail
          jdk_home="${JAVA_HOME_17_X64:?The runner must provide its Java 17 toolchain}"
          test -x "$jdk_home/bin/java"
          test -x "$jdk_home/bin/javac"
          test -f "$jdk_home/include/jni.h"
          test -f "$jdk_home/include/linux/jni_md.h"
          test -f "$jdk_home/lib/server/libjvm.so"
          javac_version="$("$jdk_home/bin/javac" -version 2>&1)"
          [[ "$javac_version" == 'javac 17.'* ]]
          java_properties="$(LC_ALL=C "$jdk_home/bin/java" -XshowSettings:properties -version 2>&1)"
          [[ "$java_properties" =~ java\.specification\.version[[:space:]]*=[[:space:]]*17($|[[:space:]]) ]]
          for tool in cc c++ make ar; do
            command -v "$tool"
          done
          printf '%s\n' "$javac_version"
          "$jdk_home/bin/java" -version
          printf '%s\n' "$jdk_home/bin" >> "$GITHUB_PATH"
          printf 'JAVA_HOME=%s\n' "$jdk_home" >> "$GITHUB_ENV"
      - name: Run complete host gate and optimized regression
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python3 --version
          javac -version
          java -version
          python3 support/android/verify_host.py \
            --out "$RUNNER_TEMP/a08/host-gates.json" \
            2>&1 | tee "$RUNNER_TEMP/a08/host-gates.log"
          python3 -O -m unittest discover \
            -s tests/workloads/android -p 'test_*.py' -v \
            2>&1 | tee "$RUNNER_TEMP/a08/unittest-optimized.log"
      - name: Preserve host evidence without implying Android guest success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a08-source-and-host-evidence
          if-no-files-found: warn
          path: ${{ runner.temp }}/a08/
