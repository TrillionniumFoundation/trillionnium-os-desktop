name: finalize-d0c04-host-evidence

on:
  push:
    branches:
      - codex/d0c04-host-validated-v4
    paths:
      - .github/workflows/finalize-d0c04-host-evidence.yml

permissions:
  contents: write

concurrency:
  group: finalize-d0c04-host-evidence
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/d0c04-host-validated-v4

      - name: Install exact Rust 1.93.0 toolchain
        run: |
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup default 1.93.0
          rustc --version
          cargo --version

      - name: Re-run exact product gate
        run: |
          python3 tools/validate_repository.py
          python3 tools/validate_d0c04_rust_product.py
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo run --locked -p hepta-browserd -- --self-check

      - name: Promote canonical evidence
        run: python3 tools/finalize_d0c04_host_evidence.py

      - name: Validate promoted state
        run: |
          python3 tools/validate_repository.py
          python3 tools/validate_d0c04_rust_product.py
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo run --locked -p hepta-browserd -- --self-check
          git diff --check

      - name: Commit evidence and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/finalize-d0c04-host-evidence.yml
          git add contracts/agent-port-bridge.v1.json \
            docs/CURRENT_STATE.md docs/MANIFEST.json docs/evidence \
            manifests/d0c04-candidate.json manifests/repository-state.json \
            tools/finalize_d0c04_host_evidence.py \
            tools/validate_d0c04_rust_product.py tools/validate_repository.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: promote D0C-04 host-validation evidence"
          git push origin HEAD:codex/d0c04-host-validated-v4
