name: ACT-2 Notes fence native qualification

on:
  push:
    branches: [feat/act2-notes-fence-20261110]

permissions:
  contents: read

jobs:
  native-fence-and-checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_TARGET_DIR: /tmp/act2-notes-fence-target
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d86e0fa8f147d6539442c26a61ebba8becc19489
        with:
          toolchain: 1.96.0
          components: rustfmt,clippy
      - name: Bind source and native prerequisites
        run: |
          set -euo pipefail
          mkdir -m 700 /tmp/act2-notes-fence-records
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD HEAD^{tree} > /tmp/act2-notes-fence-records/source-before.txt
          sha256sum ui/Cargo.lock > /tmp/act2-notes-fence-records/lock.sha256
          rustc --version --verbose > /tmp/act2-notes-fence-records/rustc.txt
          git config --global credential.helper '!gh auth git-credential'
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake protobuf-compiler libssl-dev pkg-config libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libgbm-dev
          dpkg-query -W > /tmp/act2-notes-fence-records/packages.tsv
      - name: Test complete core including legacy checkpoints and durable fence store
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path ui/Cargo.toml -p trill-ui-core \
            > /tmp/act2-notes-fence-records/core.log 2>&1
      - name: Test the original App worker
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path ui/Cargo.toml -p trill-app-window --bin trill-app-window \
            > /tmp/act2-notes-fence-records/app.log 2>&1
      - name: Build Session and App with original locks
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path ui/Cargo.toml -p trill-session -p trill-app-window --bins \
            > /tmp/act2-notes-fence-records/build.log 2>&1
          sha256sum /tmp/act2-notes-fence-target/debug/trill-session /tmp/act2-notes-fence-target/debug/trill-app-window \
            > /tmp/act2-notes-fence-records/binaries.sha256
      - name: Scoped lint and final formatter
        run: |
          set -euo pipefail
          cargo clippy --locked --manifest-path ui/Cargo.toml -p trill-ui-core -p trill-app-window --all-targets \
            > /tmp/act2-notes-fence-records/clippy.log 2>&1
          test -z "$(git status --porcelain)"
          cargo fmt --manifest-path ui/Cargo.toml --all \
            > /tmp/act2-notes-fence-records/formatter.log 2>&1
      - name: Preserve exact source and formatter postimages
        if: always()
        run: |
          mkdir -p /tmp/act2-notes-fence-records
          git rev-parse HEAD HEAD^{tree} > /tmp/act2-notes-fence-records/source-after.txt
          git status --porcelain > /tmp/act2-notes-fence-records/source-status-after.txt
          git diff --binary > /tmp/act2-notes-fence-records/final-source.patch
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          paths = subprocess.check_output(['git', 'diff', '--name-only', '-z']).decode().strip('\0').split('\0')
          records = [{'path': p, 'sha256': hashlib.sha256(Path(p).read_bytes()).hexdigest(), 'content': Path(p).read_text()} for p in paths if p]
          Path('/tmp/act2-notes-fence-records/formatted-files.json').write_text(json.dumps(records, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: act2-notes-fence-native
          path: /tmp/act2-notes-fence-records
          if-no-files-found: error
          retention-days: 14
