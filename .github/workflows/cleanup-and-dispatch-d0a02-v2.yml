name: cleanup-and-dispatch-d0a02-v2

on:
  push:
    branches:
      - codex/d0a02-workspace-composition-v2
    paths:
      - ".github/workflows/cleanup-and-dispatch-d0a02-v2.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  converge-composition-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d0a02-workspace-composition-v2
          fetch-depth: 0

      - name: Cancel obsolete composition runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=codex%2Fd0a02-workspace-composition-v2&per_page=100" \
            --jq '.workflow_runs[] | select((.status == "queued" or .status == "in_progress") and .id != env.GITHUB_RUN_ID and .name != "finalize-d0a02-composition-v2") | .id' \
            | while read -r run_id; do
                [[ -n "$run_id" ]] || continue
                gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
              done

      - name: Remove obsolete workflow and dispatch v2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -f .github/workflows/qualify-d0a02-workspace-composition.yml
          rm -f .github/workflows/cleanup-and-dispatch-d0a02-v2.yml
          test -f .github/workflows/finalize-d0a02-composition-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "ci: converge D0A-02 qualification onto v2"
            git push origin HEAD:codex/d0a02-workspace-composition-v2
          fi
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/finalize-d0a02-composition-v2.yml/dispatches" \
            -f ref=codex/d0a02-workspace-composition-v2
