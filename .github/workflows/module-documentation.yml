      - "tools/validate_repository.py"
      - "tools/validate_rust_browser_codec.py"
      - "contracts/configured-retained-bootstrap.v1.json"
      - "tools/verify_configured_retained_bootstrap.py"
      - "tests/test_configured_retained_bootstrap.py"
      - "tools/verify_ci_required_contexts.py"
      - "contracts/ci-required-contexts.v1.json"
      - "tests/test_ci_required_contexts.py"
