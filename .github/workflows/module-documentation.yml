      - "contracts/immutable-callback-url-scope.v1.json"
      - "docs/architecture/IMMUTABLE_CALLBACK_URL_SCOPE.md"
      - "tests/test_immutable_callback_url_scope.py"
      - "tools/verify_immutable_callback_url_scope.py"
      - "contracts/g6a-immutable-ab.v1.json"
      - "docs/architecture/G6A_IMMUTABLE_AB_FIXTURE.md"
      - "manifests/debian-g6a.lock.v1.json"
      - "manifests/debian-g6a.requirements.v1.json"
      - "manifests/debian-g6a.selection.v1.json"
      - "packaging/debian/g6a/fixture-init"
      - "packaging/debian/g6a/guest_selector.py"
      - "packaging/debian/g6a/init"
      - "packaging/debian/g6a/root_probe.py"
      - "tests/qemu/run_g6a_qualification.py"
      - "tests/test_g6a_immutable_ab.py"
      - "tools/build_g6a_fixture.py"
      - "tools/resolve_g6a_inputs.py"
      - "tools/verify_g6a_fixture.py"
      - "tools/resolve_debian_snapshot.py"
      - "tools/resolve_debian_snapshot_with_pinned_keys.py"
      - "packaging/debian/README.md"
      - "platform/README.md"
      - "docs/DEVELOPMENT_GUIDE.md"
permissions:
  contents: read

concurrency:
  group: module-documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head:
    name: module-documentation / exact-head
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify canonical live source role
        shell: bash
        env:
          CI_SOURCE_ROLE: head
          CI_SOURCE_EVENT: ${{ github.event_name }}
          CI_SOURCE_REPOSITORY: ${{ github.repository }}
          CI_SOURCE_REF: ${{ github.ref }}
          CI_SOURCE_REF_NAME: ${{ github.ref_name }}
          CI_SOURCE_SHA: ${{ github.sha }}
          CI_SOURCE_PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_SOURCE_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_SOURCE_PR_BASE: ${{ github.event.pull_request.base.sha }}
          CI_SOURCE_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          python3 -B tools/verify_ci_source_identity.py

      - name: Validate module documentation contract
        run: /usr/bin/python3 -I tools/validate_module_documentation.py

      - name: Validate documentation coherence
        run: python3 tools/validate_documentation_coherence.py

      - name: Assert exact source identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          git rev-parse HEAD^{tree}

      - name: Run module hostile corpus and related repository validators
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_module_documentation*.py' -v
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 tools/validate_rust_browser_codec.py >/tmp/codec-audit.json

  prospective-merge:
    name: module-documentation / prospective-merge
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out prospective merge object
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 2
          persist-credentials: false

      - name: Verify canonical live source role
        shell: bash
        env:
          CI_SOURCE_ROLE: prospective-merge
          CI_SOURCE_EVENT: ${{ github.event_name }}
          CI_SOURCE_REPOSITORY: ${{ github.repository }}
          CI_SOURCE_REF: ${{ github.ref }}
          CI_SOURCE_REF_NAME: ${{ github.ref_name }}
          CI_SOURCE_SHA: ${{ github.sha }}
          CI_SOURCE_PR_NUMBER: ${{ github.event.pull_request.number }}
          CI_SOURCE_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          CI_SOURCE_PR_BASE: ${{ github.event.pull_request.base.sha }}
          CI_SOURCE_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          python3 -B tools/verify_ci_source_identity.py

      - name: Validate module documentation contract
        run: /usr/bin/python3 -I tools/validate_module_documentation.py

      - name: Validate documentation coherence
        run: python3 tools/validate_documentation_coherence.py

      - name: Assert live parent order
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse HEAD^1)" = "${{ github.event.pull_request.base.sha }}"
          test "$(git rev-parse HEAD^2)" = "${{ github.event.pull_request.head.sha }}"
          git rev-parse HEAD^{tree}

      - name: Validate prospective module graph
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_module_documentation*.py' -v
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
