name: module-documentation

on:
  pull_request:
    paths:
      - ".github/workflows/module-documentation.yml"
      - ".github/workflows/ci.yml"
      - "Cargo.toml"
      - "apps/**/Cargo.toml"
      - "apps/**/README.md"
      - "crates/**/Cargo.toml"
      - "crates/**/README.md"
      - "docs/modules/**"
      - "docs/README.md"
      - "manifests/modules.v1.json"
      - "tools/validate_module_documentation.py"
      - "tests/test_module_documentation.py"
      - "tests/test_module_documentation_integration_hardening.py"
      - "CONTRIBUTING.md"
      - "Makefile"
  push:
    branches: [main, "codex/**"]
    paths:
      - ".github/workflows/module-documentation.yml"
      - ".github/workflows/ci.yml"
      - "Cargo.toml"
      - "apps/**/Cargo.toml"
      - "apps/**/README.md"
      - "crates/**/Cargo.toml"
      - "crates/**/README.md"
      - "docs/modules/**"
      - "docs/README.md"
      - "manifests/modules.v1.json"
      - "tools/validate_module_documentation.py"
      - "tests/test_module_documentation.py"
      - "tests/test_module_documentation_integration_hardening.py"
      - "CONTRIBUTING.md"
      - "Makefile"

permissions:
  contents: read

concurrency:
  group: module-documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Assert exact source identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          git rev-parse HEAD^{tree}
      - name: Validate module documentation contract
        run: python3 tools/validate_module_documentation.py
      - name: Run module hostile corpus and related repository validators
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_module_documentation*.py' -v
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 tools/validate_rust_browser_codec.py >/tmp/codec-audit.json

  prospective-merge:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out prospective merge object
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 2
          persist-credentials: false
      - name: Assert live parent order
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse HEAD^1)" = "${{ github.event.pull_request.base.sha }}"
          test "$(git rev-parse HEAD^2)" = "${{ github.event.pull_request.head.sha }}"
          git rev-parse HEAD^{tree}
      - name: Validate module documentation contract
        run: python3 tools/validate_module_documentation.py
      - name: Validate prospective module graph
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_module_documentation*.py' -v
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
