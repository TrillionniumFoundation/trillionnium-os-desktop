name: temporary-d2i-auto-repair

on:
  push:
    branches:
      - codex/d2i-auto-repair-v1

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: read

concurrency:
  group: temporary-d2i-auto-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: codex/full-gap-closure-final
      PR_NUMBER: "52"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repair controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/d2i-auto-repair-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned repository toolchain
        run: |
          set -euo pipefail
          channel=$(python3 - <<'PY'
          from pathlib import Path
          import tomllib
          print(tomllib.loads(Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])
          PY
          )
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustup override set "$channel"

      - name: Follow D2I failures and publish only evidence-bound repairs
        run: |
          set -euo pipefail
          mkdir -p /tmp/d2i-auto-repair
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          wait_for_run() {
            local candidate=$1
            local merge_sha=
            local run_id=
            local conclusion=
            for attempt in $(seq 1 120); do
              pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
              head=$(jq -r '.head.sha' <<<"$pr")
              merge=$(jq -r '.merge_commit_sha // empty' <<<"$pr")
              if [[ "$head" == "$candidate" && -n "$merge" ]]; then
                merge_sha=$merge
                break
              fi
              sleep 10
            done
            [[ -n "$merge_sha" ]] || return 2
            for attempt in $(seq 1 260); do
              runs=$(gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/d2i-integrated-image.yml/runs?event=pull_request&branch=$TARGET_BRANCH&per_page=50")
              run=$(jq -c --arg sha "$merge_sha" \
                '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last // empty' \
                <<<"$runs")
              if [[ -n "$run" ]]; then
                run_id=$(jq -r '.id' <<<"$run")
                status=$(jq -r '.status' <<<"$run")
                if [[ "$status" == completed ]]; then
                  conclusion=$(jq -r '.conclusion // "unknown"' <<<"$run")
                  break
                fi
              fi
              sleep 15
            done
            [[ -n "$run_id" && -n "$conclusion" ]] || return 3
            printf '%s\t%s\t%s\t%s\n' "$candidate" "$merge_sha" "$run_id" "$conclusion" \
              >> /tmp/d2i-auto-repair/attempts.tsv
            printf '%s\t%s\n' "$run_id" "$conclusion"
          }

          for cycle in $(seq 1 3); do
            candidate=
            for attempt in $(seq 1 180); do
              git fetch --no-tags origin \
                "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
              head=$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH")
              if git log --format=%s "$head" | \
                  grep -Fxq "feat(d3): bind development peer to trusted executable source"; then
                echo "D3 is already integrated; D2I repair ownership has ended"
                exit 0
              fi
              if git log --format=%s "$head" | \
                  grep -Fxq "fix(d2i): constrain llvmpipe and bind image-local input evidence"; then
                candidate=$head
                break
              fi
              sleep 10
            done
            [[ -n "$candidate" ]] || {
              echo "primary D2I v3 candidate was not published" >&2
              exit 1
            }

            result=$(wait_for_run "$candidate") || {
              echo "unable to resolve exact D2I run for $candidate" >&2
              exit 1
            }
            run_id=${result%%$'\t'*}
            conclusion=${result#*$'\t'}
            if [[ "$conclusion" == success ]]; then
              echo "D2I exact-head qualification passed at $candidate"
              exit 0
            fi

            evidence="/tmp/d2i-auto-repair/run-$run_id"
            mkdir -p "$evidence"
            gh run download "$run_id" -R "$GITHUB_REPOSITORY" -D "$evidence" || true
            decision=$(EVIDENCE="$evidence" python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          root = Path(os.environ["EVIDENCE"])
          watchdog = False
          loaded_and_framing = False
          segfault = False
          for path in root.rglob("*"):
              if not path.is_file() or path.stat().st_size > 16 * 1024 * 1024:
                  continue
              try:
                  data = path.read_bytes()
              except OSError:
                  continue
              lower = data.lower()
              if b"sigsegv" in lower or b"signal=11" in lower or b"status=11/segv" in lower:
                  segfault = True
              if path.suffix.lower() == ".json":
                  try:
                      value = json.loads(data)
                  except Exception:
                      continue
                  if isinstance(value, dict):
                      if value.get("failure") == "runtime watchdog expired":
                          watchdog = True
                      loaded = value.get("load_complete") is True
                      frames = value.get("frame_ready")
                      if loaded and isinstance(frames, int) and frames > 0:
                          loaded_and_framing = True
          if segfault:
              print("segfault")
          elif watchdog and loaded_and_framing:
              print("watchdog")
          else:
              print("unknown")
          PY
            )
            printf '%s\t%s\n' "$candidate" "$decision" \
              >> /tmp/d2i-auto-repair/decisions.tsv
            [[ "$decision" != unknown ]] || {
              echo "failure evidence is outside the bounded auto-repair policy" >&2
              exit 1
            }

            git fetch --no-tags origin \
              "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
            test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$candidate"
            git checkout -B d2i-repair "$candidate"

            DECISION="$decision" CYCLE="$cycle" python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path
          import re

          decision = os.environ["DECISION"]
          cycle = int(os.environ["CYCLE"])
          runtime_path = Path("experiments/servo-headed-runtime/src/main.rs")
          service_path = Path(
              "packaging/debian/image/d2i-overlay/etc/systemd/system/"
              "trillionnium-d2i-runtime.service"
          )
          contract_path = Path("contracts/d2i-integrated-image.v1.json")
          test_path = Path("tests/d1/test_d2i_renderer_policy.py")

          runtime = runtime_path.read_text()
          marker = "runtime watchdog expired"
          marker_pos = runtime.find(marker)
          if marker_pos < 0:
              raise SystemExit("runtime watchdog failure marker is absent")
          candidates = list(re.finditer(r"Duration::from_secs\((150|300|420|480)\)", runtime))
          if not candidates:
              raise SystemExit("bounded D2I watchdog duration is absent")
          nearest = min(candidates, key=lambda match: abs(match.start() - marker_pos))
          current_seconds = int(nearest.group(1))

          service = service_path.read_text()
          current_driver_match = re.search(r"^Environment=GALLIUM_DRIVER=(\w+)$", service, re.M)
          if current_driver_match is None:
              raise SystemExit("D2I Gallium driver is absent")
          current_driver = current_driver_match.group(1)

          use_softpipe = decision == "segfault" or current_driver == "softpipe"
          if decision == "watchdog" and current_driver == "llvmpipe" and current_seconds < 300:
              target_seconds = 300
              use_softpipe = False
          else:
              target_seconds = 480
              use_softpipe = True

          runtime = runtime[: nearest.start(1)] + str(target_seconds) + runtime[nearest.end(1) :]
          runtime_path.write_text(runtime)

          lines = service.splitlines()
          controlled_prefixes = (
              "Environment=GALLIUM_DRIVER=",
              "Environment=GALLIUM_OVERRIDE_CPU_CAPS=",
              "Environment=LP_NATIVE_VECTOR_WIDTH=",
              "Environment=LP_NUM_THREADS=",
              "Environment=DRAW_USE_LLVM=",
          )
          filtered = [line for line in lines if not line.startswith(controlled_prefixes)]
          anchor = filtered.index("Environment=LIBGL_ALWAYS_SOFTWARE=1") + 1
          if use_softpipe:
              renderer_lines = [
                  "Environment=GALLIUM_DRIVER=softpipe",
                  "Environment=DRAW_USE_LLVM=0",
              ]
              driver = "softpipe"
              renderer_requirement = "softpipe_renderer_without_llvm_jit"
              reason = (
                  "bounded interpreter renderer used after exact-head TCG evidence "
                  "proved LLVM JIT instability or noncompletion"
              )
          else:
              renderer_lines = [
                  "Environment=GALLIUM_DRIVER=llvmpipe",
                  "Environment=GALLIUM_OVERRIDE_CPU_CAPS=sse2",
                  "Environment=LP_NATIVE_VECTOR_WIDTH=128",
                  "Environment=LP_NUM_THREADS=1",
                  "Environment=DRAW_USE_LLVM=0",
              ]
              driver = "llvmpipe"
              renderer_requirement = "constrained_llvmpipe_renderer"
              reason = (
                  "SSE2-bounded single-thread LLVMpipe inside QEMU TCG with a "
                  "larger but finite qualification watchdog"
              )
          filtered[anchor:anchor] = renderer_lines
          service = "\n".join(filtered) + "\n"
          service = re.sub(r"^TimeoutStartSec=\d+s$", "TimeoutStartSec=600s", service, flags=re.M)
          service_path.write_text(service)

          contract = json.loads(contract_path.read_text())
          runtime_contract = contract["runtime"]
          runtime_contract["qualification_watchdog_seconds"] = target_seconds
          renderer = runtime_contract["software_renderer"]
          renderer["force_software"] = True
          renderer["gallium_driver"] = driver
          renderer["llvm_jit_disabled"] = True
          renderer["qualification_reason"] = reason
          renderer["environment"] = [line.removeprefix("Environment=") for line in renderer_lines]
          requirements = [
              item
              for item in contract["promotion_requires"]
              if not (
                  isinstance(item, str)
                  and "renderer" in item
                  and ("llvmpipe" in item or "softpipe" in item)
              )
          ]
          if renderer_requirement not in requirements:
              requirements.append(renderer_requirement)
          contract["promotion_requires"] = requirements
          contract_path.write_text(json.dumps(contract, indent=2, ensure_ascii=False) + "\n")

          expected_environment = [line.removeprefix("Environment=") for line in renderer_lines]
          test_path.write_text(
              "from __future__ import annotations\n\n"
              "import json\n"
              "from pathlib import Path\n"
              "import unittest\n\n\n"
              "ROOT = Path(__file__).resolve().parents[2]\n\n\n"
              "class D2IRendererPolicyTests(unittest.TestCase):\n"
              "    def test_guest_runtime_uses_the_evidence_bound_renderer(self) -> None:\n"
              "        service = (\n"
              "            ROOT\n"
              "            / \"packaging/debian/image/d2i-overlay/etc/systemd/system/\"\n"
              "            \"trillionnium-d2i-runtime.service\"\n"
              "        ).read_text()\n"
              f"        self.assertIn(\"Environment=GALLIUM_DRIVER={driver}\", service)\n"
              "        self.assertIn(\"Environment=LIBGL_ALWAYS_SOFTWARE=1\", service)\n"
              "        self.assertIn(\"Environment=DRAW_USE_LLVM=0\", service)\n"
              + (
                  "        self.assertIn(\"Environment=GALLIUM_OVERRIDE_CPU_CAPS=sse2\", service)\n"
                  "        self.assertIn(\"Environment=LP_NATIVE_VECTOR_WIDTH=128\", service)\n"
                  "        self.assertIn(\"Environment=LP_NUM_THREADS=1\", service)\n"
                  if not use_softpipe
                  else
                  "        self.assertNotIn(\"Environment=GALLIUM_OVERRIDE_CPU_CAPS=\", service)\n"
                  "        self.assertNotIn(\"Environment=LP_NATIVE_VECTOR_WIDTH=\", service)\n"
                  "        self.assertNotIn(\"Environment=LP_NUM_THREADS=\", service)\n"
              )
              + "        self.assertIn(\"Environment=HEPTA_D2I_IMAGE_LOCAL_INPUT=1\", service)\n\n"
              "        contract = json.loads(\n"
              "            (ROOT / \"contracts/d2i-integrated-image.v1.json\").read_text()\n"
              "        )\n"
              "        runtime = contract[\"runtime\"]\n"
              f"        self.assertEqual(runtime[\"qualification_watchdog_seconds\"], {target_seconds})\n"
              "        renderer = runtime[\"software_renderer\"]\n"
              f"        self.assertEqual(renderer[\"gallium_driver\"], \"{driver}\")\n"
              "        self.assertTrue(renderer[\"force_software\"])\n"
              "        self.assertTrue(renderer[\"llvm_jit_disabled\"])\n"
              f"        self.assertEqual(renderer[\"environment\"], {expected_environment!r})\n"
              f"        self.assertIn(\"{renderer_requirement}\", contract[\"promotion_requires\"])\n\n"
              "    def test_d2i_input_claim_is_image_local_only(self) -> None:\n"
              "        acceptance = (\n"
              "            ROOT\n"
              "            / \"packaging/debian/image/d2i-overlay/usr/local/libexec/\"\n"
              "            \"trillionnium-d2i-acceptance\"\n"
              "        ).read_text()\n"
              "        runtime = (\n"
              "            ROOT / \"experiments/servo-headed-runtime/src/main.rs\"\n"
              "        ).read_text()\n"
              "        self.assertIn(\"d2i_image_local_servo_dispatch\", acceptance)\n"
              "        self.assertIn(\"HEPTA_D2I_IMAGE_LOCAL_INPUT\", runtime)\n"
              "        self.assertIn(\"native_input_events\", acceptance)\n\n\n"
              "if __name__ == \"__main__\":\n"
              "    unittest.main()\n"
          )
          print(f"driver={driver} watchdog={target_seconds} cycle={cycle}")
          PY

            rustfmt --edition 2024 experiments/servo-headed-runtime/src/main.rs
            python3 tools/validate_repository.py
            python3 tools/validate_project_truth.py
            python3 tools/verify_systemd_socket_custody.py
            python3 -m unittest discover -s tests -t . -p 'test_*.py'
            shellcheck -x -e SC2016,SC2054 \
              packaging/debian/image/d2i-overlay/usr/local/libexec/trillionnium-d2i-acceptance
            cargo fmt --all --check
            cargo check --workspace --all-targets --locked
            cargo clippy --workspace --all-targets --locked -- -D warnings
            cargo test --workspace --all-targets --locked
            cargo check --workspace --all-targets --all-features --locked
            cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
            cargo test --workspace --all-targets --all-features --locked
            git diff --check

            if grep -q '^Environment=GALLIUM_DRIVER=softpipe$' \
                packaging/debian/image/d2i-overlay/etc/systemd/system/trillionnium-d2i-runtime.service; then
              subject="fix(d2i): fall back to bounded softpipe qualification"
            else
              subject="fix(d2i): widen bounded TCG qualification watchdog"
            fi
            git add -- \
              contracts/d2i-integrated-image.v1.json \
              experiments/servo-headed-runtime/src/main.rs \
              packaging/debian/image/d2i-overlay/etc/systemd/system/trillionnium-d2i-runtime.service \
              tests/d1/test_d2i_renderer_policy.py
            git commit -m "$subject"
            git fetch --no-tags origin \
              "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
            test "$(git rev-parse refs/remotes/origin/$TARGET_BRANCH)" = "$candidate"
            git push origin HEAD:refs/heads/$TARGET_BRANCH

            for wait in $(seq 1 160); do
              new_head=$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')
              [[ "$new_head" != "$candidate" ]] && break
              sleep 10
            done
          done
          echo "bounded D2I auto-repair attempts exhausted" >&2
          exit 1

      - name: Bound retained repair diagnostics
        if: always()
        run: |
          find /tmp/d2i-auto-repair -type f -size +8M -delete 2>/dev/null || true
          find /tmp/d2i-auto-repair -type f -printf '%P\t%s\n' | sort \
            > /tmp/d2i-auto-repair/retained-files.tsv 2>/dev/null || true

      - name: Upload repair evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d2i-auto-repair-${{ github.sha }}
          path: /tmp/d2i-auto-repair
          if-no-files-found: warn
          retention-days: 5
          compression-level: 6
          include-hidden-files: true
