name: extract-d2i-failure

on:
  push:
    branches: ["codex/full-gap-closure-v2"]
    paths:
      - ".github/extract-d2i-failure.trigger"

permissions:
  actions: read
  contents: read

concurrency:
  group: extract-d2i-failure
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Locate latest failed D2I run and extract bounded logs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/d2i-failure/raw /tmp/d2i-failure/evidence
          api="https://api.github.com/repos/$REPOSITORY/actions/runs?branch=codex%2Ffull-gap-closure-v2&status=failure&per_page=100"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" > /tmp/d2i-failure/runs.json
          run_id="$(jq -er '[.workflow_runs[] | select(.name == "d2i-integrated-image")][0].id' /tmp/d2i-failure/runs.json)"
          run_sha="$(jq -er --argjson id "$run_id" '.workflow_runs[] | select(.id == $id) | .head_sha' /tmp/d2i-failure/runs.json)"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/runs/$run_id/logs" \
            -o /tmp/d2i-failure/logs.zip
          unzip -q /tmp/d2i-failure/logs.zip -d /tmp/d2i-failure/raw
          {
            printf 'run_id=%s\nhead_sha=%s\n' "$run_id" "$run_sha"
            find /tmp/d2i-failure/raw -type f -printf '%P\n' | sort
          } > /tmp/d2i-failure/evidence/index.txt
          while IFS= read -r -d '' file; do
            rel="${file#/tmp/d2i-failure/raw/}"
            safe="${rel//\//__}"
            safe="${safe// /_}"
            {
              printf 'source=%s\n' "$rel"
              printf '%s\n' '--- FAILURE MATCHES ---'
              grep -n -E -C 12 '(^|[^A-Za-z])(error|failed|failure|fatal|panic|timed out|timeout|No space left|cannot|denied)([^A-Za-z]|$)|##\[error\]' "$file" | tail -n 1200 || true
              printf '%s\n' '--- LOG TAIL ---'
              tail -n 1600 "$file"
            } > "/tmp/d2i-failure/evidence/${safe}.bounded.log"
          done < <(find /tmp/d2i-failure/raw -type f -print0)
          find /tmp/d2i-failure/evidence -type f -size +4M -exec sh -c '
            for file do tail -c 4194304 "$file" > "$file.tail" && mv "$file.tail" "$file"; done
          ' sh {} +

      - name: Upload bounded failure extract
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d2i-failure-extract-${{ github.sha }}
          path: /tmp/d2i-failure/evidence
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
