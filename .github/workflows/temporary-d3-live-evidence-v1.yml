name: temporary-d3-live-evidence-v1

on:
  push:
    branches:
      - codex/control-d3-live-evidence-v1

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: temporary-d3-live-evidence-v1
  cancel-in-progress: false

jobs:
  prove:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: codex/full-gap-closure-final
      CONTROL_BRANCH: codex/control-d3-live-evidence-v1
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out D3 live-evidence control branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/control-d3-live-evidence-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Wait until D3 is present in the unified candidate
        id: route
        run: |
          set -euo pipefail
          mkdir -p /tmp/d3-live
          ready=false
          target=
          for _ in $(seq 1 1080); do
            git fetch --no-tags origin "$TARGET_BRANCH" >/dev/null 2>&1 || true
            target=$(git rev-parse "origin/$TARGET_BRANCH" 2>/dev/null || true)
            if test -n "$target" && git cat-file -e "$target:tools/validate_d3_development_profile.py" 2>/dev/null; then
              ready=true
              break
            fi
            if proof=$(git ls-remote --heads origin refs/heads/codex/d2i-apply-v3-proof | awk '{print $1}'); then
              if test -n "$proof" && git show "$proof:diagnostics/d2i-v3-monitor/latest.txt" >/dev/null 2>&1; then
                break
              fi
            fi
            sleep 20
          done
          printf 'ready=%s\ntarget=%s\n' "$ready" "$target" | tee /tmp/d3-live/route.txt
          printf 'ready=%s\ntarget=%s\n' "$ready" "$target" >> "$GITHUB_OUTPUT"

      - name: Check out exact candidate and install pinned toolchain
        if: steps.route.outputs.ready == 'true'
        run: |
          set -euo pipefail
          git checkout --detach '${{ steps.route.outputs.target }}'
          channel=$(python3 - <<'PY'
          from pathlib import Path
          import tomllib
          print(tomllib.loads(Path('rust-toolchain.toml').read_text())['toolchain']['channel'])
          PY
          )
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustup override set "$channel"

      - name: Re-prove D3 source and build development executable
        if: steps.route.outputs.ready == 'true'
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 tools/verify_systemd_socket_custody.py
          python3 tools/validate_d3_development_profile.py
          python3 -m unittest discover -s tests -t . -p 'test_*.py'
          cargo fmt --all --check
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-targets --all-features --locked
          cargo build --release --locked -p hepta-agent-portd --no-default-features --features development --bin hepta-agent-port-developmentd
          test -x target/release/hepta-agent-port-developmentd

      - name: Install exact repository socket/service units in the ephemeral host
        if: steps.route.outputs.ready == 'true'
        id: units
        run: |
          set -euo pipefail
          socket_source=$(find packaging -type f -name 'hepta-agent-development.socket' -print -quit)
          service_source=$(find packaging -type f -name 'hepta-browserd-agent-development@.service' -print -quit)
          test -n "$socket_source"
          test -n "$service_source"
          test "$(find packaging -type f -name 'hepta-agent-development.socket' | wc -l)" -eq 1
          test "$(find packaging -type f -name 'hepta-browserd-agent-development@.service' | wc -l)" -eq 1
          cp "$socket_source" /tmp/d3-live/hepta-agent-development.socket
          cp "$service_source" /tmp/d3-live/hepta-browserd-agent-development@.service
          python3 - <<'PY'
          from __future__ import annotations
          from pathlib import Path
          import re
          import shlex

          socket = Path('/tmp/d3-live/hepta-agent-development.socket').read_text()
          service = Path('/tmp/d3-live/hepta-browserd-agent-development@.service').read_text()
          def one(pattern: str, text: str, label: str) -> str:
              values = re.findall(pattern, text, flags=re.MULTILINE)
              values = [value.strip() for value in values if value.strip()]
              if len(values) != 1:
                  raise SystemExit(f'{label}: expected exactly one value, got {values}')
              return values[0]
          listen = one(r'^ListenStream=(.+)$', socket, 'ListenStream')
          user = one(r'^User=(.+)$', service, 'User')
          group_values = re.findall(r'^Group=(.+)$', service, flags=re.MULTILINE)
          group = group_values[0].strip() if len(group_values) == 1 else user
          exec_line = one(r'^ExecStart=(.+)$', service, 'ExecStart')
          argv = shlex.split(exec_line.lstrip('-'))
          if not argv or not argv[0].startswith('/'):
              raise SystemExit('ExecStart executable must be absolute')
          if Path(argv[0]).name != 'hepta-agent-port-developmentd':
              raise SystemExit(f'unexpected development executable: {argv[0]}')
          Path('/tmp/d3-live/unit.env').write_text(
              f'LISTEN_STREAM={listen}\nSERVICE_USER={user}\nSERVICE_GROUP={group}\nEXECUTABLE={argv[0]}\n'
          )
          Path('/tmp/d3-live/exec-argv.json').write_text(__import__('json').dumps(argv) + '\n')
          PY
          cat /tmp/d3-live/unit.env
          source /tmp/d3-live/unit.env
          sudo groupadd --system "$SERVICE_GROUP" 2>/dev/null || true
          if ! getent passwd "$SERVICE_USER" >/dev/null; then
            sudo useradd --system --gid "$SERVICE_GROUP" --home-dir /nonexistent --shell /usr/sbin/nologin "$SERVICE_USER"
          fi
          sudo install -D -m 0755 target/release/hepta-agent-port-developmentd "$EXECUTABLE"
          sudo install -m 0644 /tmp/d3-live/hepta-agent-development.socket /etc/systemd/system/hepta-agent-development.socket
          sudo install -m 0644 /tmp/d3-live/hepta-browserd-agent-development@.service /etc/systemd/system/hepta-browserd-agent-development@.service
          # Create only explicitly declared absolute environment paths. Marker-like
          # files are regular root-owned files; journal-like values get private parents.
          python3 - <<'PY'
          from pathlib import Path
          import os, re, shlex, subprocess
          service=Path('/tmp/d3-live/hepta-browserd-agent-development@.service').read_text()
          for raw in re.findall(r'^Environment=(.+)$', service, flags=re.MULTILINE):
              for token in shlex.split(raw):
                  if '=' not in token:
                      continue
                  name,value=token.split('=',1)
                  if not value.startswith('/') or '%' in value or '$' in value:
                      continue
                  path=Path(value)
                  if any(word in name.upper() for word in ('MARKER','ENABLE')):
                      subprocess.run(['sudo','install','-D','-m','0644','/dev/null',str(path)],check=True)
                  elif any(word in name.upper() for word in ('JOURNAL','STATE','CACHE','CONFIG','RUNTIME','HOME')):
                      subprocess.run(['sudo','install','-d','-m','0700',str(path.parent if path.suffix else path)],check=True)
          PY
          sudo systemd-analyze verify /etc/systemd/system/hepta-agent-development.socket /etc/systemd/system/hepta-browserd-agent-development@.service
          sudo systemctl daemon-reload
          sudo systemctl start hepta-agent-development.socket
          test "$(systemctl is-active hepta-agent-development.socket)" = active
          socket_path=$LISTEN_STREAM
          case "$socket_path" in
            @*) ;;
            /*) test -S "$socket_path" ;;
            *) echo 'development ListenStream must be absolute or abstract' >&2; exit 1 ;;
          esac
          printf 'socket_source=%s\nservice_source=%s\nlisten_stream=%s\nservice_user=%s\nservice_group=%s\nexecutable=%s\n' \
            "$socket_source" "$service_source" "$LISTEN_STREAM" "$SERVICE_USER" "$SERVICE_GROUP" "$EXECUTABLE" \
            | tee /tmp/d3-live/unit-identity.txt
          printf 'listen_stream=%s\nservice_user=%s\nservice_group=%s\nexecutable=%s\n' \
            "$LISTEN_STREAM" "$SERVICE_USER" "$SERVICE_GROUP" "$EXECUTABLE" >> "$GITHUB_OUTPUT"

      - name: Trigger a real cross-UID socket-activated service instance
        if: steps.route.outputs.ready == 'true'
        id: live
        run: |
          set -euo pipefail
          listen='${{ steps.units.outputs.listen_stream }}'
          service_user='${{ steps.units.outputs.service_user }}'
          executable='${{ steps.units.outputs.executable }}'
          connector_uid=$(id -u)
          export D3_LISTEN_STREAM="$listen"
          python3 - <<'PY' &
          from __future__ import annotations
          import os, socket, time
          address=os.environ['D3_LISTEN_STREAM']
          if address.startswith('@'):
              address='\0'+address[1:]
          client=socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          deadline=time.monotonic()+20
          while True:
              try:
                  client.connect(address)
                  break
              except OSError:
                  if time.monotonic() >= deadline:
                      raise
                  time.sleep(0.1)
          try:
              client.sendall(b'{}\n')
          except OSError:
              pass
          time.sleep(20)
          client.close()
          PY
          client_pid=$!
          unit=
          pid=0
          for _ in $(seq 1 200); do
            while read -r candidate _; do
              test -n "$candidate" || continue
              candidate_pid=$(systemctl show -p MainPID --value "$candidate" 2>/dev/null || true)
              if test "${candidate_pid:-0}" -gt 0 && test -d "/proc/$candidate_pid"; then
                unit=$candidate
                pid=$candidate_pid
                break 2
              fi
            done < <(systemctl list-units --all --plain --no-legend 'hepta-browserd-agent-development@*.service' 2>/dev/null || true)
            sleep 0.1
          done
          test -n "$unit"
          test "$pid" -gt 0
          test -d "/proc/$pid"
          process_uid=$(awk '/^Uid:/ {print $2}' "/proc/$pid/status")
          process_gid=$(awk '/^Gid:/ {print $2}' "/proc/$pid/status")
          expected_uid=$(id -u "$service_user")
          test "$process_uid" = "$expected_uid"
          test "$process_uid" != "$connector_uid"
          process_exe=$(readlink -f "/proc/$pid/exe")
          installed_exe=$(readlink -f "$executable")
          test "$process_exe" = "$installed_exe"
          process_sha=$(sha256sum "/proc/$pid/exe" | awk '{print $1}')
          installed_sha=$(sha256sum "$executable" | awk '{print $1}')
          test "$process_sha" = "$installed_sha"
          stat_line=$(cat "/proc/$pid/stat")
          start_time=$(python3 - "$stat_line" <<'PY'
          import sys
          line=sys.argv[1]
          end=line.rfind(')')
          if end < 0: raise SystemExit(1)
          fields=line[end+2:].split()
          # field 22 overall is index 19 after pid/comm are removed.
          value=int(fields[19])
          if value <= 0: raise SystemExit(1)
          print(value)
          PY
          )
          cgroup=$(cat "/proc/$pid/cgroup")
          grep -F "$unit" <<<"$cgroup" >/dev/null
          systemd_pid=$(systemctl show -p MainPID --value "$unit")
          test "$systemd_pid" = "$pid"
          active=$(systemctl is-active "$unit" || true)
          test "$active" = active
          socket_owner=abstract
          socket_group=abstract
          socket_mode=abstract
          if [[ "$listen" = /* ]]; then
            socket_owner=$(stat -c %U "$listen")
            socket_group=$(stat -c %G "$listen")
            socket_mode=$(stat -c %a "$listen")
          fi
          printf 'target=%s\nsocket_unit=hepta-agent-development.socket\nservice_unit=%s\nconnector_uid=%s\nservice_uid=%s\nservice_gid=%s\nprocess_pid=%s\nprocess_start_time=%s\nprocess_executable=%s\nprocess_sha256=%s\ninstalled_sha256=%s\ncross_uid=true\nmain_pid_bound=true\ncgroup_unit_bound=true\nexecutable_digest_bound=true\nsocket_owner=%s\nsocket_group=%s\nsocket_mode=%s\n' \
            '${{ steps.route.outputs.target }}' "$unit" "$connector_uid" "$process_uid" "$process_gid" "$pid" "$start_time" "$process_exe" "$process_sha" "$installed_sha" "$socket_owner" "$socket_group" "$socket_mode" \
            | tee /tmp/d3-live/live-evidence.txt
          sudo journalctl -u hepta-agent-development.socket -u "$unit" --no-pager -n 500 > /tmp/d3-live/journal.txt || true
          systemctl status hepta-agent-development.socket "$unit" --no-pager > /tmp/d3-live/systemd-status.txt || true
          wait "$client_pid" || true
          sudo systemctl stop "$unit" hepta-agent-development.socket || true
          printf 'unit=%s\npid=%s\nstart_time=%s\nsha256=%s\n' "$unit" "$pid" "$start_time" "$process_sha" >> "$GITHUB_OUTPUT"

      - name: Write strict machine evidence envelope
        if: steps.route.outputs.ready == 'true'
        env:
          LIVE_UNIT: ${{ steps.live.outputs.unit }}
          LIVE_PID: ${{ steps.live.outputs.pid }}
          LIVE_START_TIME: ${{ steps.live.outputs.start_time }}
          LIVE_SHA256: ${{ steps.live.outputs.sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib, json, os
          from pathlib import Path
          kv={}
          for line in Path('/tmp/d3-live/live-evidence.txt').read_text().splitlines():
              if '=' in line:
                  k,v=line.split('=',1); kv[k]=v
          required_true=('cross_uid','main_pid_bound','cgroup_unit_bound','executable_digest_bound')
          if any(kv.get(key) != 'true' for key in required_true):
              raise SystemExit('D3 live evidence boolean invariant failed')
          if kv.get('process_sha256') != kv.get('installed_sha256'):
              raise SystemExit('D3 live executable digest mismatch')
          envelope={
              'schema':'trillionnium.desktop.d3-live-cross-uid-evidence.v1',
              'status':'PASS',
              'target_commit':kv['target'],
              'socket_unit':kv['socket_unit'],
              'service_unit':kv['service_unit'],
              'connector_uid':int(kv['connector_uid']),
              'service_uid':int(kv['service_uid']),
              'service_gid':int(kv['service_gid']),
              'process_identity':{
                  'pid':int(kv['process_pid']),
                  'start_time_ticks':int(kv['process_start_time']),
                  'executable':kv['process_executable'],
                  'sha256':kv['process_sha256'],
              },
              'proofs':{
                  'cross_uid':True,
                  'systemd_main_pid_bound':True,
                  'cgroup_unit_bound':True,
                  'static_executable_digest_bound':True,
                  'repository_socket_unit_used':True,
                  'repository_service_unit_used':True,
              },
              'socket':{
                  'owner':kv['socket_owner'],
                  'group':kv['socket_group'],
                  'mode':kv['socket_mode'],
              },
              'claim_ceiling':{
                  'd3_live_machine_evidence_proven':True,
                  'release_readiness_proven':False,
              },
          }
          canonical=json.dumps(envelope,sort_keys=True,separators=(',',':')).encode()
          envelope['canonical_sha256']=hashlib.sha256(canonical).hexdigest()
          Path('/tmp/d3-live/evidence.json').write_text(json.dumps(envelope,indent=2)+'\n')
          PY
          python3 -m json.tool /tmp/d3-live/evidence.json >/dev/null

      - name: Publish bounded D3 evidence comment
        if: success() && steps.route.outputs.ready == 'true'
        run: |
          set -euo pipefail
          marker='<!-- trillionnium-d3-live-evidence-v1 -->'
          {
            printf '%s\n\n' "$marker"
            printf 'D3 live cross-UID systemd evidence: **PASS**\n\n'
            printf -- '- Target: `%s`\n' '${{ steps.route.outputs.target }}'
            printf -- '- Unit: `%s`\n' '${{ steps.live.outputs.unit }}'
            printf -- '- PID/start time: `%s` / `%s`\n' '${{ steps.live.outputs.pid }}' '${{ steps.live.outputs.start_time }}'
            printf -- '- Executable SHA-256: `%s`\n' '${{ steps.live.outputs.sha256 }}'
          } > /tmp/d3-live/comment.md
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/52/comments?per_page=100" --paginate --jq ".[] | select(.body | contains(\"$marker\")) | .id" | tail -n1)
          if test -n "$existing"; then
            jq -Rs '{body:.}' < /tmp/d3-live/comment.md | gh api "repos/$GITHUB_REPOSITORY/issues/comments/$existing" --method PATCH --input - >/dev/null
          else
            gh pr comment 52 --repo "$GITHUB_REPOSITORY" --body-file /tmp/d3-live/comment.md >/dev/null
          fi

      - name: Persist D3 live result and remove temporary workflow
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          ROUTE_READY: ${{ steps.route.outputs.ready }}
          TARGET_SHA: ${{ steps.route.outputs.target }}
        run: |
          set -euo pipefail
          status_snapshot=$(git status --short 2>&1 || true)
          git fetch --no-tags origin "$CONTROL_BRANCH"
          git checkout -B "$CONTROL_BRANCH" "origin/$CONTROL_BRANCH"
          rm -f .github/workflows/temporary-d3-live-evidence-v1.yml
          mkdir -p diagnostics/d3-live-evidence-v1
          cp /tmp/d3-live/evidence.json diagnostics/d3-live-evidence-v1/latest.json 2>/dev/null || true
          {
            printf 'schema=trillionnium.desktop.d3-live-result.v1\n'
            printf 'recorded_at=%s\njob_status=%s\nroute_ready=%s\ntarget=%s\n\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$JOB_STATUS" "$ROUTE_READY" "$TARGET_SHA"
            for file in /tmp/d3-live/route.txt /tmp/d3-live/unit-identity.txt /tmp/d3-live/live-evidence.txt /tmp/d3-live/systemd-status.txt /tmp/d3-live/journal.txt; do
              test -f "$file" || continue
              printf '%s\n' "--- $(basename "$file") ---"
              tail -n 1600 "$file"
              printf '\n'
            done
            printf '%s\n%s\n' '--- status ---' "$status_snapshot"
          } > diagnostics/d3-live-evidence-v1/control.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- .github/workflows/temporary-d3-live-evidence-v1.yml diagnostics/d3-live-evidence-v1
          git commit -m "diagnostics(d3): record live cross-UID evidence ($JOB_STATUS)"
          git push origin "HEAD:refs/heads/$CONTROL_BRANCH"
