name: temporary-external-readiness-v2

on:
  push:
    branches:
      - codex/control-external-readiness-v2

permissions:
  actions: read
  contents: write
  deployments: write
  pull-requests: write

concurrency:
  group: temporary-external-readiness-v2
  cancel-in-progress: false

jobs:
  attest:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      CONTROL_BRANCH: codex/control-external-readiness-v2
      D8_SOURCE: codex/d8-hardware-qualification-verifier-v1
      D9_SOURCE: codex/d9-signed-release-promotion-v1
    steps:
      - name: Check out external-readiness control branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/control-external-readiness-v2
          fetch-depth: 0
          persist-credentials: true

      - name: Extract declared external dependencies and inspect live state
        id: inspect
        run: |
          set -euo pipefail
          repo=$GITHUB_REPOSITORY
          owner=${repo%%/*}
          api=https://api.github.com
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          mkdir -p /tmp/external-readiness/source
          git fetch --no-tags origin "$D8_SOURCE" "$D9_SOURCE"
          git archive "origin/$D8_SOURCE" .github tools manifests contracts docs | tar -xf - -C /tmp/external-readiness/source || true
          git archive "origin/$D9_SOURCE" .github tools manifests contracts docs | tar -xf - -C /tmp/external-readiness/source || true
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('/tmp/external-readiness/source')
          secret_names = set()
          runner_tokens = set()
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.yml', '.yaml', '.py', '.sh', '.json', '.md'}:
                  continue
              text = path.read_text(errors='replace')
              secret_names.update(re.findall(r'secrets\.([A-Z][A-Z0-9_]*)', text))
              for match in re.finditer(r'(?m)^\s*runs-on:\s*(.+?)\s*$', text):
                  raw = match.group(1).strip()
                  if raw.startswith('${{'):
                      continue
                  for token in re.findall(r'[A-Za-z0-9_.-]+', raw):
                      if token not in {'runs', 'on'}:
                          runner_tokens.add(token)
          Path('/tmp/external-readiness/required-secrets.txt').write_text('\n'.join(sorted(secret_names)) + ('\n' if secret_names else ''))
          Path('/tmp/external-readiness/declared-runner-labels.txt').write_text('\n'.join(sorted(runner_tokens)) + ('\n' if runner_tokens else ''))
          PY

          get_endpoint() {
            local path=$1
            local output=$2
            curl -sS "${auth[@]}" -o "$output" -w '%{http_code}' "$api/$path"
          }
          secrets_status=$(get_endpoint "repos/$repo/actions/secrets?per_page=100" /tmp/external-readiness/secrets.json)
          runners_status=$(get_endpoint "repos/$repo/actions/runners?per_page=100" /tmp/external-readiness/runners.json)
          environments_status=$(get_endpoint "repos/$repo/environments?per_page=100" /tmp/external-readiness/environments-before.json)
          teams_status=$(get_endpoint "orgs/$owner/teams?per_page=100" /tmp/external-readiness/teams.json)
          reviews_status=$(get_endpoint "repos/$repo/pulls/52/reviews?per_page=100" /tmp/external-readiness/reviews.json)
          pr_status=$(get_endpoint "repos/$repo/pulls/52" /tmp/external-readiness/pr.json)

          valid_team_slug=
          valid_team_id=
          if test "$teams_status" = 200; then
            while IFS=$'\t' read -r slug id; do
              test -n "$slug" || continue
              members_status=$(get_endpoint "orgs/$owner/teams/$slug/members?per_page=100" "/tmp/external-readiness/team-$slug-members.json")
              if test "$members_status" = 200 && test "$(jq 'length' "/tmp/external-readiness/team-$slug-members.json")" -ge 2; then
                valid_team_slug=$slug
                valid_team_id=$id
                break
              fi
            done < <(jq -r 'sort_by((.name | ascii_downcase | test("review|security|release|maintain|core") | not), .name)[]? | [.slug, (.id|tostring)] | @tsv' /tmp/external-readiness/teams.json)
          fi

          review_request_status=not_attempted
          if test -n "$valid_team_slug"; then
            jq -n --arg team "$valid_team_slug" '{team_reviewers:[$team],reviewers:[]}' > /tmp/external-readiness/review-request.json
            review_request_status=$(curl -sS "${auth[@]}" -X POST -H 'Content-Type: application/json' \
              --data-binary @/tmp/external-readiness/review-request.json \
              -o /tmp/external-readiness/review-request-response.json -w '%{http_code}' \
              "$api/repos/$repo/pulls/52/requested_reviewers")
          fi

          environment_put_status=not_attempted
          if test -n "$valid_team_id"; then
            jq -n --argjson team_id "$valid_team_id" '{
              wait_timer:0,
              prevent_self_review:true,
              reviewers:[{type:"Team",id:$team_id}],
              deployment_branch_policy:{protected_branches:true,custom_branch_policies:false}
            }' > /tmp/external-readiness/production-request.json
            environment_put_status=$(curl -sS "${auth[@]}" -X PUT -H 'Content-Type: application/json' \
              --data-binary @/tmp/external-readiness/production-request.json \
              -o /tmp/external-readiness/production-put-response.json -w '%{http_code}' \
              "$api/repos/$repo/environments/production")
          fi
          production_status=$(get_endpoint "repos/$repo/environments/production" /tmp/external-readiness/production-after.json)

          independent_approval=false
          if test "$reviews_status" = 200 && test "$pr_status" = 200; then
            author=$(jq -r '.user.login' /tmp/external-readiness/pr.json)
            head=$(jq -r '.head.sha' /tmp/external-readiness/pr.json)
            if jq -e --arg author "$author" --arg head "$head" '
              any(.[]; .state == "APPROVED" and .user.login != $author and (.commit_id == $head or .commit_id == null))
            ' /tmp/external-readiness/reviews.json >/dev/null; then
              independent_approval=true
            fi
          fi

          secret_metadata_complete=false
          if test "$secrets_status" = 200; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          required = {line.strip() for line in Path('/tmp/external-readiness/required-secrets.txt').read_text().splitlines() if line.strip()}
          payload = json.loads(Path('/tmp/external-readiness/secrets.json').read_text())
          present = {entry['name'] for entry in payload.get('secrets', [])}
          missing = sorted(required - present)
          Path('/tmp/external-readiness/missing-secrets.txt').write_text('\n'.join(missing) + ('\n' if missing else ''))
          Path('/tmp/external-readiness/secret-metadata-complete.txt').write_text('true\n' if not missing else 'false\n')
          PY
            secret_metadata_complete=$(cat /tmp/external-readiness/secret-metadata-complete.txt)
          fi

          online_runner_count=0
          if test "$runners_status" = 200; then
            online_runner_count=$(jq '[.runners[]? | select(.status == "online")] | length' /tmp/external-readiness/runners.json)
          fi

          environment_proven=false
          if test "$environment_put_status" = 200 && test "$production_status" = 200; then
            if jq -e '.protection_rules | any(.type == "required_reviewers" and .prevent_self_review == true)' /tmp/external-readiness/production-after.json >/dev/null; then
              environment_proven=true
            fi
          fi

          printf 'secrets_status=%s\nrunners_status=%s\nenvironments_status=%s\nteams_status=%s\nreviews_status=%s\npr_status=%s\nvalid_team_slug=%s\nvalid_team_id=%s\nreview_request_status=%s\nenvironment_put_status=%s\nproduction_status=%s\nindependent_approval=%s\nsecret_metadata_complete=%s\nonline_runner_count=%s\nenvironment_proven=%s\n' \
            "$secrets_status" "$runners_status" "$environments_status" "$teams_status" "$reviews_status" "$pr_status" \
            "${valid_team_slug:-}" "${valid_team_id:-}" "$review_request_status" "$environment_put_status" "$production_status" \
            "$independent_approval" "$secret_metadata_complete" "$online_runner_count" "$environment_proven" \
            | tee /tmp/external-readiness/state.txt
          printf 'independent_approval=%s\nenvironment_proven=%s\nvalid_team_slug=%s\n' "$independent_approval" "$environment_proven" "${valid_team_slug:-}" >> "$GITHUB_OUTPUT"

      - name: Persist external readiness evidence and remove temporary workflow
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$CONTROL_BRANCH"
          git checkout -B "$CONTROL_BRANCH" "origin/$CONTROL_BRANCH"
          rm -f .github/workflows/temporary-external-readiness-v2.yml
          mkdir -p diagnostics/external-readiness-v2
          python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          root = Path('/tmp/external-readiness')
          def load_json(name: str):
              path = root / name
              if not path.exists():
                  return None
              try:
                  return json.loads(path.read_text())
              except Exception:
                  return {"unparsed_tail": path.read_text(errors='replace')[-5000:]}
          def lines(name: str):
              path = root / name
              return [line for line in path.read_text(errors='replace').splitlines() if line] if path.exists() else []
          state = {}
          for line in lines('state.txt'):
              if '=' in line:
                  key, value = line.split('=', 1)
                  state[key] = value
          report = {
              "schema": "trillionnium.desktop.external-readiness-result.v2",
              "job_status": os.environ.get("JOB_STATUS"),
              "state": state,
              "declared_runner_labels": lines('declared-runner-labels.txt'),
              "required_secret_names": lines('required-secrets.txt'),
              "missing_secret_names": lines('missing-secrets.txt'),
              "runners": load_json('runners.json'),
              "environments_before": load_json('environments-before.json'),
              "production_after": load_json('production-after.json'),
              "teams": load_json('teams.json'),
              "reviews": load_json('reviews.json'),
              "review_request_response": load_json('review-request-response.json'),
              "claim_ceiling": {
                  "independent_human_review_proven": state.get("independent_approval") == "true",
                  "production_environment_proven": state.get("environment_proven") == "true",
                  "hardware_readiness_proven": False,
                  "signing_secret_metadata_complete": state.get("secret_metadata_complete") == "true",
                  "signing_key_hsm_custody_proven": False,
                  "dual_control_proven": False,
                  "release_readiness_proven": False
              }
          }
          Path('diagnostics/external-readiness-v2/latest.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- .github/workflows/temporary-external-readiness-v2.yml diagnostics/external-readiness-v2/latest.json
          git commit -m "diagnostics(release): record live external readiness ($JOB_STATUS)"
          git push origin "HEAD:refs/heads/$CONTROL_BRANCH"
