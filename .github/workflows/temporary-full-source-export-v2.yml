name: temporary-full-source-export-v2

on:
  push:
    branches:
      - codex/full-source-audit-export-v2

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact audit source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ecb8c2ac0ec0e58277b64a5056a10a8262e8e63e
          fetch-depth: 1
          persist-credentials: false
      - name: Materialize tracked source without Git metadata
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ecb8c2ac0ec0e58277b64a5056a10a8262e8e63e
          mkdir -p /tmp/trillionnium-source
          git archive --format=tar HEAD | tar -xf - -C /tmp/trillionnium-source
          test ! -e /tmp/trillionnium-source/.git
          find /tmp/trillionnium-source -type f -printf '%P\n' | sort > /tmp/trillionnium-source/.source-files.txt
          printf '%s\n' "$(git rev-parse HEAD)" > /tmp/trillionnium-source/.source-commit
          printf '%s\n' "$(git rev-parse HEAD^{tree})" > /tmp/trillionnium-source/.source-tree
      - name: Upload exact tracked source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exact-source-ecb8c2ac0ec0e58277b64a5056a10a8262e8e63e
          path: /tmp/trillionnium-source
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
          include-hidden-files: true
