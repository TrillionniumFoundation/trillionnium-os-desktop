name: Derived preedit desktop package and real input gates

on:
  pull_request:
    paths:
      - 'ui/**'
      - 'services/hepta-session-host/**'
      - 'services/hepta-os/**'
      - 'libs/os-abi/**'
      - 'support/ui/**'
      - 'support/release/**'
      - 'tests/ui/**'
      - 'tests/workloads/hepta_agentd_runtime/reviewed_toolchain.py'
      - '.github/workflows/hepta-native-release.yml'
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - 'services/hepta-session-host/**'
      - 'services/hepta-os/**'
      - 'libs/os-abi/**'
      - 'support/ui/**'
      - 'support/release/**'
      - 'tests/ui/**'
      - 'tests/workloads/hepta_agentd_runtime/reviewed_toolchain.py'
      - '.github/workflows/hepta-native-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hepta-native-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  packaged-preedit-input:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RUSTUP_TOOLCHAIN: '1.96.0'
      PYTHONDONTWRITEBYTECODE: '1'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Freeze the baseline checkout without changing its Git SDK lock
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hepta-native-release/setup"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/hepta-native-release/setup/base-source.txt"
          sha256sum ui/Cargo.lock > "$RUNNER_TEMP/hepta-native-release/setup/base-lock.sha256"
          python3 -I -B support/ui/test_preedit_release.py \
            2>&1 | tee "$RUNNER_TEMP/hepta-native-release/setup/release-guards.log"
          python3 -I -B -O support/ui/test_preedit_release.py \
            2>&1 | tee "$RUNNER_TEMP/hepta-native-release/setup/release-guards-optimized.log"

      - name: Install the reviewed compiler and isolated X11 input prerequisites
        run: |
          set -euo pipefail
          setup="$RUNNER_TEMP/hepta-native-release/setup"
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy \
            2>&1 | tee "$setup/toolchain.log"
          sudo apt-get update 2>&1 | tee "$setup/apt-update.log"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake clang perl binutils libssl-dev libcap-dev bubblewrap \
            libwayland-dev libxkbcommon-dev libgl1-mesa-dev libegl1-mesa-dev libgbm-dev \
            libx11-dev libxi-dev libxrandr-dev libxcursor-dev libxinerama-dev libxext-dev \
            libasound2-dev libpulse-dev libudev-dev libxres1 \
            xvfb xauth xdotool x11-utils x11-xkb-utils dbus-daemon libglib2.0-bin \
            ibus ibus-gtk3 ibus-libpinyin python3-gi python3-cairo python3-pil \
            gir1.2-gtk-3.0 gir1.2-atspi-2.0 at-spi2-core fonts-dejavu-core \
            2>&1 | tee "$setup/apt-install.log"
          /usr/bin/python3 -B tests/ui/native-makepad/inventory.py > "$setup/input-inventory.json"

      - name: Obtain the exact original Hepta source and ancestry without credentials
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/hepta-native-release"
          pin="$(python3 -I -B -c 'import json; print(json.load(open("support/ui/linux-preedit-profile.json"))["hepta_commit"])')"
          {
            git init "$root/hepta"
            git -C "$root/hepta" remote add origin https://github.com/TrillionniumFoundation/hepta-private-ci.git
            # No depth limit: the original release verifier must prove its
            # HISTORY_OWNER ancestor. Only current checkout blobs are needed.
            git -C "$root/hepta" -c credential.helper= -c core.askPass= \
              fetch --filter=blob:none --no-tags origin "$pin"
            git -C "$root/hepta" -c credential.helper= -c core.askPass= \
              -c core.hooksPath=/dev/null checkout --detach "$pin"
          } 2>&1 | tee "$root/setup/hepta-source.log"

      - name: Materialize the derived source, build its package, and run all 17 real window checks
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/hepta-native-release"
          /usr/bin/python3 -I -B support/ui/release_preedit.py \
            --desktop-commit "$SOURCE_SHA" --desktop-tree "$(git rev-parse HEAD^{tree})" \
            --hepta-repo "$root/hepta" --work-dir "$root/source-work" \
            --output "$root/release" --jobs 1 --build-profile debug \
            2>&1 | tee "$root/setup/release-runner.log"

      - name: Require the original checkout and baseline lock to remain unchanged
        if: always()
        run: |
          set -euo pipefail
          setup="$RUNNER_TEMP/hepta-native-release/setup"
          git status --porcelain=v1 --untracked-files=all > "$setup/base-source-after.status"
          git diff --binary > "$setup/base-source-after.patch"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          sha256sum --check "$setup/base-lock.sha256"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Retain source closure, package, original gate receipts and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: derived-preedit-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/hepta-native-release/setup/
            ${{ runner.temp }}/hepta-native-release/release/*.json
            ${{ runner.temp }}/hepta-native-release/release/*.xml
            ${{ runner.temp }}/hepta-native-release/release/*.toml
            ${{ runner.temp }}/hepta-native-release/release/*.lock
            ${{ runner.temp }}/hepta-native-release/release/*.patch
            ${{ runner.temp }}/hepta-native-release/release/*.bundle
            ${{ runner.temp }}/hepta-native-release/release/*.tar.gz
            ${{ runner.temp }}/hepta-native-release/release/logs/
            ${{ runner.temp }}/hepta-native-release/release/window/
            ${{ runner.temp }}/hepta-native-release/release/product/*.json
            ${{ runner.temp }}/hepta-native-release/release/product/*.toml
            ${{ runner.temp }}/hepta-native-release/release/product/*.tar.gz
            ${{ runner.temp }}/hepta-native-release/release/product/logs/
