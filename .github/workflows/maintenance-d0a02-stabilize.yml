name: maintenance-d0a02-stabilize

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/maintenance-d0a02-stabilize.yml"

permissions:
  contents: read

concurrency:
  group: maintenance-d0a02-stabilize
  cancel-in-progress: false

jobs:
  export-final-workflow:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact D0A-02 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/d0a02-proof-soundness-v4
          fetch-depth: 0
          persist-credentials: false

      - name: Generate final permanent read-only gate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git show origin/main:tools/maintenance_stabilize_d0a02.py > "$RUNNER_TEMP/stabilize.py"
          python3 - <<'PY'
          import importlib.util
          import os
          from pathlib import Path

          path = Path(os.environ['RUNNER_TEMP']) / 'stabilize.py'
          spec = importlib.util.spec_from_file_location('stabilize', path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          module.patch_workflow()
          PY
          ! grep -q 'contents: write' .github/workflows/servo-headed-runtime.yml
          ! grep -Eq 'git[[:space:]]+push|gh[[:space:]]+workflow[[:space:]]+run' \
            .github/workflows/servo-headed-runtime.yml
          grep -q 'servo_pipeline_panic_callback_required' \
            .github/workflows/servo-headed-runtime.yml
          grep -q '"Cargo.toml"' .github/workflows/servo-headed-runtime.yml
          grep -q '"Cargo.lock"' .github/workflows/servo-headed-runtime.yml
          mkdir -p final-workflow/.github/workflows
          cp .github/workflows/servo-headed-runtime.yml \
            final-workflow/.github/workflows/servo-headed-runtime.yml

      - name: Upload exact final workflow
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d0a02-final-permanent-workflow
          path: final-workflow
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
