name: maintenance-d0a02-stabilize

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/maintenance-d0a02-stabilize.yml"
      - "tools/maintenance_extract_servo_gate_runner.py"

permissions:
  contents: write

concurrency:
  group: maintenance-d0a02-stabilize
  cancel-in-progress: false

jobs:
  materialize-gate-runner:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact D0A-02 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/d0a02-proof-soundness-v4
          fetch-depth: 0
          persist-credentials: true

      - name: Generate stable runner from corrected permanent gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch --no-tags origin main codex/d0a02-proof-soundness-v4
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/codex/d0a02-proof-soundness-v4)"
          git show origin/main:tools/maintenance_stage_d0a02_workflow.py \
            > "$RUNNER_TEMP/stage-workflow.py"
          git show origin/main:tools/maintenance_extract_servo_gate_runner.py \
            > "$RUNNER_TEMP/extract-runner.py"
          python3 "$RUNNER_TEMP/stage-workflow.py"
          python3 "$RUNNER_TEMP/extract-runner.py"
          git restore .github/workflows/servo-headed-runtime.yml

          bash -n tools/run_servo_headed_runtime_gate.sh
          grep -q 'servo_pipeline_panic_callback_required' \
            tools/run_servo_headed_runtime_gate.sh
          grep -q "promotion_authoritative.*exact_main_push" \
            tools/run_servo_headed_runtime_gate.sh
          ! grep -Eq 'git[[:space:]]+push|gh[[:space:]]+workflow[[:space:]]+run' \
            tools/run_servo_headed_runtime_gate.sh
          git diff --check

      - name: Commit only the permanent gate runner
        shell: bash
        run: |
          set -euo pipefail
          git add tools/run_servo_headed_runtime_gate.sh
          test -n "$(git status --porcelain=v1)"
          test "$(git diff --cached --name-only)" = tools/run_servo_headed_runtime_gate.sh
          git commit -m "ci(d0a02): extract permanent headed gate runner"
          git push origin HEAD:codex/d0a02-proof-soundness-v4
