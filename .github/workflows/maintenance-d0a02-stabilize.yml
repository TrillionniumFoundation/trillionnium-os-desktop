name: maintenance-d0a02-stabilize

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/maintenance-d0a02-stabilize.yml"
      - "tools/maintenance_stabilize_d0a02.py"

permissions:
  contents: write

concurrency:
  group: maintenance-d0a02-stabilize
  cancel-in-progress: false

jobs:
  stabilize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out D0A-02 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/d0a02-proof-soundness-v4
          fetch-depth: 0
          persist-credentials: true

      - name: Merge current main and materialize stable source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main codex/d0a02-proof-soundness-v4
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/codex/d0a02-proof-soundness-v4)"
          git merge --no-edit origin/main
          python3 tools/maintenance_stabilize_d0a02.py

          rm -f \
            .github/workflows/maintenance-d0a02-stabilize.yml \
            .github/workflows/d0a02-finalize-clipboard-proof.yml \
            .github/workflows/d0a02-materialize-clipboard-roundtrip.yml \
            .github/workflows/d0a02-materialize-v2.yml \
            .github/workflows/d0a02-one-shot-format-materialized-source.yml \
            .github/workflows/d0a02-source-snapshot.yml \
            .github/workflows/d0a02-transactional-qualification.yml \
            tools/maintenance_stabilize_d0a02.py \
            tools/materialize_d0a02_clipboard_roundtrip.py \
            tools/materialize_d0a02_v2.py
          rm -rf tools/.d0a02-materialize

          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustfmt +1.97.1 --edition 2024 experiments/servo-headed-runtime/src/main.rs

          test -z "$(grep -R --line-number --fixed-strings 'contents: write' .github/workflows || true)"
          test -z "$(grep -R --line-number -E 'git[[:space:]]+push|gh[[:space:]]+workflow[[:space:]]+run' .github/workflows || true)"
          test -z "$(find tools -path '*/.d0a02-materialize/*' -o -name 'materialize_d0a02*' -print -quit)"
          git diff --check

      - name: Commit stable review surface
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          test -n "$(git status --porcelain=v1)"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix(d0a02): stabilize causal process-recovery proof"
          git push origin HEAD:codex/d0a02-proof-soundness-v4
