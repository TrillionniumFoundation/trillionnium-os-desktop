name: maintenance-d0a02-stabilize

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/maintenance-d0a02-stabilize.yml"
      - "tools/maintenance_stabilize_d0a02.py"

permissions:
  contents: write

concurrency:
  group: maintenance-d0a02-stabilize
  cancel-in-progress: false

jobs:
  stabilize-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact D0A-02 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/d0a02-proof-soundness-v4
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize stable non-workflow source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch --no-tags origin main codex/d0a02-proof-soundness-v4
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/codex/d0a02-proof-soundness-v4)"
          git show origin/main:tools/maintenance_stabilize_d0a02.py > "$RUNNER_TEMP/stabilize.py"
          python3 "$RUNNER_TEMP/stabilize.py"

          # Workflow mutations are applied separately through the repository
          # administration API, whose token has the required workflows scope.
          git restore .github/workflows/servo-headed-runtime.yml
          rm -f \
            tools/materialize_d0a02_clipboard_roundtrip.py \
            tools/materialize_d0a02_v2.py
          rm -rf tools/.d0a02-materialize

          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustfmt +1.97.1 --edition 2024 experiments/servo-headed-runtime/src/main.rs
          test -z "$(find tools -path '*/.d0a02-materialize/*' -o -name 'materialize_d0a02*' -print -quit)"
          git diff --check

      - name: Commit stable non-workflow review surface
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          test -n "$(git status --porcelain=v1)"
          git commit -m "fix(d0a02): correct external process-recovery proof"
          git push origin HEAD:codex/d0a02-proof-soundness-v4
