name: s04-review-autofix-one-shot

on:
  push:
    branches: [codex/s04-transport-custody-closure-v1]
    paths: [".github/workflows/s04-review-autofix.yml"]

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/s04-transport-custody-closure-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Verify triggering head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Apply bounded review fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}: {old[:80]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          facade_path = Path("crates/hepta-agent-transport/src/facade.rs")
          facade = facade_path.read_text(encoding="utf-8")
          for line in (
              "pub const DIGEST_BYTES: usize = wire::DIGEST_BYTES;\n",
              "pub const NONCE_BYTES: usize = wire::NONCE_BYTES;\n",
              "pub const PROTOCOL_MAGIC: [u8; 8] = *b\"HEPTA001\";\n",
              "pub const PROTOCOL_VERSION: u16 = 1;\n",
              "pub const HEADER_BYTES: usize = 88;\n",
              "pub const DEFAULT_OPERATION_TIMEOUT: Duration = Duration::from_secs(20);\n",
          ):
              if facade.count(line) != 1:
                  raise SystemExit(f"facade.rs: missing exact unused constant {line!r}")
              facade = facade.replace(line, "", 1)
          into_wire = """    const fn into_wire(self) -> wire::PeerIdentity {
        wire::PeerIdentity {
            pid: self.pid,
            uid: self.uid,
            gid: self.gid,
        }
    }
"""
          if facade.count(into_wire) != 1:
              raise SystemExit("facade.rs: PeerIdentity::into_wire shape changed")
          facade = facade.replace(into_wire, "", 1)
          facade_path.write_text(facade, encoding="utf-8")

          wire_path = Path("crates/hepta-agent-transport/src/facade/wire.rs")
          wire = wire_path.read_text(encoding="utf-8")
          obsolete_timeout = "pub const DEFAULT_OPERATION_TIMEOUT: Duration = Duration::from_secs(20);\n"
          if wire.count(obsolete_timeout) != 1:
              raise SystemExit("wire.rs: obsolete timeout constant shape changed")
          wire = wire.replace(obsolete_timeout, "", 1)

          for signature in (
              "    pub const fn new(expected_uid: u32) -> Self {",
              "    pub const fn exact(identity: PeerIdentity) -> Self {",
          ):
              if wire.count(signature) != 1:
                  raise SystemExit(f"wire.rs: missing test-only signature {signature}")
              wire = wire.replace(signature, "    #[cfg(test)]\n" + signature, 1)

          fixed = """#[derive(Debug, Clone, Copy)]
pub struct FixedNonceSource(pub [u8; NONCE_BYTES]);

impl NonceSource for FixedNonceSource {
"""
          fixed_replacement = """#[cfg(test)]
#[derive(Debug, Clone, Copy)]
pub struct FixedNonceSource(pub [u8; NONCE_BYTES]);

#[cfg(test)]
impl NonceSource for FixedNonceSource {
"""
          if wire.count(fixed) != 1:
              raise SystemExit("wire.rs: FixedNonceSource shape changed")
          wire = wire.replace(fixed, fixed_replacement, 1)

          server_nonce = """    pub const fn session_nonce(&self) -> SessionNonce {
        self.binding
    }

"""
          if wire.count(server_nonce) != 1:
              raise SystemExit("wire.rs: expected exactly one unused server nonce accessor")
          wire = wire.replace(server_nonce, "", 1)

          client_nonce = """    pub const fn session_nonce(&self) -> SessionNonce {
        self.binding
    }
"""
          if wire.count(client_nonce) != 1:
              raise SystemExit("wire.rs: expected exactly one client nonce accessor")
          wire = wire.replace(
              client_nonce,
              """    #[cfg(test)]
    pub const fn session_nonce(&self) -> SessionNonce {
        self.binding
    }
""",
              1,
          )
          marker = "pub fn self_check() -> Result<(), TransportError> {"
          if wire.count(marker) != 1:
              raise SystemExit("wire.rs: self_check shape changed")
          wire = wire.replace(marker, "#[cfg(test)]\n" + marker, 1)
          wire_path.write_text(wire, encoding="utf-8")

          validator_path = Path("tools/validate_s04_transport_custody.py")
          validator = validator_path.read_text(encoding="utf-8")
          require_block = """def _require(condition: bool, message: str, errors: list[str]) -> None:
    if not condition:
        errors.append(message)


"""
          typed_helper = """def _require(condition: bool, message: str, errors: list[str]) -> None:
    if not condition:
        errors.append(message)


PUBLIC_API_FINDING = "S04-PUBLIC-API-CONTRACT"
PUBLIC_SURFACE_FINDING = "S04-PUBLIC-API-EXPOSES"
EXPECTED_TRANSPORT_PUBLIC_API: dict[str, object] = {
    "connected_stream_only": True,
    "listener_type_exposed": False,
    "raw_frame_types_exposed": False,
    "session_nonce_value_exposed": False,
    "nonce_source_trait_exposed": False,
    "deterministic_nonce_source_exposed": False,
    "server_acceptance": "operating_system_entropy_only",
    "peer_identity_debug": "redacted",
    "peer_policy_debug": "redacted",
    "connection_debug_and_display": "redacted",
    "unauthorized_peer_error_formatting": "redacted",
    "handler_error_text_formatting": "redacted_by_agent_port",
}


def _require_exact_typed_object(
    value: object,
    expected: dict[str, object],
    label: str,
    errors: list[str],
) -> None:
    if not isinstance(value, dict):
        errors.append(f"{PUBLIC_API_FINDING}:{label}:not-an-object")
        return
    actual_keys = set(value)
    expected_keys = set(expected)
    for key in sorted(expected_keys - actual_keys):
        errors.append(f"{PUBLIC_API_FINDING}:{label}:missing:{key}")
    for key in sorted(actual_keys - expected_keys):
        errors.append(f"{PUBLIC_API_FINDING}:{label}:unexpected:{key}")
    for key in sorted(actual_keys & expected_keys):
        actual = value[key]
        wanted = expected[key]
        if type(actual) is not type(wanted):
            errors.append(
                f"{PUBLIC_API_FINDING}:{label}:type:{key}:"
                f"{type(actual).__name__}!={type(wanted).__name__}"
            )
        elif actual != wanted:
            errors.append(f"{PUBLIC_API_FINDING}:{label}:value:{key}")


"""
          if validator.count(require_block) != 1:
              raise SystemExit("validator: _require insertion point changed")
          validator = validator.replace(require_block, typed_helper, 1)

          old_expected = """    public_api = contract.get("public_api")
    expected_public_api = {
        "connected_stream_only": True,
        "listener_type_exposed": False,
        "raw_frame_types_exposed": False,
        "session_nonce_value_exposed": False,
        "nonce_source_trait_exposed": False,
        "deterministic_nonce_source_exposed": False,
        "server_acceptance": "operating_system_entropy_only",
        "peer_identity_debug": "redacted",
        "peer_policy_debug": "redacted",
        "connection_debug_and_display": "redacted",
        "unauthorized_peer_error_formatting": "redacted",
        "handler_error_text_formatting": "redacted_by_agent_port",
    }
    _require(
        public_api == expected_public_api,
        "agent-transport public_api contract drifted",
        errors,
    )
"""
          new_expected = """    public_api = contract.get("public_api")
    _require_exact_typed_object(
        public_api,
        EXPECTED_TRANSPORT_PUBLIC_API,
        "agent-transport.public_api",
        errors,
    )
"""
          if validator.count(old_expected) != 1:
              raise SystemExit("validator: public_api comparison shape changed")
          validator = validator.replace(old_expected, new_expected, 1)

          validator = validator.replace(
              'f"public transport surface exposes {forbidden}"',
              'f"{PUBLIC_SURFACE_FINDING}:{forbidden}"',
          )
          validator = validator.replace(
              '"public transport surface exposes accept_with_nonce_source"',
              'f"{PUBLIC_SURFACE_FINDING}:accept_with_nonce_source"',
          )
          validator = validator.replace(
              '"public transport surface exposes session nonce material"',
              'f"{PUBLIC_SURFACE_FINDING}:session_nonce"',
          )
          validator_path.write_text(validator, encoding="utf-8")

          tests_path = Path("tests/test_s04_transport_custody.py")
          tests = tests_path.read_text(encoding="utf-8")
          old_tokens = """        for token in (
            "FixedNonceSource",
            "NonceSource",
            "SessionNonce",
            "FrameKind",
            "pub struct Frame",
        ):
            with self.subTest(token=token):
                mutated = root + f"\npub use facade::{token};\n"
                errors = VALIDATOR.validate_transport_sources(
                    mutated, facade, agent, manifest, contract
                )
                self.assertTrue(any(token in error for error in errors), errors)
"""
          new_tokens = """        for token in (
            "FixedNonceSource",
            "NonceSource",
            "SessionNonce",
            "FrameKind",
            "Frame",
        ):
            with self.subTest(token=token):
                mutated = root + f"\npub use facade::{token};\n"
                errors = VALIDATOR.validate_transport_sources(
                    mutated, facade, agent, manifest, contract
                )
                self.assertTrue(
                    any(
                        error == f"{VALIDATOR.PUBLIC_SURFACE_FINDING}:{token}"
                        for error in errors
                    ),
                    errors,
                )
"""
          if tests.count(old_tokens) != 1:
              raise SystemExit("tests: public export mutation test shape changed")
          tests = tests.replace(old_tokens, new_tokens, 1)

          old_contract_test = """        for candidate in mutations:
            errors = VALIDATOR.validate_transport_sources(
                root, facade, agent, manifest, candidate
            )
            self.assertTrue(any("public_api" in error for error in errors), errors)
"""
          new_contract_test = """        for candidate in mutations:
            errors = VALIDATOR.validate_transport_sources(
                root, facade, agent, manifest, candidate
            )
            self.assertTrue(
                any(error.startswith(VALIDATOR.PUBLIC_API_FINDING + ":") for error in errors),
                errors,
            )

    def test_every_public_api_field_is_type_and_value_bound(self) -> None:
        root, facade, agent, manifest, contract = sources()
        expected = VALIDATOR.EXPECTED_TRANSPORT_PUBLIC_API
        self.assertEqual(contract["public_api"], expected)
        for key, value in expected.items():
            with self.subTest(key=key, mutation="missing"):
                candidate = copy.deepcopy(contract)
                del candidate["public_api"][key]
                errors = VALIDATOR.validate_transport_sources(
                    root, facade, agent, manifest, candidate
                )
                self.assertIn(
                    f"{VALIDATOR.PUBLIC_API_FINDING}:agent-transport.public_api:missing:{key}",
                    errors,
                )
            with self.subTest(key=key, mutation="type"):
                candidate = copy.deepcopy(contract)
                candidate["public_api"][key] = 1 if isinstance(value, bool) else False
                errors = VALIDATOR.validate_transport_sources(
                    root, facade, agent, manifest, candidate
                )
                self.assertTrue(
                    any(
                        error.startswith(
                            f"{VALIDATOR.PUBLIC_API_FINDING}:agent-transport.public_api:type:{key}:"
                        )
                        for error in errors
                    ),
                    errors,
                )
            with self.subTest(key=key, mutation="value"):
                candidate = copy.deepcopy(contract)
                if isinstance(value, bool):
                    candidate["public_api"][key] = not value
                else:
                    candidate["public_api"][key] = value + "-mutated"
                errors = VALIDATOR.validate_transport_sources(
                    root, facade, agent, manifest, candidate
                )
                self.assertIn(
                    f"{VALIDATOR.PUBLIC_API_FINDING}:agent-transport.public_api:value:{key}",
                    errors,
                )
"""
          if tests.count(old_contract_test) != 1:
              raise SystemExit("tests: public_api strictness test shape changed")
          tests = tests.replace(old_contract_test, new_contract_test, 1)
          tests_path.write_text(tests, encoding="utf-8")
          PY

      - name: Install exact Rust toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.93.0

      - name: Run complete exact-head gates before commit
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          python3 tools/validate_s04_transport_custody.py
          python3 -m unittest tests.test_s04_transport_custody -v
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-targets --all-features --locked

      - name: Commit verified repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/s04-review-autofix.yml
          git config user.name "Trillionnium gap-closure bot"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(s04): enforce typed API surface and eliminate dead mechanisms"
          git push origin HEAD:codex/s04-transport-custody-closure-v1
