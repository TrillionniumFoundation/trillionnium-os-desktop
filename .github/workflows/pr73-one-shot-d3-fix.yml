name: pr73-one-shot-d3-fix

on:
  push:
    branches: ["codex/d6-sensitive-log-redaction-v1"]
    paths: [".github/workflows/pr73-one-shot-d3-fix.yml"]

permissions:
  contents: write

concurrency:
  group: pr73-one-shot-d3-fix
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'TrillionniumFoundation/trillionnium-os-desktop' && github.ref_name == 'codex/d6-sensitive-log-redaction-v1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact bootstrap head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Repair D3 patch and governance inventory atomically
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          patch_path=manifests/servo-patches/d3-retained-node-action-v1/007.patch
          manifest_path=manifests/lab-d3-servo-retained-node-action.v1.json
          governance_path=contracts/repository-governance.v1.json
          test "$(grep -c '^@@ -1580,2 +1580,2 @@$' "$patch_path")" = 1
          sed -i 's/^@@ -1580,2 +1580,2 @@$/@@ -1413,2 +1413,2 @@/' "$patch_path"
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          patch_path = Path('manifests/servo-patches/d3-retained-node-action-v1/007.patch')
          manifest_path = Path('manifests/lab-d3-servo-retained-node-action.v1.json')
          governance_path = Path('contracts/repository-governance.v1.json')

          hardening_digest = hashlib.sha256(patch_path.read_bytes()).hexdigest()
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['hardening']['sha256'] = hardening_digest
          manifest['hardening']['parts'][0]['sha256'] = hardening_digest
          manifest_path.write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )

          workflow = '.github/workflows/d3-retained-node-behavior.yml'
          anchor = '.github/workflows/d3-integrated-runtime-evidence.yml'
          governance = json.loads(governance_path.read_text(encoding='utf-8'))
          required = governance['required_workflows']
          if workflow not in required:
              required.insert(required.index(anchor) + 1, workflow)
          governance_path.write_text(
              json.dumps(governance, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          python3 tools/verify_d3_servo_patch.py \
            --manifest "$manifest_path" --root . \
            --base-output /tmp/d3-base.patch \
            --hardening-output /tmp/d3-hardening.patch \
            --output /tmp/d3-combined.patch >/tmp/d3-patch-verification.json
          git rm .github/workflows/pr73-one-shot-d3-fix.yml
          python3 tools/validate_governance_integrity.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$patch_path" "$manifest_path" "$governance_path"
          git commit -m 'fix(d3): repair retained-node behavior qualification'
          git push origin "HEAD:$GITHUB_REF_NAME"
