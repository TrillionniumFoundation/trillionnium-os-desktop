name: materialize-product-tree

on:
  push:
    branches:
      - codex/d5-product-foundation
    paths:
      - ".bootstrap/**"
      - ".github/workflows/materialize-product-tree.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize and validate product tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* > /tmp/product-tree.tar.gz.b64
          base64 -d /tmp/product-tree.tar.gz.b64 > /tmp/product-tree.tar.gz
          echo "31cea3c830744d030d67608e01b395542c8adc888f28654d1fe02f3304e4c70d  /tmp/product-tree.tar.gz" | sha256sum -c -
          tar -xzf /tmp/product-tree.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/materialize-product-tree.yml
          python3 tools/validate_repository.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: establish d5 product foundation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
