name: temporary-d0t03-hardening

on:
  push:
    branches: ["codex/d0t03-live-governance-controller-v2"]
    paths:
      - ".github/workflows/temporary-d0t03-hardening.yml"
      - ".github/d0t03-hardening/**"

permissions:
  contents: write

concurrency:
  group: temporary-d0t03-hardening
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact hardening transaction
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true

      - name: Verify and extract immutable payload
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/codex/d0t03-live-governance-controller-v2"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse HEAD^)" = "6aed391384e8545615544052acb94e8eb18531f3"
          cat .github/d0t03-hardening/payload.b64.* | base64 --decode > "$RUNNER_TEMP/d0t03-hardening.tar.gz"
          printf '%s  %s\n' \
            'ad8efc83bdab38fe01d5b4fb0ee3fee8eedbff7faaf9f0396deeeb033514b5e6' \
            "$RUNNER_TEMP/d0t03-hardening.tar.gz" | sha256sum --check --strict
          tar -tzf "$RUNNER_TEMP/d0t03-hardening.tar.gz" | sort > "$RUNNER_TEMP/actual-paths"
          cat > "$RUNNER_TEMP/expected-paths" <<'EOF'
          tests/test_d0t03_admin_controller.py
          tools/d0t03_admin_controller.py
          EOF
          sort -o "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/expected-paths"
          cmp "$RUNNER_TEMP/expected-paths" "$RUNNER_TEMP/actual-paths"
          tar -xzf "$RUNNER_TEMP/d0t03-hardening.tar.gz" --no-same-owner --no-same-permissions -C .
          printf '%s  %s\n' 'e34be7cfd53fc24dd18768b81cef44f5fa2b425e31859ef6235dc9eff5137e3c' tools/d0t03_admin_controller.py | sha256sum -c --strict
          printf '%s  %s\n' 'ddf4a0d548f5ee72dfdc92caed529f1f838ef663e558a18cf2e9d5c419b959e4' tests/test_d0t03_admin_controller.py | sha256sum -c --strict

      - name: Remove transaction authority before validation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/d0t03-hardening
          rm -f .github/workflows/temporary-d0t03-hardening.yml

      - name: Validate final controller tree
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/d0t03_admin_controller.py --check-config
          python3 -m unittest tests.test_d0t03_admin_controller -v
          python3 -m py_compile tools/d0t03_admin_controller.py tests/test_d0t03_admin_controller.py
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 tools/validate_contract_foundation.py
          git diff --check

      - name: Publish one clean ordinary source commit
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --name-only | sort > "$RUNNER_TEMP/actual-final-paths"
          cat > "$RUNNER_TEMP/expected-final-paths" <<'EOF'
          .github/d0t03-hardening/payload.b64.00
          .github/d0t03-hardening/payload.b64.01
          .github/workflows/temporary-d0t03-hardening.yml
          tests/test_d0t03_admin_controller.py
          tools/d0t03_admin_controller.py
          EOF
          sort -o "$RUNNER_TEMP/expected-final-paths" "$RUNNER_TEMP/expected-final-paths"
          cmp "$RUNNER_TEMP/expected-final-paths" "$RUNNER_TEMP/actual-final-paths"
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(governance): bind rulesets environments and independent probes"
          git push origin HEAD:codex/d0t03-live-governance-controller-v2
