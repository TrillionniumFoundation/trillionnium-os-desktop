name: source-snapshot-once

on:
  push:
    branches:
      - codex/full-gap-closure-v1
    paths:
      - .github/workflows/source-snapshot-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/full-gap-closure-v1
          fetch-depth: 0

      - name: Publish clean exact head
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/source-snapshot-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/source-snapshot-once.yml
          git commit -m 'ci: remove completed source snapshot workflow'
          git push origin HEAD:codex/full-gap-closure-v1
          git archive --format=tar.gz --output="$RUNNER_TEMP/trillionnium-os-desktop-source.tar.gz" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/source-commit.txt"

      - name: Upload exact-head source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: trillionnium-os-desktop-source
          path: |
            ${{ runner.temp }}/trillionnium-os-desktop-source.tar.gz
            ${{ runner.temp }}/source-commit.txt
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
