name: temporary-promote-d4-build-d5-v3

on:
  push:
    branches:
      - codex/control-d4-promote-d5-build-v3

permissions:
  actions: write
  contents: write

concurrency:
  group: temporary-promote-d4-build-d5-v3
  cancel-in-progress: false

jobs:
  promote-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: codex/full-gap-closure-final
      CONTROL_BRANCH: codex/control-d4-promote-d5-build-v3
      D4_CANDIDATE: codex/d4-integration-candidate-v2
      D4_CONTROL: codex/control-d4-build-v2
      D5_CANDIDATE: codex/d5-integration-candidate-v2
      D5_SOURCE_A: codex/d5-product-foundation
      D5_SOURCE_B: codex/d5-trusted-app-verifier-v1
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out corrected D4/D5 control branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/control-d4-promote-d5-build-v3
          fetch-depth: 0
          persist-credentials: true

      - name: Wait for D4 candidate or terminal D4 construction failure
        id: route
        run: |
          set -euo pipefail
          ready=false
          candidate=
          for _ in $(seq 1 720); do
            candidate=$(git ls-remote --heads origin "refs/heads/$D4_CANDIDATE" | awk '{print $1}')
            if test -n "$candidate"; then
              ready=true
              break
            fi
            control=$(git ls-remote --heads origin "refs/heads/$D4_CONTROL" | awk '{print $1}')
            if test -n "$control" && git show "$control:diagnostics/d4-candidate-v2/latest.txt" >/dev/null 2>&1; then
              break
            fi
            sleep 10
          done
          printf 'ready=%s\n' "$ready" >> "$GITHUB_OUTPUT"
          test "$ready" = true && printf 'candidate=%s\n' "$candidate" >> "$GITHUB_OUTPUT" || true

      - name: Install pinned toolchain and independently prove D4
        if: steps.route.outputs.ready == 'true'
        id: d4
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$TARGET_BRANCH" "$D4_CANDIDATE"
          candidate=$(git rev-parse "origin/$D4_CANDIDATE")
          test "$candidate" = '${{ steps.route.outputs.candidate }}'
          test "$(git show -s --format=%P "$candidate" | wc -w)" -eq 1
          parent=$(git show -s --format=%P "$candidate")
          target=$(git rev-parse "origin/$TARGET_BRANCH")
          if test "$target" != "$candidate"; then
            test "$parent" = "$target"
          fi
          git checkout -B "$D4_CANDIDATE" "$candidate"
          channel=$(python3 - <<'PY'
          from pathlib import Path
          import tomllib
          print(tomllib.loads(Path('rust-toolchain.toml').read_text())['toolchain']['channel'])
          PY
          )
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustup override set "$channel"
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 tools/verify_systemd_socket_custody.py
          python3 -m unittest discover -s tests -t . -p 'test_*.py'
          cargo fmt --all --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-targets --all-features --locked
          printf 'head=%s\nparent=%s\ninitial_target=%s\n' "$candidate" "$parent" "$target" >> "$GITHUB_OUTPUT"

      - name: Idempotently fast-forward unified candidate to D4
        if: steps.route.outputs.ready == 'true'
        run: |
          set -euo pipefail
          current=$(git ls-remote --heads origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')
          if test "$current" != '${{ steps.d4.outputs.head }}'; then
            test "$current" = '${{ steps.d4.outputs.parent }}'
            git push origin '${{ steps.d4.outputs.head }}:refs/heads/codex/full-gap-closure-final'
          fi

      - name: Dispatch and require exact D4-head D2I evidence
        if: steps.route.outputs.ready == 'true'
        run: |
          set -euo pipefail
          repo=$GITHUB_REPOSITORY
          candidate='${{ steps.d4.outputs.head }}'
          gh workflow run d2i-integrated-image.yml --repo "$repo" --ref "$TARGET_BRANCH"
          workflow_id=$(gh api "repos/$repo/actions/workflows" --paginate --jq '.workflows[] | select(.path == ".github/workflows/d2i-integrated-image.yml") | .id' | head -n1)
          run_id=
          for _ in $(seq 1 420); do
            run_id=$(gh api "repos/$repo/actions/workflows/$workflow_id/runs?event=workflow_dispatch&per_page=100" --jq ".workflow_runs | map(select(.head_branch == \"$TARGET_BRANCH\" and .head_sha == \"$candidate\")) | sort_by(.created_at) | reverse | .[0].id // empty")
            if test -n "$run_id" && test "$(gh api "repos/$repo/actions/runs/$run_id" --jq '.status')" = completed; then
              break
            fi
            sleep 15
          done
          test -n "$run_id"
          status=$(gh api "repos/$repo/actions/runs/$run_id" --jq '.status')
          conclusion=$(gh api "repos/$repo/actions/runs/$run_id" --jq '.conclusion')
          printf 'candidate=%s\nrun_id=%s\nstatus=%s\nconclusion=%s\n' "$candidate" "$run_id" "$status" "$conclusion" | tee /tmp/d4-d2i-v3-state.txt
          if test "$status" != completed || test "$conclusion" != success; then
            gh run view "$run_id" --repo "$repo" --log-failed > /tmp/d4-d2i-v3-failed.log 2>&1 || true
            exit 1
          fi

      - name: Build or independently reuse D5 candidate
        if: steps.route.outputs.ready == 'true'
        run: |
          set -euo pipefail
          d4='${{ steps.d4.outputs.head }}'
          existing=$(git ls-remote --heads origin "refs/heads/$D5_CANDIDATE" | awk '{print $1}')
          if test -n "$existing"; then
            git fetch --no-tags origin "$D5_CANDIDATE"
            test "$(git show -s --format=%P "$existing")" = "$d4"
            git checkout -B "$D5_CANDIDATE" "$existing"
          else
            git fetch --no-tags origin "$D5_SOURCE_A" "$D5_SOURCE_B"
            git checkout -B "$D5_CANDIDATE" "$d4"
            : > /tmp/d5-v3-history.txt
            : > /tmp/d5-v3-selected.txt
            declare -A seen=()
            for source_branch in "$D5_SOURCE_A" "$D5_SOURCE_B"; do
              source=$(git rev-parse "origin/$source_branch")
              merge_base=$(git merge-base "$d4" "$source")
              printf 'source=%s head=%s merge_base=%s\n' "$source_branch" "$source" "$merge_base" >> /tmp/d5-v3-history.txt
              git log --reverse --format='%H%x09%s' "$merge_base..$source" >> /tmp/d5-v3-history.txt
              mapfile -t commits < <(git log --reverse --format='%H%x09%s' --extended-regexp --regexp-ignore-case --grep='(^|[^[:alnum:]])d5([^[:alnum:]]|$)' "$merge_base..$source" | awk -F '\t' 'tolower($2) !~ /(temporary|diagnostic|export|audit-only)/ {print $1}')
              test "${#commits[@]}" -gt 0
              for commit in "${commits[@]}"; do
                test "$(git show -s --format=%P "$commit" | wc -w)" -eq 1
                patch_id=$(git show --pretty=format: --binary "$commit" | git patch-id --stable | awk 'NR==1 {print $1}')
                test -n "$patch_id"
                test -n "${seen[$patch_id]:-}" && continue
                seen[$patch_id]=1
                git cherry-pick --no-commit "$commit"
                printf '%s %s\n' "$commit" "$patch_id" >> /tmp/d5-v3-selected.txt
              done
            done
            test -s /tmp/d5-v3-selected.txt
            test -n "$(git diff --cached --name-only)"
            git diff --cached --check
            if git diff --cached --name-only | grep -E '(^|/)(temporary|diagnostics?)(/|$)|\.patch(\.|$)|\.b85$'; then
              exit 1
            fi
          fi
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 tools/verify_systemd_socket_custody.py
          python3 -m unittest discover -s tests -t . -p 'test_*.py'
          cargo fmt --all --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-targets --all-features --locked
          if test -z "$existing"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m 'feat(d5): integrate trusted application product foundation'
            git push origin "HEAD:refs/heads/$D5_CANDIDATE"
          fi

      - name: Persist corrected D4/D5 result and remove workflow
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          ROUTE_READY: ${{ steps.route.outputs.ready }}
        run: |
          set -euo pipefail
          status_snapshot=$(git status --short 2>&1 || true)
          git fetch --no-tags origin "$CONTROL_BRANCH"
          git checkout -B "$CONTROL_BRANCH" "origin/$CONTROL_BRANCH"
          rm -f .github/workflows/temporary-promote-d4-build-d5-v3.yml
          mkdir -p diagnostics/d4-promote-d5-build-v3
          {
            printf 'schema=trillionnium.desktop.d4-promote-d5-build-result.v3\n'
            printf 'recorded_at=%s\njob_status=%s\nroute_ready=%s\n\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$JOB_STATUS" "$ROUTE_READY"
            for file in /tmp/d4-d2i-v3-state.txt /tmp/d4-d2i-v3-failed.log /tmp/d5-v3-history.txt /tmp/d5-v3-selected.txt; do
              test -f "$file" || continue
              printf '%s\n' "--- $(basename "$file") ---"
              tail -n 1800 "$file"
              printf '\n'
            done
            printf '%s\n%s\n' '--- status ---' "$status_snapshot"
          } > diagnostics/d4-promote-d5-build-v3/latest.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- .github/workflows/temporary-promote-d4-build-d5-v3.yml diagnostics/d4-promote-d5-build-v3/latest.txt
          git commit -m "diagnostics(d4-d5): record corrected pipeline result ($JOB_STATUS)"
          git push origin "HEAD:refs/heads/$CONTROL_BRANCH"
