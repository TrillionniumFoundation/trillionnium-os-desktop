name: d0a02-transactional-qualification

on:
  push:
    branches:
      - codex/d0a02-proof-soundness-v4
    paths:
      - ".github/workflows/d0a02-transactional-qualification.yml"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: d0a02-transactional-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transact:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: codex/d0a02-proof-soundness-v4
      PR_NUMBER: "33"
    steps:
      - name: Check out current branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Converge to permanent source only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          if [[ -f tools/materialize_d0a02_clipboard_roundtrip.py ]]; then
            python3 tools/materialize_d0a02_clipboard_roundtrip.py
          fi
          test -f tools/validate_d0a02_clipboard_roundtrip.py
          test -f docs/architecture/D0A02_CLIPBOARD_ROUNDTRIP.md
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustfmt +1.97.1 --edition 2024 experiments/servo-headed-runtime/src/main.rs
          python3 tools/validate_d0a02_proof_soundness.py
          python3 tools/validate_d0a02_clipboard_roundtrip.py
          rm -f \
            .github/workflows/d0a02-materialize-clipboard-roundtrip.yml \
            .github/workflows/d0a02-one-shot-format-materialized-source.yml \
            .github/workflows/d0a02-finalize-clipboard-proof.yml \
            .github/workflows/d0a02-transactional-qualification.yml \
            tools/materialize_d0a02_clipboard_roundtrip.py
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m 'test(d0a02): converge permanent proof source'
            git pull --rebase origin "$BRANCH"
            git push origin "HEAD:$BRANCH"
          fi
          printf 'SOURCE_SHA=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          printf 'SOURCE_TREE_SHA=%s\n' "$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          test -z "$(git status --porcelain=v1)"
          test ! -e .github/workflows/d0a02-transactional-qualification.yml
          test ! -e tools/materialize_d0a02_clipboard_roundtrip.py

      - name: Dispatch exact-ref permanent qualification
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail
          before=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow servo-headed-runtime.yml \
            --branch "$BRANCH" \
            --event workflow_dispatch \
            --limit 50 \
            --json databaseId \
            --jq '.[].databaseId' | sort -n)
          gh workflow run servo-headed-runtime.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$BRANCH"
          run_id=
          for _ in $(seq 1 60); do
            run_id=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow servo-headed-runtime.yml \
              --branch "$BRANCH" \
              --event workflow_dispatch \
              --limit 50 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$SOURCE_SHA\") | .databaseId" \
              | sort -nr | head -n1)
            if [[ -n "$run_id" ]] && ! grep -qx "$run_id" <<<"$before"; then
              break
            fi
            sleep 5
          done
          test -n "$run_id"
          printf 'RUN_ID=%s\n' "$run_id" >> "$GITHUB_ENV"
          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

      - name: Wait for exact-head terminal success
        shell: bash
        run: |
          set -euo pipefail
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status
          conclusion=$(gh run view "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json conclusion,headSha \
            --jq '.conclusion + " " + .headSha')
          test "$conclusion" = "success $SOURCE_SHA"

      - name: Download and independently validate bounded evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/d0a02-evidence
          mkdir -p /tmp/d0a02-evidence
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --dir /tmp/d0a02-evidence
          result=$(find /tmp/d0a02-evidence -type f -name runtime-result.json -print -quit)
          test -n "$result"
          jq -e '
            .status == "PASS_HEADED_LOCAL_FIXTURE_AND_CONTENT_CRASH_RECOVERY"
            and .claims.external_navigation_performed == false
            and .claims.agent_port_started == false
            and .fault.status == "PASS_EXACT_INJECTED_TERMINATION_AND_SERVO_CALLBACK"
            and .fault.signal == "SIGKILL"
            and .fault.selected.pid == .fault.observed.pid
            and .fault.selected.start_time == .fault.observed.start_time
            and .generation.stale_callbacks == 0
            and .generation.recovery_generation == 2
            and .webviews.live == 1
            and .webviews.peak == 1
            and .webviews.created == 2
            and .webviews.invalidated == 1
            and .webviews.dropped == 1
            and .processes.original.pid != .processes.replacement.pid
            and .processes.original.start_time != .processes.replacement.start_time
            and .clipboard.status == "PASS_SERVO_EDITING_ACTION_TO_GENERATION_BOUND_DELEGATE_AND_BACK_TO_DOCUMENT"
            and .clipboard.phase == "Verified"
            and .clipboard.sentinel == "hepta-servo-clipboard-roundtrip-v1"
            and .clipboard.set_text_calls == 1
            and .clipboard.get_text_calls == 1
            and .clipboard.clear_calls == 0
            and .clipboard.stale_callbacks == 0
            and .clipboard.document_verified == true
            and .clipboard.generation_bound == true
            and .clipboard.host_clipboard_authority_claimed == false
            and .clipboard.image_clipboard_authority_claimed == false
          ' "$result" >/dev/null
          for name in process-topology-pre-fault.txt process-topology-post-termination.txt process-topology-post-recovery.txt; do
            test -s "$(find /tmp/d0a02-evidence -type f -name "$name" -print -quit)"
          done
          cp "$result" /tmp/runtime-result.json
          artifact_json=$(gh api \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts")
          artifact_id=$(jq -er '.artifacts | length == 1 and .[0].id' <<<"$artifact_json")
          artifact_digest=$(jq -er '.artifacts[0].digest' <<<"$artifact_json")
          artifact_name=$(jq -er '.artifacts[0].name' <<<"$artifact_json")
          test "$artifact_digest" != null
          printf 'ARTIFACT_ID=%s\nARTIFACT_DIGEST=%s\nARTIFACT_NAME=%s\n' \
            "$artifact_id" "$artifact_digest" "$artifact_name" >> "$GITHUB_ENV"

      - name: Commit exact-source machine receipt
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p docs/evidence/generated
          runtime_sha=$(sha256sum /tmp/runtime-result.json | awk '{print $1}')
          workflow_sha=$(sha256sum .github/workflows/servo-headed-runtime.yml | awk '{print $1}')
          source_sha=$(sha256sum experiments/servo-headed-runtime/src/main.rs | awk '{print $1}')
          validator_sha=$(sha256sum tools/validate_d0a02_proof_soundness.py | awk '{print $1}')
          clipboard_validator_sha=$(sha256sum tools/validate_d0a02_clipboard_roundtrip.py | awk '{print $1}')
          jq -n \
            --arg source_sha "$SOURCE_SHA" \
            --arg source_tree_sha "$SOURCE_TREE_SHA" \
            --argjson run_id "$RUN_ID" \
            --argjson artifact_id "$ARTIFACT_ID" \
            --arg artifact_digest "$ARTIFACT_DIGEST" \
            --arg artifact_name "$ARTIFACT_NAME" \
            --arg runtime_result_sha256 "$runtime_sha" \
            --arg workflow_sha256 "$workflow_sha" \
            --arg source_file_sha256 "$source_sha" \
            --arg validator_sha256 "$validator_sha" \
            --arg clipboard_validator_sha256 "$clipboard_validator_sha" \
            '{
              schema: "trillionnium.desktop.d0a02-proof-soundness-receipt.v1",
              status: "PASS_EXACT_HEAD_MACHINE_EVIDENCE_AWAITING_INDEPENDENT_REVIEW_AND_EXACT_MAIN",
              source_sha: $source_sha,
              source_tree_sha: $source_tree_sha,
              workflow_run_id: $run_id,
              artifact: {
                id: $artifact_id,
                name: $artifact_name,
                digest: $artifact_digest,
                runtime_result_sha256: $runtime_result_sha256
              },
              inputs: {
                workflow_sha256: $workflow_sha256,
                runtime_source_sha256: $source_file_sha256,
                proof_validator_sha256: $validator_sha256,
                clipboard_validator_sha256: $clipboard_validator_sha256
              },
              proven: {
                exact_sigkill_causality: true,
                generation_and_webview_isolation: true,
                measured_webview_cardinality: true,
                measured_process_replacement: true,
                servo_clipboard_roundtrip: true
              },
              not_claimed: [
                "integrated_main",
                "debian_image",
                "agent_port",
                "external_effects",
                "hardware",
                "release"
              ]
            }' > docs/evidence/generated/d0a02-proof-soundness-result.json
          python3 tools/validate_d0a02_proof_soundness.py
          python3 tools/validate_d0a02_clipboard_roundtrip.py
          git add docs/evidence/generated/d0a02-proof-soundness-result.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'docs(evidence): bind D0A-02 exact-head proof receipt'
          git push origin "HEAD:$BRANCH"
          gh pr comment "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Exact source \`$SOURCE_SHA\` passed permanent headed workflow run \`$RUN_ID\`; artifact \`$ARTIFACT_ID\` is bound by \`$ARTIFACT_DIGEST\`. The downloaded receipt independently passed exact SIGKILL causality, stale-callback rejection, measured WebView/process replacement, and Servo EditingAction→ClipboardDelegate→document round-trip assertions. Promotion remains blocked on independent review and exact-main rerun."
