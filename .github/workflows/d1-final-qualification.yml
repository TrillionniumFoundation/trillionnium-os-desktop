name: d1-final-qualification

on:
  pull_request:
    paths:
      - ".github/workflows/d1-final-qualification.yml"
      - "apps/hepta-agent-portd/**"
      - "contracts/agent-port-*.json"
      - "manifests/debian-d1*"
      - "manifests/debian-snapshot*"
      - "manifests/e2fsprogs-host-toolchain.v1.json"
      - "manifests/project-state.v1.json"
      - "manifests/gates.v1.json"
      - "packaging/debian/image/**"
      - "packaging/debian/systemd/**"
      - "packaging/debian/sysusers.d/**"
      - "packaging/debian/tmpfiles.d/**"
      - "tests/d1/**"
      - "tests/qemu/**"
      - "tools/build_pinned_e2fsprogs.sh"
      - "tools/compare_d1_builds.py"
      - "tools/prepare_d1_inputs.py"
      - "tools/resolve_debian_snapshot.py"
      - "tools/resolve_debian_snapshot_with_pinned_keys.py"
      - "tools/validate_project_truth.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  push:
    branches:
      - codex/d1-01-d6-replay-v1
    paths:
      - ".github/workflows/d1-final-qualification.yml"
      - "apps/hepta-agent-portd/**"
      - "contracts/agent-port-*.json"
      - "manifests/debian-d1*"
      - "manifests/debian-snapshot*"
      - "manifests/e2fsprogs-host-toolchain.v1.json"
      - "manifests/project-state.v1.json"
      - "manifests/gates.v1.json"
      - "packaging/debian/image/**"
      - "packaging/debian/systemd/**"
      - "packaging/debian/sysusers.d/**"
      - "packaging/debian/tmpfiles.d/**"
      - "tests/d1/**"
      - "tests/qemu/**"
      - "tools/build_pinned_e2fsprogs.sh"
      - "tools/compare_d1_builds.py"
      - "tools/prepare_d1_inputs.py"
      - "tools/resolve_debian_snapshot.py"
      - "tools/resolve_debian_snapshot_with_pinned_keys.py"
      - "tools/validate_project_truth.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d1-final-qualification-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  E2FSPROGS_COMMIT: c3cce4a07efefc62bc7fc57a678cb870af27d0f2
  E2FSPROGS_VERSION: 1.47.2
  CANDIDATE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
  TESTED_SHA: ${{ github.sha }}

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Check out exact D1 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Record exact source identities
        shell: bash
        run: |
          set -euo pipefail
          printf 'TESTED_TREE_SHA=%s\n' "$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          printf 'candidate_head=%s\nbase=%s\ntested=%s\ntree=%s\n' \
            "$CANDIDATE_HEAD_SHA" "$BASE_SHA" "$TESTED_SHA" "$(git rev-parse HEAD^{tree})"

      - name: Check out exact e2fsprogs source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: tytso/e2fsprogs
          ref: ${{ env.E2FSPROGS_COMMIT }}
          path: e2fsprogs-source
          fetch-depth: 1
          persist-credentials: false

      - name: Install D1 host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            debian-archive-keyring \
            e2fsprogs \
            gettext \
            gnupg \
            jq \
            mmdebstrap \
            qemu-system-x86 \
            rsync \
            shellcheck \
            systemd
          sudo rm -rf /var/lib/apt/lists/*

      - name: Build isolated exact e2fsprogs toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C e2fsprogs-source rev-parse HEAD)" = "$E2FSPROGS_COMMIT"
          test -z "$(git -C e2fsprogs-source status --porcelain=v1)"
          python3 - <<'PY'
          from pathlib import Path
          import json

          manifest = json.loads(Path('manifests/e2fsprogs-host-toolchain.v1.json').read_text())
          assert manifest['commit'] == 'c3cce4a07efefc62bc7fc57a678cb870af27d0f2'
          assert manifest['version'] == '1.47.2'
          assert manifest['build']['configure_flags'] == ['--enable-nls']
          assert manifest['build']['runtime_locale'] == 'C.UTF-8'
          assert manifest['build']['utf8_tar_import_probe_required'] is True
          assert manifest['build']['install_system_wide'] is False
          assert manifest['build']['isolated_prefix_required'] is True
          PY
          prefix="$RUNNER_TEMP/e2fsprogs-$E2FSPROGS_VERSION"
          build="$RUNNER_TEMP/e2fsprogs-build"
          rm -rf "$prefix" "$build"
          mkdir -p "$build"
          cd "$build"
          "$GITHUB_WORKSPACE/e2fsprogs-source/configure" \
            --prefix="$prefix" \
            --enable-nls
          make -j2
          make -C e2fsck install
          make -C misc install
          test -x "$prefix/sbin/mke2fs"
          test -x "$prefix/sbin/e2fsck"
          test -x "$prefix/sbin/dumpe2fs"
          test "$("$prefix/sbin/mke2fs" -V 2>&1 | awk 'NR == 1 { print $2 }')" = "$E2FSPROGS_VERSION"
          test "$(LC_ALL=C.UTF-8 LANG=C.UTF-8 locale charmap)" = UTF-8
          probe="$RUNNER_TEMP/e2fsprogs-utf8-probe"
          rm -rf "$probe"
          mkdir -p "$probe/root"
          printf 'utf8-path-probe\n' > "$probe/root/路径.txt"
          LC_ALL=C tar \
            --sort=name \
            --format=pax \
            --pax-option=delete=atime,delete=ctime,exthdr.name=%d/PaxHeaders/%f \
            --numeric-owner \
            --mtime='@1700000000' \
            -C "$probe/root" \
            -cf "$probe/rootfs.tar" .
          truncate -s 64M "$probe/probe.ext4"
          probe_uuid=7f453284-a1e5-4f17-9c30-7c5bde91ffff
          E2FSPROGS_FAKE_TIME=1700000000 \
            LC_ALL=C.UTF-8 LANG=C.UTF-8 \
            "$prefix/sbin/mke2fs" \
            -F -q -t ext4 -b 4096 -I 256 -m 0 \
            -L TOSD1PROBE -U "$probe_uuid" \
            -E "root_owner=0:0,lazy_itable_init=0,lazy_journal_init=0,hash_seed=$probe_uuid" \
            -d "$probe/rootfs.tar" \
            "$probe/probe.ext4"
          "$prefix/sbin/e2fsck" -fn "$probe/probe.ext4"
          mkdir -p /tmp/trillionnium-d1/evidence
          python3 - "$prefix/sbin/mke2fs" \
            /tmp/trillionnium-d1/evidence/e2fsprogs-utf8-probe.json \
            "$E2FSPROGS_COMMIT" "$E2FSPROGS_VERSION" <<'PROBE_PY'
          import hashlib
          import json
          from pathlib import Path
          import sys

          binary = Path(sys.argv[1])
          output = Path(sys.argv[2])
          report = {
              "schema": "trillionnium.desktop.e2fsprogs-utf8-probe.v1",
              "status": "PASS_UTF8_TAR_IMPORT",
              "commit": sys.argv[3],
              "version": sys.argv[4],
              "configure_flags": ["--enable-nls"],
              "runtime_locale": "C.UTF-8",
              "source_patch_count": 0,
              "mke2fs_sha256": hashlib.sha256(binary.read_bytes()).hexdigest(),
          }
          output.write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          PROBE_PY
          rm -rf "$probe"
          printf '%s\n' "$prefix/sbin" "$prefix/bin" >> "$GITHUB_PATH"
          cd "$GITHUB_WORKSPACE"
          rm -rf e2fsprogs-source

      - name: Install exact repository Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(python3 - <<'PY'
          from pathlib import Path
          import tomllib
          print(tomllib.loads(Path('rust-toolchain.toml').read_text())['toolchain']['channel'])
          PY
          )"
          components="$(python3 - <<'PY'
          from pathlib import Path
          import tomllib
          print(' '.join(tomllib.loads(Path('rust-toolchain.toml').read_text())['toolchain']['components']))
          PY
          )"
          printf 'RUST_CHANNEL=%s\n' "$channel" >> "$GITHUB_ENV"
          rustup toolchain install "$channel" --profile minimal
          for component in $components; do
            rustup component add "$component" --toolchain "$channel"
          done
          export RUSTUP_TOOLCHAIN="$channel"
          rustc --version --verbose
          cargo --version --verbose

      - name: Restore Cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: d1-final-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}

      - name: Validate tracked source corpus
        shell: bash
        run: |
          set -euo pipefail
          export RUSTUP_TOOLCHAIN="$RUST_CHANNEL"
          test "$(mke2fs -V 2>&1 | awk 'NR == 1 { print $2 }')" = "$E2FSPROGS_VERSION"
          test -z "$(git status --porcelain=v1)"
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 -m unittest discover -s tests/d1 -p 'test_*.py'
          python3 -m py_compile \
            tools/compare_d1_builds.py \
            tools/prepare_d1_inputs.py \
            tools/resolve_debian_snapshot.py \
            tools/resolve_debian_snapshot_with_pinned_keys.py
          shellcheck -e SC2016,SC2054 \
            packaging/debian/image/build-d1-image.sh \
            packaging/debian/image/rootfs-overlay/usr/local/libexec/trillionnium-d1-acceptance \
            packaging/debian/image/rootfs-overlay/usr/local/libexec/trillionnium-d1-agent-fixture-launcher \
            tests/qemu/run-d1-boot-test.sh \
            tests/qemu/run-d1-pipeline.sh
          cargo fmt --all --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-targets --all-features --locked

      - name: Build AgentPort PID1 qualification binaries
        shell: bash
        run: |
          set -euo pipefail
          export RUSTUP_TOOLCHAIN="$RUST_CHANNEL"
          cargo build --release --locked \
            -p hepta-agent-portd \
            --bin hepta-agent-portd \
            --bin hepta-agent-d1-fixture
          test -x target/release/hepta-agent-portd
          test -x target/release/hepta-agent-d1-fixture

      - name: Resolve signed closure, build twice, and qualify under QEMU
        shell: bash
        run: |
          set -euo pipefail
          export RUSTUP_TOOLCHAIN="$RUST_CHANNEL"
          test "$(mke2fs -V 2>&1 | awk 'NR == 1 { print $2 }')" = "$E2FSPROGS_VERSION"
          tests/qemu/run-d1-pipeline.sh \
            --workspace "$GITHUB_WORKSPACE" \
            --output-dir /tmp/trillionnium-d1

      - name: Enforce complete D1 evidence and claim ceiling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          root = Path('/tmp/trillionnium-d1')
          pipeline = json.loads((root / 'pipeline-result.json').read_text())
          repro = json.loads((root / 'reproducibility-result.json').read_text())
          boot = json.loads((root / 'qemu/boot-result.json').read_text())
          acceptance = json.loads((root / 'qemu/acceptance.json').read_text())
          utf8_probe = json.loads((root / 'evidence/e2fsprogs-utf8-probe.json').read_text())
          assert pipeline['status'] == 'PASS', pipeline
          assert repro['status'] == 'PASS_TWO_INDEPENDENT_BUILDS', repro
          assert repro['reproducible'] is True, repro
          assert boot['status'] == 'PASS_QEMU_PID1_WAYLAND_AND_AGENT_PORT', boot
          assert acceptance['status'] == 'PASS', acceptance
          assert utf8_probe['status'] == 'PASS_UTF8_TAR_IMPORT', utf8_probe
          assert utf8_probe['commit'] == os.environ['E2FSPROGS_COMMIT'], utf8_probe
          assert utf8_probe['configure_flags'] == ['--enable-nls'], utf8_probe
          assert utf8_probe['runtime_locale'] == 'C.UTF-8', utf8_probe
          assert utf8_probe['source_patch_count'] == 0, utf8_probe
          claims = boot['claims']
          for key in [
              'systemd_booted', 'udev_active', 'dbus_active', 'logind_active',
              'headless_wayland_active', 'agent_port_default_disabled',
              'agent_port_pid1_activation_validated', 'unauthorized_peer_denied',
              'authorized_fixture_request', 'per_connection_teardown',
              'connection_kill_recovered',
          ]:
              assert claims[key] is True, (key, claims.get(key))
          assert claims['network_enabled'] is False
          assert claims['servo_started'] is False
          assert claims['visible_window_created'] is False
          assert claims['secure_boot_qualified'] is False
          assert boot['release_marker_absent'] is True
          assert boot['clean_poweroff'] is True

          workflow = Path('.github/workflows/d1-final-qualification.yml')
          input_paths = [
              Path('Cargo.lock'),
              Path('rust-toolchain.toml'),
              Path('manifests/debian-d1.requirements.v1.json'),
              Path('manifests/debian-d1.selection.json'),
              Path('manifests/e2fsprogs-host-toolchain.v1.json'),
              Path('packaging/debian/image/build-d1-image.sh'),
              Path('tests/qemu/run-d1-pipeline.sh'),
          ]
          evidence = root / 'evidence'
          evidence.mkdir(parents=True, exist_ok=True)
          summary = {
              'schema': 'trillionnium.desktop.d1-final-qualification.v1',
              'status': 'PASS',
              'repository': os.environ['GITHUB_REPOSITORY'],
              'base_sha': os.environ['BASE_SHA'],
              'candidate_head_sha': os.environ['CANDIDATE_HEAD_SHA'],
              'tested_sha': os.environ['TESTED_SHA'],
              'tree_sha': os.environ['TESTED_TREE_SHA'],
              'workflow_sha256': hashlib.sha256(workflow.read_bytes()).hexdigest(),
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'input_digests': {
                  str(path): hashlib.sha256(path.read_bytes()).hexdigest()
                  for path in input_paths
              },
              'e2fsprogs_utf8_probe': utf8_probe,
              'pipeline': pipeline,
              'reproducibility': repro,
              'boot': boot,
              'acceptance': acceptance,
              'claim_ceiling': {
                  'servo_started': False,
                  'visible_window_created': False,
                  'network_enabled_during_acceptance': False,
                  'secure_boot_qualified': False,
                  'product_release_authorized': False,
              },
          }
          (evidence / 'd1-final-qualification.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Upload complete D1 machine evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d1-final-qualification-${{ github.sha }}
          path: /tmp/trillionnium-d1/evidence
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
