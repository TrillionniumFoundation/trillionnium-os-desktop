name: cleanup-remote-branches

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every non-main branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r branch; do
            [ "${branch}" = "main" ] && continue
            encoded=$(printf '%s' "${branch}" | jq -sRr @uri)
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${encoded}"
          done < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name')
      - name: Remove this temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/cleanup-remote-branches.yml?ref=main" --jq .sha)
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/cleanup-remote-branches.yml"             -f message='chore: remove temporary branch cleanup workflow'             -f sha="${sha}"             -f branch=main
