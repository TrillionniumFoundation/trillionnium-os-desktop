name: temporary-validator-repair

on:
  push:
    branches:
      - codex/full-gap-closure-final

permissions:
  contents: write

concurrency:
  group: temporary-validator-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/full-gap-closure-final
          fetch-depth: 0
          persist-credentials: true

      - name: Apply structural fail-closed parser repair
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/validate_governance_integrity.py")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          starts = [
              index
              for index in range(len(lines) - 2)
              if lines[index] == "        elif (\n"
              and lines[index + 1] == '            argument in {"-H", "--header"}\n'
              and lines[index + 2] == '            or lowered.startswith("--header=")\n'
          ]
          if len(starts) != 1:
              raise SystemExit(f"repair start count was {len(starts)}, expected exactly one")
          start = starts[0]
          try:
              stop = lines.index('            header = ""\n', start, start + 24) + 1
          except ValueError as error:
              raise SystemExit("repair stop was not found in the bounded source window") from error
          replacement = [
              "        elif (\n",
              "            # Attached long forms such as `--header${HEADER}` are either\n",
              "            # dynamic or malformed.  A source-only scan cannot prove their\n",
              "            # value is a harmless header, so reject every non-`=` attached\n",
              "            # spelling before it can consume the following URL as its value.\n",
              '            lowered.startswith("--header")\n',
              '            and len(argument) > len("--header")\n',
              '            and not lowered.startswith("--header=")\n',
              "        ):\n",
              "            return True\n",
              '        elif argument in {"-H", "--header"} or lowered.startswith("--header="):\n',
              '            header = ""\n',
          ]
          lines[start:stop] = replacement
          path.write_text("".join(lines), encoding="utf-8")
          PY

      - name: Prove syntax and the existing negative regression
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 - <<'PY'
          import py_compile
          py_compile.compile(
              "tools/validate_governance_integrity.py",
              cfile="/tmp/validate_governance_integrity.pyc",
              doraise=True,
          )
          PY
          python3 -m unittest \
            tests.test_validate_governance_integrity.GovernanceModelTests.test_bounded_dynamic_git_http_shell_and_module_forms_are_rejected \
            -v

      - name: Remove the temporary repair surface and publish the fix
        run: |
          rm .github/workflows/temporary-source-export.yml
          actual=$(git diff --name-only | sort)
          expected=$(printf '%s\n' \
            .github/workflows/temporary-source-export.yml \
            tools/validate_governance_integrity.py | sort)
          test "$actual" = "$expected"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- \
            .github/workflows/temporary-source-export.yml \
            tools/validate_governance_integrity.py
          git commit -m "fix(governance): reject attached dynamic curl headers"
          git push origin HEAD:refs/heads/codex/full-gap-closure-final
