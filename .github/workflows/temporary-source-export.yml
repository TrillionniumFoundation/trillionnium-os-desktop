name: temporary-validator-repair

on:
  push:
    branches:
      - codex/full-gap-closure-final

permissions:
  contents: write

concurrency:
  group: temporary-validator-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/full-gap-closure-final
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact fail-closed parser repair
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/validate_governance_integrity.py")
          text = path.read_text(encoding="utf-8")
          old = '''        elif (
              argument in {"-H", "--header"}
              or lowered.startswith("--header=")
              or (
                  # Attached long forms such as `--header${HEADER}` are
                  # either dynamic or malformed.  A source-only scan cannot
                  # prove their value is a harmless header, so reject every
                  # non-`=` attached spelling before it can bypass the
                  # separate-argument branch above.
                  lowered.startswith("--header")
                  and len(argument) > len("--header")
                  and not lowered.startswith("--header=")
              )
          ):
              header = ""
          '''
          new = '''        elif (
              # Attached long forms such as `--header${HEADER}` are either
              # dynamic or malformed.  A source-only scan cannot prove their
              # value is a harmless header, so reject every non-`=` attached
              # spelling before it can consume the following URL as its value.
              lowered.startswith("--header")
              and len(argument) > len("--header")
              and not lowered.startswith("--header=")
          ):
              return True
          elif argument in {"-H", "--header"} or lowered.startswith("--header="):
              header = ""
          '''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"repair target count was {count}, expected exactly one")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Prove syntax and the existing negative regression
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 - <<'PY'
          import py_compile
          py_compile.compile(
              "tools/validate_governance_integrity.py",
              cfile="/tmp/validate_governance_integrity.pyc",
              doraise=True,
          )
          PY
          python3 -m unittest \
            tests.test_validate_governance_integrity.GovernanceModelTests.test_bounded_dynamic_git_http_shell_and_module_forms_are_rejected \
            -v

      - name: Remove the temporary repair surface and publish the fix
        run: |
          rm .github/workflows/temporary-source-export.yml
          actual=$(git diff --name-only | sort)
          expected=$(printf '%s\n' \
            .github/workflows/temporary-source-export.yml \
            tools/validate_governance_integrity.py | sort)
          test "$actual" = "$expected"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- \
            .github/workflows/temporary-source-export.yml \
            tools/validate_governance_integrity.py
          git commit -m "fix(governance): reject attached dynamic curl headers"
          git push origin HEAD:refs/heads/codex/full-gap-closure-final
