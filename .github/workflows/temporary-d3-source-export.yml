name: temporary-d3-source-export

on:
  push:
    branches:
      - codex/d3-cross-uid-static-attestation-v1

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact D3 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Stage complete bounded D3 reference set
        run: |
          set -euo pipefail
          mkdir -p /tmp/d3-source
          patterns='BLOCKED_UPSTREAM_CROSS_UID_PROCFS|qualification-static-attestation|development_static_attestation|development_blocker|HEPTA_D3_EXPECTED_EXECUTABLE_SHA256|attest_with_static_executable_digest|hash_trusted_executable'
          grep -RIlE "$patterns" \
            --exclude-dir=.git \
            --exclude='*.lock' \
            . | sed 's#^./##' | sort > /tmp/d3-source/matching-files.txt
          while IFS= read -r file; do
            cp --parents "$file" /tmp/d3-source
          done < /tmp/d3-source/matching-files.txt
          cp --parents \
            crates/hepta-browser-actor/src/lib.rs \
            packaging/debian/systemd/hepta-browserd-agent-development@.service \
            /tmp/d3-source
      - name: Upload complete bounded D3 reference set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: temporary-d3-source-${{ github.sha }}
          path: /tmp/d3-source
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
