name: materialize-d0c-rust-stack-v3

on:
  push:
    branches:
      - codex/d0c02-transport-v2
    paths:
      - ".github/workflows/materialize-d0c-rust-stack-v3.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-d0c-rust-stack-v3
  cancel-in-progress: false

jobs:
  materialize-autofix-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d0c02-transport-v2
          fetch-depth: 0

      - name: Install exact Rust 1.93.0
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup default 1.93.0
          rustc --version --verbose
          cargo --version --verbose

      - name: Materialize D0C product candidate if absent
        run: |
          set -euo pipefail
          if [[ ! -f crates/hepta-browser-codec/src/lib.rs || ! -f crates/hepta-agent-port/src/lib.rs ]]; then
            curl --fail --location --silent --show-error \
              https://raw.githubusercontent.com/TrillionniumFoundation/trillionnium-os-desktop/b617f1013d84770a74129895e4be1f3ce3960c17/.bootstrap-d0c/payload.tar.gz.b64 \
              --output /tmp/d0c-materialize.tar.gz.b64
            base64 -d /tmp/d0c-materialize.tar.gz.b64 > /tmp/d0c-materialize.tar.gz
            echo "787c4df8648ab4dd3c0795de3e04f3f1c11b913215cd81f0cc4bf9449b316ad9  /tmp/d0c-materialize.tar.gz" | sha256sum -c -
            mkdir -p /tmp/d0c
            tar -xzf /tmp/d0c-materialize.tar.gz -C /tmp/d0c
            mkdir -p docs/evidence/generated
            python3 /tmp/d0c/apply_to_checkout.py "$GITHUB_WORKSPACE" \
              --apply --allow-dirty \
              --report docs/evidence/generated/d0c-rust-overlay-application.json
            cp /tmp/d0c/toolchain/tools/verify_cargo_lock_allowlist.py tools/verify_cargo_lock_allowlist.py
            cp /tmp/d0c/toolchain/manifests/cargo-external-allowlist-d0c02-baseline.json \
              manifests/cargo-external-allowlist-d0c02-baseline.json
          fi
          test -f crates/hepta-browser-codec/src/lib.rs
          test -f crates/hepta-agent-port/src/lib.rs

      - name: Resolve dependency graph and apply mechanical Rust fixes
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo fmt --all
          cargo fix --workspace --all-targets --allow-dirty --allow-staged || true
          cargo clippy --fix --workspace --all-targets --allow-dirty --allow-staged -- -D warnings || true
          cargo fmt --all
          python3 tools/verify_cargo_lock_allowlist.py \
            --lock Cargo.lock \
            --baseline manifests/cargo-external-allowlist-d0c02-baseline.json \
            --write-candidate manifests/cargo-external-allowlist.d0c-candidate.json \
            --output-result docs/evidence/generated/d0c-cargo-lock-candidate-result.json

      - name: Commit the exact source candidate before gate execution
        run: |
          set -euo pipefail
          rm -f .github/workflows/materialize-d0c-rust-stack.yml
          rm -f .github/workflows/materialize-d0c-rust-stack-v2.yml
          rm -f .github/workflows/materialize-d0c-rust-stack-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "feat: materialize and mechanically fix D0C Rust product candidate"
            git push origin HEAD:codex/d0c02-transport-v2
          fi
          echo "TESTED_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Execute every exact Rust gate without losing later diagnostics
        id: gate
        shell: bash
        run: |
          set +e
          mkdir -p docs/evidence/generated
          cargo fmt --all --check > docs/evidence/generated/d0c-rust-fmt.log 2>&1
          fmt=$?
          cargo clippy --workspace --all-targets --locked -- -D warnings > docs/evidence/generated/d0c-rust-clippy.log 2>&1
          clippy=$?
          cargo test --workspace --all-targets --locked > docs/evidence/generated/d0c-rust-workspace-tests.log 2>&1
          workspace=$?
          cargo test --locked -p hepta-browser-codec --all-targets > docs/evidence/generated/d0c-rust-codec-tests.log 2>&1
          codec=$?
          cargo test --locked -p hepta-agent-port --all-targets > docs/evidence/generated/d0c-rust-agent-port-tests.log 2>&1
          port=$?
          cargo run --locked -p hepta-browserd -- --self-check > docs/evidence/generated/d0c-rust-browserd-self-check.log 2>&1
          selfcheck=$?
          git diff --check > docs/evidence/generated/d0c-rust-diff-check.log 2>&1
          diffcheck=$?
          overall=0
          for status in "$fmt" "$clippy" "$workspace" "$codec" "$port" "$selfcheck" "$diffcheck"; do
            if [[ "$status" -ne 0 ]]; then overall=1; fi
          done
          {
            echo "fmt=$fmt"
            echo "clippy=$clippy"
            echo "workspace=$workspace"
            echo "codec=$codec"
            echo "port=$port"
            echo "selfcheck=$selfcheck"
            echo "diffcheck=$diffcheck"
            echo "overall=$overall"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write and push immutable exact-head evidence
        env:
          FMT: ${{ steps.gate.outputs.fmt }}
          CLIPPY: ${{ steps.gate.outputs.clippy }}
          WORKSPACE: ${{ steps.gate.outputs.workspace }}
          CODEC: ${{ steps.gate.outputs.codec }}
          PORT: ${{ steps.gate.outputs.port }}
          SELFCHECK: ${{ steps.gate.outputs.selfcheck }}
          DIFFCHECK: ${{ steps.gate.outputs.diffcheck }}
          OVERALL: ${{ steps.gate.outputs.overall }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path('.')
          def state(name): return "PASS" if os.environ[name] == "0" else "FAIL"
          def sha(path): return hashlib.sha256((root / path).read_bytes()).hexdigest()
          ok = os.environ["OVERALL"] == "0"
          evidence = {
            "schema": "trillionnium.desktop.d0c-rust-exact-gate.v2",
            "status": "PASS_ALLOWLIST_REVIEW_REQUIRED" if ok else "FAIL_SOURCE_FIX_REQUIRED",
            "rust_version": "1.93.0",
            "tested_source_commit": os.environ["TESTED_SOURCE_COMMIT"],
            "cargo_lock_sha256": sha("Cargo.lock"),
            "codec_source_sha256": sha("crates/hepta-browser-codec/src/lib.rs"),
            "agent_port_source_sha256": sha("crates/hepta-agent-port/src/lib.rs"),
            "checks": {
              "cargo_fmt": state("FMT"),
              "cargo_clippy_deny_warnings": state("CLIPPY"),
              "cargo_test_workspace_all_targets": state("WORKSPACE"),
              "codec_tests": state("CODEC"),
              "agent_port_tests": state("PORT"),
              "browserd_self_check": state("SELFCHECK"),
              "git_diff_check": state("DIFFCHECK")
            },
            "merge_ready": False,
            "remaining_gate": "review and promote exact Cargo allowlist, then permanent CI" if ok else "repair exact Rust failures using committed logs",
            "authority": {
              "listener_enabled": False,
              "browser_actor_connected": False,
              "servo_connected": False,
              "external_effect_authorized": False
            }
          }
          (root / "docs/evidence/generated/d0c-rust-exact-gate-result.json").write_text(
            json.dumps(evidence, indent=2, sort_keys=True) + "\n"
          )
          PY
          git add docs/evidence/generated
          git diff --cached --check
          git commit -m "test: publish exact Rust 1.93 D0C gate evidence"
          git push origin HEAD:codex/d0c02-transport-v2

      - name: Enforce result after evidence publication
        env:
          OVERALL: ${{ steps.gate.outputs.overall }}
        run: test "$OVERALL" = "0"
