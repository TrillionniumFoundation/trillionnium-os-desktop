name: promote-d0c03-once

on:
  push:
    branches:
      - codex/d0c03-codec-v2
    paths:
      - ".github/workflows/promote-d0c03-once.yml"

permissions:
  contents: write

concurrency:
  group: promote-d0c03-once
  cancel-in-progress: false

jobs:
  validate-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          ref: codex/d0c03-codec-v2
          fetch-depth: 0

      - name: Install exact Rust 1.93.0 toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup default 1.93.0
          rustc --version --verbose
          cargo --version --verbose
          rustfmt --version
          cargo clippy --version

      - name: Upgrade validator and apply rustfmt
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/patch_d0c03_validator_once.py
          cargo fmt --all
          rm -f tools/patch_d0c03_validator_once.py
          rm -f .github/workflows/promote-d0c03-once.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: align and format D0C-03 codec candidate"

      - name: Validate exact tested-source commit
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          python3 tools/validate_rust_browser_codec.py >/tmp/d0c03-rust-source-audit.json
          rm -rf /tmp/d0c03-golden
          mkdir -p /tmp/d0c03-golden
          python3 tools/browser_codec_reference.py \
            --self-test \
            --contract contracts/browser-codec.v1.json \
            --write-result /tmp/d0c03-reference.json \
            --write-golden-dir /tmp/d0c03-golden \
            >/tmp/d0c03-reference.stdout.json
          cmp /tmp/d0c03-reference.json docs/evidence/generated/d0c03-browser-codec-reference-result.json
          for fixture in contracts/golden/golden-*.wire.json; do
            cmp "$fixture" "/tmp/d0c03-golden/$(basename "$fixture")"
          done
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo run --locked -p hepta-browserd -- --self-check
          git diff --exit-code
          git diff --cached --exit-code
          test ! -S /run/hepta/browserd/agent.sock
          test ! -e /etc/hepta/enable-agent-port

      - name: Push validated source commit
        shell: bash
        run: |
          set -euo pipefail
          git push --force-with-lease origin HEAD:codex/d0c03-codec-v2
