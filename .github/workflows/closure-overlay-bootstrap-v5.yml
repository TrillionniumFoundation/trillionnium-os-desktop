name: closure-overlay-bootstrap-v5

on:
  push:
    branches:
      - codex/d4-d7-authority-runtime-v1

permissions:
  contents: write

concurrency:
  group: closure-overlay-bootstrap-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reconcile-validate-and-stage-ready:
    if: "${{ github.event.head_commit.message == 'chore: stage verified one-shot closure overlay' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out exact current head with complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/d4-d7-authority-runtime-v1
          fetch-depth: 0
          persist-credentials: true

      - name: Reconcile verified overlay and remove every bootstrap surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor f44837a6867b134fb329d14407e3ae918ed74a4b HEAD

          if test -d .closure-bootstrap; then
            for index in 00 01 02 03 04 05 06 07; do
              test -f ".closure-bootstrap/patch.part.${index}"
            done
            cat .closure-bootstrap/patch.part.{00,01,02,03,04,05,06,07} > /tmp/closure-overlay.patch.xz.b64
            base64 --decode /tmp/closure-overlay.patch.xz.b64 > /tmp/closure-overlay.patch.xz
            printf '%s  %s\n' \
              '67b79657f6901434fa01fcd95bd76becd375e430d632be7d666436e16f21a9e1' \
              '/tmp/closure-overlay.patch.xz' \
              | sha256sum --check --strict -
            xz --decompress --stdout /tmp/closure-overlay.patch.xz > /tmp/closure-overlay.patch
            if git apply --check --binary /tmp/closure-overlay.patch; then
              git apply --binary /tmp/closure-overlay.patch
            elif git apply --reverse --check --binary /tmp/closure-overlay.patch; then
              echo 'verified overlay is already present; continuing idempotently'
            else
              echo 'verified overlay is neither applicable nor already applied' >&2
              exit 1
            fi
          fi

          rm -rf .closure-bootstrap .closure-finalization
          find .github/workflows -maxdepth 1 -type f -name 'closure-overlay-bootstrap*.yml' -delete
          test ! -e .closure-bootstrap
          test ! -e .closure-finalization
          test -z "$(find .github/workflows -maxdepth 1 -type f -name 'closure-overlay-bootstrap*.yml' -print -quit)"
          git diff --check

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.93.0
          rustc --version --verbose
          cargo --version --verbose

      - name: Apply machine-safe formatting and compiler fixes
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fix --workspace --all-targets --locked --allow-dirty --allow-staged
          cargo clippy --fix --workspace --all-targets --locked --allow-dirty --allow-staged -- -D warnings
          cargo fmt --all
          git diff --check

      - name: Commit the clean candidate before exact-object validation
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git clean -fdX
          git add -A
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(d4-d7): bind authority evidence and make transitions atomic'
          candidate_sha="$(git rev-parse HEAD)"
          candidate_tree="$(git rev-parse HEAD^{tree})"
          printf 'sha=%s\n' "$candidate_sha" >> "$GITHUB_OUTPUT"
          printf 'tree=%s\n' "$candidate_tree" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain)"

      - name: Validate exact clean candidate object
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ steps.candidate.outputs.sha }}"
          test "$(git rev-parse HEAD^{tree})" = "${{ steps.candidate.outputs.tree }}"
          test -z "$(git status --porcelain)"

          python3 tools/validate_repository.py
          python3 tools/validate_d0t03_source.py
          python3 tools/validate_governance_integrity.py
          python3 tools/validate_late_stage_source_packages.py
          python3 tools/ab_update_reference.py self-test
          python3 -m unittest discover -s tests -t . -p 'test_*.py'
          if test -f Makefile && grep -Eq '^test-python[[:space:]]*:' Makefile; then
            make test-python
          fi

          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo run --locked -p hepta-browserd -- --self-check

          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "${{ steps.candidate.outputs.sha }}"
          test "$(git rev-parse HEAD^{tree})" = "${{ steps.candidate.outputs.tree }}"

      - name: Add one-time ready marker after all exact-object tests pass
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .closure-finalization
          cat > .closure-finalization/READY <<EOF
          schema=trillionnium-pr59-finalization-ready/v1
          candidate_sha=${{ steps.candidate.outputs.sha }}
          candidate_tree=${{ steps.candidate.outputs.tree }}
          validated_by_run=${GITHUB_RUN_ID}
          bootstrap_head=${GITHUB_SHA}
          EOF
          git add .closure-finalization/READY
          git diff --cached --check
          git commit -m 'chore: stage exact validated candidate for app finalization'

      - name: Publish validated candidate plus ready marker with lease protection
        shell: bash
        run: |
          set -euo pipefail
          git push \
            --force-with-lease="refs/heads/codex/d4-d7-authority-runtime-v1:$GITHUB_SHA" \
            origin HEAD:codex/d4-d7-authority-runtime-v1
