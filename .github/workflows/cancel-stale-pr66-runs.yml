name: cancel-stale-pr66-runs

on:
  push:
    branches:
      - codex/v14-object-import-3c73e5a2
    paths:
      - ".github/workflows/cancel-stale-pr66-runs.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: cancel-stale-pr66-runs
  cancel-in-progress: false

jobs:
  cancel-stale:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Cancel only obsolete PR #66 and import runs
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_PR_HEAD: 364503d41b6c02656e7361e948d78dfa5612ec30
          PR_BRANCH: codex/d6-gap-closure-v1
          STALE_IMPORT_RUN: "33974093238"
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          if repo != "TrillionniumFoundation/trillionnium-os-desktop":
              raise SystemExit("wrong repository")
          token = os.environ["GH_TOKEN"]
          current = os.environ["CURRENT_PR_HEAD"]
          branch = os.environ["PR_BRANCH"]
          stale_import = int(os.environ["STALE_IMPORT_RUN"])
          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "trillionnium-cancel-stale-pr66-runs",
          }

          def get(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          def cancel(run_id):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/cancel",
                  data=b"{}",
                  method="POST",
                  headers={**headers, "Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      if response.status not in (202, 204):
                          raise RuntimeError(f"unexpected cancel status {response.status}")
              except urllib.error.HTTPError as error:
                  if error.code == 409:
                      print(f"run {run_id} already terminal", flush=True)
                      return
                  raise
              print(f"cancelled stale run {run_id}", flush=True)

          page = 1
          cancelled = []
          while True:
              query = urllib.parse.urlencode({"branch": branch, "per_page": 100, "page": page})
              payload = get(f"https://api.github.com/repos/{repo}/actions/runs?{query}")
              runs = payload.get("workflow_runs", [])
              for run in runs:
                  if (
                      run.get("head_branch") == branch
                      and run.get("head_sha") != current
                      and run.get("status") != "completed"
                  ):
                      cancel(run["id"])
                      cancelled.append(run["id"])
              if len(runs) < 100:
                  break
              page += 1
          stale = get(f"https://api.github.com/repos/{repo}/actions/runs/{stale_import}")
          if stale.get("status") != "completed":
              cancel(stale_import)
              cancelled.append(stale_import)
          print(json.dumps({"current_head_preserved": current, "cancelled": cancelled}, sort_keys=True))
          PY
