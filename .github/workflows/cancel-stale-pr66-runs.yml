name: cancel-stale-pr66-runs

on:
  push:
    branches:
      - codex/v14-object-import-3c73e5a2
    paths:
      - ".github/workflows/cancel-stale-pr66-runs.yml"

permissions:
  contents: read
  actions: write

concurrency:
  group: cancel-stale-pr66-runs
  cancel-in-progress: false

jobs:
  cancel-stale:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Cancel every obsolete PR #66 run without touching current head
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_PR_HEAD: 364503d41b6c02656e7361e948d78dfa5612ec30
          PR_BRANCH: codex/d6-gap-closure-v1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          if repo != "TrillionniumFoundation/trillionnium-os-desktop":
              raise SystemExit("wrong repository")
          token = os.environ["GH_TOKEN"]
          current = os.environ["CURRENT_PR_HEAD"]
          branch = os.environ["PR_BRANCH"]
          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "trillionnium-cancel-all-stale-pr66-runs",
          }

          def get_runs():
              query = urllib.parse.urlencode({"branch": branch, "per_page": 100, "page": 1})
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/runs?{query}", headers=headers
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response).get("workflow_runs", [])

          def cancel(run_id):
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/cancel",
                  data=b"{}",
                  method="POST",
                  headers={**headers, "Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      if response.status not in (202, 204):
                          raise RuntimeError(f"unexpected cancel status {response.status}")
              except urllib.error.HTTPError as error:
                  if error.code == 409:
                      return False
                  raise
              print(f"cancelled stale run {run_id}", flush=True)
              return True

          cancelled = []
          for sweep in range(50):
              runs = get_runs()
              stale = [
                  run for run in runs
                  if run.get("head_branch") == branch
                  and run.get("head_sha") != current
                  and run.get("status") != "completed"
              ]
              if not stale:
                  break
              for run in stale:
                  if cancel(run["id"]):
                      cancelled.append(run["id"])
              time.sleep(1)
          else:
              raise SystemExit("stale-run cleanup did not converge in 50 sweeps")

          remaining = [
              {"id": run["id"], "head_sha": run.get("head_sha"), "status": run.get("status")}
              for run in get_runs()
              if run.get("head_branch") == branch
              and run.get("head_sha") != current
              and run.get("status") != "completed"
          ]
          if remaining:
              raise SystemExit("stale runs remain: " + json.dumps(remaining, sort_keys=True))
          print(json.dumps({
              "current_head_preserved": current,
              "cancelled_count": len(cancelled),
              "cancelled": cancelled,
              "remaining": remaining,
          }, sort_keys=True))
          PY
