name: d1-explicit-e2fsprogs-path-patch

on:
  push:
    branches:
      - codex/d1-01-reproducible-qemu-substrate
    paths:
      - .github/workflows/d1-explicit-e2fsprogs-path-patch.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: d1-explicit-e2fsprogs-path-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d1-01-reproducible-qemu-substrate
          fetch-depth: 0

      - name: Bind exact filesystem tools across the root boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one anchor, found {count}')
              return source.replace(old, new)

          build_path = Path('packaging/debian/image/build-d1-image.sh')
          build = build_path.read_text()
          old = (
              'for command in mmdebstrap python3 jq mke2fs e2fsck dumpe2fs tar chroot rsync sha256sum \\\n'
              '  systemd-sysusers systemd-tmpfiles cmp diff readlink stat awk; do\n'
              '  command -v "$command" >/dev/null || {\n'
              '    echo "required command is missing: $command" >&2\n'
              '    exit 1\n'
              '  }\n'
              'done\n\n'
              'script_dir=$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)\n'
          )
          new = (
              'for command in mmdebstrap python3 jq tar chroot rsync sha256sum \\\n'
              '  systemd-sysusers systemd-tmpfiles cmp diff readlink stat awk; do\n'
              '  command -v "$command" >/dev/null || {\n'
              '    echo "required command is missing: $command" >&2\n'
              '    exit 1\n'
              '  }\n'
              'done\n\n'
              'mke2fs_binary=${D1_MKE2FS_BINARY:-}\n'
              'e2fsck_binary=${D1_E2FSCK_BINARY:-}\n'
              'dumpe2fs_binary=${D1_DUMPE2FS_BINARY:-}\n'
              'for binding in mke2fs_binary e2fsck_binary dumpe2fs_binary; do\n'
              '  if [[ -z "${!binding}" ]]; then\n'
              '    echo "missing explicit D1 filesystem-tool binding: $binding" >&2\n'
              '    exit 1\n'
              '  fi\n'
              'done\n'
              'mke2fs_binary=$(readlink -f "$mke2fs_binary")\n'
              'e2fsck_binary=$(readlink -f "$e2fsck_binary")\n'
              'dumpe2fs_binary=$(readlink -f "$dumpe2fs_binary")\n'
              'for binary in "$mke2fs_binary" "$e2fsck_binary" "$dumpe2fs_binary"; do\n'
              '  [[ -f "$binary" && -x "$binary" && ! -L "$binary" ]] || {\n'
              '    echo "explicit D1 filesystem tool is missing or unsafe: $binary" >&2\n'
              '    exit 1\n'
              '  }\n'
              'done\n'
              'e2fsprogs_dir=$(dirname "$mke2fs_binary")\n'
              'if [[ $(dirname "$e2fsck_binary") != "$e2fsprogs_dir" \\\n'
              '   || $(dirname "$dumpe2fs_binary") != "$e2fsprogs_dir" ]]; then\n'
              '  echo "D1 filesystem tools do not share one exact reviewed prefix" >&2\n'
              '  exit 1\n'
              'fi\n'
              'if [[ $(readlink -f "$(command -v mke2fs)") != "$mke2fs_binary" \\\n'
              '   || $(readlink -f "$(command -v e2fsck)") != "$e2fsck_binary" \\\n'
              '   || $(readlink -f "$(command -v dumpe2fs)") != "$dumpe2fs_binary" ]]; then\n'
              '  echo "D1 filesystem tool PATH does not resolve to the explicit reviewed bindings" >&2\n'
              '  exit 1\n'
              'fi\n\n'
              'script_dir=$(cd -- "$(dirname -- "${BASH_SOURCE[0]}")" && pwd)\n'
          )
          build = replace_once(build, old, new, 'build tool preflight')
          build = replace_once(
              build,
              'mke2fs_version=$(mke2fs -V 2>&1 | awk \'NR == 1 { print $2 }\')\n',
              'mke2fs_version=$("$mke2fs_binary" -V 2>&1 | awk \'NR == 1 { print $2 }\')\n',
              'mke2fs version probe',
          )
          build = replace_once(build, 'mke2fs \\\n', '"$mke2fs_binary" \\\n', 'mke2fs execution')
          build = replace_once(
              build,
              'e2fsck -fn "$image" >"$logs/e2fsck-read-only.log" 2>&1\n',
              '"$e2fsck_binary" -fn "$image" >"$logs/e2fsck-read-only.log" 2>&1\n',
              'e2fsck execution',
          )
          build = replace_once(
              build,
              'dumpe2fs -h "$image" >"$logs/dumpe2fs-header.log" 2>&1\n',
              '"$dumpe2fs_binary" -h "$image" >"$logs/dumpe2fs-header.log" 2>&1\n',
              'dumpe2fs execution',
          )
          build_path.write_text(build)

          pipeline_path = Path('tests/qemu/run-d1-pipeline.sh')
          pipeline = pipeline_path.read_text()
          anchor = (
              'agent_portd="$workspace/target/release/hepta-agent-portd"\n'
              'agent_fixture="$workspace/target/release/hepta-agent-d1-fixture"\n\n'
          )
          binding = (
              'agent_portd="$workspace/target/release/hepta-agent-portd"\n'
              'agent_fixture="$workspace/target/release/hepta-agent-d1-fixture"\n'
              'mke2fs_binary=$(readlink -f "$(command -v mke2fs)")\n'
              'e2fsck_binary=$(readlink -f "$(command -v e2fsck)")\n'
              'dumpe2fs_binary=$(readlink -f "$(command -v dumpe2fs)")\n'
              'e2fsprogs_dir=$(dirname "$mke2fs_binary")\n'
              'if [[ $(dirname "$e2fsck_binary") != "$e2fsprogs_dir" \\\n'
              '   || $(dirname "$dumpe2fs_binary") != "$e2fsprogs_dir" ]]; then\n'
              '  echo "D1 filesystem tools do not share one exact reviewed prefix" >&2\n'
              '  exit 1\n'
              'fi\n'
              'd1_root_path="$e2fsprogs_dir:/usr/sbin:/usr/bin:/sbin:/bin"\n\n'
          )
          pipeline = replace_once(pipeline, anchor, binding, 'pipeline tool binding')
          old_sudo = '  sudo "$workspace/packaging/debian/image/build-d1-image.sh" \\\n'
          new_sudo = (
              '  sudo env \\\n'
              '    PATH="$d1_root_path" \\\n'
              '    D1_MKE2FS_BINARY="$mke2fs_binary" \\\n'
              '    D1_E2FSCK_BINARY="$e2fsck_binary" \\\n'
              '    D1_DUMPE2FS_BINARY="$dumpe2fs_binary" \\\n'
              '    "$workspace/packaging/debian/image/build-d1-image.sh" \\\n'
          )
          count = pipeline.count(old_sudo)
          if count != 2:
              raise SystemExit(f'pipeline root invocation: expected two anchors, found {count}')
          pipeline = pipeline.replace(old_sudo, new_sudo)
          pipeline_path.write_text(pipeline)
          PY
          git diff --check
          shellcheck -e SC2016,SC2054 \
            packaging/debian/image/build-d1-image.sh \
            tests/qemu/run-d1-pipeline.sh
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packaging/debian/image/build-d1-image.sh tests/qemu/run-d1-pipeline.sh
          git commit -m 'fix: bind exact e2fsprogs tools across D1 sudo boundary'
          git push origin HEAD:codex/d1-01-reproducible-qemu-substrate
