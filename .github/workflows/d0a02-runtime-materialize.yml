name: d0a02-runtime-materialize

on:
  push:
    branches:
      - codex/d0a02-headed-runtime-v3
    paths:
      - .github/workflows/d0a02-runtime-materialize.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: d0a02-runtime-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d0a02-headed-runtime-v3
          fetch-depth: 0

      - name: Materialize reviewed headed-runtime gate
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/d0a02-runtime-payload.b64 <<'PAYLOAD'

PAYLOAD
          base64 -d /tmp/d0a02-runtime-payload.b64 > /tmp/d0a02-runtime-payload.tar.gz
          printf '%s  %s\n'             b16925f3bae3f36729b858db834f6d81d455bd71f89621497ac0176730e33281             /tmp/d0a02-runtime-payload.tar.gz | sha256sum -c -
          tar -xzf /tmp/d0a02-runtime-payload.tar.gz -C .
          rm .github/workflows/d0a02-runtime-materialize.yml
          test -f .github/workflows/d0a02-headed-runtime.yml
          test -f experiments/servo-headed-runtime/trillionnium_workspace.rs
          test -f experiments/servo-headed-runtime/fixtures/panic.html
          grep -F 'ServoTestUtils.panic()'             experiments/servo-headed-runtime/fixtures/panic.html
          python3 tools/validate_repository.py
          cargo fmt --all -- --check
          cargo test --locked -p hepta-workspace-composition --all-targets
          git diff --check

      - name: Commit permanent exact-pin runtime gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add exact-pin headed Servo runtime gate"
          git push origin HEAD:codex/d0a02-headed-runtime-v3
