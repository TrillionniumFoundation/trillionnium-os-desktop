name: final-candidate-qualification

on:
  push:
    branches: ["codex/full-gap-closure-v2"]
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: read

concurrency:
  group: final-candidate-qualification
  cancel-in-progress: true

jobs:
  supervise:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out exact frozen candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/full-gap-closure-v2
          fetch-depth: 0

      - name: Verify event is bound to checked-out head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'CANDIDATE_TREE_SHA=%s\n' "$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"

      - name: Wait for exact-head permanent qualification runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/final-candidate
          mkdir -p "$out"
          api="https://api.github.com/repos/$REPOSITORY"
          deadline=$(( $(date +%s) + 21000 ))
          required='desktop-ci d2i-integrated-image d3-browseractor'

          while :; do
            curl --fail --silent --show-error --retry 3 --retry-all-errors \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api/actions/runs?head_sha=$CANDIDATE_SHA&per_page=100" \
              > "$out/actions.json"
            jq -e --arg sha "$CANDIDATE_SHA" '
              .workflow_runs | all(.head_sha == $sha)
            ' "$out/actions.json" >/dev/null

            missing=
            for name in $required; do
              if ! jq -e --arg name "$name" '
                [.workflow_runs[] | select(.name == $name)] | length > 0
              ' "$out/actions.json" >/dev/null; then
                missing="$missing $name"
              fi
            done

            pending=$(jq '[
              .workflow_runs[]
              | select(.name != "final-candidate-qualification")
              | select(.path | test("/(stabilize-|integrate-|repair-|harden-|finalize-|request-independent-review|publish-closure-snapshot)" ) | not)
              | select(.status != "completed")
            ] | length' "$out/actions.json")

            if [ -z "$missing" ] && [ "$pending" -eq 0 ]; then
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              printf 'qualification timeout; missing:%s pending:%s\n' "$missing" "$pending" >&2
              break
            fi
            sleep 30
          done

          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/final-candidate/actions.json').read_text())
          excluded_fragments = (
              'stabilize-', 'integrate-', 'repair-', 'harden-', 'finalize-',
              'request-independent-review', 'publish-closure-snapshot',
          )
          runs = []
          for item in data.get('workflow_runs', []):
              if item.get('name') == 'final-candidate-qualification':
                  continue
              path = item.get('path') or ''
              if any(fragment in path for fragment in excluded_fragments):
                  continue
              runs.append({
                  'id': item.get('id'),
                  'name': item.get('name'),
                  'path': path,
                  'status': item.get('status'),
                  'conclusion': item.get('conclusion'),
                  'event': item.get('event'),
                  'head_sha': item.get('head_sha'),
                  'created_at': item.get('created_at'),
                  'updated_at': item.get('updated_at'),
                  'html_url': item.get('html_url'),
              })
          latest = {}
          for run in sorted(runs, key=lambda r: r.get('created_at') or ''):
              latest[run['name']] = run
          required = ('desktop-ci', 'd2i-integrated-image', 'd3-browseractor')
          missing = [name for name in required if name not in latest]
          nonterminal = [name for name, run in latest.items() if run['status'] != 'completed']
          failed = [
              {'name': name, 'conclusion': run['conclusion'], 'id': run['id']}
              for name, run in latest.items()
              if run['status'] == 'completed' and run['conclusion'] not in ('success', 'skipped', 'neutral')
          ]
          technical_green = not missing and not nonterminal and not failed and all(
              latest[name]['status'] == 'completed' and latest[name]['conclusion'] == 'success'
              for name in required
          )
          summary = {
              'required': list(required),
              'missing': missing,
              'nonterminal': nonterminal,
              'failed': failed,
              'technical_green': technical_green,
              'latest_runs': latest,
          }
          Path('/tmp/final-candidate/workflow-summary.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          PY

      - name: Capture PR review, branch protection, checks and backlog
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CANDIDATE_SHA: ${{ github.sha }}
          PR_NUMBER: "31"
        shell: bash
        run: |
          set -euo pipefail
          out=/tmp/final-candidate
          api="https://api.github.com/repos/$REPOSITORY"
          get() {
            curl --fail --silent --show-error --retry 3 --retry-all-errors \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$1" > "$2"
          }
          get "$api/branches/main" "$out/main.json"
          get "$api/branches/codex/full-gap-closure-v2" "$out/candidate.json"
          get "$api/pulls/$PR_NUMBER" "$out/pr.json"
          get "$api/pulls/$PR_NUMBER/reviews?per_page=100" "$out/reviews.json"
          get "$api/pulls/$PR_NUMBER/requested_reviewers" "$out/requested-reviewers.json"
          get "$api/commits/$CANDIDATE_SHA/check-runs?per_page=100" "$out/check-runs.json"
          get "$api/issues?state=open&per_page=100" "$out/open-items.json"
          get "$api/pulls?state=open&per_page=100" "$out/open-prs.json"
          http=$(curl --silent --show-error --output "$out/main-protection.json" \
            --write-out '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "$api/branches/main/protection")
          printf '%s\n' "$http" > "$out/main-protection.http"

      - name: Build fail-closed final candidate decision
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          CANDIDATE_TREE_SHA: ${{ env.CANDIDATE_TREE_SHA }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('/tmp/final-candidate')
          load = lambda name: json.loads((root / name).read_text())
          workflows = load('workflow-summary.json')
          main = load('main.json')
          candidate = load('candidate.json')
          pr = load('pr.json')
          reviews = load('reviews.json')
          requested = load('requested-reviewers.json')
          checks = load('check-runs.json').get('check_runs', [])
          open_items = load('open-items.json')
          open_prs = load('open-prs.json')
          sha = os.environ['CANDIDATE_SHA']
          author = pr.get('user', {}).get('login')

          effective = {}
          for review in sorted(reviews, key=lambda item: item.get('submitted_at') or ''):
              login = review.get('user', {}).get('login')
              kind = review.get('user', {}).get('type')
              if not login or login == author or kind == 'Bot' or login.endswith('[bot]'):
                  continue
              effective[login] = review
          approvals = sorted(
              login for login, review in effective.items()
              if review.get('state') == 'APPROVED' and review.get('commit_id') == sha
          )
          rejections = sorted(
              login for login, review in effective.items()
              if review.get('state') == 'CHANGES_REQUESTED'
          )
          protection_http = int((root / 'main-protection.http').read_text())
          protected = protection_http == 200
          remote_head = candidate.get('commit', {}).get('sha')
          pr_head = pr.get('head', {}).get('sha')
          exact = remote_head == sha == pr_head
          review_green = bool(approvals) and not rejections
          technical = workflows['technical_green']
          mergeable = pr.get('mergeable') is True and pr.get('state') == 'open' and not pr.get('draft')

          if not exact:
              outcome = 'BASE_DRIFT'
          elif not technical:
              outcome = 'RESUME_REQUIRED'
          elif not protected or not review_green:
              outcome = 'REPOSITORY_SETTING_REQUIRED'
          elif not mergeable:
              outcome = 'SECURITY_REVIEW_REQUIRED'
          else:
              outcome = 'MODULE_CLOSED_CANDIDATE'

          workflow_path = Path('.github/workflows/final-candidate-qualification.yml')
          report = {
              'schema': 'trillionnium.desktop.final-candidate-qualification.v1',
              'captured_at': datetime.now(timezone.utc).isoformat(),
              'repository': os.environ['REPOSITORY'],
              'candidate': {
                  'branch': 'codex/full-gap-closure-v2',
                  'sha': sha,
                  'tree_sha': os.environ['CANDIDATE_TREE_SHA'],
                  'remote_head_sha': remote_head,
                  'pr_head_sha': pr_head,
                  'exact_head_stable': exact,
              },
              'main': {
                  'sha': main.get('commit', {}).get('sha'),
                  'protected': protected,
                  'protection_http': protection_http,
              },
              'pr31': {
                  'state': pr.get('state'),
                  'draft': pr.get('draft'),
                  'mergeable': pr.get('mergeable'),
                  'mergeable_state': pr.get('mergeable_state'),
                  'author': author,
                  'exact_head_independent_approvals': approvals,
                  'active_changes_requested': rejections,
                  'requested_reviewers': sorted(u.get('login') for u in requested.get('users', []) if u.get('login')),
                  'requested_teams': sorted(t.get('slug') for t in requested.get('teams', []) if t.get('slug')),
                  'review_green': review_green,
              },
              'workflows': workflows,
              'checks': [
                  {'name': check.get('name'), 'status': check.get('status'),
                   'conclusion': check.get('conclusion'), 'details_url': check.get('details_url')}
                  for check in checks
              ],
              'open_pull_requests': [
                  {'number': item.get('number'), 'title': item.get('title'), 'draft': item.get('draft'),
                   'head_sha': item.get('head', {}).get('sha'), 'base_ref': item.get('base', {}).get('ref')}
                  for item in open_prs
              ],
              'open_issues': [
                  {'number': item.get('number'), 'title': item.get('title')}
                  for item in open_items if 'pull_request' not in item
              ],
              'workflow_run_id': os.environ['WORKFLOW_RUN_ID'],
              'workflow_run_attempt': int(os.environ['WORKFLOW_RUN_ATTEMPT']),
              'workflow_sha256': hashlib.sha256(workflow_path.read_bytes()).hexdigest(),
              'outcome': outcome,
              'claim_ceiling': {
                  'external_effects': False,
                  'production_agent_port_activation': False,
                  'fixed_hardware_beta': False,
                  'signed_release': False,
              },
          }
          (root / 'final-candidate-qualification.json').write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n'
          )
          lines = [
              '# TrillionniumOS Desktop final candidate qualification', '',
              f"- Candidate: `{sha}`",
              f"- Tree: `{report['candidate']['tree_sha']}`",
              f"- Main: `{report['main']['sha']}`",
              f"- Technical exact-head gates: `{technical}`",
              f"- Independent exact-head approvals: `{', '.join(approvals) or 'none'}`",
              f"- Active changes requested: `{', '.join(rejections) or 'none'}`",
              f"- Main protected: `{protected}`",
              f"- PR mergeable and ready: `{mergeable}`",
              f"- Outcome: `{outcome}`", '',
              '## Permanent workflow results', '',
          ]
          for name, run in sorted(workflows['latest_runs'].items()):
              lines.append(f"- `{name}`: `{run['status']}/{run['conclusion']}` (run `{run['id']}`)")
          lines.extend(['', '## Remaining explicit boundaries', '',
                        '- No production external-effect authority is promoted.',
                        '- No fixed-hardware D8 evidence is invented by this workflow.',
                        '- No signing-key custody or D9 release approval is invented by this workflow.'])
          (root / 'final-candidate-qualification.md').write_text('\n'.join(lines) + '\n')
          PY

      - name: Publish report to dedicated evidence branch
        shell: bash
        run: |
          set -euo pipefail
          report=/tmp/final-candidate
          git config user.name "trillionnium-final-qualification"
          git config user.email "final-qualification@users.noreply.github.com"
          git checkout --orphan final-qualification-work
          git rm -rf . >/dev/null 2>&1 || true
          cp "$report/final-candidate-qualification.json" .
          cp "$report/final-candidate-qualification.md" .
          cp "$report/workflow-summary.json" .
          git add final-candidate-qualification.json final-candidate-qualification.md workflow-summary.json
          git commit -m "evidence: publish final candidate qualification for $GITHUB_SHA"
          git push --force origin HEAD:codex/final-candidate-evidence

      - name: Comment exact outcome on integration PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: "31"
        shell: bash
        run: |
          set -euo pipefail
          body=$(jq -Rs '{body:.}' /tmp/final-candidate/final-candidate-qualification.md)
          curl --fail --silent --show-error -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
            -d "$body" >/dev/null

      - name: Enforce fail-closed supervisor outcome
        shell: bash
        run: |
          set -euo pipefail
          outcome=$(jq -er '.outcome' /tmp/final-candidate/final-candidate-qualification.json)
          case "$outcome" in
            MODULE_CLOSED_CANDIDATE) exit 0 ;;
            *) echo "$outcome" >&2; exit 1 ;;
          esac

      - name: Upload bounded report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-candidate-qualification-${{ github.sha }}
          path: |
            /tmp/final-candidate/final-candidate-qualification.json
            /tmp/final-candidate/final-candidate-qualification.md
            /tmp/final-candidate/workflow-summary.json
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6
