name: desktop-ci

on:
  push:
    branches: ["codex/d0a02-headed-runtime-v3"]

permissions:
  contents: write

concurrency:
  group: desktop-ci-d0a02-patch
  cancel-in-progress: false

jobs:
  apply-runtime-fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact package branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/d0a02-headed-runtime-v3
          fetch-depth: 0

      - name: Apply evidence-bound runtime changes
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/d0a02_patch_v2.py
          python3 /tmp/d0a02_patch_v2.py
          rustfmt --edition 2024 experiments/servo-headed-runtime/src/main.rs runtime/servo/hepta_workspace_runtime.rs
          git diff --check

      - name: Commit bounded fix and restore canonical CI file
        shell: bash
        run: |
          set -euo pipefail
          git show 0178cd5eae7aca091f2e58332a238cd48dc71cd3:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "trillionnium-d0a02-repair"
          git config user.email "d0a02-repair@users.noreply.github.com"
          git add .github/workflows/ci.yml .github/workflows/d0a02-headed-servo.yml .github/workflows/servo-headed-runtime.yml experiments/servo-headed-runtime/src/main.rs runtime/servo/hepta_workspace_runtime.rs
          git diff --cached --check
          git commit -m "fix(servo): bind recovery to page input evidence"
          git push origin HEAD:codex/d0a02-headed-runtime-v3
