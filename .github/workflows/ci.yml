name: desktop-ci

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-d0a02-repair:
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/d0a02-headed-runtime-v3'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact package branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/d0a02-headed-runtime-v3
          fetch-depth: 0

      - name: Apply fail-closed headed-runtime teardown repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"expected one replacement in {path}, found {count}: {old[:80]!r}"
                  )
              target.write_text(text.replace(old, new, 1))

          headed = "experiments/servo-headed-runtime/src/main.rs"
          replace_once(
              headed,
              """            AppEvent::Exit(code) => {
                self.exit_code = code;
                event_loop.exit();
            }
""",
              """            AppEvent::Exit(code) => {
                self.exit_code = code;
                if let Some(state) = self.state.take() {
                    state.webview.borrow_mut().take();
                    drop(state);
                }
                event_loop.exit();
            }
""",
          )
          replace_once(
              headed,
              """struct RuntimeState {
    window: Window,
    servo: Servo,
    parent_context: Rc<WindowRenderingContext>,
    content_context: Rc<OffscreenRenderingContext>,
    webview: RefCell<Option<WebView>>,
""",
              """struct RuntimeState {
    webview: RefCell<Option<WebView>>,
    servo: Servo,
    content_context: Rc<OffscreenRenderingContext>,
    parent_context: Rc<WindowRenderingContext>,
    // The native window must outlive both rendering contexts.
    window: Window,
""",
          )
          replace_once(
              headed,
              """            WindowEvent::CloseRequested => {
                state.fail("window closed before qualification completed");
                event_loop.exit();
            }
""",
              """            WindowEvent::CloseRequested => {
                state.fail("window closed before qualification completed");
            }
""",
          )
          replace_once(
              headed,
              """        event_loop: &ActiveEventLoop,
        _window_id: winit::window::WindowId,
        event: WindowEvent,
""",
              """        _event_loop: &ActiveEventLoop,
        _window_id: winit::window::WindowId,
        event: WindowEvent,
""",
          )

          product = "runtime/servo/hepta_workspace_runtime.rs"
          replace_once(
              product,
              """struct RuntimeState {
    window: Window,
    servo: Servo,
    rendering_context: Rc<WindowRenderingContext>,
    webview: RefCell<Option<WebView>>,
""",
              """struct RuntimeState {
    webview: RefCell<Option<WebView>>,
    servo: Servo,
    rendering_context: Rc<WindowRenderingContext>,
    // Keep the native window alive until after Servo and its rendering context.
    window: Window,
""",
          )
          replace_once(
              product,
              """enum App {
    Initial { waker: Waker, output: PathBuf },
    Running(Rc<RuntimeState>),
}
""",
              """enum App {
    Initial { waker: Waker, output: PathBuf },
    Running(Rc<RuntimeState>),
    Finished,
}
""",
          )
          replace_once(
              product,
              """    fn new(event_loop: &EventLoop<AppEvent>, output: PathBuf) -> Self {
        Self::Initial {
            waker: Waker::new(event_loop),
            output,
        }
    }
}
""",
              """    fn new(event_loop: &EventLoop<AppEvent>, output: PathBuf) -> Self {
        Self::Initial {
            waker: Waker::new(event_loop),
            output,
        }
    }

    fn shutdown(&mut self, event_loop: &ActiveEventLoop) {
        let previous = std::mem::replace(self, Self::Finished);
        if let Self::Running(state) = previous {
            state.webview.borrow_mut().take();
            drop(state);
        }
        event_loop.exit();
    }
}
""",
          )
          replace_once(
              product,
              """    fn about_to_wait(&mut self, event_loop: &ActiveEventLoop) {
        let Self::Running(state) = self else {
            return;
        };
        state.drive();
        state.window.request_redraw();
        if state.evidence_written.get()
            && (state.output.join("capture.done").is_file()
                || state.started_at.elapsed() > Duration::from_secs(100))
        {
            event_loop.exit();
        }
    }
""",
              """    fn about_to_wait(&mut self, event_loop: &ActiveEventLoop) {
        let should_shutdown = {
            let Self::Running(state) = self else {
                return;
            };
            state.drive();
            state.window.request_redraw();
            state.evidence_written.get()
                && (state.output.join("capture.done").is_file()
                    || state.started_at.elapsed() > Duration::from_secs(100))
        };
        if should_shutdown {
            self.shutdown(event_loop);
        }
    }
""",
          )
          replace_once(
              ".github/workflows/servo-headed-runtime.yml",
              "xdotool mousemove --sync --window \"$window_id\" 400 132",
              "xdotool mousemove --sync --window \"$window_id\" 400 164",
          )
          PY

          rustfmt --edition 2024 \
            experiments/servo-headed-runtime/src/main.rs \
            runtime/servo/hepta_workspace_runtime.rs
          git diff --check

      - name: Commit bounded repair and restore the original CI surface
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/ci.yml > .github/workflows/ci.yml
          git rm .github/workflows/apply-d0a02-teardown-fix.yml
          git config user.name "trillionnium-d0a02-repair"
          git config user.email "d0a02-repair@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            .github/workflows/servo-headed-runtime.yml \
            experiments/servo-headed-runtime/src/main.rs \
            runtime/servo/hepta_workspace_runtime.rs
          git diff --cached --check
          git commit -m "fix(servo): shut down headed proof before closing event loop"
          git push origin HEAD:codex/d0a02-headed-runtime-v3

  repository-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate repository contracts and product boundary
        run: python3 tools/validate_repository.py

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install locked Rust toolchain
        run: |
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup default 1.93.0
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --workspace
      - name: D0 browserd self-check
        run: cargo run -p hepta-browserd -- --self-check
