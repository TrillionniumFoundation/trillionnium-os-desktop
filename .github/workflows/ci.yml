name: apply-d0a02-page-ready-ime

on:
  push:
    branches: ["codex/d0a02-headed-runtime-v3"]
    paths:
      - ".github/workflows/ci.yml"

permissions:
  contents: write

concurrency:
  group: apply-d0a02-page-ready-ime
  cancel-in-progress: false

jobs:
  patch-runtime:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact D0A-02 package branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/d0a02-headed-runtime-v3
          fetch-depth: 0

      - name: Apply page-ready IME sequencing repair
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/d0a02_ime_stage_patch.py
          rustfmt --edition 2024 runtime/servo/hepta_workspace_runtime.rs
          git diff --check
          grep -F 'ime-composition.started' runtime/servo/hepta_workspace_runtime.rs
          grep -F "document.getElementById('field').focus()" runtime/servo/hepta_workspace_runtime.rs

      - name: Commit product runtime repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "trillionnium-d0a02-repair"
          git config user.email "d0a02-repair@users.noreply.github.com"
          git add runtime/servo/hepta_workspace_runtime.rs
          git diff --cached --check
          git commit -m "fix(servo): sequence IME after page input readiness"
          git push origin HEAD:codex/d0a02-headed-runtime-v3
