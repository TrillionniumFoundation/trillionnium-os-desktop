name: temporary-pr109-current-head-audit
on:
  push:
    branches:
      - codex/s07-module-documentation-closure-v1
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/s07-module-documentation-closure-v1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Exact-current-head module documentation audit
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_module_documentation.py
          python3 -m unittest -v tests.test_module_documentation
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 tools/validate_governance_integrity.py
          python3 tools/validate_rust_browser_codec.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 -m compileall -q tools tests
          git diff --check
      - name: Remove successful audit controller
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temporary-pr109-current-head-audit.yml
          git config user.name "Trillionnium gap-closure bot"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git add -A
          git commit -m 'test(modules): bind current-head hostile audit' || exit 0
          git push origin HEAD:codex/s07-module-documentation-closure-v1
