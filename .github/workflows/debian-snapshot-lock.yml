name: debian-snapshot-lock

on:
  pull_request:
    paths:
      - ".github/workflows/debian-snapshot-lock.yml"
      - ".github/workflows/ci.yml"
      - "tools/resolve_debian_snapshot.py"
      - "tools/resolve_debian_snapshot_with_pinned_keys.py"
      - "tools/validate_debian_snapshot_lock.py"
      - "tools/promote_debian_snapshot_lock.py"
      - "manifests/debian-base.selection.json"
      - "manifests/debian-snapshot.requirements.v1.json"
      - "manifests/debian-snapshot.lock.v1.json"
      - "manifests/repository-state.json"
      - "docs/MANIFEST.json"
      - "docs/CURRENT_STATE.md"
      - "docs/architecture/DEBIAN_SNAPSHOT_LOCK.md"
      - "docs/evidence/2026-08-29-d0r02-debian-snapshot.md"
      - "docs/plan/D0R02_EXECUTION_CHECKPOINT-2026-08-29.md"
  push:
    branches:
      - main
      - codex/d0r02-debian-snapshot-lock
    paths:
      - ".github/workflows/debian-snapshot-lock.yml"
      - ".github/workflows/ci.yml"
      - "tools/resolve_debian_snapshot.py"
      - "tools/resolve_debian_snapshot_with_pinned_keys.py"
      - "tools/validate_debian_snapshot_lock.py"
      - "tools/promote_debian_snapshot_lock.py"
      - "manifests/debian-base.selection.json"
      - "manifests/debian-snapshot.requirements.v1.json"
      - "manifests/debian-snapshot.lock.v1.json"
      - "manifests/repository-state.json"
      - "docs/MANIFEST.json"
      - "docs/CURRENT_STATE.md"
      - "docs/architecture/DEBIAN_SNAPSHOT_LOCK.md"
      - "docs/evidence/2026-08-29-d0r02-debian-snapshot.md"
      - "docs/plan/D0R02_EXECUTION_CHECKPOINT-2026-08-29.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: debian-snapshot-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install Debian signature and repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl debian-archive-keyring gnupg

      - name: Resolve signed snapshot and full package closure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/debian-snapshot/logs /tmp/trillionnium-debian-lock /tmp/trillionnium-curl
          collect_diagnostics() {
            mkdir -p artifacts/debian-snapshot/trust-roots artifacts/debian-snapshot/inrelease
            cp -f /tmp/trillionnium-debian-lock/debian-13-archive-keyring.gpg \
              artifacts/debian-snapshot/ 2>/dev/null || true
            cp -f /tmp/trillionnium-debian-lock/trust-roots/* \
              artifacts/debian-snapshot/trust-roots/ 2>/dev/null || true
            cp -f /tmp/trillionnium-debian-lock/inrelease/* \
              artifacts/debian-snapshot/inrelease/ 2>/dev/null || true
            cp -f /tmp/trillionnium-debian-lock/requirements.with-keyring.json \
              artifacts/debian-snapshot/ 2>/dev/null || true
          }
          trap collect_diagnostics EXIT
          cat > /tmp/trillionnium-curl/curl <<'SH'
          #!/usr/bin/env bash
          exec /usr/bin/curl --silent "$@"
          SH
          chmod 0755 /tmp/trillionnium-curl/curl
          PATH="/tmp/trillionnium-curl:$PATH" \
            python3 tools/resolve_debian_snapshot_with_pinned_keys.py \
              --requirements manifests/debian-snapshot.requirements.v1.json \
              --output artifacts/debian-snapshot/debian-snapshot-lock.json \
              --work-dir /tmp/trillionnium-debian-lock \
              --logs artifacts/debian-snapshot/logs \
              | tee artifacts/debian-snapshot/report.stdout.json

      - name: Enforce snapshot claim ceiling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          report = json.loads(Path('artifacts/debian-snapshot/debian-snapshot-lock.json').read_text())
          assert report['status'] == 'PASS_SIGNED_INPUT_AND_PACKAGE_CLOSURE_ONLY'
          assert report['snapshot_timestamp'] == '20260828T000000Z'
          assert report['architecture'] == 'amd64'
          assert len(report['inrelease']) == 3
          assert report['resolved_package_count'] == len(report['packages'])
          assert report['resolved_package_count'] > len(report['seed_packages'])
          assert len(report['package_set_sha256']) == 64
          keyring = report['archive_keyring']
          assert keyring['bootstrap'] == 'official_debian_https_plus_pinned_primary_fingerprints'
          assert len(keyring['trust_roots']) == 3
          assert all(len(item['primary_fingerprint']) == 40 for item in keyring['trust_roots'])
          assert all(item['valid_primary_fingerprints'] for item in report['inrelease'])
          assert all(
              set(item['valid_primary_fingerprints']).intersection(item['accepted_primary_fingerprints'])
              for item in report['inrelease']
          )
          assert all(value is False for value in report['claims'].values())
          assert report['next_gate'].startswith('D1-01')
          PY

      - name: Promote canonical lock and repository state on the dedicated branch
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/codex/d0r02-debian-snapshot-lock'
        run: |
          set -euo pipefail
          python3 tools/promote_debian_snapshot_lock.py \
            --generated-lock artifacts/debian-snapshot/debian-snapshot-lock.json
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add manifests docs
            git commit -m "build: promote canonical signed Debian snapshot lock"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Verify committed canonical lock is reproducible
        run: |
          set -euo pipefail
          cmp --silent \
            manifests/debian-snapshot.lock.v1.json \
            artifacts/debian-snapshot/debian-snapshot-lock.json
          sha256sum \
            manifests/debian-snapshot.lock.v1.json \
            artifacts/debian-snapshot/debian-snapshot-lock.json

      - name: Validate desktop repository contracts
        run: |
          python3 tools/validate_repository.py
          python3 tools/validate_debian_snapshot_lock.py

      - name: Upload signed input evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debian-snapshot-lock-${{ github.sha }}
          path: artifacts/debian-snapshot
          if-no-files-found: warn
          retention-days: 30
