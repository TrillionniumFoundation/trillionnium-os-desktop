name: stage-d2i-gate-promotion

on:
  push:
    branches: ["codex/full-gap-closure-v2"]
    paths:
      - ".github/d2i-actual-crash.trigger"

permissions:
  contents: write

concurrency:
  group: stage-d2i-gate-promotion
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/full-gap-closure-v2
          fetch-depth: 0
      - name: Build promoted permanent D2I workflow blob
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/d2i-integrated-image.yml').read_text()
          replacements = {
              "          assert boot['claims']['actual_content_process_crash_proven'] is False\n": (
                  "          assert boot['claims']['actual_content_process_crash_proven'] is True\n"
                  "          assert acceptance['actual_content_process_crash_proven'] is True\n"
                  "          assert acceptance['actual_crash_callbacks'] >= 1\n"
                  "          assert runtime['actual_content_process_crash_proven'] is True\n"
                  "          assert runtime['actual_crash_callbacks'] >= 1\n"
                  "          assert runtime['content_process_termination_observed'] is True\n"
              ),
              "              'status': 'PASS_CANDIDATE_BLOCKED_ACTUAL_CONTENT_PROCESS_CRASH',\n": (
                  "              'status': 'PASS_D1_D2_INTEGRATED_IMAGE_CANDIDATE',\n"
              ),
              "                  'actual_content_process_crash_callback_observed',\n": "",
          }
          for old, new in replacements.items():
              if source.count(old) != 1:
                  raise SystemExit(f'D2I workflow promotion marker drifted: {old!r}')
              source = source.replace(old, new, 1)
          target = Path('staging/d2i-integrated-image.yml')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(source)
          PY
          grep -F "assert runtime['actual_content_process_crash_proven'] is True" \
            staging/d2i-integrated-image.yml
          grep -F "'status': 'PASS_D1_D2_INTEGRATED_IMAGE_CANDIDATE'" \
            staging/d2i-integrated-image.yml
          ! grep -F 'actual_content_process_crash_callback_observed' \
            staging/d2i-integrated-image.yml
          git diff --check
      - name: Commit staging blob only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "trillionnium-d2i-promotion"
          git config user.email "d2i-promotion@users.noreply.github.com"
          git add staging/d2i-integrated-image.yml
          git diff --cached --check
          git commit -m "ci: stage promoted D2I permanent gate blob"
          git push origin HEAD:codex/full-gap-closure-v2
