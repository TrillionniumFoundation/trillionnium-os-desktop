name: publish-dispatch-v14-exact

on:
  push:
    branches:
      - codex/v14-publish-finalize-3c73e5a2

permissions:
  contents: write
  actions: write
  pull-requests: write
  issues: write

concurrency:
  group: publish-dispatch-v14-exact
  cancel-in-progress: false

jobs:
  publish-and-qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact published baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ff4fe3aa072fec521d0ed22dd63408f5bb38d0b5
          fetch-depth: 1
          persist-credentials: true

      - name: Verify bundle, publish v14, and dispatch exact-head matrix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_URL: https://filebin.net/trillionnium-v14-3c73e5a2-20260905/desktop-gap-repair-v14-2026-09-05.zip
          ARCHIVE_SHA256: 637be63550fe57f967f198d5aa1459078e1eb8969feb7e855303e49817a0d841
          BASE_COMMIT: ff4fe3aa072fec521d0ed22dd63408f5bb38d0b5
          BASE_TREE: c922e84bbe68455040189ac2e16bee42aa1692fc
          LOCAL_V14_COMMIT: ca7d39656d657d1d27f21400b7bfdec785232fc1
          TARGET_TREE: 3c73e5a2e9c060b80fbc08f21afae4296d7843ea
          TARGET_BRANCH: codex/d6-gap-closure-v1
        run: |
          set -euo pipefail
          umask 077
          test "$GITHUB_REPOSITORY" = "TrillionniumFoundation/trillionnium-os-desktop"
          test "$(git rev-parse HEAD)" = "$BASE_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$BASE_TREE"
          test -z "$(git status --porcelain)"

          work="$RUNNER_TEMP/v14-publish-dispatch"
          mkdir -p "$work/unpacked"
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2 --max-time 180 \
            "$ARCHIVE_URL" -o "$work/v14.zip"
          printf '%s  %s\n' "$ARCHIVE_SHA256" "$work/v14.zip" | sha256sum --check --strict
          unzip -q "$work/v14.zip" -d "$work/unpacked"
          bundle="$(find "$work/unpacked" -type f -name 'candidate-v14.bundle' -print -quit)"
          test -n "$bundle"
          git bundle verify "$bundle"
          git bundle unbundle "$bundle" >/dev/null
          git cat-file -e "$LOCAL_V14_COMMIT^{commit}"
          test "$(git rev-parse "$LOCAL_V14_COMMIT^{tree}")" = "$TARGET_TREE"

          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          if [ "$remote_head" = "$BASE_COMMIT" ]; then
            export GIT_AUTHOR_NAME='Qian QI'
            export GIT_AUTHOR_EMAIL='102159240+ProfHepta@users.noreply.github.com'
            export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
            export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            export GIT_AUTHOR_DATE='2026-09-05T15:15:00Z'
            export GIT_COMMITTER_DATE='2026-09-05T15:15:00Z'
            cat > "$work/message.txt" <<'EOF'
          fix(desktop): publish cumulative d6 source repairs through v14

          Publish the exact locally reviewed v14 source tree, including documentation
          claim projection hardening, D5/D6 contract alignment, D3 actor/identity/event
          loop work, receipt persistence/recovery/migration, and deterministic D8/Servo
          validator isolation repairs.

          Exact source tree: 3c73e5a2e9c060b80fbc08f21afae4296d7843ea

          This source publication does not promote D2I-D9 product, physical hardware,
          signing, release, branch-governance, independent-review or exact-main gates.
          EOF
            published_head="$(git commit-tree "$TARGET_TREE" -p "$BASE_COMMIT" < "$work/message.txt")"
            test "$(git rev-parse "$published_head^{tree}")" = "$TARGET_TREE"
            test "$(git rev-parse "$published_head^")" = "$BASE_COMMIT"
            git push origin "$published_head:refs/heads/$TARGET_BRANCH"
          else
            git fetch --no-tags origin "$TARGET_BRANCH"
            test "$(git rev-parse FETCH_HEAD^{tree})" = "$TARGET_TREE"
            published_head="$remote_head"
          fi
          test "$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')" = "$published_head"

          export PUBLISHED_HEAD="$published_head"
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = 'TrillionniumFoundation/trillionnium-os-desktop'
          head = os.environ['PUBLISHED_HEAD']
          tree = os.environ['TARGET_TREE']
          branch = os.environ['TARGET_BRANCH']
          token = os.environ['GH_TOKEN']
          workflows = {
              'governance-integrity': 345999554,
              'd1-final-qualification': 345184204,
              'd4-collaboration': 346008923,
              'd3-integrated-runtime-evidence-verifier': 348056356,
              'agent-port-path-custody': 346449095,
              'browser-codec-reference-and-rust-gate': 344376769,
              'servo-exact-pin': 344789766,
              'd2i-integrated-image': 345469373,
              'd3-semantic-resolver-reference': 347121542,
              'd0t03-source-contract': 345901145,
              'd8-hardware-qualification': 346023885,
              'receipt-journal': 345122885,
              'servo-headed-runtime': 345149581,
              'd8-hardware-promotion-policy': 346026000,
              'd5-trusted-app': 346013180,
              'agent-port-custody': 344335327,
              'desktop-ci': 344297852,
              'agent-transport-reference': 344365935,
              'd4-d9-source-suite': 346441160,
              'd7-recovery-update': 346019680,
              'd6-capability-egress': 346016275,
              'd9-release-promotion': 346030603,
          }

          def api(path, method='GET', payload=None, allow=()):
              data = None if payload is None else json.dumps(payload).encode('utf-8')
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + repo + '/' + path,
                  data=data,
                  method=method,
                  headers={
                      'Authorization': 'Bearer ' + token,
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'trillionnium-v14-publish-dispatch',
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      raw = response.read(8 * 1024 * 1024)
                  return response.status, (json.loads(raw) if raw else {})
              except urllib.error.HTTPError as exc:
                  raw = exc.read(1024 * 1024).decode('utf-8', 'replace')
                  if exc.code in allow:
                      return exc.code, raw
                  raise RuntimeError(f'GitHub API {method} {path} -> {exc.code}: {raw}') from exc

          _, commit = api('git/commits/' + head)
          if commit.get('tree', {}).get('sha') != tree:
              raise RuntimeError('Published commit tree mismatch')
          parents = [p.get('sha') for p in commit.get('parents', [])]
          if parents != [os.environ['BASE_COMMIT']]:
              raise RuntimeError('Published commit parent mismatch')

          dispatched_at = dt.datetime.now(dt.timezone.utc)
          dispatch_failures = []
          for name, workflow_id in workflows.items():
              status, payload = api(
                  f'actions/workflows/{workflow_id}/dispatches',
                  'POST', {'ref': branch}, allow=(404, 422),
              )
              if status != 204:
                  dispatch_failures.append({'name': name, 'status': status, 'body': str(payload)[:500]})
              else:
                  print('dispatched', name, workflow_id, flush=True)

          runs = {}
          deadline = time.monotonic() + 1500
          while time.monotonic() < deadline:
              for name, workflow_id in workflows.items():
                  if name in runs and runs[name].get('status') == 'completed':
                      continue
                  query = urllib.parse.urlencode({
                      'branch': branch,
                      'event': 'workflow_dispatch',
                      'per_page': 20,
                  })
                  _, payload = api(f'actions/workflows/{workflow_id}/runs?{query}')
                  candidates = []
                  for run in payload.get('workflow_runs', []):
                      if run.get('head_sha') != head or run.get('event') != 'workflow_dispatch':
                          continue
                      created = dt.datetime.fromisoformat(run['created_at'].replace('Z', '+00:00'))
                      if created >= dispatched_at - dt.timedelta(seconds=30):
                          candidates.append(run)
                  if candidates:
                      runs[name] = max(candidates, key=lambda r: (r.get('run_attempt', 0), r['id']))
              if len(runs) == len(workflows) and all(r.get('status') == 'completed' for r in runs.values()):
                  break
              time.sleep(15)

          rows = []
          for name in sorted(workflows):
              run = runs.get(name, {})
              rows.append({
                  'name': name,
                  'workflow_id': workflows[name],
                  'run_id': run.get('id'),
                  'status': run.get('status', 'missing'),
                  'conclusion': run.get('conclusion'),
              })
          all_green = not dispatch_failures and all(
              row['status'] == 'completed' and row['conclusion'] == 'success' for row in rows
          )
          failures = [
              row for row in rows
              if not (row['status'] == 'completed' and row['conclusion'] == 'success')
          ]

          body = f'''## v14 cumulative source candidate — published, Draft, no product promotion

```text
plan:              2026-08-29-d6
base main:         addaf73a48bae65f19f6bfe91c6264fd2ddb85a1
source head:       {head}
source tree:       {tree}
```

The exact locally reviewed v14 tree is now ordinary repository source. It includes cumulative documentation and contract repairs, D3 actor/identity/event-loop work, receipt persistence/recovery/migration, and deterministic D8/Servo validator-isolation fixes.

Local verification bound to `{tree}`: 698 Python tests; Rust 1.93.0 default/all-feature format, check, Clippy and tests; 64 persistence and 16 migration SIGKILL cases; documentation, repository, project-truth, source-governance and packaging validators. These are source/host results, not installed-product, physical-hardware, signing or release evidence.

Exact-head explicitly dispatched permanent workflow matrix: `{len(runs)}/22` present; all terminal success: `{str(all_green).lower()}`. Any source/base/prospective-merge movement invalidates this packet.

Keep Draft. Require a fresh independent non-author review of this unchanged object, actual protected-main/ruleset/environment enforcement with authenticated positive/negative readback, normal governed merge, and exact-main reruns.

D2I exact image; D3 real Servo-owned retained nodes/native event loop/attested IPC; installed D4-D7 services; D8 fixed-BOM 24/72-hour physical and raw power-loss evidence; D9 offline/HSM dual control and protected publication remain separate open gates. Legacy cutover, partial initialization repair, archival/pruning and external trusted anti-rollback also remain open.

`all_gaps_closed=false`.
'''
          api('pulls/66', 'PATCH', {'body': body})
          diagnostic = {
              'published_head': head,
              'published_tree': tree,
              'dispatch_failures': dispatch_failures,
              'runs': rows,
              'all_green': all_green,
          }
          api('issues/66/comments', 'POST', {'body':
              '## v14 publication and exact-head dispatch checkpoint\n\n'
              f'Published head `{head}` with exact tree `{tree}`. '
              f'Observed dispatched matrix: `{len(runs)}/22`; all green: `{str(all_green).lower()}`.\n\n'
              '```json\n' + json.dumps(diagnostic, indent=2, sort_keys=True) + '\n```\n\n'
              'No merge, product, hardware, signing or release claim is made.'})
          if all_green:
              api('pulls/66/requested_reviewers', 'POST', {'reviewers': ['Tomasrgbsf']})
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as out:
                  out.write(f'## v14 publication\n\nHead: `{head}`  \nTree: `{tree}`  \n')
                  out.write(f'Dispatched matrix: `{len(runs)}/22`; all green: `{str(all_green).lower()}`.\n')
          if not all_green:
              raise SystemExit('Exact-head dispatch matrix not green: ' + json.dumps({
                  'dispatch_failures': dispatch_failures,
                  'failures': failures,
              }))
          PY
