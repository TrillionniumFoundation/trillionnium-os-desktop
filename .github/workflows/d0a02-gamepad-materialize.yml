name: d0a02-gamepad-materialize

on:
  push:
    branches:
      - codex/d0a02-headed-runtime-v3
    paths:
      - .github/workflows/d0a02-gamepad-materialize.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: d0a02-gamepad-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d0a02-headed-runtime-v3
          fetch-depth: 0

      - name: Complete the exact-pin servoshell feature closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/servo-headed-runtime.yml')
          source = path.read_text()
          old = '--no-default-features --features bundled,js_jit,max_log_level'
          new = '--no-default-features --features bundled,gamepad,js_jit,max_log_level'
          if source.count(old) != 2:
              raise SystemExit(f'expected two exact feature lists, found {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY
          rm .github/workflows/d0a02-gamepad-materialize.yml
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/servo-headed-runtime.yml .github/workflows/d0a02-gamepad-materialize.yml
          git commit -m 'fix: enable servoshell gamepad feature in headed gate'
          git push origin HEAD:codex/d0a02-headed-runtime-v3

      - name: Dispatch permanent headed qualification at repaired head
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            repos/${{ github.repository }}/actions/workflows/servo-headed-runtime.yml/dispatches \
            -f ref=codex/d0a02-headed-runtime-v3
