name: d5-trusted-app

on:
  pull_request:
    branches:
      - main
      - codex/d4-collaboration-state-machine-v1
  push:
    branches:
      - main
      - codex/d5-trusted-app-verifier-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d5-trusted-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trusted_app_reference:
    name: d5-trusted-app-verifier
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate without write credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Record exact Git identity
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          git show -s --format='%P' HEAD

      - name: Compile dependency-free verifier and corpus
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/trusted_app_bundle.py \
            tools/trusted_app_indicator.py \
            tests/d5/test_trusted_app_bundle.py

      - name: Run signature, tamper, policy, revocation, and rotation corpus
        run: |
          set -euo pipefail
          python3 -m unittest discover \
            -s tests/d5 \
            -p 'test_*.py' \
            -v

      - name: Generate bounded source-only evidence
        run: |
          set -euo pipefail
          mkdir -p artifacts/d5-trusted-app
          python3 tools/trusted_app_bundle.py self-test \
            --contract contracts/trusted-app-bundle.v1.json \
            --write-result artifacts/d5-trusted-app/reference-result.json \
            | tee artifacts/d5-trusted-app/reference-result.stdout.json
          cmp \
            artifacts/d5-trusted-app/reference-result.json \
            artifacts/d5-trusted-app/reference-result.stdout.json

      - name: Validate repository and committed project truth
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py

      - name: Enforce D5 source-only claim ceiling
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path('contracts/trusted-app-bundle.v1.json').read_text())
          result = json.loads(Path('artifacts/d5-trusted-app/reference-result.json').read_text())
          assert contract['status'] == 'SOURCE_CANDIDATE_BLOCKED_UPSTREAM_D4'
          assert contract['claim_ceiling']['offline_reference_verifier'] is True
          for key in [
              'real_product_trusted_origin_integrated',
              'production_publisher_key_enrolled',
              'production_signing_key_custody_proven',
              'native_trusted_chrome_integrated',
              'browser_storage_partition_integrated',
              'service_worker_runtime_integrated',
              'revocation_distribution_integrated',
              'external_effects_enabled',
              'hardware_qualified',
              'release_ready',
          ]:
              assert contract['claim_ceiling'][key] is False, key
          assert result['status'] == 'PASS_SOURCE_REFERENCE_ONLY'
          assert result['rfc8032_vector'] == 'PASS'
          assert result['network_used'] is False
          assert result['production_signing_key_custody_proven'] is False
          assert result['product_origin_integrated'] is False
          assert result['release_ready'] is False
          PY

      - name: Upload exact-head source evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d5-trusted-app-${{ github.sha }}
          path: artifacts/d5-trusted-app
          if-no-files-found: warn
          retention-days: 30
