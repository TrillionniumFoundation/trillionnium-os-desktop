name: status-facts

on:
  pull_request:
    paths:
      - ".github/workflows/status-facts.yml"
      - "manifests/project-state.v1.json"
      - "docs/status-facts.v1.json"
      - "docs/CURRENT_STATE.md"
      - "tools/validate_status_facts.py"
      - "tests/test_status_facts.py"
  push:
    branches:
      - main
      - "codex/**"
    paths:
      - ".github/workflows/status-facts.yml"
      - "manifests/project-state.v1.json"
      - "docs/status-facts.v1.json"
      - "docs/CURRENT_STATE.md"
      - "tools/validate_status_facts.py"
      - "tests/test_status_facts.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: status-facts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Validate closed-schema projection
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_status_facts.py
          python3 -m unittest tests.test_status_facts
