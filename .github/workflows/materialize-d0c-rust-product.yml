name: materialize-d0c-rust-product

on:
  push:
    branches: [codex/d0c-rust-product-v1]
    paths:
      - ".bootstrap-d0c-v2/**"
      - ".github/workflows/materialize-d0c-rust-product.yml"

permissions:
  contents: write

concurrency:
  group: materialize-d0c-rust-product
  cancel-in-progress: false

jobs:
  materialize-test-and-record:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d0c-rust-product-v1
          fetch-depth: 0

      - name: Reconstruct reviewed D0C overlay bundle
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap-d0c-v2/part-00 \
            .bootstrap-d0c-v2/part-01 \
            .bootstrap-d0c-v2/part-02 \
            .bootstrap-d0c-v2/part-03a \
            .bootstrap-d0c-v2/part-03b \
            .bootstrap-d0c-v2/part-04 \
            .bootstrap-d0c-v2/part-05 \
            > /tmp/d0c-materialize.tar.gz.b64
          test "$(wc -c < /tmp/d0c-materialize.tar.gz.b64)" -eq 32428
          base64 -d /tmp/d0c-materialize.tar.gz.b64 > /tmp/d0c-materialize.tar.gz
          echo "7e5ebc89218dbc2e262dad1610633bcab992151ff335c0e46a763e64d5c7749d  /tmp/d0c-materialize.tar.gz" | sha256sum -c -
          mkdir -p /tmp/d0c-bundle
          tar -xzf /tmp/d0c-materialize.tar.gz -C /tmp/d0c-bundle

      - name: Apply fail-closed product overlay
        run: |
          python3 /tmp/d0c-bundle/apply_to_checkout.py "$GITHUB_WORKSPACE" \
            --apply --allow-dirty \
            --report /tmp/d0c-overlay-application.json

      - name: Apply reviewed Rust 1.93 source fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("crates/hepta-browser-codec/src/lib.rs")
          text = path.read_text()
          old = """    if let Some(port) = port {\n        if port == 0 {\n            return Err(CodecError::InvalidUrl);\n        }\n    }\n"""
          new = """    if port == Some(0) {\n        return Err(CodecError::InvalidUrl);\n    }\n"""
          if old not in text:
              raise SystemExit("reviewed zero-port block was not found exactly")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Install exact Rust 1.93.0 toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup default 1.93.0
          rustc --version --verbose | tee /tmp/rustc-version.txt
          cargo --version --verbose | tee /tmp/cargo-version.txt

      - name: Resolve lock and format exact source
        run: |
          cargo generate-lockfile
          cargo fmt --all
          cargo fmt --all --check

      - name: Run Clippy across every product target
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run full workspace tests
        run: cargo test --workspace --all-targets --locked

      - name: Run focused codec and AgentPort tests
        run: |
          cargo test --locked -p hepta-browser-codec
          cargo test --locked -p hepta-agent-port

      - name: Run integrated browserd self-check
        run: cargo run --locked -p hepta-browserd -- --self-check | tee /tmp/browserd-self-check.json

      - name: Generate exact dependency candidate
        run: |
          python3 /tmp/d0c-bundle/toolchain/tools/verify_cargo_lock_allowlist.py \
            --lock Cargo.lock \
            --baseline /tmp/d0c-bundle/toolchain/manifests/cargo-external-allowlist-d0c02-baseline.json \
            --write-candidate manifests/cargo-external-allowlist.d0c-candidate.json

      - name: Record exact-head host evidence
        env:
          CANDIDATE_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          mkdir -p docs/evidence/generated
          python3 - <<'PY'
          import hashlib, json, os, platform
          from pathlib import Path
          def sha(path): return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          candidate = json.loads(Path("manifests/cargo-external-allowlist.d0c-candidate.json").read_text())
          overlay = json.loads(Path("/tmp/d0c-overlay-application.json").read_text())
          value = {
            "schema": "trillionnium.desktop.d0c-rust-host-evidence.v1",
            "status": "PASS_HOST_RUST_1_93_EXACT_HEAD",
            "candidate_head_before_materialization": os.environ["CANDIDATE_HEAD"],
            "runner": {
              "os": platform.platform(), "machine": platform.machine(),
              "python": platform.python_version(),
              "rustc": Path("/tmp/rustc-version.txt").read_text().strip(),
              "cargo": Path("/tmp/cargo-version.txt").read_text().strip()
            },
            "checks": {
              "cargo_fmt": "PASS", "cargo_clippy_workspace_all_targets_D_warnings": "PASS",
              "cargo_test_workspace_all_targets": "PASS", "hepta_browser_codec_tests": "PASS",
              "hepta_agent_port_tests": "PASS", "browserd_self_check": "PASS"
            },
            "hashes": {
              "cargo_lock_sha256": sha("Cargo.lock"),
              "dependency_candidate_sha256": sha("manifests/cargo-external-allowlist.d0c-candidate.json"),
              "browserd_self_check_sha256": sha("/tmp/browserd-self-check.json")
            },
            "external_package_count": len(candidate["packages"]),
            "new_packages_requiring_review": candidate["new_packages_requiring_review"],
            "overlay_application": overlay,
            "authority": {
              "listener_created": False, "browser_actor_created": False,
              "servo_called": False, "external_effect_authorized": False
            },
            "promotion": {
              "rust_host_gate": "PASS", "dependency_review": "REVIEW_REQUIRED",
              "merge_ready": False
            }
          }
          Path("docs/evidence/generated/d0c-rust-host-evidence.json").write_text(
            json.dumps(value, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Remove temporary payload and workflow
        run: |
          rm -rf .bootstrap-d0c .bootstrap-d0c-v2
          rm .github/workflows/materialize-d0c-rust-product.yml

      - name: Commit tested product candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: implement and host-test D0C-03/D0C-04 Rust product path"
          git push origin HEAD:codex/d0c-rust-product-v1
