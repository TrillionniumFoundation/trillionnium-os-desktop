name: servo-headed-runtime

on:
  pull_request:
    paths:
      - ".github/workflows/servo-headed-runtime.yml"
      - "experiments/servo-headed-runtime/**"
      - "contracts/workspace-composition.v1.json"
      - "crates/hepta-workspace-composition/**"
      - "docs/architecture/TRUSTED_WORKSPACE_COMPOSITION.md"
      - "manifests/servo.lock.json"
      - "manifests/servo-patch-ledger.v1.json"
  push:
    branches:
      - codex/d0a02-headed-runtime-v3
    paths:
      - ".github/workflows/servo-headed-runtime.yml"
      - "experiments/servo-headed-runtime/**"
      - "contracts/workspace-composition.v1.json"
      - "crates/hepta-workspace-composition/**"
      - "docs/architecture/TRUSTED_WORKSPACE_COMPOSITION.md"
      - "manifests/servo.lock.json"
      - "manifests/servo-patch-ledger.v1.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: servo-headed-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVO_COMMIT: 670ae8a70801b162e186f81cbb5bdd2d59c39108
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Check out TrillionniumOS Desktop candidate
        uses: actions/checkout@v4

      - name: Check out exact Servo source pin
        uses: actions/checkout@v4
        with:
          repository: servo/servo
          ref: ${{ env.SERVO_COMMIT }}
          path: servo-source
          fetch-depth: 1
          submodules: false

      - name: Verify exact clean zero-patch Servo input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C servo-source rev-parse HEAD)" = "$SERVO_COMMIT"
          test -z "$(git -C servo-source status --porcelain=v1)"
          python3 - <<'PY'
          from pathlib import Path
          import json
          expected = '670ae8a70801b162e186f81cbb5bdd2d59c39108'
          lock = json.loads(Path('manifests/servo.lock.json').read_text())
          ledger = json.loads(Path('manifests/servo-patch-ledger.v1.json').read_text())
          assert lock['commit'] == expected
          assert ledger['servo_commit'] == expected
          assert ledger['patch_count'] == 0
          assert ledger['patches'] == []
          PY

      - name: Install Servo headed runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          sed -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' \
            servo-source/python/servo/platform/linux_packages/apt/apt_common.txt \
            servo-source/python/servo/platform/linux_packages/apt/apt_ubuntu_only.txt \
            | sort -u > /tmp/servo-packages.txt
          sudo apt-get update
          xargs -r sudo apt-get install -y --no-install-recommends < /tmp/servo-packages.txt
          sudo apt-get install -y --no-install-recommends \
            iproute2 mesa-utils x11-utils xdotool xvfb
          sudo apt-get purge -y fonts-droid-fallback || true

      - name: Install Servo-declared Rust channel
        shell: bash
        run: |
          set -euo pipefail
          SERVO_RUST_CHANNEL="$(python3 - <<'PY'
          from pathlib import Path
          import tomllib
          print(tomllib.loads(Path('servo-source/rust-toolchain.toml').read_text())['toolchain']['channel'])
          PY
          )"
          printf 'SERVO_RUST_CHANNEL=%s\n' "$SERVO_RUST_CHANNEL" >> "$GITHUB_ENV"
          rustup toolchain install "$SERVO_RUST_CHANNEL" --profile minimal
          rustup component add rustfmt --toolchain "$SERVO_RUST_CHANNEL"
          RUSTUP_TOOLCHAIN="$SERVO_RUST_CHANNEL" rustc --version --verbose
          RUSTUP_TOOLCHAIN="$SERVO_RUST_CHANNEL" cargo --version --verbose

      - name: Restore exact-pin Cargo and target cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            servo-source/target
          key: servo-headed-${{ runner.os }}-${{ env.SERVO_COMMIT }}-${{ hashFiles('servo-source/Cargo.lock', 'servo-source/rust-toolchain.toml', 'experiments/servo-headed-runtime/src/main.rs') }}
          restore-keys: |
            servo-headed-${{ runner.os }}-${{ env.SERVO_COMMIT }}-
            servo-${{ runner.os }}-${{ env.SERVO_COMMIT }}-

      - name: Install product-owned example overlay
        shell: bash
        run: |
          set -euo pipefail
          export RUSTUP_TOOLCHAIN="$SERVO_RUST_CHANNEL"
          rustfmt --check experiments/servo-headed-runtime/src/main.rs
          cp experiments/servo-headed-runtime/src/main.rs \
            servo-source/components/servo/examples/trillionnium_headed_runtime.rs
          cp experiments/servo-headed-runtime/fixture/index.html \
            servo-source/components/servo/examples/trillionnium_headed_fixture.html

      - name: Compile product-owned exact-pin headed runtime
        shell: bash
        run: |
          set -euo pipefail
          export RUSTUP_TOOLCHAIN="$SERVO_RUST_CHANNEL"
          mkdir -p artifacts/servo-headed-runtime
          cargo check --locked --manifest-path servo-source/Cargo.toml \
            -p servo --example trillionnium_headed_runtime \
            2>&1 | tee artifacts/servo-headed-runtime/cargo-check.log
          cargo build --locked --manifest-path servo-source/Cargo.toml \
            -p servo --example trillionnium_headed_runtime \
            2>&1 | tee artifacts/servo-headed-runtime/cargo-build.log

      - name: Run one-window local-fixture crash-and-recovery corpus
        shell: bash
        run: |
          set -euo pipefail
          output="$PWD/artifacts/servo-headed-runtime/runtime"
          mkdir -p "$output"
          export HEPTA_D0A02_OUTPUT="$output"
          export RUST_BACKTRACE=1

          Xvfb :99 -screen 0 1280x900x24 -nolisten tcp \
            >"$output/xvfb.log" 2>&1 &
          xvfb_pid=$!
          app_pid=
          cleanup() {
            if [[ -n "${app_pid:-}" ]]; then
              kill "$app_pid" 2>/dev/null || true
              wait "$app_pid" 2>/dev/null || true
            fi
            kill "$xvfb_pid" 2>/dev/null || true
            wait "$xvfb_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          export DISPLAY=:99
          for _ in $(seq 1 100); do
            xdpyinfo >/dev/null 2>&1 && break
            sleep 0.1
          done
          xdpyinfo >"$output/xdpyinfo.txt"

          servo-source/target/debug/examples/trillionnium_headed_runtime \
            >"$output/runtime.log" 2>&1 &
          app_pid=$!

          for _ in $(seq 1 600); do
            [[ -f "$output/input-ready" ]] && break
            kill -0 "$app_pid" 2>/dev/null || {
              cat "$output/runtime.log" >&2
              exit 1
            }
            sleep 0.1
          done
          test -f "$output/input-ready"

          window_id="$(xdotool search --name 'TrillionniumOS Desktop.*D0A-02' | head -n1)"
          test -n "$window_id"
          xwininfo -id "$window_id" >"$output/xwininfo.txt"
          xdotool windowfocus --sync "$window_id"
          xdotool mousemove --window "$window_id" 400 132
          xdotool click --window "$window_id" 1
          xdotool click --window "$window_id" 5
          xdotool key --window "$window_id" k

          ps -eo pid,ppid,stat,args >"$output/process-topology.txt"
          timeout 180 tail --pid="$app_pid" -f /dev/null
          wait "$app_pid"
          app_status=$?
          app_pid=
          test "$app_status" -eq 0

      - name: Enforce headed runtime evidence and claim ceiling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path('artifacts/servo-headed-runtime/runtime')
          path = root / 'runtime-result.json'
          report = json.loads(path.read_text())
          assert report['status'] == 'PASS_HEADED_LOCAL_FIXTURE_ONLY'
          assert report['servo_commit'] == '670ae8a70801b162e186f81cbb5bdd2d59c39108'
          assert report['window_created'] is True
          assert report['trusted_chrome_separate_from_content'] is True
          assert report['logical_content_webview_peak'] == 1
          assert report['initial_generation'] == 1
          assert report['recovery_generation'] == 2
          assert report['chrome_initial_pixels_verified'] is True
          assert report['chrome_crash_pixels_verified'] is True
          assert report['chrome_recovery_pixels_verified'] is True
          assert report['native_pointer_events'] > 0
          assert report['native_button_events'] >= 2
          assert report['native_wheel_events'] > 0
          assert report['native_keyboard_events'] >= 2
          assert report['synthetic_ime_composition_events'] == 3
          assert report['input_handled_callbacks'] >= 6
          assert report['input_method_controls'] > 0
          assert report['popup_requests_denied'] > 0
          assert report['external_navigation_requests_denied'] > 0
          assert report['content_crash_observed'] is True
          assert report['trusted_window_survived_content_crash'] is True

          initial = report['initial_page_evidence']
          assert initial['generation'] == 1
          assert initial['loaded'] is True
          assert initial['pointerMoves'] > 0
          assert initial['pointerDowns'] > 0
          assert initial['clicks'] > 0
          assert initial['wheels'] > 0
          assert 'k' in [str(item).lower() for item in initial['keyDowns']]
          states = [item[0] for item in initial['composition']]
          assert states[-3:] == ['start', 'update', 'end']
          assert initial['popupAttempted'] is True
          assert initial['externalNavigationAttempted'] is True

          recovery = report['recovery_page_evidence']
          assert recovery['generation'] == 2
          assert recovery['loaded'] is True

          authority = report['authority']
          assert authority['fixture_listener_loopback_only'] is True
          assert all(authority[key] is False for key in [
              'external_navigation_performed',
              'webdriver_listener_started',
              'browser_actor_started',
              'agent_port_enabled',
              'persistent_credentials_used',
              'product_ready',
          ])
          topology = (root / 'process-topology.txt').read_text(errors='replace')
          assert 'trillionnium_headed_runtime' in topology
          assert '--content-process' in topology

          artifacts = {}
          for file in sorted(root.glob('*.png')):
              data = file.read_bytes()
              assert data.startswith(b'\x89PNG\r\n\x1a\n')
              artifacts[file.name] = {
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              }
          required = {
              'content-generation-1.png',
              'content-generation-2.png',
              'workspace-generation-1.png',
              'workspace-crash-placeholder.png',
              'workspace-generation-2.png',
          }
          assert required.issubset(artifacts)
          report['artifacts'] = artifacts
          path.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          PY

      - name: Restore clean exact Servo checkout
        if: always()
        shell: bash
        run: |
          rm -f \
            servo-source/components/servo/examples/trillionnium_headed_runtime.rs \
            servo-source/components/servo/examples/trillionnium_headed_fixture.html
          test -z "$(git -C servo-source status --porcelain=v1)"

      - name: Validate tracked desktop repository
        shell: bash
        run: |
          set -euo pipefail
          validation_root="$RUNNER_TEMP/trillionnium-d0a02-validation"
          rm -rf "$validation_root"
          mkdir -p "$validation_root"
          git archive --format=tar HEAD | tar -xf - -C "$validation_root"
          python3 "$validation_root/tools/validate_repository.py"

      - name: Upload D0A-02 headed runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: servo-headed-runtime-${{ github.sha }}
          path: artifacts/servo-headed-runtime
          if-no-files-found: warn
          retention-days: 30
