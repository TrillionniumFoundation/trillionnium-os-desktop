name: servo-headed-runtime

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: servo-headed-runtime-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVO_COMMIT: 670ae8a70801b162e186f81cbb5bdd2d59c39108
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Check out exact desktop object
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Derive and validate exact Git identities
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BEFORE: ${{ github.event.before || '' }}
        run: bash tools/run_servo_headed_runtime_gate.sh identities

      - name: Check out exact Servo source pin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: servo/servo
          ref: ${{ env.SERVO_COMMIT }}
          path: servo-source
          fetch-depth: 1
          submodules: false
          persist-credentials: false

      - name: Verify exact clean zero-patch Servo input
        shell: bash
        run: bash tools/run_servo_headed_runtime_gate.sh verify-servo

      - name: Install headed runtime dependencies
        shell: bash
        run: bash tools/run_servo_headed_runtime_gate.sh install-deps

      - name: Install Servo-declared Rust channel
        shell: bash
        run: bash tools/run_servo_headed_runtime_gate.sh install-rust

      - name: Restore exact-pin Cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            servo-source/target
          key: servo-headed-v3-${{ runner.os }}-${{ env.SERVO_COMMIT }}-${{ hashFiles('servo-source/Cargo.lock', 'servo-source/rust-toolchain.toml', 'experiments/servo-headed-runtime/src/main.rs', 'tools/inject_servo_content_process.py', 'tools/run_servo_headed_runtime_gate.sh', '.github/workflows/servo-headed-runtime.yml') }}
          restore-keys: |
            servo-headed-v3-${{ runner.os }}-${{ env.SERVO_COMMIT }}-
            servo-headed-v2-${{ runner.os }}-${{ env.SERVO_COMMIT }}-
            servo-headed-${{ runner.os }}-${{ env.SERVO_COMMIT }}-

      - name: Install deterministic formatted product overlay
        shell: bash
        run: bash tools/run_servo_headed_runtime_gate.sh install-overlay

      - name: Compile exact-pin headed runtime
        shell: bash
        run: bash tools/run_servo_headed_runtime_gate.sh compile

      - name: Run causal one-window crash-and-recovery corpus
        shell: bash
        run: bash tools/run_servo_headed_runtime_gate.sh run-runtime

      - name: Enforce causal evidence and claim ceiling
        shell: bash
        run: bash tools/run_servo_headed_runtime_gate.sh enforce-evidence

      - name: Restore clean exact Servo checkout
        if: always()
        shell: bash
        run: bash tools/run_servo_headed_runtime_gate.sh restore-servo

      - name: Validate tracked desktop repository
        shell: bash
        run: bash tools/run_servo_headed_runtime_gate.sh validate-repository

      - name: Upload headed runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: servo-headed-runtime-v3-${{ github.sha }}
          path: artifacts/servo-headed-runtime
          if-no-files-found: warn
          retention-days: 30
