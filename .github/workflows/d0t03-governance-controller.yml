name: d0t03-governance-controller

on:
  pull_request:
    paths:
      - ".github/workflows/d0t03-governance-controller.yml"
      - "tools/d0t03_admin_controller.py"
      - "tests/test_d0t03_admin_controller.py"
      - "docs/governance/D0T03_ADMIN_CONTROLLER.md"
  push:
    branches: [main, "codex/**"]
    paths:
      - ".github/workflows/d0t03-governance-controller.yml"
      - "tools/d0t03_admin_controller.py"
      - "tests/test_d0t03_admin_controller.py"
      - "docs/governance/D0T03_ADMIN_CONTROLLER.md"

permissions:
  contents: read

concurrency:
  group: d0t03-governance-controller-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Assert exact source identity
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          git rev-parse HEAD^{tree}
      - name: Validate closed administrative configuration
        run: |
          set -euo pipefail
          python3 tools/d0t03_admin_controller.py --check-config
          python3 -m unittest tests.test_d0t03_admin_controller -v
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py

  prospective-merge:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out prospective merge object
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 2
          persist-credentials: false
      - name: Assert prospective merge identity and parent order
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse HEAD^1)" = "${{ github.event.pull_request.base.sha }}"
          test "$(git rev-parse HEAD^2)" = "${{ github.event.pull_request.head.sha }}"
          git rev-parse HEAD^{tree}
      - name: Validate prospective controller tree
        run: |
          set -euo pipefail
          python3 tools/d0t03_admin_controller.py --check-config
          python3 -m unittest tests.test_d0t03_admin_controller -v
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
