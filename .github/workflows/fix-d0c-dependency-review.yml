name: fix-d0c-dependency-review

on:
  push:
    branches:
      - codex/d0c-rust-product-v1
    paths:
      - .github/workflows/fix-d0c-dependency-review.yml

permissions:
  contents: write

jobs:
  regenerate-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d0c-rust-product-v1
          fetch-depth: 0

      - name: Install exact Rust toolchain and obtain metadata
        run: |
          rustup toolchain install 1.93.0 --profile minimal
          rustup default 1.93.0
          cargo metadata --locked --format-version 1 > /tmp/cargo-metadata.json
          cargo tree --locked --workspace --all-targets --edges normal,build,dev > /tmp/cargo-tree.txt

      - name: Join Cargo.lock checksums with package metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import tomllib
          from pathlib import Path

          metadata = json.loads(Path('/tmp/cargo-metadata.json').read_text())
          lock = tomllib.loads(Path('Cargo.lock').read_text())
          baseline = json.loads(Path('manifests/cargo-external-allowlist.json').read_text())

          lock_checksums = {
              (package['name'], package['version']): package.get('checksum')
              for package in lock['package']
              if package.get('source', '').startswith('registry+')
          }
          baseline_keys = {
              (package['name'], package['version'], package['checksum'])
              for package in baseline['packages']
          }
          packages = {package['id']: package for package in metadata['packages']}
          reverse = {package_id: [] for package_id in packages}
          for node in metadata['resolve']['nodes']:
              owner = packages[node['id']]
              for dependency in node['deps']:
                  reverse.setdefault(dependency['pkg'], []).append({
                      'name': owner['name'],
                      'version': owner['version'],
                      'dependency_name': dependency['name'],
                      'kinds': sorted({entry['kind'] or 'normal' for entry in dependency['dep_kinds']}),
                  })

          reviewed = []
          for package in metadata['packages']:
              source = package.get('source')
              if not source:
                  continue
              checksum = lock_checksums.get((package['name'], package['version']))
              if not checksum:
                  raise SystemExit(f"lock checksum missing for {package['name']} {package['version']}")
              targets = package.get('targets', [])
              key = (package['name'], package['version'], checksum)
              reviewed.append({
                  'name': package['name'],
                  'version': package['version'],
                  'checksum': checksum,
                  'source': source,
                  'license': package.get('license'),
                  'license_file': package.get('license_file'),
                  'repository': package.get('repository'),
                  'homepage': package.get('homepage'),
                  'documentation': package.get('documentation'),
                  'rust_version': package.get('rust_version'),
                  'manifest_path_suffix': '/'.join(Path(package['manifest_path']).parts[-3:]),
                  'has_build_script': any('custom-build' in target.get('kind', []) for target in targets),
                  'is_proc_macro': any('proc-macro' in target.get('kind', []) for target in targets),
                  'target_kinds': sorted({kind for target in targets for kind in target.get('kind', [])}),
                  'baseline_package': key in baseline_keys,
                  'reverse_dependencies': sorted(reverse.get(package['id'], []), key=lambda item: (item['name'], item['dependency_name'])),
              })

          reviewed.sort(key=lambda item: (item['name'], item['version']))
          new_packages = [item for item in reviewed if not item['baseline_package']]
          baseline_preserved = baseline_keys.issubset({
              (item['name'], item['version'], item['checksum']) for item in reviewed
          })
          if not baseline_preserved:
              raise SystemExit('D0C-02 dependency baseline was not preserved')
          if len(new_packages) != 10:
              raise SystemExit(f'expected 10 new packages, found {len(new_packages)}')

          review = {
              'schema': 'trillionnium.desktop.cargo-dependency-review.v1',
              'generated_for': 'TOS-D0C-03-D0C-04',
              'status': 'METADATA_GENERATED_REVIEW_REQUIRED',
              'policy': 'exact crates.io source, version, checksum and explicit license/build/proc-macro review',
              'cargo_lock_sha256': hashlib.sha256(Path('Cargo.lock').read_bytes()).hexdigest(),
              'cargo_tree_sha256': hashlib.sha256(Path('/tmp/cargo-tree.txt').read_bytes()).hexdigest(),
              'baseline_package_count': len(baseline_keys),
              'external_package_count': len(reviewed),
              'new_package_count': len(new_packages),
              'baseline_preserved': True,
              'new_packages': new_packages,
              'all_external_packages': reviewed,
              'authority': {
                  'git_dependencies': any(not item['source'].startswith('registry+https://github.com/rust-lang/crates.io-index') for item in reviewed),
                  'listener_enabled': False,
                  'external_effect_authorized': False,
              },
          }
          Path('manifests/cargo-dependency-review.d0c.json').write_text(json.dumps(review, indent=2, sort_keys=True) + '\n')
          Path('docs/evidence/generated/d0c-cargo-tree.txt').write_text(Path('/tmp/cargo-tree.txt').read_text())

          candidate = {
              'schema': 'trillionnium.desktop.cargo-external-allowlist.v1',
              'generated_for': 'TOS-D0C-03-D0C-04',
              'status': 'REVIEW_REQUIRED_NOT_YET_TRUSTED',
              'policy': 'exact_name_version_checksum_no_git_dependencies',
              'baseline_preserved': True,
              'new_packages_requiring_review': [
                  {'name': item['name'], 'version': item['version'], 'checksum': item['checksum']}
                  for item in new_packages
              ],
              'packages': [
                  {'name': item['name'], 'version': item['version'], 'checksum': item['checksum']}
                  for item in reviewed
              ],
          }
          Path('manifests/cargo-external-allowlist.d0c-candidate.json').write_text(json.dumps(candidate, indent=2, sort_keys=True) + '\n')
          PY

      - name: Remove one-shot workflow and commit corrected review
        run: |
          rm .github/workflows/fix-d0c-dependency-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: bind D0C dependency review to Cargo.lock checksums"
          git push origin HEAD:codex/d0c-rust-product-v1
