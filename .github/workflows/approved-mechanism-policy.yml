name: approved-mechanism-policy-source

on:
  push:
    branches: [main, "codex/**"]
    paths:
      - ".github/workflows/approved-mechanism-policy.yml"
      - "crates/hepta-peer-attestation/**"
      - "apps/hepta-browserd/**"
      - "crates/hepta-agent-transport/**"
      - "contracts/approved-mechanism-policy.v1.json"
      - "contracts/fixtures/approved-mechanisms.v1.conf"
      - "docs/architecture/APPROVED_MECHANISM_POLICY.md"
      - "tests/test_approved_mechanism_policy.py"
      - "manifests/modules.v1.json"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - ".github/workflows/approved-mechanism-policy.yml"
      - "crates/hepta-peer-attestation/**"
      - "apps/hepta-browserd/**"
      - "crates/hepta-agent-transport/**"
      - "contracts/approved-mechanism-policy.v1.json"
      - "contracts/fixtures/approved-mechanisms.v1.conf"
      - "docs/architecture/APPROVED_MECHANISM_POLICY.md"
      - "tests/test_approved_mechanism_policy.py"
      - "manifests/modules.v1.json"
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: read

concurrency:
  group: approved-mechanism-policy-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actual-host-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        object: ${{ github.event_name == 'pull_request' && fromJSON('["head","prospective-merge"]') || fromJSON('["head"]') }}
    steps:
      - name: Check out exact source object
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.object == 'prospective-merge' && format('refs/pull/{0}/merge', github.event.pull_request.number) || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha) }}
          fetch-depth: 2
          persist-credentials: false
      - name: Bind exact source and current prospective parents
        shell: bash
        env:
          SOURCE_OBJECT: ${{ matrix.object }}
          EVENT_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          EVENT_TESTED: ${{ github.sha }}
          HEAD_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          live_head="$(git ls-remote origin "refs/heads/$HEAD_REF" | awk 'NR == 1 {print $1}')"
          test "$live_head" = "$EVENT_HEAD"
          if test "$SOURCE_OBJECT" = prospective-merge; then
            live_base="$(git ls-remote origin "refs/heads/$BASE_REF" | awk 'NR == 1 {print $1}')"
            test "$live_base" = "$EVENT_BASE"
            test "$(git rev-parse HEAD)" = "$EVENT_TESTED"
            test "$(git show -s --format=%P HEAD | wc -w)" -eq 2
            test "$(git rev-parse HEAD^1)" = "$live_base"
            test "$(git rev-parse HEAD^2)" = "$live_head"
          else
            test "$(git rev-parse HEAD)" = "$EVENT_HEAD"
          fi
          git rev-parse HEAD 'HEAD^{tree}'
          sha256sum crates/hepta-peer-attestation/src/approved_policy.rs crates/hepta-peer-attestation/src/control_owner/root_path/approved.rs apps/hepta-browserd/src/product_dispatch/product_approved_policy.rs contracts/approved-mechanism-policy.v1.json
      - name: Install exact source toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup override set 1.93.0
      - name: Run actual rooted configuration and retained coordinator corpus
        shell: bash
        env:
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_PROFILE_TEST_OPT_LEVEL: '1'
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_DEV_OPT_LEVEL: '1'
        run: |
          set -euo pipefail
          unset PYTHONOPTIMIZE
          cargo test --locked -p hepta-peer-attestation --lib
          cargo test --locked -p hepta-peer-attestation --lib --all-features
          cargo test --locked -p hepta-peer-attestation --test approved_policy_kernel
          cargo test --locked -p hepta-browserd --test approved_policy_product_kernel
          cargo test --locked -p hepta-peer-attestation --doc
          cargo clippy --locked -p hepta-peer-attestation -p hepta-browserd --all-targets --all-features -- -D warnings
          cargo fmt --all --check
          python3 - <<'PYTHON'
          import unittest
          suite = unittest.defaultTestLoader.discover('tests', pattern='test_approved_mechanism_policy.py')
          expected = suite.countTestCases()
          if expected < 7:
              raise RuntimeError('approved source corpus missing')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if not result.wasSuccessful() or result.testsRun != expected or result.skipped:
              raise SystemExit('approved source corpus failed, omitted or skipped')
          PYTHON
      - name: Validate source inventory and unchanged claim ceilings
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_module_documentation.py
          python3 tools/validate_documentation_coherence.py
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 tools/validate_contract_foundation.py
          git diff --exit-code
