name: d3-integrated-runtime-evidence-verifier

on:
  pull_request:
    paths:
      - "docs/architecture/D3_CALLBACK_SERVICE_RUNNER.md"
      - "contracts/d3-callback-service-runner.v1.json"
      - "tests/test_callback_service_runner.py"
      - "tools/audit_callback_service.py"
      - "crates/hepta-d3-development/src/sessiond/callback_runner.rs"
      - "crates/hepta-d3-development/src/sessiond/callback_runner_tests.rs"
      - "crates/hepta-browser-actor/src/engine_dispatch/immediate_callbacks.rs"
      - "docs/architecture/EVENT_LOOP_COMPLETION.md"
      - "contracts/event-loop-completion.v1.json"
      - "tests/test_event_loop_completion.py"
      - "tools/audit_event_loop_completion.py"
      - "crates/hepta-browser-actor/src/engine_dispatch/event_loop.rs"
      - "crates/hepta-browser-actor/src/engine_dispatch/event_loop_tests.rs"
      - "crates/hepta-browser-actor/src/engine_dispatch/event_loop_transport_tests.rs"
      - "docs/architecture/SESSION_INCARNATION.md"
      - "contracts/session-incarnation.v1.json"
      - "tests/test_session_incarnation.py"
      - "docs/architecture/REQUEST_PEER_CUSTODY.md"
      - "contracts/request-peer-custody.v1.json"
      - "tests/test_request_peer_custody.py"
      - "crates/hepta-peer-attestation/**"
      - "crates/hepta-browser-actor/**"
      - "contracts/d3-session-engine-runner.v1.json"
      - "docs/architecture/D3_SESSION_ENGINE_RUNNER.md"
      - "tests/test_d3_session_engine_runner.py"
      - "tools/verify_receipt_journal.py"
      - "crates/hepta-d3-development/**"
      - "crates/hepta-browser-actor/**"
      - ".github/workflows/d3-integrated-runtime-evidence.yml"
      - "contracts/d3-integrated-runtime-evidence.v1.json"
      - "tools/verify_d3_integrated_runtime_evidence.py"
      - "tools/d3_integrated_runtime_common.py"
      - "tools/d3_integrated_runtime_verify.py"
      - "tools/d3_integrated_runtime_fixture.py"
      - "tools/trusted_app_bundle.py"
      - "tests/d3/test_d3_integrated_runtime_evidence.py"
      - "tests/test_validator_loader_stability.py"
      - "tools/validate_project_truth.py"
      - "tools/validate_d3_development_profile.py"
      - "tools/_validate_d3_development_profile_impl.py"
      - "tests/test_validate_d3_development_profile.py"
      - "tests/test_validate_project_truth.py"
      - "tools/validate_governance_integrity.py"
      - "tools/validate_repository.py"
      - "Makefile"
      - "docs/architecture/D3_INTEGRATED_RUNTIME_QUALIFICATION.md"
  push:
    branches: [main, "codex/**"]
    paths:
      - "docs/architecture/D3_CALLBACK_SERVICE_RUNNER.md"
      - "contracts/d3-callback-service-runner.v1.json"
      - "tests/test_callback_service_runner.py"
      - "tools/audit_callback_service.py"
      - "crates/hepta-d3-development/src/sessiond/callback_runner.rs"
      - "crates/hepta-d3-development/src/sessiond/callback_runner_tests.rs"
      - "crates/hepta-browser-actor/src/engine_dispatch/immediate_callbacks.rs"
      - "docs/architecture/EVENT_LOOP_COMPLETION.md"
      - "contracts/event-loop-completion.v1.json"
      - "tests/test_event_loop_completion.py"
      - "tools/audit_event_loop_completion.py"
      - "crates/hepta-browser-actor/src/engine_dispatch/event_loop.rs"
      - "crates/hepta-browser-actor/src/engine_dispatch/event_loop_tests.rs"
      - "crates/hepta-browser-actor/src/engine_dispatch/event_loop_transport_tests.rs"
      - "docs/architecture/SESSION_INCARNATION.md"
      - "contracts/session-incarnation.v1.json"
      - "tests/test_session_incarnation.py"
      - "docs/architecture/REQUEST_PEER_CUSTODY.md"
      - "contracts/request-peer-custody.v1.json"
      - "tests/test_request_peer_custody.py"
      - "crates/hepta-peer-attestation/**"
      - "crates/hepta-browser-actor/**"
      - "contracts/d3-session-engine-runner.v1.json"
      - "docs/architecture/D3_SESSION_ENGINE_RUNNER.md"
      - "tests/test_d3_session_engine_runner.py"
      - "tools/verify_receipt_journal.py"
      - "crates/hepta-d3-development/**"
      - "crates/hepta-browser-actor/**"
      - ".github/workflows/d3-integrated-runtime-evidence.yml"
      - "contracts/d3-integrated-runtime-evidence.v1.json"
      - "tools/verify_d3_integrated_runtime_evidence.py"
      - "tools/d3_integrated_runtime_common.py"
      - "tools/d3_integrated_runtime_verify.py"
      - "tools/d3_integrated_runtime_fixture.py"
      - "tools/trusted_app_bundle.py"
      - "tests/d3/test_d3_integrated_runtime_evidence.py"
      - "tests/test_validator_loader_stability.py"
      - "tools/validate_project_truth.py"
      - "tools/validate_d3_development_profile.py"
      - "tools/_validate_d3_development_profile_impl.py"
      - "tests/test_validate_d3_development_profile.py"
      - "tests/test_validate_project_truth.py"
      - "tools/validate_governance_integrity.py"
      - "tools/validate_repository.py"
      - "Makefile"
      - "docs/architecture/D3_INTEGRATED_RUNTIME_QUALIFICATION.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d3-integrated-runtime-evidence-verifier-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-verifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Compile verifier and tests
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/verify_d3_integrated_runtime_evidence.py \
            tools/d3_integrated_runtime_common.py \
            tools/d3_integrated_runtime_verify.py \
            tools/d3_integrated_runtime_fixture.py \
            tests/d3/test_d3_integrated_runtime_evidence.py \
            tests/test_validator_loader_stability.py \
            tools/validate_d3_development_profile.py \
            tests/test_validate_d3_development_profile.py \
            tools/validate_project_truth.py \
            tests/test_validate_project_truth.py

      - name: Run adversarial verifier and loader corpus
        run: |
          set -euo pipefail
          python3 -m unittest tests.d3.test_d3_integrated_runtime_evidence -v
          python3 -m unittest tests.test_validator_loader_stability -v
          python3 -m unittest tests.test_validate_d3_development_profile -v
          python3 -m unittest tests.test_d3_session_engine_runner -v
          python3 -m unittest tests.test_callback_service_runner -v
          python3 -m unittest tests.test_request_peer_custody -v

      - name: Require deterministic source-only self-test
        run: |
          set -euo pipefail
          python3 tools/verify_d3_integrated_runtime_evidence.py \
            --self-test --write-result /tmp/d3-verifier-a.json \
            >/tmp/d3-verifier-a.stdout
          python3 tools/verify_d3_integrated_runtime_evidence.py \
            --self-test --write-result /tmp/d3-verifier-b.json \
            >/tmp/d3-verifier-b.stdout
          cmp /tmp/d3-verifier-a.json /tmp/d3-verifier-b.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('/tmp/d3-verifier-a.json').read_text())
          assert result['status'] == 'PASS_SOURCE_VERIFIER_ONLY'
          assert result['promotion_eligible'] is False
          assert result['promotion_authoritative'] is False
          assert result['product_agent_port_enabled'] is False
          assert result['external_effect_authority'] is False
          assert result['hardware_qualified'] is False
          assert result['release_ready'] is False
          PY

      - name: Validate repository and truth ceilings
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 tools/validate_governance_integrity.py
          python3 tools/validate_module_documentation.py
          python3 tools/validate_d3_development_profile.py
