name: Self-hosted ROG and Pocket4 availability

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this bounded runner probe is being requested
        required: false
        default: operator-check
        type: string

# Connectivity only. No checkout, token, qualification, evidence promotion, or
# release operation is permitted.
permissions: {}

jobs:
  rog:
    name: ROG runner probe
    runs-on: [self-hosted, linux, x64, rog]
    timeout-minutes: 10
    steps:
      - name: Verify trusted manual main invocation on ROG
        shell: bash
        env:
          LC_ALL: C
          PROBE_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$RUNNER_NAME" = rog
          test "${#PROBE_REASON}" -le 512
          printf 'runner=%q\nos=%q\narch=%q\nref=%q\nreason=%q\n' \
            "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" "$GITHUB_REF" \
            "$PROBE_REASON"
      - name: Read-only browser snapshot
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version || true
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            google-chrome-stable --version || true
          elif command -v chromium >/dev/null 2>&1; then
            chromium --version || true
          elif command -v chromium-browser >/dev/null 2>&1; then
            chromium-browser --version || true
          fi

  pocket4:
    name: Pocket4 runner probe
    runs-on: [self-hosted, linux, x64, pocket4]
    timeout-minutes: 10
    steps:
      - name: Verify trusted manual main invocation on Pocket4
        shell: bash
        env:
          LC_ALL: C
          PROBE_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$RUNNER_NAME" = pocket4
          test "${#PROBE_REASON}" -le 512
          printf 'runner=%q\nos=%q\narch=%q\nref=%q\nreason=%q\n' \
            "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH" "$GITHUB_REF" \
            "$PROBE_REASON"
      - name: Read-only host snapshot
        shell: bash
        run: |
          set -euo pipefail
          uname -a
