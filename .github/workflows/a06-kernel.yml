name: A06 exact kernel scheduler and QEMU tests

# Keep an exact A06 receipt on current-main A02 candidates.

on:
  pull_request:
    paths:
      - "kernel/asterinas/**"
      - "libs/os-abi/**"
      - "libs/os-control/**"
      - "support/build/kernel.sh"
      - "support/build/verify-source.py"
      - "support/build/minimal/**"
      - "support/build/minimal.mk"
      - "support/build/check-boot.py"
      - "support/build/record-qemu.py"
      - "support/build/ktest/**"
      - "support/build/prepare-host.sh"
      - "support/upstream-lock.json"
      - "tests/kernel/control/**"
      - "tests/organ_backend/**"
      - ".github/workflows/a06-kernel.yml"
  push:
    branches: [main]
    paths:
      - "kernel/asterinas/**"
      - "libs/os-abi/**"
      - "libs/os-control/**"
      - "support/build/kernel.sh"
      - "support/build/verify-source.py"
      - "support/build/minimal/**"
      - "support/build/minimal.mk"
      - "support/build/check-boot.py"
      - "support/build/record-qemu.py"
      - "support/build/ktest/**"
      - "support/build/prepare-host.sh"
      - "support/upstream-lock.json"
      - "tests/kernel/control/**"
      - "tests/organ_backend/**"
      - ".github/workflows/a06-kernel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-kernel-ktest:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install disposable kernel-test host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git python3 pkg-config libssl-dev \
            clang lld qemu-system-x86 busybox-static

      - name: Install pinned Rust toolchain and verify VDSO input
        shell: bash
        run: |
          set -euo pipefail
          bash support/build/prepare-host.sh

      - name: Prepare fixed OSDK test locks
        shell: bash
        run: |
          set -euo pipefail
          prepared="${RUNNER_TEMP}/a06-prepared-locks"
          python3 -I support/build/ktest/prepare-locks.py --output-dir "$prepared"
          cmp "$prepared/ostd.Cargo.lock" support/build/ktest/locks/ostd.Cargo.lock
          cmp "$prepared/aster-core.Cargo.lock" support/build/ktest/locks/aster-core.Cargo.lock

      - name: Run complete OSTD and aster-core kernel tests in real QEMU
        id: ktest
        shell: bash
        env:
          A01_KTEST_TIMEOUT: "300"
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/a06-ktest"
          mkdir -p "${RUNNER_TEMP}"
          python3 -I support/build/ktest/run.py --output "$out"
          test -f "$out/result.json"
          python3 - "$out/result.json" <<'PY'
          import json
          import sys
          report = json.load(open(sys.argv[1]))
          if report.get("passed") is not True:
              raise SystemExit("A06 ktest report is not passed")
          crates = report.get("crates")
          if not isinstance(crates, list) or len(crates) != 2:
              raise SystemExit("A06 ktest report does not contain both required crates")
          seen = set()
          for item in crates:
              if item.get("passed") is not True or not item.get("guests"):
                  raise SystemExit(f"A06 ktest crate is incomplete: {item!r}")
              seen.update(guest.get("crate") for guest in item["guests"])
          if seen != {"ostd", "aster-core"}:
              raise SystemExit(f"A06 ktest guest crate set is incomplete: {seen!r}")
          PY

      - name: Build ordinary G1 product and verify QueryAbi with all four disabled operations
        shell: bash
        run: |
          set -euo pipefail
          python3 -I tests/kernel/control/run_queryabi_candidate_guest.py \
            --expected-source-head "$(git rev-parse HEAD)" \
            --expected-source-tree "$(git rev-parse HEAD^{tree})" \
            --target-dir "${RUNNER_TEMP}/a06-target" \
            --output "${RUNNER_TEMP}/a06-queryabi-candidate"

      - name: Build exact A06 SMP=2 candidate kernel
        shell: bash
        env:
          A01_SMP: "2"
          A01_RUN_DIR: ${{ runner.temp }}/a06-kernel-build
          CARGO_TARGET_DIR: ${{ runner.temp }}/a06-target
        run: |
          set -euo pipefail
          bash support/build/kernel.sh kernel
          # The raw Cargo ELF is not QEMU-loadable for the multiboot protocol.
          # OSDK's bundle step emits a .elf copy and rewrites its machine field to
          # EM_386 (the QEMU multiboot loader requires that marker for x86_64 guests).
          kernel="${CARGO_TARGET_DIR}/osdk/asterinas/asterinas-osdk-bin.elf"
          test -f "$kernel" && test -x "$kernel"
          readelf -h "$kernel" | grep -Eq 'Class:[[:space:]]+ELF64'
          readelf -h "$kernel" | grep -Eq 'Machine:[[:space:]]+Intel 80386'
          sha256sum "$kernel" | tee "${RUNNER_TEMP}/a06-kernel.sha256"

      - name: Run bounded one-vCPU quota and two-vCPU exit-lifecycle probes
        shell: bash
        env:
          KERNEL: ${{ runner.temp }}/a06-target/osdk/asterinas/asterinas-osdk-bin.elf
        run: |
          set -euo pipefail
          sha=$(cut -d' ' -f1 "${RUNNER_TEMP}/a06-kernel.sha256")
          python3 tests/organ_backend/run_candidate_matrix.py \
            --a01-tree "$GITHUB_WORKSPACE" --kernel "$KERNEL" --expected-sha256 "$sha" \
            --out "${RUNNER_TEMP}/a06-probe-1vcpu" --quota-us 1000 --mode leaf \
            --repeat 2 --duration-seconds 1 --max-cpu-percent 3
          python3 tests/organ_backend/smp2/run_parallel_candidate.py \
            --a01-tree "$GITHUB_WORKSPACE" --kernel "$KERNEL" --expected-sha256 "$sha" \
            --out "${RUNNER_TEMP}/a06-probe-2vcpu" --quota-us 1000 --mode leaf \
            --repeat 2 --duration-seconds 1 --max-cpu-percent 3

      - name: Upload exact A06 kernel and raw QEMU evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: a06-exact-kernel-ktest-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/a06-ktest
            ${{ runner.temp }}/a06-prepared-locks
            ${{ runner.temp }}/a06-queryabi-candidate
            ${{ runner.temp }}/a06-kernel-build
            ${{ runner.temp }}/a06-probe-1vcpu
            ${{ runner.temp }}/a06-probe-2vcpu
            ${{ runner.temp }}/a06-kernel.sha256
            ${{ runner.temp }}/a06-target/osdk/asterinas/asterinas-osdk-bin.elf
            kernel/asterinas/target/osdk/aster-core/aster-core-osdk-bin.elf
            kernel/asterinas/target/osdk/ostd/ostd-osdk-bin.elf
            support/build/ktest/locks
          if-no-files-found: error
