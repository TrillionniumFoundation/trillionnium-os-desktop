name: A06 exact kernel scheduler and QEMU tests

# Keep an exact A06 receipt on current-main A02 candidates.

on:
  pull_request:
    paths:
      - "kernel/asterinas/**"
      - "libs/os-abi/**"
      - "libs/os-control/**"
      - "compat/linux/**"
      - "support/rootfs/**"
      - "support/build/kernel.sh"
      - "support/build/verify-source.py"
      - "support/build/minimal/**"
      - "support/build/minimal.mk"
      - "support/build/check-boot.py"
      - "support/build/record-qemu.py"
      - "support/build/ktest/**"
      - "support/build/prepare-host.sh"
      - "support/upstream-lock.json"
      - "tests/kernel/control/**"
      - "tests/organ_backend/**"
      - "tests/workloads/linux/**"
      - "tests/integration/hepta/run_original_agentd.py"
      - ".github/workflows/a06-kernel.yml"
  push:
    branches: [main]
    paths:
      - "kernel/asterinas/**"
      - "libs/os-abi/**"
      - "libs/os-control/**"
      - "compat/linux/**"
      - "support/rootfs/**"
      - "support/build/kernel.sh"
      - "support/build/verify-source.py"
      - "support/build/minimal/**"
      - "support/build/minimal.mk"
      - "support/build/check-boot.py"
      - "support/build/record-qemu.py"
      - "support/build/ktest/**"
      - "support/build/prepare-host.sh"
      - "support/upstream-lock.json"
      - "tests/kernel/control/**"
      - "tests/organ_backend/**"
      - "tests/workloads/linux/**"
      - "tests/integration/hepta/run_original_agentd.py"
      - ".github/workflows/a06-kernel.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-kernel-ktest:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install disposable kernel-test host dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git python3 pkg-config libssl-dev \
            clang lld qemu-system-x86 busybox-static \
            gcc-13 libc6-dev binutils libsqlite3-dev python3.12 python3.12-minimal \
            libpython3.12-stdlib openssl tzdata

      - name: Freeze the permission probe and verify it in an isolated Linux mount namespace
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/a04-permission-build"
          mkdir "$out"
          python3 -I -B -m unittest discover -s tests/workloads/linux -p 'test_permission_guest.py' -v \
            > "$out/runner-tests.log" 2>&1
          python3 -I -B -O -m unittest discover -s tests/workloads/linux -p 'test_permission_guest.py' -v \
            > "$out/runner-tests-optimized.log" 2>&1
          cc --version > "$out/compiler-version.txt"
          uname -a > "$out/linux-version.txt"
          cc -O2 -std=c11 -Wall -Wextra -Werror -static \
            tests/workloads/linux/permission_probe.c -o "$out/probe.elf" \
            > "$out/compile.log" 2>&1
          sha256sum tests/workloads/linux/permission_probe.c "$out/probe.elf" > "$out/inputs.sha256"
          sha256sum "$out/probe.elf" > "$out/probe.sha256"
          probe_sha=$(cut -d' ' -f1 "$out/probe.sha256")
          # The probe creates a private mount namespace before any mount change;
          # it never changes the runner's own mounts. Each credential case forks.
          set +e
          sudo python3 -I -B tests/workloads/linux/run_permission_guest.py reference \
            --probe-elf "$out/probe.elf" --expected-probe-sha256 "$probe_sha" \
            --output "${RUNNER_TEMP}/a04-permission-linux"
          reference_exit=$?
          set -e
          # Restore only this fresh evidence directory to the runner, including
          # on failure, so guest verification and always-upload can read raw data.
          if test -d "${RUNNER_TEMP}/a04-permission-linux"; then
            sudo chown -R -- "$(id -u):$(id -g)" "${RUNNER_TEMP}/a04-permission-linux"
          fi
          test "$reference_exit" -eq 0
          sha256sum --check "$out/probe.sha256"

      - name: Install pinned Rust toolchain and verify VDSO input
        shell: bash
        run: |
          set -euo pipefail
          bash support/build/prepare-host.sh

      - name: Prepare fixed OSDK test locks
        shell: bash
        run: |
          set -euo pipefail
          prepared="${RUNNER_TEMP}/a06-prepared-locks"
          python3 -I support/build/ktest/prepare-locks.py --output-dir "$prepared"
          cmp "$prepared/ostd.Cargo.lock" support/build/ktest/locks/ostd.Cargo.lock
          cmp "$prepared/aster-core.Cargo.lock" support/build/ktest/locks/aster-core.Cargo.lock

      - name: Run complete OSTD and aster-core kernel tests in real QEMU
        id: ktest
        shell: bash
        env:
          A01_KTEST_TIMEOUT: "300"
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/a06-ktest"
          mkdir -p "${RUNNER_TEMP}"
          python3 -I support/build/ktest/run.py --output "$out"
          test -f "$out/result.json"
          python3 - "$out/result.json" <<'PY'
          import json
          import sys
          report = json.load(open(sys.argv[1]))
          if report.get("passed") is not True:
              raise SystemExit("A06 ktest report is not passed")
          crates = report.get("crates")
          if not isinstance(crates, list) or len(crates) != 2:
              raise SystemExit("A06 ktest report does not contain both required crates")
          seen = set()
          for item in crates:
              if item.get("passed") is not True or not item.get("guests"):
                  raise SystemExit(f"A06 ktest crate is incomplete: {item!r}")
              seen.update(guest.get("crate") for guest in item["guests"])
          if seen != {"ostd", "aster-core"}:
              raise SystemExit(f"A06 ktest guest crate set is incomplete: {seen!r}")
          PY

      - name: Prove the CPU owner regression fails under the frozen old behavior
        shell: bash
        env:
          A01_KTEST_TIMEOUT: "300"
        run: |
          set -euo pipefail
          python3 -I -B tests/organ_backend/test_cpu_owner_negative.py
          python3 -I -B tests/organ_backend/run_cpu_owner_negative.py \
            --green-evidence "${RUNNER_TEMP}/a06-ktest" \
            --worktree "${RUNNER_TEMP}/a06-owner-negative-source" \
            --output "${RUNNER_TEMP}/a06-owner-negative"

      - name: Prove paired-clock and scheduler-handoff regressions reject six frozen defects
        shell: bash
        env:
          A01_KTEST_TIMEOUT: "300"
        run: |
          set -euo pipefail
          for control in clocksource-drop-fraction vdso-drop-fraction vdso-skip-fault-mode \
              handoff-drop-tail handoff-eligibility-first dequeue-drop-owner; do
            # The first mutation rebuilt the original shared OSDK target.
            # Every later control verifies the saved green ELF against the
            # original successful QEMU record before changing any source.
            python3 -I -B tests/organ_backend/run_cpu_owner_negative.py \
              --control "$control" \
              --green-evidence "${RUNNER_TEMP}/a06-ktest" \
              --green-kernel "${RUNNER_TEMP}/a06-owner-negative/green-core-kernel.elf" \
              --worktree "${RUNNER_TEMP}/a06-clock-handoff-source-$control" \
              --output "${RUNNER_TEMP}/a06-clock-handoff-negative/$control"
          done

      - name: Freeze one SCM_RIGHTS probe and verify all 27 cases on original Linux
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/a04-scm-linux"
          mkdir "$out"
          python3 -I -B -m unittest discover -s tests/workloads/linux -p 'test_scm_rights_cloexec_guest.py' -v \
            > "$out/runner-tests.log" 2>&1
          python3 -I -B -O -m unittest discover -s tests/workloads/linux -p 'test_scm_rights_cloexec_guest.py' -v \
            > "$out/runner-tests-optimized.log" 2>&1
          cc --version > "$out/compiler-version.txt"
          uname -a > "$out/linux-version.txt"
          cc -O2 -std=c11 -Wall -Wextra -Werror -static \
            tests/workloads/linux/scm_rights_cloexec_probe.c -o "$out/probe.elf" \
            > "$out/compile.log" 2>&1
          sha256sum tests/workloads/linux/scm_rights_cloexec_probe.c "$out/probe.elf" > "$out/inputs.sha256"
          sha256sum "$out/probe.elf" > "$out/probe.sha256"
          set +e
          "$out/probe.elf" > "$out/stdout.log" 2> "$out/stderr.log"
          probe_exit=$?
          set -e
          printf '%s\n' "$probe_exit" > "$out/exit-code.txt"
          test "$probe_exit" -eq 0
          test ! -s "$out/stderr.log"
          sha256sum --check "$out/probe.sha256"
          python3 -I -B - "$out/stdout.log" <<'PY'
          import importlib.util
          from pathlib import Path
          import sys
          source = Path('tests/workloads/linux/run_scm_rights_cloexec_guest.py').resolve()
          spec = importlib.util.spec_from_file_location('scm', source)
          scm = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(scm)
          expected = [f'SCM_CLOEXEC_CASE name={name} result=PASS line=0' for name in scm.CASE_ORDER]
          expected.append(scm.COMPLETE)
          if Path(sys.argv[1]).read_text().splitlines() != expected:
              raise SystemExit('Linux SCM_RIGHTS reference is incomplete or differs')
          PY

      - name: Freeze one RLIMIT_NOFILE probe and verify all 37 cases on original Linux
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/a04-nofile-build"
          mkdir "$out"
          python3 -I -B -m unittest discover -s tests/workloads/linux -p 'test_rlimit_nofile_guest.py' -v \
            > "$out/runner-tests.log" 2>&1
          python3 -I -B -O -m unittest discover -s tests/workloads/linux -p 'test_rlimit_nofile_guest.py' -v \
            > "$out/runner-tests-optimized.log" 2>&1
          cc --version > "$out/compiler-version.txt"
          uname -a > "$out/linux-version.txt"
          cc -O2 -std=c11 -Wall -Wextra -Werror -static -pthread \
            tests/workloads/linux/rlimit_nofile_probe.c -o "$out/probe.elf" \
            > "$out/compile.log" 2>&1
          sha256sum tests/workloads/linux/rlimit_nofile_probe.c "$out/probe.elf" > "$out/inputs.sha256"
          sha256sum "$out/probe.elf" > "$out/probe.sha256"
          probe_sha=$(cut -d' ' -f1 "$out/probe.sha256")
          python3 -I -B tests/workloads/linux/run_rlimit_nofile_guest.py reference \
            --probe-elf "$out/probe.elf" --expected-probe-sha256 "$probe_sha" \
            --output "${RUNNER_TEMP}/a04-nofile-linux"
          sha256sum --check "$out/probe.sha256"

      - name: Verify complete Ubuntu full32 runner negative controls
        shell: bash
        run: |
          set -euo pipefail
          checks="${RUNNER_TEMP}/a04-full-checks"
          mkdir "$checks"
          /usr/bin/python3.12 -I -B tests/workloads/linux/test_full_ubuntu_profile.py \
            > "$checks/runner-tests.log" 2>&1
          /usr/bin/python3.12 -I -B -O tests/workloads/linux/test_full_ubuntu_profile.py \
            > "$checks/runner-tests-optimized.log" 2>&1

      - name: Build and freeze the complete Ubuntu full32 workload image
        id: a04_full_bundle
        shell: bash
        run: |
          set -euo pipefail
          checks="${RUNNER_TEMP}/a04-full-checks"
          bundle="${RUNNER_TEMP}/a04-full-bundle"
          source_head=$(git rev-parse HEAD)
          source_tree=$(git rev-parse HEAD^{tree})
          cargo +nightly-2026-07-21 fetch --locked \
            --manifest-path tests/workloads/linux/rust/Cargo.toml \
            > "$checks/cargo-fetch.log" 2>&1
          /usr/bin/python3.12 -I -B tests/workloads/linux/run_full_ubuntu_profile.py build \
            --a01-initramfs support/build/evidence/2026-10-16/artifacts/initramfs.cpio.gz \
            --qemu /usr/bin/qemu-system-x86_64 \
            --expected-source-head "$source_head" --expected-source-tree "$source_tree" \
            --output "$bundle" \
            > "$checks/build-stage.stdout.log" 2> "$checks/build-stage.stderr.log"
          (
            cd "$bundle"
            sha256sum --check inputs.sha256
          )
          # This is the sole digest file, written by build before any workload.
          # Freeze its value as a step output; later stages never replace it
          # with a digest newly computed after the Linux or kernel execution.
          read -r input_sha input_name < "$bundle/inputs.sha256"
          test "$input_name" = inputs.json
          [[ "$input_sha" =~ ^[0-9a-f]{64}$ ]]
          printf 'source_head=%s\nsource_tree=%s\ninput_sha256=%s\n' \
            "$source_head" "$source_tree" "$input_sha" >> "$GITHUB_OUTPUT"

      - name: Run all 32 original Linux cases from the frozen Ubuntu image
        shell: bash
        env:
          A04_FULL_INPUT_SHA: ${{ steps.a04_full_bundle.outputs.input_sha256 }}
        run: |
          set -euo pipefail
          checks="${RUNNER_TEMP}/a04-full-checks"
          # Root is used only for this disposable, unmounted chroot. Each
          # workload runs as UID/GID 65534 with maintained process-group cleanup.
          sudo /usr/bin/python3.12 -I -B tests/workloads/linux/run_full_ubuntu_profile.py reference \
            --bundle "${RUNNER_TEMP}/a04-full-bundle" \
            --expected-input-sha256 "$A04_FULL_INPUT_SHA" \
            --output "${RUNNER_TEMP}/a04-full-linux" \
            > "$checks/reference-stage.stdout.log" 2> "$checks/reference-stage.stderr.log"

      - name: Build ordinary G1 product and verify QueryAbi with all four disabled operations
        shell: bash
        run: |
          set -euo pipefail
          python3 -I tests/kernel/control/run_queryabi_candidate_guest.py \
            --expected-source-head "$(git rev-parse HEAD)" \
            --expected-source-tree "$(git rev-parse HEAD^{tree})" \
            --target-dir "${RUNNER_TEMP}/a06-target" \
            --output "${RUNNER_TEMP}/a06-queryabi-candidate"

      - name: Verify the same permission ELF on the exact ordinary kernel
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check "${RUNNER_TEMP}/a04-permission-build/probe.sha256"
          probe_sha=$(cut -d' ' -f1 "${RUNNER_TEMP}/a04-permission-build/probe.sha256")
          python3 -I -B tests/workloads/linux/run_permission_guest.py guest \
            --linux-reference "${RUNNER_TEMP}/a04-permission-linux" \
            --expected-probe-sha256 "$probe_sha" \
            --product-evidence "${RUNNER_TEMP}/a06-queryabi-candidate" \
            --expected-source-head "$(git rev-parse HEAD)" \
            --expected-source-tree "$(git rev-parse HEAD^{tree})" \
            --a01-initramfs support/build/evidence/2026-10-16/artifacts/initramfs.cpio.gz \
            --output "${RUNNER_TEMP}/a04-permission-guest"

      - name: Verify the same SCM_RIGHTS ELF on the exact ordinary kernel
        shell: bash
        run: |
          set -euo pipefail
          probe="${RUNNER_TEMP}/a04-scm-linux/probe.elf"
          # Reuse the digest frozen before the Linux run; never approve a
          # potentially different ELF by hashing it again after kernel build.
          sha256sum --check "${RUNNER_TEMP}/a04-scm-linux/probe.sha256"
          probe_sha=$(cut -d' ' -f1 "${RUNNER_TEMP}/a04-scm-linux/probe.sha256")
          python3 -I -B tests/workloads/linux/run_scm_rights_cloexec_guest.py \
            --product-evidence "${RUNNER_TEMP}/a06-queryabi-candidate" \
            --expected-source-head "$(git rev-parse HEAD)" \
            --expected-source-tree "$(git rev-parse HEAD^{tree})" \
            --probe-elf "$probe" --expected-probe-sha256 "$probe_sha" \
            --a01-initramfs support/build/evidence/2026-10-16/artifacts/initramfs.cpio.gz \
            --output "${RUNNER_TEMP}/a04-scm-guest"

      - name: Verify the same RLIMIT_NOFILE ELF on the exact ordinary kernel
        shell: bash
        run: |
          set -euo pipefail
          # The reference executes a private copy and records its actual exit.
          # The guest consumes that validated copy and the original frozen hash.
          sha256sum --check "${RUNNER_TEMP}/a04-nofile-build/probe.sha256"
          probe_sha=$(cut -d' ' -f1 "${RUNNER_TEMP}/a04-nofile-build/probe.sha256")
          python3 -I -B tests/workloads/linux/run_rlimit_nofile_guest.py guest \
            --linux-reference "${RUNNER_TEMP}/a04-nofile-linux" \
            --expected-probe-sha256 "$probe_sha" \
            --product-evidence "${RUNNER_TEMP}/a06-queryabi-candidate" \
            --expected-source-head "$(git rev-parse HEAD)" \
            --expected-source-tree "$(git rev-parse HEAD^{tree})" \
            --a01-initramfs support/build/evidence/2026-10-16/artifacts/initramfs.cpio.gz \
            --output "${RUNNER_TEMP}/a04-nofile-guest"

      - name: Verify local CPU settlement with fixed ordinary-kernel timing criteria
        shell: bash
        run: |
          set -euo pipefail
          checks="${RUNNER_TEMP}/a06-cpu-config-checks"
          mkdir "$checks"
          python3 -B -m unittest discover -s tests/organ_backend -p 'test_cpu_config_settlement.py' -v \
            > "$checks/runner-tests.log" 2>&1
          python3 -B -O -m unittest discover -s tests/organ_backend -p 'test_cpu_config_settlement.py' -v \
            > "$checks/runner-tests-optimized.log" 2>&1
          kernel="${RUNNER_TEMP}/a06-queryabi-candidate/product-kernel.elf"
          kernel_sha=$(python3 -I -B -c 'import json,sys; print(json.load(open(sys.argv[1]))["kernel_elf_sha256"])' \
            "${RUNNER_TEMP}/a06-queryabi-candidate/result.json")
          for period in 100000 2000; do
            for mode in read-only same-value; do
              python3 -B tests/organ_backend/run_cpu_config_settlement.py \
                --kernel "$kernel" --expected-sha256 "$kernel_sha" \
                --initramfs support/build/evidence/2026-10-16/artifacts/initramfs.cpio.gz \
                --bios /usr/share/seabios/bios-256k.bin --qemu /usr/bin/qemu-system-x86_64 \
                --out "${RUNNER_TEMP}/a06-cpu-config-${period}-${mode}" \
                --period-us "$period" --mode "$mode"
            done
          done

      - name: Verify all 32 Ubuntu cases on the same ordinary kernel and frozen image
        shell: bash
        env:
          A04_FULL_INPUT_SHA: ${{ steps.a04_full_bundle.outputs.input_sha256 }}
          A04_FULL_SOURCE_HEAD: ${{ steps.a04_full_bundle.outputs.source_head }}
          A04_FULL_SOURCE_TREE: ${{ steps.a04_full_bundle.outputs.source_tree }}
        run: |
          set -euo pipefail
          checks="${RUNNER_TEMP}/a04-full-checks"
          /usr/bin/python3.12 -I -B tests/workloads/linux/run_full_ubuntu_profile.py guest \
            --bundle "${RUNNER_TEMP}/a04-full-bundle" \
            --expected-input-sha256 "$A04_FULL_INPUT_SHA" \
            --linux-reference "${RUNNER_TEMP}/a04-full-linux" \
            --product-evidence "${RUNNER_TEMP}/a06-queryabi-candidate" \
            --expected-source-head "$A04_FULL_SOURCE_HEAD" \
            --expected-source-tree "$A04_FULL_SOURCE_TREE" \
            --bios /usr/share/seabios/bios-256k.bin --qemu /usr/bin/qemu-system-x86_64 \
            --output "${RUNNER_TEMP}/a04-full-guest" \
            > "$checks/guest-stage.stdout.log" 2> "$checks/guest-stage.stderr.log"

      - name: Build exact A06 SMP=2 candidate kernel
        shell: bash
        env:
          A01_SMP: "2"
          A01_RUN_DIR: ${{ runner.temp }}/a06-kernel-build
          CARGO_TARGET_DIR: ${{ runner.temp }}/a06-target
        run: |
          set -euo pipefail
          bash support/build/kernel.sh kernel
          # The raw Cargo ELF is not QEMU-loadable for the multiboot protocol.
          # OSDK's bundle step emits a .elf copy and rewrites its machine field to
          # EM_386 (the QEMU multiboot loader requires that marker for x86_64 guests).
          kernel="${CARGO_TARGET_DIR}/osdk/asterinas/asterinas-osdk-bin.elf"
          test -f "$kernel" && test -x "$kernel"
          readelf -h "$kernel" | grep -Eq 'Class:[[:space:]]+ELF64'
          readelf -h "$kernel" | grep -Eq 'Machine:[[:space:]]+Intel 80386'
          sha256sum "$kernel" | tee "${RUNNER_TEMP}/a06-kernel.sha256"

      - name: Run bounded one-vCPU quota and two-vCPU exit-lifecycle probes
        shell: bash
        env:
          KERNEL: ${{ runner.temp }}/a06-target/osdk/asterinas/asterinas-osdk-bin.elf
        run: |
          set -euo pipefail
          sha=$(cut -d' ' -f1 "${RUNNER_TEMP}/a06-kernel.sha256")
          python3 tests/organ_backend/run_candidate_matrix.py \
            --a01-tree "$GITHUB_WORKSPACE" --kernel "$KERNEL" --expected-sha256 "$sha" \
            --out "${RUNNER_TEMP}/a06-probe-1vcpu" --quota-us 1000 --mode leaf \
            --repeat 2 --duration-seconds 1 --max-cpu-percent 3
          python3 tests/organ_backend/smp2/run_parallel_candidate.py \
            --a01-tree "$GITHUB_WORKSPACE" --kernel "$KERNEL" --expected-sha256 "$sha" \
            --out "${RUNNER_TEMP}/a06-probe-2vcpu" --quota-us 1000 --mode leaf \
            --repeat 2 --duration-seconds 1 --max-cpu-percent 3

      - name: Upload exact A06 kernel and raw QEMU evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: a06-exact-kernel-ktest-${{ github.run_id }}
          # The full32 bundle retains every frozen input, all five workload
          # ELFs, runtime/image bytes and build logs. Only its regenerable Cargo
          # target cache is excluded; failed stage evidence remains included.
          path: |
            ${{ runner.temp }}/a06-ktest
            ${{ runner.temp }}/a06-prepared-locks
            ${{ runner.temp }}/a06-queryabi-candidate
            ${{ runner.temp }}/a06-owner-negative
            ${{ runner.temp }}/a06-clock-handoff-negative
            ${{ runner.temp }}/a06-owner-negative-source/kernel/asterinas/target/osdk/aster-core/aster-core-osdk-bin.elf
            ${{ runner.temp }}/a04-scm-linux
            ${{ runner.temp }}/a04-scm-guest
            ${{ runner.temp }}/a04-nofile-build
            ${{ runner.temp }}/a04-nofile-linux
            ${{ runner.temp }}/a04-nofile-guest
            ${{ runner.temp }}/a04-permission-build
            ${{ runner.temp }}/a04-permission-linux
            ${{ runner.temp }}/a04-permission-guest
            ${{ runner.temp }}/a04-full-checks
            ${{ runner.temp }}/a04-full-bundle
            ${{ runner.temp }}/a04-full-linux
            ${{ runner.temp }}/a04-full-guest
            !${{ runner.temp }}/a04-full-bundle/build/cargo-target/**
            ${{ runner.temp }}/a06-cpu-config-*
            ${{ runner.temp }}/a06-kernel-build
            ${{ runner.temp }}/a06-probe-1vcpu
            ${{ runner.temp }}/a06-probe-2vcpu
            ${{ runner.temp }}/a06-kernel.sha256
            ${{ runner.temp }}/a06-target/osdk/asterinas/asterinas-osdk-bin.elf
            kernel/asterinas/target/osdk/aster-core/aster-core-osdk-bin.elf
            kernel/asterinas/target/osdk/ostd/ostd-osdk-bin.elf
            support/build/ktest/locks
          if-no-files-found: error
