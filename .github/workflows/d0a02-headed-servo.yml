name: d0a02-headed-servo

on:
  pull_request:
    paths:
      - .github/workflows/d0a02-headed-servo.yml
      - .github/scripts/apply_d0a02_teardown_fix.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out package branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/d0a02-headed-runtime-v3
          fetch-depth: 0

      - name: Restore permanent workflow definitions
        shell: bash
        run: |
          set -euo pipefail
          original=acb6e6d4628373a8d91d17d642a43cfe034f6417
          git show "${original}:.github/workflows/ci.yml" > .github/workflows/ci.yml
          git show "${original}:.github/workflows/d0a02-headed-servo.yml" > .github/workflows/d0a02-headed-servo.yml
          git show "${original}:.github/workflows/servo-headed-runtime.yml" > .github/workflows/servo-headed-runtime.yml

      - name: Apply bounded source repair
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_d0a02_teardown_fix.py
          git diff --check

      - name: Format repaired standalone sources
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt
          rustfmt +1.93.0 --edition 2024 \
            experiments/servo-headed-runtime/src/main.rs \
            runtime/servo/hepta_workspace_runtime.rs
          git diff --check

      - name: Commit repaired permanent tree
        shell: bash
        run: |
          set -euo pipefail
          git rm --ignore-unmatch \
            .github/scripts/apply_d0a02_teardown_fix.py \
            .github/workflows/apply-d0a02-teardown-fix.yml
          git config user.name "trillionnium-d0a02-repair"
          git config user.email "d0a02-repair@users.noreply.github.com"
          git add \
            .github/workflows/ci.yml \
            .github/workflows/d0a02-headed-servo.yml \
            .github/workflows/servo-headed-runtime.yml \
            experiments/servo-headed-runtime/src/main.rs \
            runtime/servo/hepta_workspace_runtime.rs
          git diff --cached --check
          git commit -m "fix(servo): shut down headed proof before closing event loop"
          git push origin HEAD:codex/d0a02-headed-runtime-v3
