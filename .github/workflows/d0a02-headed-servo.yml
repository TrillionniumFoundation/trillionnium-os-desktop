name: d0a02-headed-servo

on:
  pull_request:
    paths:
      - .github/workflows/d0a02-headed-servo.yml
      - .github/scripts/apply_d0a02_teardown_fix.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-repaired-tree:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out package branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/d0a02-headed-runtime-v3
          fetch-depth: 0

      - name: Restore permanent workflow definitions
        shell: bash
        run: |
          set -euo pipefail
          original=acb6e6d4628373a8d91d17d642a43cfe034f6417
          git show "${original}:.github/workflows/ci.yml" > .github/workflows/ci.yml
          git show "${original}:.github/workflows/d0a02-headed-servo.yml" > .github/workflows/d0a02-headed-servo.yml
          git show "${original}:.github/workflows/servo-headed-runtime.yml" > .github/workflows/servo-headed-runtime.yml

      - name: Apply bounded source repair
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_d0a02_teardown_fix.py
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt
          rustfmt +1.93.0 --edition 2024 \
            experiments/servo-headed-runtime/src/main.rs \
            runtime/servo/hepta_workspace_runtime.rs
          git diff --check

      - name: Stage exact repaired tree payload
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/d0a02-repaired-tree"
          mkdir -p \
            "$payload/.github/workflows" \
            "$payload/experiments/servo-headed-runtime/src" \
            "$payload/runtime/servo"
          cp .github/workflows/ci.yml "$payload/.github/workflows/ci.yml"
          cp .github/workflows/d0a02-headed-servo.yml \
            "$payload/.github/workflows/d0a02-headed-servo.yml"
          cp .github/workflows/servo-headed-runtime.yml \
            "$payload/.github/workflows/servo-headed-runtime.yml"
          cp experiments/servo-headed-runtime/src/main.rs \
            "$payload/experiments/servo-headed-runtime/src/main.rs"
          cp runtime/servo/hepta_workspace_runtime.rs \
            "$payload/runtime/servo/hepta_workspace_runtime.rs"
          find "$payload" -type f -print0 | sort -z | xargs -0 sha256sum \
            > "$payload/SHA256SUMS"

      - name: Upload exact repaired tree payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d0a02-repaired-tree-${{ github.sha }}
          path: ${{ runner.temp }}/d0a02-repaired-tree
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
