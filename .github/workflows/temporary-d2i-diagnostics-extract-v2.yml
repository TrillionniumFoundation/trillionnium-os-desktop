name: temporary-d2i-diagnostics-extract-v2

on:
  push:
    branches:
      - codex/d2i-diagnostics-extract-v2

permissions:
  actions: read
  contents: read

jobs:
  extract:
    runs-on: ubuntu-24.04
    steps:
      - name: Download exact failed-run diagnostics
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: 9743227783
          path: /tmp/d2i-full
          github-token: ${{ github.token }}
          repository: TrillionniumFoundation/trillionnium-os-desktop
          run-id: 33348890192

      - name: Retain bounded causal evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import hashlib
          import shutil

          source = Path('/tmp/d2i-full')
          output = Path('/tmp/d2i-bounded')
          output.mkdir(parents=True, exist_ok=True)
          manifest = []
          text_suffixes = {'.json', '.txt', '.log', '.service', '.target'}
          for path in sorted(p for p in source.rglob('*') if p.is_file()):
              rel = path.relative_to(source)
              size = path.stat().st_size
              digest = hashlib.sha256(path.read_bytes() if size <= 16 * 1024 * 1024 else b'').hexdigest() if size <= 16 * 1024 * 1024 else 'omitted-large'
              manifest.append(f'{rel}\t{size}\t{digest}')
              keep = path.suffix.lower() in text_suffixes
              keep = keep or any(token in path.name.lower() for token in ('serial', 'journal', 'diagnostic', 'failure', 'status', 'evidence'))
              keep_png = path.suffix.lower() == '.png' and size <= 12 * 1024 * 1024
              if not (keep or keep_png):
                  continue
              destination = output / rel
              destination.parent.mkdir(parents=True, exist_ok=True)
              if keep_png or size <= 8 * 1024 * 1024:
                  shutil.copy2(path, destination)
              else:
                  data = path.read_bytes()
                  marker = b'\n\n--- middle omitted by bounded extractor ---\n\n'
                  destination.write_bytes(data[:4 * 1024 * 1024] + marker + data[-4 * 1024 * 1024:])
          (output / 'artifact-manifest.tsv').write_text('\n'.join(manifest) + '\n', encoding='utf-8')
          PY
          find /tmp/d2i-bounded -type f -printf '%P\t%s\n' | sort

      - name: Upload bounded causal evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bounded-d2i-failure-${{ github.sha }}
          path: /tmp/d2i-bounded
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
          include-hidden-files: true
