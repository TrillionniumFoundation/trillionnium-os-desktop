name: temporary-d2i-apply-v3

on:
  push:
    branches:
      - codex/d2i-apply-v3-proof

permissions:
  contents: write

concurrency:
  group: temporary-d2i-apply-v3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-prove:
    runs-on: ubuntu-24.04
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out exact D2I proof branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/d2i-apply-v3-proof
          fetch-depth: 0
          persist-credentials: true

      - name: Decode and apply bounded D2I patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import lzma

          encoded = Path("tools/temporary-d2i-fix-v3.patch.xz.b85").read_text().strip()
          compressed = base64.b85decode(encoded)
          if hashlib.sha256(compressed).hexdigest() != "b1a1d1b6df372e1460644cc9fb07272c3fa07bd4450ded3019df599a0ba99e54":
              raise SystemExit("compressed D2I v3 patch digest mismatch")
          patch = lzma.decompress(compressed)
          if hashlib.sha256(patch).hexdigest() != "8cfd0197bd75b9439ab143be30daa96052603fda0bab74272fe1e8c9b2e4ca2f":
              raise SystemExit("D2I v3 patch digest mismatch")
          Path("/tmp/d2i-v3.patch").write_bytes(patch)
          PY
          git apply --check /tmp/d2i-v3.patch
          git apply --whitespace=error-all /tmp/d2i-v3.patch
          rm .github/workflows/temporary-d2i-apply-v3.yml
          rm tools/temporary-d2i-fix-v3.patch.xz.b85

      - name: Install pinned repository toolchain
        run: |
          set -euo pipefail
          channel=$(python3 - <<'PY'
          from pathlib import Path
          import tomllib
          print(tomllib.loads(Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])
          PY
          )
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustup override set "$channel"
          rustc --version --verbose
          cargo --version --verbose

      - name: Prove source truth and D2I policy
        run: |
          set -euo pipefail
          python3 tools/validate_repository.py
          python3 tools/validate_project_truth.py
          python3 tools/verify_systemd_socket_custody.py
          python3 -m unittest discover -s tests -t . -p 'test_*.py'
          python3 -m json.tool contracts/d2i-integrated-image.v1.json >/dev/null
          bash -n packaging/debian/image/d2i-overlay/usr/local/libexec/trillionnium-d2i-acceptance
          rustfmt --edition 2024 --check experiments/servo-headed-runtime/src/main.rs

      - name: Prove every repository Rust feature graph
        run: |
          set -euo pipefail
          cargo fmt --all --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-targets --all-features --locked

      - name: Publish only the proved clean D2I source tree
        run: |
          set -euo pipefail
          actual=$(git diff --name-only | sort)
          expected=$(printf '%s\n' \
            .github/workflows/temporary-d2i-apply-v3.yml \
            contracts/d2i-integrated-image.v1.json \
            experiments/servo-headed-runtime/src/main.rs \
            packaging/debian/image/d2i-overlay/etc/systemd/system/trillionnium-d2i-runtime.service \
            packaging/debian/image/d2i-overlay/usr/local/libexec/trillionnium-d2i-acceptance \
            tests/d1/test_d2i_renderer_policy.py \
            tools/temporary-d2i-fix-v3.patch.xz.b85 | sort)
          test "$actual" = "$expected"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all -- \
            .github/workflows/temporary-d2i-apply-v3.yml \
            contracts/d2i-integrated-image.v1.json \
            experiments/servo-headed-runtime/src/main.rs \
            packaging/debian/image/d2i-overlay/etc/systemd/system/trillionnium-d2i-runtime.service \
            packaging/debian/image/d2i-overlay/usr/local/libexec/trillionnium-d2i-acceptance \
            tests/d1/test_d2i_renderer_policy.py \
            tools/temporary-d2i-fix-v3.patch.xz.b85
          git commit -m "fix(d2i): constrain llvmpipe and bind image-local input evidence"
          git push origin HEAD:refs/heads/codex/d2i-apply-v3-proof
