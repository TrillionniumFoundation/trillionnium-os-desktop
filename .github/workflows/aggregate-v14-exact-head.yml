name: aggregate-v14-exact-head

on:
  push:
    branches:
      - codex/v14-publish-finalize-3c73e5a2

permissions:
  actions: read
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: aggregate-v14-exact-head
  cancel-in-progress: true

jobs:
  aggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Aggregate exact-head native and dispatched permanent workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TREE: 3c73e5a2e9c060b80fbc08f21afae4296d7843ea
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import time
          import traceback
          import urllib.parse
          import urllib.request

          repo = 'TrillionniumFoundation/trillionnium-os-desktop'
          token = os.environ['GH_TOKEN']
          target_tree = os.environ['TARGET_TREE']
          expected = {
              'governance-integrity', 'd1-final-qualification', 'd4-collaboration',
              'd3-integrated-runtime-evidence-verifier', 'agent-port-path-custody',
              'browser-codec-reference-and-rust-gate', 'servo-exact-pin',
              'd2i-integrated-image', 'd3-semantic-resolver-reference',
              'd0t03-source-contract', 'd8-hardware-qualification', 'receipt-journal',
              'servo-headed-runtime', 'd8-hardware-promotion-policy', 'd5-trusted-app',
              'agent-port-custody', 'desktop-ci', 'agent-transport-reference',
              'd4-d9-source-suite', 'd7-recovery-update', 'd6-capability-egress',
              'd9-release-promotion',
          }

          def api(path, method='GET', payload=None):
              body = None if payload is None else json.dumps(payload).encode('utf-8')
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + repo + '/' + path,
                  data=body,
                  method=method,
                  headers={
                      'Authorization': 'Bearer ' + token,
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'User-Agent': 'trillionnium-v14-exact-head-aggregator',
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  raw = response.read(8 * 1024 * 1024)
              return json.loads(raw) if raw else {}

          diagnostic = {'target_tree': target_tree}
          green = False
          try:
              pr = api('pulls/66')
              head = pr['head']['sha']
              base = pr['base']['sha']
              diagnostic.update({'head': head, 'base': base, 'draft': pr.get('draft')})
              commit = api('git/commits/' + head)
              actual_tree = commit['tree']['sha']
              diagnostic['actual_tree'] = actual_tree
              if actual_tree != target_tree:
                  raise RuntimeError(f'PR head tree mismatch: {actual_tree} != {target_tree}')

              chosen = {}
              deadline = time.monotonic() + 2100
              while time.monotonic() < deadline:
                  query = urllib.parse.urlencode({'head_sha': head, 'per_page': 100})
                  payload = api('actions/runs?' + query)
                  candidates = {}
                  for run in payload.get('workflow_runs', []):
                      name = run.get('name')
                      if name not in expected or run.get('head_sha') != head:
                          continue
                      if run.get('event') not in {'pull_request', 'workflow_dispatch'}:
                          continue
                      candidates.setdefault(name, []).append(run)
                  for name, runs in candidates.items():
                      # Prefer a successful terminal run; otherwise the newest attempt.
                      successful = [r for r in runs if r.get('status') == 'completed' and r.get('conclusion') == 'success']
                      pool = successful or runs
                      chosen[name] = max(pool, key=lambda r: (r.get('run_attempt', 0), r.get('id', 0)))
                  if expected == set(chosen) and all(
                      run.get('status') == 'completed' for run in chosen.values()
                  ):
                      break
                  time.sleep(15)

              rows = []
              for name in sorted(expected):
                  run = chosen.get(name, {})
                  rows.append({
                      'name': name,
                      'run_id': run.get('id'),
                      'event': run.get('event'),
                      'status': run.get('status', 'missing'),
                      'conclusion': run.get('conclusion'),
                  })
              diagnostic['runs'] = rows
              green = all(
                  row['status'] == 'completed' and row['conclusion'] == 'success'
                  for row in rows
              )
              diagnostic['all_green'] = green
              body = f'''## v14 cumulative source candidate — exact immutable head, Draft

```text
plan:              2026-08-29-d6
base main:         {base}
source head:       {head}
source tree:       {target_tree}
```

The exact locally reviewed v14 tree is ordinary repository source. Local verification bound to `{target_tree}` covered 698 Python tests; Rust 1.93.0 default/all-feature formatting, checks, Clippy and tests; persistence/migration SIGKILL cases; and documentation, repository, project-truth, source-governance and packaging validators.

Exact-head permanent workflow matrix, accepting only `pull_request` or `workflow_dispatch` runs bound to this same head: `{len(chosen)}/22`; all terminal success: `{str(green).lower()}`. Any source, base or prospective-merge movement invalidates this packet.

Keep Draft. Require a fresh independent non-author review, actual protected-main/ruleset/environment enforcement with authenticated positive/negative readback, normal governed merge and exact-main reruns.

D2I exact image; D3 real Servo-owned retained nodes/native event loop/attested IPC; installed D4-D7 services; D8 fixed-BOM 24/72-hour physical and raw power-loss evidence; D9 offline/HSM dual control and protected publication remain separate open gates. Legacy cutover, partial initialization recovery, archival/pruning and external trusted anti-rollback also remain open.

`all_gaps_closed=false`.
'''
              api('pulls/66', 'PATCH', {'body': body})
              if green:
                  api('pulls/66/requested_reviewers', 'POST', {'reviewers': ['Tomasrgbsf']})
          except Exception as exc:
              diagnostic['exception'] = repr(exc)
              diagnostic['traceback'] = traceback.format_exc()[-8000:]
          finally:
              api('issues/66/comments', 'POST', {'body':
                  '## v14 exact-head aggregate checkpoint\n\n'
                  '```json\n' + json.dumps(diagnostic, indent=2, sort_keys=True) + '\n```\n\n'
                  'No merge, product, hardware, signing or release claim is made.'})
              summary = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary:
                  with open(summary, 'a', encoding='utf-8') as out:
                      out.write('## v14 exact-head aggregate\n\n```json\n')
                      out.write(json.dumps(diagnostic, indent=2, sort_keys=True))
                      out.write('\n```\n')
          if not green:
              raise SystemExit('Exact-head permanent workflow matrix is not green')
          PY
