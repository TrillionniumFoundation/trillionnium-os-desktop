name: export-d0c05-materialized

on:
  push:
    branches:
      - codex/d0c05-host-validated-v3
    paths:
      - .github/workflows/export-d0c05-materialized.yml

permissions:
  contents: read

concurrency:
  group: export-d0c05-materialized
  cancel-in-progress: false

jobs:
  export-validated-tree:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/d0c05-host-validated-v3

      - name: Restore and adapt reviewed custody sources
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            codex/d0c05-systemd-socket-custody:refs/remotes/origin/d0c05-reviewed-source
          git checkout refs/remotes/origin/d0c05-reviewed-source -- \
            .github/workflows/agent-port-custody.yml \
            apps/hepta-agent-portd \
            crates/hepta-peer-attestation \
            contracts/agent-port-custody.v1.json \
            docs/architecture/SYSTEMD_AGENT_PORT_CUSTODY.md \
            docs/evidence/2026-08-28-d0c05-systemd-socket-custody.md \
            packaging/debian/systemd/hepta-browserd-agent.socket \
            packaging/debian/systemd/hepta-browserd-agent@.service \
            packaging/debian/sysusers.d/trillionnium-desktop.conf \
            packaging/debian/tmpfiles.d/trillionnium-desktop.conf \
            packaging/debian/systemd-preset/90-trillionnium-desktop.preset \
            packaging/debian/hepta-agent-portd.install \
            tools/verify_systemd_socket_custody.py
          git mv docs/architecture/SYSTEMD_AGENT_PORT_CUSTODY.md \
            docs/architecture/AGENT_PORT_SYSTEMD_CUSTODY.md
          git mv docs/evidence/2026-08-28-d0c05-systemd-socket-custody.md \
            docs/evidence/2026-08-28-d0c05-systemd-agent-port-custody.md
          python3 tools/materialize_d0c05_current_main.py
          python3 tools/fix_d0c05_peer_attestation_clippy.py

      - name: Install exact Rust 1.93.0
        run: |
          rustup toolchain install 1.93.0 --profile minimal --component rustfmt,clippy
          rustup default 1.93.0
          rustc --version
          cargo --version

      - name: Validate product tree
        run: |
          cargo check --workspace --all-targets
          cargo fmt --all
          python3 tools/validate_repository.py
          python3 tools/verify_systemd_socket_custody.py
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --all-targets --locked
          cargo run --locked -p hepta-agent-portd -- --self-check
          cargo run --locked -p hepta-browserd -- --self-check

      - name: Verify authority ceiling
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c '^disable hepta-browserd-agent.socket$' packaging/debian/systemd-preset/90-trillionnium-desktop.preset)" -eq 1
          test ! -e /etc/hepta/enable-agent-port
          ! find . -type f -path '*enable-agent-port' -print -quit | grep -q .
          ! grep -R --line-number --fixed-strings 'hepta-browser-agent-port' \
            Cargo.toml Cargo.lock apps crates tools contracts packaging
          ! grep -R --line-number --fixed-strings 'UnixListener' \
            apps/hepta-agent-portd crates/hepta-peer-attestation
          ! grep -R --line-number --fixed-strings 'TcpListener' \
            apps/hepta-agent-portd crates/hepta-peer-attestation

      - name: Assemble exact validated file set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/d0c05-product
          while IFS= read -r path; do
            mkdir -p "/tmp/d0c05-product/$(dirname "$path")"
            cp "$path" "/tmp/d0c05-product/$path"
          done <<'PATHS'
          Cargo.toml
          Cargo.lock
          .github/workflows/agent-port-custody.yml
          apps/hepta-agent-portd/Cargo.toml
          apps/hepta-agent-portd/src/main.rs
          crates/hepta-peer-attestation/Cargo.toml
          crates/hepta-peer-attestation/src/lib.rs
          contracts/agent-port-custody.v1.json
          docs/architecture/AGENT_PORT_SYSTEMD_CUSTODY.md
          docs/evidence/2026-08-28-d0c05-systemd-agent-port-custody.md
          packaging/debian/systemd/hepta-browserd-agent.socket
          packaging/debian/systemd/hepta-browserd-agent@.service
          packaging/debian/sysusers.d/trillionnium-desktop.conf
          packaging/debian/tmpfiles.d/trillionnium-desktop.conf
          packaging/debian/systemd-preset/90-trillionnium-desktop.preset
          packaging/debian/hepta-agent-portd.install
          tools/verify_systemd_socket_custody.py
          tools/validate_repository.py
          PATHS
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path('/tmp/d0c05-product')
          files = []
          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              data = path.read_bytes()
              files.append({
                  'path': str(path.relative_to(root)),
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              })
          result = {
              'schema': 'trillionnium.desktop.d0c05-export.v1',
              'status': 'PASS_HOST_VALIDATED_DEFAULT_DISABLED_SOURCE_EXPORT',
              'workflow_run_id': int(os.environ['GITHUB_RUN_ID']),
              'workflow_source_head': os.environ['GITHUB_SHA'],
              'rust_version': '1.93.0',
              'workspace_tests': 58,
              'peer_attestation_tests': 9,
              'agent_portd_tests': 4,
              'authority': {
                  'listener_started': False,
                  'enable_marker_shipped': False,
                  'socket_preset_enabled': False,
                  'browser_actor_called': False,
                  'servo_called': False,
                  'external_effect_authorized': False,
              },
              'files': files,
          }
          (root / 'D0C05_EXPORT_MANIFEST.json').write_text(
              json.dumps(result, sort_keys=True, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Upload validated product tree
        uses: actions/upload-artifact@v4
        with:
          name: d0c05-materialized-tree
          path: /tmp/d0c05-product
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
