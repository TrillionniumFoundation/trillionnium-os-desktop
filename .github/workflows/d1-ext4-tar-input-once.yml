name: d1-ext4-tar-input-once

on:
  push:
    branches:
      - codex/d1-01-reproducible-qemu-substrate
    paths:
      - .github/workflows/d1-ext4-tar-input-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d1-01-reproducible-qemu-substrate
          fetch-depth: 0
      - name: Consume normalized tar directly in mke2fs 1.47.1+
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('packaging/debian/image/build-d1-image.sh')
          lines = path.read_text().splitlines()

          command_a = 'for command in mmdebstrap python3 jq mke2fs tar chroot rsync sha256sum \\'
          command_b = '  systemd-sysusers systemd-tmpfiles cmp diff readlink stat awk; do'
          command_new_a = 'for command in mmdebstrap python3 jq mke2fs e2fsck dumpe2fs tar chroot rsync sha256sum \\'
          if lines.count(command_a) != 1 or lines.count(command_b) != 1:
              raise SystemExit('unexpected D1 command-list shape')
          lines[lines.index(command_a)] = command_new_a

          variable = 'normalized_rootfs="$build_dir/normalized-rootfs"'
          if lines.count(variable) != 1:
              raise SystemExit('unexpected normalized-rootfs variable count')
          lines.remove(variable)

          mkdir_old = 'mkdir -p "$rootfs" "$normalized_rootfs" "$logs" "$artifacts"'
          if lines.count(mkdir_old) != 1:
              raise SystemExit('unexpected D1 build mkdir shape')
          lines[lines.index(mkdir_old)] = 'mkdir -p "$rootfs" "$logs" "$artifacts"'

          extract_start = 'tar --numeric-owner --xattrs --acls --selinux \\'
          start = lines.index(extract_start)
          expected = [
              extract_start,
              '  -xf "$artifacts/rootfs.tar" -C "$normalized_rootfs"',
              'find "$normalized_rootfs" -xdev -print0 \\',
              '  | LC_ALL=C sort -z \\',
              '  | xargs -0r touch --no-dereference --date="@$source_epoch"',
              '',
          ]
          if lines[start:start + len(expected)] != expected:
              raise SystemExit('unexpected unpacked-directory normalization block')
          version_block = [
              "mke2fs_version=$(mke2fs -V 2>&1 | awk 'NR == 1 { print $2 }')",
              "python3 -c 'import re,sys; m=re.fullmatch(r\"(\\d+)\\.(\\d+)\\.(\\d+)\",sys.argv[1]); raise SystemExit(0 if m and tuple(map(int,m.groups())) >= (1,47,1) else 1)' \"$mke2fs_version\" || {",
              '  echo "D1 reproducible tar input requires e2fsprogs >= 1.47.1; got $mke2fs_version" >&2',
              '  exit 1',
              '}',
              '',
          ]
          lines[start:start + len(expected)] = version_block

          directory_input = '  -d "$normalized_rootfs" \\'
          if lines.count(directory_input) != 1:
              raise SystemExit('unexpected mke2fs directory-input count')
          lines[lines.index(directory_input)] = '  -d "$artifacts/rootfs.tar" \\'

          unset_index = lines.index('unset E2FSPROGS_FAKE_TIME')
          validation = [
              'set +e',
              'e2fsck -fn "$image" >"$logs/e2fsck-read-only.log" 2>&1',
              'e2fsck_status=$?',
              'set -e',
              'if (( e2fsck_status != 0 )); then',
              '  echo "generated ext4 image failed read-only e2fsck: status=$e2fsck_status" >&2',
              '  cat "$logs/e2fsck-read-only.log" >&2',
              '  exit "$e2fsck_status"',
              'fi',
              'dumpe2fs -h "$image" >"$logs/dumpe2fs-header.log" 2>&1',
          ]
          lines[unset_index + 1:unset_index + 1] = validation

          cleanup = 'rm -rf "$rootfs" "$normalized_rootfs"'
          if lines.count(cleanup) != 1:
              raise SystemExit('unexpected D1 cleanup shape')
          lines[lines.index(cleanup)] = 'rm -rf "$rootfs"'
          if any('normalized_rootfs' in line for line in lines):
              raise SystemExit('unpacked-directory ext4 input remains')

          path.write_text('\n'.join(lines) + '\n')
          PY
          bash -n packaging/debian/image/build-d1-image.sh
          shellcheck -e SC2016,SC2054 packaging/debian/image/build-d1-image.sh
          grep -F -- '-d "$artifacts/rootfs.tar"' packaging/debian/image/build-d1-image.sh
          git diff --check
      - name: Commit deterministic ext4 product construction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packaging/debian/image/build-d1-image.sh
          git commit -m "build: construct D1 ext4 directly from normalized tar"
          git push origin HEAD:codex/d1-01-reproducible-qemu-substrate
