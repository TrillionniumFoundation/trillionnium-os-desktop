name: d1-ext4-tar-input-once

on:
  push:
    branches:
      - codex/d1-01-reproducible-qemu-substrate
    paths:
      - .github/workflows/d1-ext4-tar-input-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/d1-01-reproducible-qemu-substrate
          fetch-depth: 0
      - name: Consume normalized tar directly in mke2fs 1.47.1+
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('packaging/debian/image/build-d1-image.sh')
          text = path.read_text()
          replacements = {
              'for command in mmdebstrap python3 jq mke2fs tar chroot rsync sha256sum \\\n  systemd-sysusers systemd-tmpfiles cmp diff readlink stat awk; do':
                  'for command in mmdebstrap python3 jq mke2fs e2fsck dumpe2fs tar chroot rsync sha256sum \\\n  systemd-sysusers systemd-tmpfiles cmp diff readlink stat awk; do',
              'normalized_rootfs="$build_dir/normalized-rootfs"\n': '',
              'mkdir -p "$rootfs" "$normalized_rootfs" "$logs" "$artifacts"':
                  'mkdir -p "$rootfs" "$logs" "$artifacts"',
              '''tar --numeric-owner --xattrs --acls --selinux \\
  -xf "$artifacts/rootfs.tar" -C "$normalized_rootfs"
find "$normalized_rootfs" -xdev -print0 \\
  | LC_ALL=C sort -z \\
  | xargs -0r touch --no-dereference --date="@$source_epoch"

''':
                  '''mke2fs_version=$(mke2fs -V 2>&1 | awk 'NR == 1 { print $2 }')
python3 -c 'import re,sys; m=re.fullmatch(r"(\\d+)\\.(\\d+)\\.(\\d+)",sys.argv[1]); raise SystemExit(0 if m and tuple(map(int,m.groups())) >= (1,47,1) else 1)' "$mke2fs_version" || {
  echo "D1 reproducible tar input requires e2fsprogs >= 1.47.1; got $mke2fs_version" >&2
  exit 1
}

''',
              '-d "$normalized_rootfs" \\\n': '-d "$artifacts/rootfs.tar" \\\n',
              '''unset E2FSPROGS_FAKE_TIME

image_sha256=''':
                  '''unset E2FSPROGS_FAKE_TIME
set +e
e2fsck -fn "$image" >"$logs/e2fsck-read-only.log" 2>&1
e2fsck_status=$?
set -e
if (( e2fsck_status != 0 )); then
  echo "generated ext4 image failed read-only e2fsck: status=$e2fsck_status" >&2
  cat "$logs/e2fsck-read-only.log" >&2
  exit "$e2fsck_status"
fi
dumpe2fs -h "$image" >"$logs/dumpe2fs-header.log" 2>&1

image_sha256=''',
              'rm -rf "$rootfs" "$normalized_rootfs"': 'rm -rf "$rootfs"',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one D1 image-builder anchor, got {count}: {old[:80]!r}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          rm .github/workflows/d1-ext4-tar-input-once.yml
          bash -n packaging/debian/image/build-d1-image.sh
          shellcheck -e SC2016,SC2054 packaging/debian/image/build-d1-image.sh
          grep -F -- '-d "$artifacts/rootfs.tar"' packaging/debian/image/build-d1-image.sh
          if grep -Fq 'normalized_rootfs' packaging/debian/image/build-d1-image.sh; then
            echo "unpacked-directory ext4 input must not remain" >&2
            exit 1
          fi
          git diff --check
      - name: Commit deterministic ext4 construction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build: construct D1 ext4 directly from normalized tar"
          git push origin HEAD:codex/d1-01-reproducible-qemu-substrate
