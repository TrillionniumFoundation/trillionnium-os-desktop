name: internal-s02-source-export

on:
  push:
    branches:
      - codex/s02-contract-foundation-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Assert and archive exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          git archive --format=zip --output="$RUNNER_TEMP/trillionnium-os-desktop-s02-source.zip" HEAD
          sha256sum "$RUNNER_TEMP/trillionnium-os-desktop-s02-source.zip" \
            > "$RUNNER_TEMP/trillionnium-os-desktop-s02-source.zip.sha256"

      - name: Upload exact source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s02-source-${{ github.sha }}
          path: |
            ${{ runner.temp }}/trillionnium-os-desktop-s02-source.zip
            ${{ runner.temp }}/trillionnium-os-desktop-s02-source.zip.sha256
          if-no-files-found: error
          retention-days: 1
