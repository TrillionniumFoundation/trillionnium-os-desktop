name: d0a02-gap-fix-runner

# second push intentionally activates the already-registered one-shot workflow
on:
  push:
    branches:
      - codex/d0a02-headed-runtime-v3
    paths:
      - .github/workflows/d0a02-gap-fix-runner.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact package branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/d0a02-headed-runtime-v3
          fetch-depth: 0

      - name: Extract and run the staged deterministic patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/d0a02-gap-fix.yml').read_text().splitlines()
          marker = '      - name: Patch deterministic runtime blockers'
          start = source.index(marker)
          run_line = source.index('        run: |', start)
          end = source.index('      - name: Commit exact blocker fixes', run_line)
          script = []
          for line in source[run_line + 1:end]:
              if line.startswith('          '):
                  script.append(line[10:])
              elif line:
                  raise SystemExit(f'unexpected staged patch indentation: {line!r}')
              else:
                  script.append('')
          Path('/tmp/d0a02-gap-fix.sh').write_text('\n'.join(script) + '\n')
          PY
          bash /tmp/d0a02-gap-fix.sh

      - name: Commit exact blocker fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Tomasrgbsf"
          git config user.email "tomasbraynt@gmail.com"
          git add \
            experiments/servo-headed-runtime/src/main.rs \
            runtime/servo/hepta_workspace_runtime.rs \
            .github/workflows/d0a02-headed-servo.yml
          git diff --cached --check
          git commit -m "fix(d0a02): make recovery gates evidence-driven"
          git push origin HEAD:codex/d0a02-headed-runtime-v3
