<!doctype html>
<meta charset="utf-8">
<title>TrillionniumOS D0A-02 fixture</title>
<style>
  :root { color-scheme: light; font-family: sans-serif; background: #f7f8fa; }
  body { margin: 0; min-height: 1400px; color: #172033; background: #f7f8fa; }
  main { padding: 20px; }
  h1 { margin: 0 0 12px; font-size: 24px; }
  input, button { box-sizing: border-box; height: 42px; font-size: 18px; }
  input { width: 320px; padding: 6px 10px; }
  button { margin-left: 12px; padding: 6px 20px; }
  #status { margin-top: 18px; padding: 12px; border: 2px solid #246b45; background: #dff7e9; }
  #scroll-target { margin-top: 1000px; height: 120px; background: #dbe8ff; }
</style>
<main>
  <h1>One Servo content surface</h1>
  <input id="field" aria-label="D0A-02 input" autocomplete="off" autofocus>
  <button id="button" type="button">Record click</button>
  <div id="status">fixture-ready</div>
  <div id="scroll-target">scroll-target</div>
</main>
<script>
  const generation = Number(new URL(location.href).searchParams.get('generation') || '1');
  const evidence = window.__heptaEvidence = {
    generation,
    loaded: false,
    pointerMoves: 0,
    pointerDowns: 0,
    clicks: 0,
    wheels: 0,
    keyDowns: [],
    composition: [],
    inputEvents: 0,
    popupAttempted: false,
    externalNavigationAttempted: false,
    resourceProbesSettled: false,
    sameOriginScriptRejected: false,
    wrongMethodFetchRejected: false,
    externalScriptRejected: false,
    forbiddenResourceExecuted: false,
    serviceWorkerProbe: 'unavailable'
  };
  const field = document.getElementById('field');
  const button = document.getElementById('button');
  const status = document.getElementById('status');

  document.addEventListener('pointermove', () => evidence.pointerMoves++);
  document.addEventListener('pointerdown', () => evidence.pointerDowns++);
  document.addEventListener('wheel', () => evidence.wheels++);
  document.addEventListener('keydown', event => evidence.keyDowns.push(event.key));
  document.addEventListener('compositionstart', event => evidence.composition.push(['start', event.data]));
  document.addEventListener('compositionupdate', event => evidence.composition.push(['update', event.data]));
  document.addEventListener('compositionend', event => evidence.composition.push(['end', event.data]));
  field.addEventListener('input', () => evidence.inputEvents++);
  button.addEventListener('click', () => {
    evidence.clicks++;
    status.textContent = `clicked-${evidence.clicks}`;
  });

  // These requests are deliberately permitted by this qualification response's
  // narrow CSP so the actual HTTP embedder callback, rather than CSP, refuses
  // them. They do not grant resource or network authority to the page.
  window.__forbiddenResourceExecuted = false;
  function rejectedScript(url, key) {
    return new Promise(resolve => {
      const script = document.createElement('script');
      script.src = url;
      script.onerror = () => { evidence[key] = true; resolve(); };
      script.onload = () => { evidence.forbiddenResourceExecuted = true; resolve(); };
      document.head.append(script);
    });
  }
  const probes = [
    rejectedScript(`/blocked-script.js?generation=${generation}`, 'sameOriginScriptRejected'),
    rejectedScript(`https://resource-denied.invalid/blocked-script.js?generation=${generation}`, 'externalScriptRejected'),
    fetch(`/?generation=${generation}`, {method: 'POST', body: 'denied-resource-probe'})
      .then(() => { evidence.forbiddenResourceExecuted = true; },
            () => { evidence.wrongMethodFetchRejected = true; })
  ];
  if (navigator.serviceWorker) {
    evidence.serviceWorkerProbe = 'pending';
    probes.push(navigator.serviceWorker.register(`/global-worker.js?generation=${generation}`)
      .then(() => { evidence.serviceWorkerProbe = 'unexpectedly-registered'; },
            () => { evidence.serviceWorkerProbe = 'rejected'; }));
  }
  Promise.all(probes).then(() => {
    evidence.forbiddenResourceExecuted ||= window.__forbiddenResourceExecuted === true;
    evidence.resourceProbesSettled = true;
  });

  addEventListener('load', () => {
    evidence.loaded = true;
    field.focus();
    setTimeout(() => {
      evidence.popupAttempted = true;
      window.open('https://popup.invalid/d0a02', '_blank', 'noopener');
      evidence.externalNavigationAttempted = true;
      location.href = 'https://navigation.invalid/d0a02';
    }, 50);
  });
</script>
